name: Deploy to GAS

on:
  push:
    branches:
      - main
      - メイン
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SECOND_SCRIPT_ID: ${{ secrets.SECOND_SCRIPT_ID }}
      SECOND_DEPLOYMENT_ID: ${{ secrets.SECOND_DEPLOYMENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Create .clasprc.json
        run: echo '${{ secrets.CLASPRC_JSON_KEY }}' > ~/.clasprc.json

      - name: Create .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"."}' > .clasp.json

      - name: Push to GAS
        run: clasp push --force

      - name: Deploy to GAS
        run: clasp deploy --deploymentId ${{ secrets.DEPLOYMENT_ID }}

      - name: Create secondary .clasp.json
        if: ${{ env.SECOND_SCRIPT_ID != '' && env.SECOND_DEPLOYMENT_ID != '' }}
        run: |
          echo "{\"scriptId\":\"${SECOND_SCRIPT_ID}\",\"rootDir\":\".\"}" > .clasp.json

      - name: Push to secondary GAS
        if: ${{ env.SECOND_SCRIPT_ID != '' && env.SECOND_DEPLOYMENT_ID != '' }}
        run: clasp push --force

      - name: Deploy to secondary GAS
        if: ${{ env.SECOND_SCRIPT_ID != '' && env.SECOND_DEPLOYMENT_ID != '' }}
        run: clasp deploy --deploymentId "$SECOND_DEPLOYMENT_ID"

      - name: Secondary GAS deploy not configured
        if: ${{ env.SECOND_SCRIPT_ID == '' || env.SECOND_DEPLOYMENT_ID == '' }}
        run: echo "Secondary GAS deploy skipped. Configure SECOND_SCRIPT_ID and SECOND_DEPLOYMENT_ID."

name: Fix song management UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-song-management-ui.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SongLyricsManagement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SongLyricsManagement.html')
          s=p.read_text()
          s=s.replace('.slm-field{display:grid;gap:6px}', '.slm-field{display:grid;gap:6px;min-width:0}')
          s=s.replace('.slm-field input,.slm-field select,.slm-field textarea{width:100%;box-sizing:border-box;', '.slm-field input,.slm-field select,.slm-field textarea{width:100%;max-width:100%;min-width:0;box-sizing:border-box;')
          s=s.replace('.slm-toggle{display:flex;align-items:center;gap:10px;min-height:48px}', '.slm-toggle{display:flex;align-items:center;gap:10px;min-height:48px}.slm-toggle input[type="checkbox"]{width:24px;max-width:24px;min-width:24px;min-height:24px;height:24px;padding:0;margin:0;flex:0 0 24px}.slm-loading[hidden]{display:none!important}')
          s=s.replace("['SONG INFO','CREDITS','LYRICS']", "['楽曲情報','クレジット','歌詞']")
          s=s.replace('<h3 class="slm-section-title">SONG INFO</h3>', '<h3 class="slm-section-title">楽曲情報</h3>')
          s=s.replace("'ARTIST'", "'アーティスト'")
          s=s.replace("'TITLE'", "'曲名'")
          s=s.replace("'RELEASE DATE'", "'リリース日'")
          s=s.replace("'FORM'", "'形態'")
          s=s.replace("'CD TITLE'", "'CDタイトル'")
          s=s.replace('<span>TITLE TRACK</span>', '<span>表題曲</span>')
          s=s.replace('<h3 class="slm-section-title">CREDITS</h3>', '<h3 class="slm-section-title">クレジット</h3>')
          s=s.replace("'Lyrics'", "'作詞'")
          s=s.replace("'Music'", "'作曲'")
          s=s.replace("'Choreography'", "'振付'")
          s=s.replace("'Original Song'", "'原曲'")
          s=s.replace('<h3 class="slm-section-title">LYRICS INPUT</h3>', '<h3 class="slm-section-title">歌詞入力</h3>')
          s=s.replace('解析したSingerはMAINとして保存されます。', '解析したSingerはメインとして保存されます。')
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q 'slm-loading\[hidden\]' SongLyricsManagement.html
          grep -q 'リリース日' SongLyricsManagement.html
          grep -q '作詞' SongLyricsManagement.html
          grep -q 'max-width:100%;min-width:0' SongLyricsManagement.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SongLyricsManagement.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix song management mobile UI labels and loading'
          git push

name: One-shot final cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean residual management code and pin DB library
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          image = Path('ImageManagement.html')
          text = image.read_text()
          broken = '  body.theme-light \n  body.theme-light .image-management-file-field'
          if broken in text:
              text = text.replace(broken, '  body.theme-light .image-management-file-field')
          image.write_text(text)

          manifest = Path('appsscript.json')
          data = json.loads(manifest.read_text())
          found = False
          for lib in data.get('dependencies', {}).get('libraries', []):
              if lib.get('userSymbol') == 'BMSGDB':
                  lib['version'] = '9'
                  found = True
          if not found:
              raise SystemExit('BMSGDB library not found')
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          slm = Path('SongLyricsManagement.html').read_text()
          forbidden = ['OriginalSongID','originalSongId','slmNewOriginal','slmEditOriginal','.slm-loading[hidden]']
          hits = [x for x in forbidden if x in slm]
          if hits:
              raise SystemExit('Residual Song/Lyrics code found: ' + ', '.join(hits))
          if 'min-height:62px' not in slm:
              raise SystemExit('Song/Lyrics local choice height missing')

          buttons = Path('ButtonSystem.html').read_text()
          if '.slm-choice{min-height:62px' in buttons or '.slm-choice {min-height:62px' in buttons:
              raise SystemExit('Feature-specific slm choice sizing leaked into ButtonSystem')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ImageManagement.html appsscript.json
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
          else
            git commit -m 'Finalize management cleanup and pin BMSGDB v9'
            git push origin main
          fi

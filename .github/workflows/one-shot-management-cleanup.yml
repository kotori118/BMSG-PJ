name: One-shot management cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-management-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove management UI duplication and dead remnants
        run: |
          python <<'PY'
          from pathlib import Path

          slm=Path('SongLyricsManagement.html')
          s=slm.read_text()
          replacements=[
            ('.slm-choice{display:flex;align-items:center;justify-content:space-between;padding:0 18px;text-align:left}', '.slm-choice{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 18px;text-align:left}'),
            ('.slm-loading[hidden]{display:none!important}', ''),
            ("function slmCreditsHtml_(credits,isEdit){const songs=songLyricsManagementState.bootstrap.songs||[];return ", "function slmCreditsHtml_(credits,isEdit){return "),
            ("'slmNewLyricists','slmNewComposers','slmNewChoreographers','slmNewOriginal','slmRawLyrics'", "'slmNewLyricists','slmNewComposers','slmNewChoreographers','slmRawLyrics'"),
            ("'slmEditLyricists','slmEditComposers','slmEditChoreographers','slmEditOriginal'", "'slmEditLyricists','slmEditComposers','slmEditChoreographers'"),
            ("slmSongSelectField_('slmExistingSong','SONG',songs,songLyricsManagementState.existingSongId,'')", "slmSongSelectField_('slmExistingSong','曲',songs,songLyricsManagementState.existingSongId)"),
            ("function slmSongSelectField_(id,label,songs,value,exclude){return '<label class=\"management-field slm-field\"><span>'+escapeSlm(label)+'</span><select id=\"'+id+'\"><option value=\"\">選択なし</option>'+(songs||[]).filter(function(song){return !exclude||song.songId!==exclude;}).map(function(song){", "function slmSongSelectField_(id,label,songs,value){return '<label class=\"management-field slm-field\"><span>'+escapeSlm(label)+'</span><select id=\"'+id+'\"><option value=\"\">選択なし</option>'+(songs||[]).map(function(song){"),
            ("<section class=\"slm-edit-section slm-card\"><h3 class=\"management-section-title slm-section-title\">楽曲情報</h3>", "<section class=\"management-card slm-edit-section slm-card\"><h3 class=\"management-section-title slm-section-title\">楽曲情報</h3>"),
            ("<section class=\"slm-edit-section slm-card\"><h3 class=\"management-section-title slm-section-title\">LYRICS</h3>", "<section class=\"management-card slm-edit-section slm-card\"><h3 class=\"management-section-title slm-section-title\">LYRICS</h3>")
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit('SongLyricsManagement target not found: '+old[:90])
              s=s.replace(old,new,1)
          slm.write_text(s)

          btn=Path('ButtonSystem.html'); b=btn.read_text()
          target='  .slm-choice{min-height:62px!important}\n'
          if target not in b: raise SystemExit('ButtonSystem slm-choice height target not found')
          btn.write_text(b.replace(target,'',1))

          img=Path('ImageManagement.html'); i=img.read_text()
          target='  body.theme-light \n  body.theme-light .image-management-file-field'
          if target not in i: raise SystemExit('ImageManagement stray theme selector not found')
          img.write_text(i.replace(target,'  body.theme-light .image-management-file-field',1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SongLyricsManagement.html ButtonSystem.html ImageManagement.html
          git diff --cached --check
          git commit -m 'Clean management UI ownership and dead remnants'
          git push

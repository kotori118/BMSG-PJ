name: Q6-Quiz-Setup-Owner

on: [push]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-quiz-setup-owner-20260911
      - name: Move setup block
        run: |
          cat > /tmp/q6.py <<'PY'
          from pathlib import Path
          setup=Path('QuizSetup.html')
          fixes=Path('QuizRedesignV3Fixes.html')
          s=setup.read_text()
          f=fixes.read_text()
          start=f.find('  function safeClearQuizTimer_(){')
          end=f.find('  function patchResultNavigation_(){',start)
          if start < 0 or end < 0:
              raise SystemExit('setup block markers not found')
          block=f[start:end]
          # Keep exact runtime code, wrapped in its own IIFE at the canonical owner.
          moved='<script>\n(function(){\n'+block+'})();\n</script>\n'
          if 'function safeClearQuizTimer_(){' in s:
              raise SystemExit('already moved')
          setup.write_text(s.rstrip()+'\n'+moved)
          fixes.write_text(f[:start]+f[end:])
          PY
          python3 /tmp/q6.py
          rm .github/workflows/q6-quiz-setup-owner.yml
      - name: Verify
        run: |
          grep -q 'function safeClearQuizTimer_' QuizSetup.html
          if grep -q 'function safeClearQuizTimer_' QuizRedesignV3Fixes.html; then exit 1; fi
          grep -q 'function patchResultNavigation_' QuizRedesignV3Fixes.html
          grep -q 'installQuizLocalizationObserver_' QuizRedesignV3Fixes.html
      - name: Commit
        run: |
          git config user.name kotori118
          git config user.email pinoso615@gmail.com
          git add QuizSetup.html QuizRedesignV3Fixes.html .github/workflows/q6-quiz-setup-owner.yml
          git commit -m 'Move QUIZ setup authority into QuizSetup'
          git push origin HEAD:refactor-quiz-setup-owner-20260911

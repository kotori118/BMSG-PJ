name: Q8-Quiz-Play-Owner
on: [push]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-quiz-play-owner-20260911
      - name: Absorb final play behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('QuizPlay.html')
          f=Path('QuizRedesignV3Fixes.html')
          s=p.read_text()
          x=f.read_text()

          # Source now emits the same final Japanese text that observers produced.
          replacements={
            "onclick=\"abandonQuiz_()\">諦める</button>":"onclick=\"abandonQuiz_()\">終了する</button>",
            "status.textContent='MISS — まだ回答できます'":"status.textContent='不正解 — まだ回答できます'",
            "flashV3_(correct?'CORRECT':'MISS',!correct)":"flashV3_(correct?'正解':'不正解',!correct)",
            "flashV3_('CORRECT',false)":"flashV3_('正解',false)",
            "<div class=\"quiz-v3-feedback-mark\">SONG CORRECT</div>":"<div class=\"quiz-v3-feedback-mark\">曲名正解</div>",
            "<div class=\"quiz-v3-feedback-mark\">ANSWER</div>":"<div class=\"quiz-v3-feedback-mark\">答え</div>",
            "<div class=\"quiz-v3-feedback-mark\">SINGER</div>":"<div class=\"quiz-v3-feedback-mark\">歌唱</div>",
            "<div class=\"quiz-v3-feedback-mark\">RESULT</div>":"<div class=\"quiz-v3-feedback-mark\">結果</div>",
            "let ok=false,mark='MISS',detail=''":"let ok=false,mark='不正解',detail=''",
            "mark=answer.timedOut?'TIME UP':(ok?'CORRECT':'MISS')":"mark=answer.timedOut?'TIME UP':(ok?'正解':'不正解')",
            "mark=answer.timedOut?'TIME UP':(ok?'CORRECT':(answer.songCorrect?'SONG +1':'MISS'))":"mark=answer.timedOut?'TIME UP':(ok?'正解':(answer.songCorrect?'曲名正解 +1':'不正解'))"
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit('missing play replacement: '+old[:80])
            s=s.replace(old,new)

          # Clear visible timer at the same transitions previously handled by Fixes wrappers.
          anchor="  function renderQuizQuestionBodyV3_(question){"
          helper="  function hideTimerV3_(){const host=document.getElementById('quizTimerV3');if(host)host.innerHTML='';}\n\n"
          if helper.strip() not in s:
            s=s.replace(anchor,helper+anchor,1)
          s=s.replace("quizState.stage='answered';clearTimer();flashV3_(correct?'正解':'不正解',!correct);", "quizState.stage='answered';clearTimer();hideTimerV3_();flashV3_(correct?'正解':'不正解',!correct);",1)
          s=s.replace("clearTimer();quizState.stage='singer';flashV3_('正解',false);", "clearTimer();hideTimerV3_();quizState.stage='singer';flashV3_('正解',false);",1)
          s=s.replace("window.revealOfflineLyricsV3_=function(){if(quizState.stage!=='question')return;clearTimer();quizState.stage='songAward';replaceBodyV3_();};", "window.revealOfflineLyricsV3_=function(){if(quizState.stage!=='question')return;clearTimer();hideTimerV3_();quizState.stage='songAward';replaceBodyV3_();};",1)

          # Replace the compatibility delegate with the final award implementation.
          old="""  const legacyAward=awardOfflineLyrics_;\n  awardOfflineLyrics_=function(kind,encoded){legacyAward(kind,encoded);};\n"""
          new="""  awardOfflineLyrics_=function(kind,encoded){\n    const id=encoded?decodeURIComponent(encoded):'';\n    if(!quizState.awards[quizState.index])quizState.awards[quizState.index]={songWinner:'',singerWinner:''};\n    if(kind==='song'){\n      quizState.awards[quizState.index].songWinner=id;\n      quizState.stage='singerAward';\n    }else{\n      quizState.awards[quizState.index].singerWinner=id;\n      quizState.stage='answered';\n    }\n    const body=document.getElementById('quizQuestionBody');\n    const q=quizState.game&&quizState.game.questions&&quizState.game.questions[quizState.index];\n    if(body&&q){\n      if(quizState.stage==='singerAward'){\n        body.innerHTML='<p class=\"quiz-question-text is-lyrics\">'+quizEscape_(q.text)+'</p><div class=\"quiz-v3-feedback\"><div class=\"quiz-v3-feedback-mark\">歌唱</div><div class=\"quiz-v3-feedback-answer\">'+quizEscape_((q.source.singerNames||[]).join(' / '))+'</div></div><div class=\"quiz-award-step\"><p class=\"quiz-setting-title\">歌唱メンバーの正解者</p>'+renderQuizAwardButtons_('singer')+'</div>';\n      }else{\n        const award=quizState.awards[quizState.index]||{};\n        body.innerHTML='<p class=\"quiz-question-text is-lyrics\">'+quizEscape_(q.text)+'</p><div class=\"quiz-v3-feedback\"><div class=\"quiz-v3-feedback-mark\">結果</div><div class=\"quiz-v3-feedback-answer\">曲名：'+quizEscape_(q.source.title)+'<br>歌唱：'+quizEscape_((q.source.singerNames||[]).join(' / '))+'<br><small>'+quizEscape_(quizUserName_(award.songWinner)||'正解者なし')+' / '+quizEscape_(quizUserName_(award.singerWinner)||'正解者なし')+'</small></div></div>'+renderQuizLyricsLink_(q);\n      }\n    }\n    if(quizState.stage==='answered')enableQuizNext_();\n  };\n"""
          if old not in s:
            raise SystemExit('legacy award block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Remove wrappers/award override from Fixes, retain localization + observers as compatibility gate.
          a=x.find("  function hideTimerV3Fix_(){")
          b=x.find("  installQuizLocalizationObserver_();",a)
          if a<0 or b<0:
            raise SystemExit('Fixes play block markers missing')
          # Keep localize/install functions before wrappers: remove helper separately and wrapper block after install definition.
          helper_end=x.find("\n\n",a)+2
          x=x[:a]+x[helper_end:]
          start=x.find("  const baseSongAnswer=window.answerSongV3_;")
          end=x.find("  installQuizLocalizationObserver_();",start)
          if start<0 or end<0:
            raise SystemExit('Fixes wrapper markers missing')
          x=x[:start]+x[end:]
          f.write_text(x)
          PY
          rm .github/workflows/q8-quiz-play-owner.yml
      - name: Verify Q8
        run: |
          grep -q "不正解 — まだ回答できます" QuizPlay.html
          grep -q "function hideTimerV3_" QuizPlay.html
          grep -q "awardOfflineLyrics_=function" QuizPlay.html
          if grep -q "baseSongAnswer" QuizRedesignV3Fixes.html; then exit 1; fi
          if grep -q "hideTimerV3Fix_" QuizRedesignV3Fixes.html; then exit 1; fi
          grep -q "installQuizLocalizationObserver_" QuizRedesignV3Fixes.html
          grep -q "installQuizUiAudit_" QuizRedesignV3Fixes.html
          grep -q "previousRenderQuestion_" QuizOfflineParty.html
      - name: Commit Q8
        run: |
          git config user.name kotori118
          git config user.email pinoso615@gmail.com
          git add QuizPlay.html QuizRedesignV3Fixes.html .github/workflows/q8-quiz-play-owner.yml
          git commit -m 'Move QUIZ final play behavior into QuizPlay'
          git push origin HEAD:refactor-quiz-play-owner-20260911

name: Validate catalog PR (no deployment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check Apps Script source
        run: node scripts/validate-gas-sources.mjs
      - name: Run source contracts
        run: node --test tests/*.test.mjs
      - name: Run predeployment audit (release blockers)
        run: node --test audit/*.test.mjs
      - name: Install layout browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile and theme layout
        run: node scripts/verify-management-layout.mjs
      - name: Keep management layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-layout
          path: layout-results/

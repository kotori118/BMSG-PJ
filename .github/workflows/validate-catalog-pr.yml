name: Validate catalog PR (no deployment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Apps Script source
        run: node scripts/validate-gas-sources.mjs
      - name: Run source contracts
        run: node --test tests/*.test.mjs

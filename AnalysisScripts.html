<script>
  let analysisData=null,analysisView='top',analysisMember='',analysisYear='all',analysisSongId='',analysisOtherView='',analysisCreatorType='lyricists';
  function renderAnalysis(){const t=document.getElementById('analysisPageTemplate');return t?t.innerHTML:'<section class="view"><h1>ANALYSIS</h1></section>';}
  function initAnalysisPage(){analysisView='top';const panel=document.getElementById('analysisPanel');if(!panel)return;if(!analysisData){panel.innerHTML='<div class="analysis-loading">'+renderUniverseLoading('LOADING...','#9cecff')+'</div>';google.script.run.withSuccessHandler(function(data){analysisData=data;renderAnalysisView();}).withFailureHandler(function(err){panel.innerHTML='<div class="analysis-card"><h2>読み込みに失敗しました</h2><p class="analysis-muted">'+escapeHtml(String(err&&err.message||err))+'</p><button class="u-btn" onclick="retryAnalysis()">再試行</button></div>';}).getAnalysisBootstrap();}else renderAnalysisView();}
  function retryAnalysis(){analysisData=null;initAnalysisPage();}
  function selectAnalysisView(view){analysisView=view;analysisOtherView='';document.querySelectorAll('.analysis-tab').forEach(b=>b.classList.toggle('active',b.dataset.analysisView===view));renderAnalysisView();}
  function renderAnalysisView(){document.querySelectorAll('.analysis-tab').forEach(b=>b.classList.toggle('active',b.dataset.analysisView===analysisView));const p=document.getElementById('analysisPanel');if(!p||!analysisData)return;if(analysisView==='member')renderAnalysisMember();else if(analysisView==='song')renderAnalysisSong();else if(analysisView==='timeline')renderAnalysisTimeline();else if(analysisView==='other')renderAnalysisOther();else renderAnalysisTop();if(typeof syncUniverseCrossLinks==='function')syncUniverseCrossLinks();}
  function renderAnalysisTop(){document.getElementById('analysisPanel').innerHTML='<div class="analysis-menu">'+[
    ['member','メンバー別分析','担当曲・歌い出し／歌い終わり'],['song','楽曲別分析','歌い出し・歌い終わり・歌詞'],['timeline','時系列分析','歌い出し／歌い終わりの推移'],['other','その他分析','パート継承、順番、フレーズ、制作者、リリース形態']
  ].map(x=>'<button class="analysis-menu-card u-btn" onclick="selectAnalysisView(\''+x[0]+'\')"><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join('')+'</div>';}
  function memberOptions(){return analysisData.members.map(m=>'<option value="'+escapeHtml(m.name)+'"'+(analysisMember===m.name?' selected':'')+'>'+escapeHtml(m.name)+'</option>').join('');}


  function renderAnalysisSong(){const p=document.getElementById('analysisPanel');p.innerHTML='<div class="analysis-section"><div class="analysis-card"><h2>楽曲別 歌詞分析</h2><div class="analysis-controls"><div class="analysis-search-wrap"><input id="analysisSongInput" list="analysisSongList" placeholder="楽曲名を入力または選択" oninput="filterAnalysisSongPrefix()" onchange="selectAnalysisSongByTitle()" value="'+escapeHtml((analysisData.songList.find(s=>s.id===analysisSongId)||{}).name||'')+'"><button class="u-btn" onclick="clearAnalysisSong()">✕</button></div><datalist id="analysisSongList"></datalist></div></div><div id="analysisSongBody"></div></div>';refreshAnalysisSongDatalist(analysisData.songList);if(analysisSongId)renderAnalysisSongBody(analysisData.songDetails[analysisSongId]);}
  function refreshAnalysisSongDatalist(list){const d=document.getElementById('analysisSongList');if(d)d.innerHTML=list.map(s=>'<option value="'+escapeHtml(s.name)+'"></option>').join('');}
  function filterAnalysisSongPrefix(){const v=(document.getElementById('analysisSongInput').value||'').toLowerCase();refreshAnalysisSongDatalist(v?analysisData.songList.filter(s=>s.name.toLowerCase().startsWith(v)):analysisData.songList);}
  function selectAnalysisSongByTitle(){const v=document.getElementById('analysisSongInput').value,s=analysisData.songList.find(x=>x.name===v);if(!s)return;analysisSongId=s.id;renderAnalysisSongBody(analysisData.songDetails[s.id]);}
  function clearAnalysisSong(){analysisSongId='';renderAnalysisSong();}
  function renderAnalysisTimeline(){const p=document.getElementById('analysisPanel'),rows=analysisData.timelineData,years=[...new Set(rows.map(r=>r.year).filter(Boolean))].sort();p.innerHTML='<div class="analysis-section"><div class="analysis-card"><h2>時系列分析</h2><div class="analysis-controls"><select id="analysisTimelineYear" onchange="drawAnalysisTimeline()"><option value="all">全期間</option>'+years.map(y=>'<option value="'+y+'">'+y+'年</option>').join('')+'</select></div></div><div id="analysisTimelineBody"></div></div>';drawAnalysisTimeline();}
  function drawAnalysisTimeline(){
    const y=document.getElementById('analysisTimelineYear');
    const year=y?y.value:'all',rows=year==='all'?analysisData.timelineData:analysisData.timelineData.filter(function(r){return r.year===year;});
    const body=document.getElementById('analysisTimelineBody');if(!body)return;
    const fl=function(key){return analysisData.members.map(function(m){
      return {name:m.name,val:rows.filter(function(r){return (r[key]||[]).indexOf(m.name)!==-1;}).length};
    }).sort(function(a,b){return b.val-a.val;});};
    const history=rows.filter(function(r){return r.parts>0;});
    const table=genericTable(['公開年','楽曲','歌い出し','歌い終わり'],history.map(function(r){
      return [r.year||'-',r.name,(r.first||[]).join(', ')||'-',(r.last||[]).join(', ')||'-'];
    }));
    body.innerHTML='<div class="analysis-section"><div class="analysis-rank-grid">'+
      genericRankCard('歌い出し回数ランキング',fl('first'),'回')+
      genericRankCard('歌い終わり回数ランキング',fl('last'),'回')+
      '</div><div class="analysis-card"><h3>楽曲別 歌い出し／歌い終わり履歴</h3>'+table+'</div></div>';
  }

  function genericRankCard(title,rows,suffix){return '<div class="analysis-card"><h3>'+title+'</h3><div class="analysis-table-wrap"><table class="analysis-table">'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHtml(r.name)+'</td><td class="num">'+(suffix==='%'?Number(r.val).toFixed(1):r.val)+suffix+'</td></tr>').join('')+'</table></div></div>';}
  function renderAnalysisOther(){const p=document.getElementById('analysisPanel');if(!analysisOtherView){p.innerHTML='<div class="analysis-other-menu">'+[['transfer','パート継承分析'],['sequence','順番分析'],['phrase','フレーズ分析'],['creator','制作者分析'],['release','リリース形態分析']].map(x=>'<button class="analysis-menu-card u-btn" onclick="openAnalysisOther(\''+x[0]+'\')"><strong>'+x[1]+'</strong></button>').join('')+'</div>';return;}renderAnalysisOtherDetail();}
  function openAnalysisOther(view){analysisOtherView=view;renderAnalysisOtherDetail();}
  function renderAnalysisOtherDetail(){if(analysisOtherView==='transfer')renderOtherTransfer();else if(analysisOtherView==='sequence')renderOtherSequence();else if(analysisOtherView==='phrase')renderOtherPhrase();else if(analysisOtherView==='creator')renderOtherCreator();else if(analysisOtherView==='release')renderOtherRelease();else renderAnalysisOther();}
  function renderTransferSongs(){const sel=document.getElementById('analysisTransferMember'),mem=sel?sel.value:'all',host=document.getElementById('analysisTransferSongs');if(!host)return;host.innerHTML=analysisData.partTransferData.songs.map(s=>{const parts=mem==='all'?s.parts:s.parts.filter(p=>p.member===mem);if(!parts.length)return'';return '<div class="analysis-card"><h3>'+escapeHtml(s.songName)+'</h3><div class="analysis-lyrics">'+parts.map(p=>'<div class="analysis-lyric"><div class="analysis-lyric-member">'+escapeHtml(p.member)+'</div><div class="analysis-lyric-text">'+escapeHtml(p.text)+'</div></div>').join('')+'</div></div>';}).join('');}
  function renderOtherSequence(){const d=analysisData.sequenceData;otherShell('順番分析','<div class="analysis-rank-grid"><div class="analysis-card"><h3>回数ランキング（Top 15）</h3>'+genericTable(['順位','パスの流れ','回数'],d.transitions.map((r,i)=>[i+1,r.label,r.count]))+'</div><div class="analysis-card"><h3>掛け合いランキング（Top 15）</h3>'+genericTable(['順位','コンビ','掛け合い回数'],d.abaCombos.map((r,i)=>[i+1,r.label,r.count]))+'</div></div>');}
  function renderOtherPhrase(){const d=analysisData.phraseData,heads=['キーワード',...analysisData.members.map(m=>m.name),'合計'],rows=d.map(x=>[x.keyword,...analysisData.members.map(m=>x.stats[m.name]||'-'),x.stats.total]);otherShell('フレーズ分析','<div class="analysis-card"><div class="analysis-table-wrap">'+genericTable(heads,rows)+'</div></div>');}
  function renderOtherCreator(){const all=analysisData.otherAllSongsData,set=[...new Set(all.flatMap(s=>s[analysisCreatorType]))].sort();otherShell('制作者分析','<div class="analysis-card"><div class="analysis-creator-tabs"><button class="u-btn analysis-creator-tab '+(analysisCreatorType==='lyricists'?'active':'')+'" onclick="analysisCreatorType=\'lyricists\';renderOtherCreator()">作詞</button><button class="u-btn analysis-creator-tab '+(analysisCreatorType==='composers'?'active':'')+'" onclick="analysisCreatorType=\'composers\';renderOtherCreator()">作曲</button><button class="u-btn analysis-creator-tab '+(analysisCreatorType==='choreographers'?'active':'')+'" onclick="analysisCreatorType=\'choreographers\';renderOtherCreator()">コレオ</button></div><div class="analysis-controls"><select id="analysisCreatorSelect" onchange="renderCreatorBody()"><option value="all">全員（全曲）</option>'+set.map(v=>'<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('')+'</select></div></div><div id="analysisCreatorBody"></div>');renderCreatorBody();}
  function renderCreatorBody(){
    const sel=document.getElementById('analysisCreatorSelect');if(!sel)return;
    const creator=sel.value,all=analysisData.otherAllSongsData;
    const songs=creator==='all'?all:all.filter(function(s){return s[analysisCreatorType].includes(creator);});
    const first={},last={};
    analysisData.members.forEach(function(m){first[m.name]=0;last[m.name]=0;});
    songs.forEach(function(s){
      s.first.forEach(function(name){if(first[name]!=null)first[name]++;});
      s.last.forEach(function(name){if(last[name]!=null)last[name]++;});
    });
    const base=songs.filter(function(s){return s.parts>0;}).length;
    const rows=analysisData.members.map(function(m){
      const countFirst=first[m.name],countLast=last[m.name];
      return [m.name,countFirst,base?(countFirst/base*100).toFixed(1)+'%':'-',
        countLast,base?(countLast/base*100).toFixed(1)+'%':'-'];
    });
    document.getElementById('analysisCreatorBody').innerHTML=
      '<div class="analysis-card"><h3>担当楽曲一覧</h3><p class="analysis-song-list">'+
      (songs.length?songs.map(function(s){return escapeHtml(s.name);}).join(' / '):'対象曲なし')+
      '</p></div><div class="analysis-card"><h3>メンバー別 歌い出し／歌い終わり</h3>'+
      genericTable(['メンバー','歌い出し(回)','対象曲比率','歌い終わり(回)','対象曲比率'],rows)+
      '</div>';
  }

  function renderOtherRelease(){const options=[['all','全形態'],['title','表題曲'],['single','シングル曲'],['album','アルバム曲'],['digital','デジタルシングル']];otherShell('リリース形態分析','<div class="analysis-card"><div class="analysis-controls"><select id="analysisReleaseType" onchange="renderReleaseBody()">'+options.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select></div></div><div id="analysisReleaseBody"></div>');renderReleaseBody();}
  function releaseMatches(s,type){if(type==='title')return!!s.isTitleTrack;if(type==='single')return s.form==='シングル'&&!s.isTitleTrack;if(type==='album')return s.form.indexOf('アルバム')!==-1;if(type==='digital')return s.form.indexOf('デジタル')!==-1;return true;}
  function renderReleaseBody(){
    const sel=document.getElementById('analysisReleaseType');if(!sel)return;
    const type=sel.value,all=analysisData.otherAllSongsData;
    const songs=all.filter(function(s){return releaseMatches(s,type);});
    const first={},last={};
    analysisData.members.forEach(function(m){first[m.name]=0;last[m.name]=0;});
    songs.forEach(function(s){
      s.first.forEach(function(n){if(first[n]!=null)first[n]++;});
      s.last.forEach(function(n){if(last[n]!=null)last[n]++;});
    });
    const rows=analysisData.members.map(function(m){return [m.name,first[m.name],last[m.name]];});
    document.getElementById('analysisReleaseBody').innerHTML=
      '<div class="analysis-card"><h3>対象楽曲一覧</h3><p class="analysis-song-list">'+
      (songs.length?songs.map(function(s){return escapeHtml(s.name);}).join(' / '):'対象曲なし')+
      '</p></div><div class="analysis-card"><h3>歌い出し・歌い終わり回数</h3>'+
      genericTable(['メンバー','歌い出し(回)','歌い終わり(回)'],rows)+'</div>';
  }

  function genericTable(headers,rows,raw){return '<div class="analysis-table-wrap"><table class="analysis-table"><thead><tr>'+headers.map(h=>'<th>'+escapeHtml(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+(raw?String(v):escapeHtml(String(v)))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}


  function showAnalysisSongList(title,rows){showAnalysisModal(title,'<p class="analysis-song-list">'+(rows.length?rows.map(r=>escapeHtml(r.songName)).join('<br>'):'データなし')+'</p>');}
  function closeAnalysisModal(){const m=document.getElementById('analysisModal');if(m)m.hidden=true;}
  /* Canonical ANALYSIS runtime authority. */
  window.__analysisCanonicalRuntimeState=window.__analysisCanonicalRuntimeState||{
    memberModalRows:{first:[],last:[]},
    currentSongDetail:null
  };

  function renderAnalysisMember(){
    const p=document.getElementById('analysisPanel');
    p.innerHTML='<div class="analysis-section"><div class="analysis-card"><h2>メンバー別 歌割り分析</h2>'+
      '<div class="analysis-controls"><select id="analysisMemberSelect" onchange="analysisMember=this.value;analysisYear=\'all\';renderAnalysisMember()">'+
      '<option value="">メンバーを選択してください</option>'+memberOptions()+
      '</select><select id="analysisYearSelect" onchange="analysisYear=this.value;renderAnalysisMember()" '+(!analysisMember?'disabled':'')+'></select></div></div>'+
      '<div id="analysisMemberBody"></div></div>';
    const select=document.getElementById('analysisYearSelect');
    if(!analysisMember){select.innerHTML='<option>全期間</option>';return;}
    const rows=(analysisData.memberAnalysis[analysisMember]||{songs:[]}).songs;
    const years=[...new Set(rows.map(function(r){return r.year;}).filter(Boolean))].sort();
    select.innerHTML='<option value="all">全期間</option>'+
      years.map(function(v){return '<option value="'+v+'"'+(analysisYear===v?' selected':'')+'>'+v+'年</option>';}).join('');
    const list=analysisYear==='all'?rows:rows.filter(function(r){return r.year===analysisYear;});
    const first=list.filter(function(r){return r.isFirst;}),last=list.filter(function(r){return r.isLast;});
    window.__analysisCanonicalRuntimeState.memberModalRows={first:first,last:last};
    const listTable=genericTable(['楽曲','歌い出し','歌い終わり'],list.map(function(r){
      return [r.songName,r.isFirst?'○':'-',r.isLast?'○':'-'];
    }));
    document.getElementById('analysisMemberBody').innerHTML=
      '<div class="analysis-section"><div class="analysis-stats">'+
      '<div class="analysis-stat"><span class="analysis-stat-label">担当パートがある楽曲</span><span class="analysis-stat-value">'+list.length+'</span></div>'+
      '<button class="analysis-stat u-btn" onclick="showAnalysisMemberSongList(\'first\')">'+
      '<span class="analysis-stat-label">歌い出し回数</span><span class="analysis-stat-value">'+first.length+'</span></button>'+
      '<button class="analysis-stat u-btn" onclick="showAnalysisMemberSongList(\'last\')">'+
      '<span class="analysis-stat-label">歌い終わり回数</span><span class="analysis-stat-value">'+last.length+'</span></button>'+
      '</div><div class="analysis-card"><h3>担当楽曲一覧</h3>'+listTable+'</div></div>';
  }

  function showAnalysisMemberSongList(type){
    const rows=window.__analysisCanonicalRuntimeState.memberModalRows[type]||[];
    showAnalysisSongList(type==='first'?'歌い出し楽曲':'歌い終わり楽曲',rows);
  }

  function renderAnalysisSongBody(d){
    window.__analysisCanonicalRuntimeState.currentSongDetail=d;
    const body=document.getElementById('analysisSongBody');
    if(!body||!d)return;
    body.innerHTML='<div class="analysis-section"><div class="analysis-stats">'+
      '<div class="analysis-stat"><div class="analysis-stat-label">歌い出し</div><div class="analysis-stat-value">'+escapeHtml(d.firstSinger)+'</div></div>'+
      '<div class="analysis-stat"><div class="analysis-stat-label">歌い終わり</div><div class="analysis-stat-value">'+escapeHtml(d.lastSinger)+'</div></div>'+
      '</div><div class="analysis-card"><h3 id="analysisLyricsTitle">歌詞一覧（全員）</h3>'+
      '<div id="analysisLyricsBody" class="analysis-lyrics"></div></div></div>';
    renderAnalysisSongLyrics('ALL');
  }

  function renderAnalysisSongLyrics(target){
    const d=window.__analysisCanonicalRuntimeState.currentSongDetail;
    const title=document.getElementById('analysisLyricsTitle');
    const host=document.getElementById('analysisLyricsBody');
    if(!d||!title||!host)return;
    title.textContent=target==='ALL'?'歌詞一覧（全員）':'歌詞一覧（'+target+' 歌唱パート）';
    const rows=d.lyrics.filter(function(line){
      if(target==='ALL')return true;
      return String(line.members||'').split(',').map(function(v){return v.trim();}).indexOf(target)!==-1;
    });
    host.innerHTML=rows.length?rows.map(function(line){return '<div class="analysis-lyric"><div class="analysis-lyric-member">'+escapeHtml(line.members)+'</div><div class="analysis-lyric-text">'+escapeHtml(line.text)+'</div></div>';}).join(''):'<p class="analysis-muted">該当する歌詞データがありません。</p>';
  }



  function showAnalysisModal(title,html){
    let m=document.getElementById('analysisModal');
    if(!m){
      m=document.createElement('div');
      m.id='analysisModal';
      m.className='analysis-modal';
      m.innerHTML='<div class="analysis-modal-card" role="dialog" aria-modal="true" aria-labelledby="analysisModalTitle"><div class="analysis-modal-head"><h2 id="analysisModalTitle"></h2><button class="analysis-modal-close u-btn" onclick="closeAnalysisModal()">閉じる</button></div><div id="analysisModalBody" class="analysis-modal-body"></div></div>';
      m.addEventListener('click',function(e){if(e.target===m)closeAnalysisModal();});
      document.body.appendChild(m);
    }
    document.getElementById('analysisModalTitle').textContent=title;
    document.getElementById('analysisModalBody').innerHTML=html;
    m.hidden=false;
  }

  function otherShell(title,html){
    document.getElementById('analysisPanel').innerHTML='<div class="analysis-section"><div class="analysis-subhead"><button class="u-btn analysis-back" aria-label="戻る" onclick="analysisOtherView=\'\';renderAnalysisOther()">‹</button><h2>'+title+'</h2></div>'+html+'</div>';
  }

  function renderOtherTransfer(){
    const d=analysisData.partTransferData;
    otherShell('パート継承分析','<div class="analysis-card"><h3>引き継ぎパート数ランキング</h3>'+genericTable(['順位','メンバー','引き継ぎパート数'],d.ranking.map((r,i)=>[i+1,r.name,r.count]))+'</div><div class="analysis-card"><h3>メンバー検索</h3><div class="analysis-controls"><select id="analysisTransferMember" onchange="renderTransferSongs()"><option value="all">全メンバー表示</option>'+d.ranking.map(r=>'<option>'+escapeHtml(r.name)+'</option>').join('')+'</select></div></div><div id="analysisTransferSongs"></div>');
    renderTransferSongs();
  }
</script>

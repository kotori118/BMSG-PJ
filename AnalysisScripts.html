<script>
  let analysisData=null,analysisView='top',analysisCharts=[],analysisMember='',analysisYear='all',analysisSongId='',analysisOtherView='',analysisCreatorType='lyricists';
  function renderAnalysis(){const t=document.getElementById('analysisPageTemplate');return t?t.innerHTML:'<section class="view"><h1>ANALYSIS</h1></section>';}
  function initAnalysisPage(){analysisView='top';const panel=document.getElementById('analysisPanel');if(!panel)return;if(!analysisData){panel.innerHTML='<div class="analysis-loading">'+renderUniverseLoading('LOADING...','#9cecff')+'</div>';google.script.run.withSuccessHandler(function(data){analysisData=data;renderAnalysisView();}).withFailureHandler(function(err){panel.innerHTML='<div class="analysis-card"><h2>読み込みに失敗しました</h2><p class="analysis-muted">'+escapeHtml(String(err&&err.message||err))+'</p><button class="u-btn" onclick="retryAnalysis()">RETRY</button></div>';}).getAnalysisBootstrap();}else renderAnalysisView();}
  function retryAnalysis(){analysisData=null;initAnalysisPage();}
  function selectAnalysisView(view){analysisView=view;analysisOtherView='';document.querySelectorAll('.analysis-tab').forEach(b=>b.classList.toggle('active',b.dataset.analysisView===view));renderAnalysisView();}
  function renderAnalysisView(){destroyAnalysisCharts();document.querySelectorAll('.analysis-tab').forEach(b=>b.classList.toggle('active',b.dataset.analysisView===analysisView));const p=document.getElementById('analysisPanel');if(!p||!analysisData)return;if(analysisView==='member')renderAnalysisMember();else if(analysisView==='song')renderAnalysisSong();else if(analysisView==='timeline')renderAnalysisTimeline();else if(analysisView==='other')renderAnalysisOther();else renderAnalysisTop();}
  function renderAnalysisTop(){document.getElementById('analysisPanel').innerHTML='<div class="analysis-menu">'+[
    ['member','メンバー別分析','歌唱・センター割合、歌い出し／歌い終わり、ランキング'],['song','楽曲別分析','歌唱・センター構成、特化度、歌詞'],['timeline','時系列分析','割合推移と各種ランキング'],['other','その他分析','パート継承、順番、フレーズ、制作者、リリース形態、レコード']
  ].map(x=>'<button class="analysis-menu-card u-btn" onclick="selectAnalysisView(\''+x[0]+'\')"><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join('')+'</div>';}
  function memberOptions(){return analysisData.members.map(m=>'<option value="'+escapeHtml(m.name)+'"'+(analysisMember===m.name?' selected':'')+'>'+escapeHtml(m.name)+'</option>').join('');}
  function renderAnalysisMember(){const p=document.getElementById('analysisPanel');p.innerHTML='<div class="analysis-section"><div class="analysis-card"><h2>メンバー別 楽曲割合分析</h2><div class="analysis-controls"><select id="analysisMemberSelect" onchange="analysisMember=this.value;analysisYear=\'all\';renderAnalysisMember()"><option value="">メンバーを選択してください</option>'+memberOptions()+'</select><select id="analysisYearSelect" onchange="analysisYear=this.value;renderAnalysisMember()" '+(!analysisMember?'disabled':'')+'></select></div></div><div id="analysisMemberBody"></div></div>';const y=document.getElementById('analysisYearSelect');if(!analysisMember){y.innerHTML='<option>全期間</option>';return;}const rows=(analysisData.memberAnalysis[analysisMember]||{songs:[]}).songs;const years=[...new Set(rows.map(r=>r.year).filter(Boolean))].sort();y.innerHTML='<option value="all">全期間</option>'+years.map(v=>'<option value="'+v+'"'+(analysisYear===v?' selected':'')+'>'+v+'年</option>').join('');const list=analysisYear==='all'?rows:rows.filter(r=>r.year===analysisYear);const validS=list.filter(r=>typeof r.singRatio==='number'),validC=list.filter(r=>typeof r.centerRatio==='number'),avg=a=>a.length?(a.reduce((s,r)=>s+r,0)/a.length).toFixed(1):'--';const lyric=list.filter(r=>r.hasLyric),first=lyric.filter(r=>r.isFirst),last=lyric.filter(r=>r.isLast);const rankS=[...validS].sort((a,b)=>b.singRatio-a.singRatio),rankC=[...validC].sort((a,b)=>b.centerRatio-a.centerRatio);document.getElementById('analysisMemberBody').innerHTML='<div class="analysis-section"><div class="analysis-card"><div class="analysis-chart"><canvas id="analysisMemberChart"></canvas></div></div><div class="analysis-stats"><button class="analysis-stat u-btn"><span class="analysis-stat-label">平均歌唱割合</span><span class="analysis-stat-value">'+avg(validS.map(r=>r.singRatio))+(validS.length?'%':'')+'</span></button><button class="analysis-stat u-btn"><span class="analysis-stat-label">平均センター割合</span><span class="analysis-stat-value">'+avg(validC.map(r=>r.centerRatio))+(validC.length?'%':'')+'</span></button><button class="analysis-stat u-btn" onclick="showAnalysisSongList(\'歌い出し楽曲\','+htmlJson(first)+')"><span class="analysis-stat-label">歌い出し回数</span><span class="analysis-stat-value">'+first.length+' / '+lyric.length+'</span></button><button class="analysis-stat u-btn" onclick="showAnalysisSongList(\'歌い終わり楽曲\','+htmlJson(last)+')"><span class="analysis-stat-label">歌い終わり回数</span><span class="analysis-stat-value">'+last.length+' / '+lyric.length+'</span></button></div><div class="analysis-rank-grid">'+rankBlock('歌唱割合ランキング',rankS,'singRatio')+rankBlock('センター割合ランキング',rankC,'centerRatio')+'</div></div>';drawMemberChart(list,analysisMember);}
  function rankBlock(title,rows,key){const top=rows.slice(0,3),worst=rows.slice(-3).reverse();return '<div class="analysis-card"><h3>'+title+'</h3><div class="analysis-rank-grid"><div><p class="analysis-muted">TOP 3</p>'+simpleRank(top,key)+'</div><div><p class="analysis-muted">WORST 3</p>'+simpleRank(worst,key)+'</div></div><button class="u-btn" onclick="showAnalysisRanking(\''+title+'\','+htmlJson(rows)+',\''+key+'\')">もっと見る（全曲ランキング）</button></div>';}
  function simpleRank(rows,key){return '<div class="analysis-table-wrap"><table class="analysis-table">'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHtml(r.songName)+'</td><td class="num">'+Number(r[key]).toFixed(1)+'%</td></tr>').join('')+'</table></div>';}
  function drawMemberChart(rows,name){if(typeof Chart==='undefined')return;const m=analysisData.members.find(x=>x.name===name)||{};const ctx=document.getElementById('analysisMemberChart');if(!ctx)return;analysisCharts.push(new Chart(ctx,{type:'line',data:{labels:rows.map(r=>r.songName),datasets:[{label:'歌唱割合(%)',data:rows.map(r=>r.singRatio),borderColor:m.color||'#9cecff',backgroundColor:m.color||'#9cecff',spanGaps:false,tension:.1},{label:'センター割合(%)',data:rows.map(r=>r.centerRatio),borderColor:'#9cecff',backgroundColor:'#9cecff',spanGaps:false,tension:.1}]},options:chartOptions()}));}
  function renderAnalysisSong(){const p=document.getElementById('analysisPanel');p.innerHTML='<div class="analysis-section"><div class="analysis-card"><h2>楽曲別 構成・歌詞分析</h2><div class="analysis-controls"><div class="analysis-search-wrap"><input id="analysisSongInput" list="analysisSongList" placeholder="楽曲名を入力または選択" oninput="filterAnalysisSongPrefix()" onchange="selectAnalysisSongByTitle()" value="'+escapeHtml((analysisData.songList.find(s=>s.id===analysisSongId)||{}).name||'')+'"><button class="u-btn" onclick="clearAnalysisSong()">✕</button></div><datalist id="analysisSongList"></datalist></div></div><div id="analysisSongBody"></div></div>';refreshAnalysisSongDatalist(analysisData.songList);if(analysisSongId)renderAnalysisSongBody(analysisData.songDetails[analysisSongId]);}
  function refreshAnalysisSongDatalist(list){const d=document.getElementById('analysisSongList');if(d)d.innerHTML=list.map(s=>'<option value="'+escapeHtml(s.name)+'"></option>').join('');}
  function filterAnalysisSongPrefix(){const v=(document.getElementById('analysisSongInput').value||'').toLowerCase();refreshAnalysisSongDatalist(v?analysisData.songList.filter(s=>s.name.toLowerCase().startsWith(v)):analysisData.songList);}
  function selectAnalysisSongByTitle(){const v=document.getElementById('analysisSongInput').value,s=analysisData.songList.find(x=>x.name===v);if(!s)return;analysisSongId=s.id;renderAnalysisSongBody(analysisData.songDetails[s.id]);}
  function clearAnalysisSong(){analysisSongId='';renderAnalysisSong();}
  function renderAnalysisSongBody(d){const body=document.getElementById('analysisSongBody');if(!body||!d)return;body.innerHTML='<div class="analysis-section"><div class="analysis-stats"><div class="analysis-stat"><div class="analysis-stat-label">歌唱割当て</div><div class="analysis-stat-value">'+escapeHtml(d.singBalance.type)+'</div><div class="analysis-muted">'+(d.singBalance.level==null?'':'特化度: '+d.singBalance.level)+'</div></div><div class="analysis-stat"><div class="analysis-stat-label">センター配置</div><div class="analysis-stat-value">'+escapeHtml(d.centerBalance.type)+'</div><div class="analysis-muted">'+(d.centerBalance.level==null?'':'特化度: '+d.centerBalance.level)+'</div></div></div>'+(d.hasSing||d.hasDance?'<div class="analysis-card"><div class="analysis-pies">'+(d.hasSing?'<div><h3>歌唱割合</h3><div class="analysis-pie"><canvas id="analysisSingPie"></canvas></div></div>':'')+(d.hasDance?'<div><h3>センター割合</h3><div class="analysis-pie"><canvas id="analysisCenterPie"></canvas></div></div>':'')+'</div><div class="analysis-legend">'+analysisData.members.map(m=>'<span class="analysis-legend-item"><i class="analysis-legend-dot" style="background:'+m.color+'"></i>'+escapeHtml(m.name)+'</span>').join('')+'</div></div>':'<div class="analysis-card"><p class="analysis-muted">秒数データが未登録です</p></div>')+'<div class="analysis-stats"><div class="analysis-stat"><div class="analysis-stat-label">歌い出し</div><div class="analysis-stat-value">'+escapeHtml(d.firstSinger)+'</div></div><div class="analysis-stat"><div class="analysis-stat-label">歌い終わり</div><div class="analysis-stat-value">'+escapeHtml(d.lastSinger)+'</div></div></div><div class="analysis-card"><h3>歌詞一覧（全員）</h3><div class="analysis-lyrics">'+d.lyrics.map(l=>'<div class="analysis-lyric"><div class="analysis-lyric-member">'+escapeHtml(l.members)+'</div><div class="analysis-lyric-text">'+escapeHtml(l.text)+'</div></div>').join('')+'</div></div></div>';if(d.hasSing)drawPie('analysisSingPie',d.singData);if(d.hasDance)drawPie('analysisCenterPie',d.centerData);}
  function drawPie(id,data){if(typeof Chart==='undefined')return;const el=document.getElementById(id);if(!el)return;analysisCharts.push(new Chart(el,{type:'pie',data:{labels:analysisData.members.map(m=>m.name),datasets:[{data:data,backgroundColor:analysisData.members.map(m=>m.color),borderColor:'#07101a',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+c.raw+'%'}},datalabels:{display:false}}}}));}
  function renderAnalysisTimeline(){const p=document.getElementById('analysisPanel'),rows=analysisData.timelineData,years=[...new Set(rows.map(r=>r.year).filter(Boolean))].sort();p.innerHTML='<div class="analysis-section"><div class="analysis-card"><h2>時系列分析</h2><div class="analysis-controls"><select id="analysisTimelineYear" onchange="drawAnalysisTimeline()"><option value="all">全期間</option>'+years.map(y=>'<option value="'+y+'">'+y+'年</option>').join('')+'</select></div></div><div id="analysisTimelineBody"></div></div>';drawAnalysisTimeline();}
  function drawAnalysisTimeline(){destroyAnalysisCharts();const y=document.getElementById('analysisTimelineYear'),year=y?y.value:'all',rows=year==='all'?analysisData.timelineData:analysisData.timelineData.filter(r=>r.year===year),body=document.getElementById('analysisTimelineBody');const avgRanks=(type)=>analysisData.members.map(m=>{const vals=rows.map(r=>r[type+'Total']>0&&r[type+'Sec'][m.name]!=null?r[type+'Sec'][m.name]/r[type+'Total']*100:null).filter(v=>v!=null);return{name:m.name,val:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0};}).sort((a,b)=>b.val-a.val);const fl=(key)=>analysisData.members.map(m=>({name:m.name,val:rows.filter(r=>r[key].includes(m.name)).length})).sort((a,b)=>b.val-a.val);body.innerHTML='<div class="analysis-section"><div class="analysis-card"><h3>歌唱割合推移</h3><div class="analysis-chart tall"><canvas id="analysisTimelineSing"></canvas></div></div><div class="analysis-card"><h3>センター割合推移</h3><div class="analysis-chart tall"><canvas id="analysisTimelineCenter"></canvas></div></div><div class="analysis-rank-grid">'+genericRankCard('平均歌唱割合ランキング',avgRanks('sing'),'%')+genericRankCard('平均センター割合ランキング',avgRanks('center'),'%')+genericRankCard('歌い出し回数ランキング',fl('first'),'回')+genericRankCard('歌い終わり回数ランキング',fl('last'),'回')+'</div></div>';drawTimelineChart('analysisTimelineSing',rows,'sing');drawTimelineChart('analysisTimelineCenter',rows,'center');}
  function drawTimelineChart(id,rows,type){if(typeof Chart==='undefined')return;const el=document.getElementById(id);if(!el)return;analysisCharts.push(new Chart(el,{type:'line',data:{labels:rows.map(r=>r.name),datasets:analysisData.members.map(m=>({label:m.name,data:rows.map(r=>r[type+'Total']>0&&r[type+'Sec'][m.name]!=null?+(r[type+'Sec'][m.name]/r[type+'Total']*100).toFixed(1):null),borderColor:m.color,backgroundColor:m.color,spanGaps:false,tension:.1}))},options:chartOptions()}));}
  function genericRankCard(title,rows,suffix){return '<div class="analysis-card"><h3>'+title+'</h3><div class="analysis-table-wrap"><table class="analysis-table">'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHtml(r.name)+'</td><td class="num">'+(suffix==='%'?Number(r.val).toFixed(1):r.val)+suffix+'</td></tr>').join('')+'</table></div></div>';}
  function renderAnalysisOther(){const p=document.getElementById('analysisPanel');if(!analysisOtherView){p.innerHTML='<div class="analysis-other-menu">'+[['transfer','パート継承分析'],['sequence','順番分析'],['phrase','フレーズ分析'],['creator','制作者分析'],['release','リリース形態分析'],['record','レコード']].map(x=>'<button class="analysis-menu-card u-btn" onclick="openAnalysisOther(\''+x[0]+'\')"><strong>'+x[1]+'</strong></button>').join('')+'</div>';return;}renderAnalysisOtherDetail();}
  function openAnalysisOther(view){analysisOtherView=view;renderAnalysisOtherDetail();}
  function otherShell(title,html){document.getElementById('analysisPanel').innerHTML='<div class="analysis-section"><div class="analysis-subhead"><button class="u-btn analysis-back" onclick="analysisOtherView=\'\';renderAnalysisOther()">BACK</button><h2>'+title+'</h2></div>'+html+'</div>';}
  function renderAnalysisOtherDetail(){if(analysisOtherView==='transfer')renderOtherTransfer();else if(analysisOtherView==='sequence')renderOtherSequence();else if(analysisOtherView==='phrase')renderOtherPhrase();else if(analysisOtherView==='creator')renderOtherCreator();else if(analysisOtherView==='release')renderOtherRelease();else renderOtherRecord();}
  function renderOtherTransfer(){const d=analysisData.partTransferData;otherShell('パート継承分析','<div class="analysis-card"><h3>引き継ぎパート数ランキング</h3>'+genericTable(['順位','メンバー','引き継ぎパート数'],d.ranking.map((r,i)=>[i+1,r.name,r.count]))+'<h3>メンバー検索</h3><div class="analysis-controls"><select id="analysisTransferMember" onchange="renderTransferSongs()"><option value="all">全メンバー表示</option>'+d.ranking.map(r=>'<option>'+escapeHtml(r.name)+'</option>').join('')+'</select></div></div><div id="analysisTransferSongs"></div>');renderTransferSongs();}
  function renderTransferSongs(){const sel=document.getElementById('analysisTransferMember'),mem=sel?sel.value:'all',host=document.getElementById('analysisTransferSongs');if(!host)return;host.innerHTML=analysisData.partTransferData.songs.map(s=>{const parts=mem==='all'?s.parts:s.parts.filter(p=>p.member===mem);if(!parts.length)return'';return '<div class="analysis-card"><h3>'+escapeHtml(s.songName)+'</h3><div class="analysis-lyrics">'+parts.map(p=>'<div class="analysis-lyric"><div class="analysis-lyric-member">'+escapeHtml(p.member)+'</div><div class="analysis-lyric-text">'+escapeHtml(p.text)+'</div></div>').join('')+'</div></div>';}).join('');}
  function renderOtherSequence(){const d=analysisData.sequenceData;otherShell('順番分析','<div class="analysis-rank-grid"><div class="analysis-card"><h3>回数ランキング（Top 15）</h3>'+genericTable(['順位','パスの流れ','回数'],d.transitions.map((r,i)=>[i+1,r.label,r.count]))+'</div><div class="analysis-card"><h3>掛け合いランキング（Top 15）</h3>'+genericTable(['順位','コンビ','掛け合い回数'],d.abaCombos.map((r,i)=>[i+1,r.label,r.count]))+'</div></div>');}
  function renderOtherPhrase(){const d=analysisData.phraseData,heads=['キーワード',...analysisData.members.map(m=>m.name),'合計'],rows=d.map(x=>[x.keyword,...analysisData.members.map(m=>x.stats[m.name]||'-'),x.stats.total]);otherShell('フレーズ分析','<div class="analysis-card"><div class="analysis-table-wrap">'+genericTable(heads,rows)+'</div></div>');}
  function renderOtherCreator(){const all=analysisData.otherAllSongsData,set=[...new Set(all.flatMap(s=>s[analysisCreatorType]))].sort();otherShell('制作者分析','<div class="analysis-card"><div class="analysis-creator-tabs"><button class="u-btn analysis-creator-tab '+(analysisCreatorType==='lyricists'?'active':'')+'" onclick="analysisCreatorType=\'lyricists\';renderOtherCreator()">作詞</button><button class="u-btn analysis-creator-tab '+(analysisCreatorType==='composers'?'active':'')+'" onclick="analysisCreatorType=\'composers\';renderOtherCreator()">作曲</button><button class="u-btn analysis-creator-tab '+(analysisCreatorType==='choreographers'?'active':'')+'" onclick="analysisCreatorType=\'choreographers\';renderOtherCreator()">コレオ</button></div><div class="analysis-controls"><select id="analysisCreatorSelect" onchange="renderCreatorBody()"><option value="all">全員（全曲）</option>'+set.map(v=>'<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join('')+'</select></div></div><div id="analysisCreatorBody"></div>');renderCreatorBody();}
  function calcAllStats(songs){const ss={},cs={};let st=0,ct=0;analysisData.members.forEach(m=>{ss[m.name]=0;cs[m.name]=0});songs.forEach(s=>{if(s.singTotal>0){st+=s.singTotal;analysisData.members.forEach(m=>{if(s.singSec[m.name]!=null)ss[m.name]+=s.singSec[m.name]})}if(s.centerTotal>0){ct+=s.centerTotal;analysisData.members.forEach(m=>{if(s.centerSec[m.name]!=null)cs[m.name]+=s.centerSec[m.name]})}});return{sing:ss,center:cs,singTotal:st,centerTotal:ct};}
  function renderCreatorBody(){const sel=document.getElementById('analysisCreatorSelect');if(!sel)return;const creator=sel.value,all=analysisData.otherAllSongsData,songs=creator==='all'?all:all.filter(s=>s[analysisCreatorType].includes(creator)),base=calcAllStats(all),st=calcAllStats(songs),first={},last={};analysisData.members.forEach(m=>{first[m.name]=0;last[m.name]=0});songs.forEach(s=>{s.first.forEach(n=>{if(first[n]!=null)first[n]++});s.last.forEach(n=>{if(last[n]!=null)last[n]++})});const rows=analysisData.members.map(m=>{const s=st.singTotal?st.sing[m.name]/st.singTotal*100:null,c=st.centerTotal?st.center[m.name]/st.centerTotal*100:null,bs=base.singTotal?base.sing[m.name]/base.singTotal*100:null,bc=base.centerTotal?base.center[m.name]/base.centerTotal*100:null;return[m.name,s==null?'-':s.toFixed(1),creator==='all'?'-':diffHtml(s,bs),c==null?'-':c.toFixed(1),creator==='all'?'-':diffHtml(c,bc)]});const fl=analysisData.members.map(m=>[m.name,first[m.name],songs.length?((first[m.name]/songs.length)*100).toFixed(1)+'%':'-',last[m.name],songs.length?((last[m.name]/songs.length)*100).toFixed(1)+'%':'-']);document.getElementById('analysisCreatorBody').innerHTML='<div class="analysis-card"><h3>担当楽曲一覧</h3><p class="analysis-song-list">'+(creator==='all'?'全曲対象':songs.map(s=>escapeHtml(s.name)).join(' / '))+'</p></div><div class="analysis-card"><h3>メンバー別 平均割合</h3>'+genericTable(['メンバー','平均歌唱割合(%)','全曲比較','平均センター割合(%)','全曲比較'],rows,true)+'</div><div class="analysis-card"><h3>メンバー別 歌い出し/終わり 回数・シェア率</h3>'+genericTable(['メンバー','歌い出し(回)','シェア率(%)','歌い終わり(回)','シェア率(%)'],fl)+'</div>';}
  function renderOtherRelease(){const options=[['all','全形態'],['title','表題曲'],['single','シングル曲'],['album','アルバム曲'],['digital','デジタルシングル']];otherShell('リリース形態分析','<div class="analysis-card"><div class="analysis-controls"><select id="analysisReleaseType" onchange="renderReleaseBody()">'+options.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select></div></div><div id="analysisReleaseBody"></div>');renderReleaseBody();}
  function releaseMatches(s,type){if(type==='title')return!!s.isTitleTrack;if(type==='single')return s.form==='シングル'&&!s.isTitleTrack;if(type==='album')return s.form.indexOf('アルバム')!==-1;if(type==='digital')return s.form.indexOf('デジタル')!==-1;return true;}
  function renderReleaseBody(){const sel=document.getElementById('analysisReleaseType');if(!sel)return;const type=sel.value,all=analysisData.otherAllSongsData,songs=all.filter(s=>releaseMatches(s,type)),base=calcAllStats(all),st=calcAllStats(songs),rows=analysisData.members.map(m=>{const s=st.singTotal?st.sing[m.name]/st.singTotal*100:null,c=st.centerTotal?st.center[m.name]/st.centerTotal*100:null,bs=base.singTotal?base.sing[m.name]/base.singTotal*100:null,bc=base.centerTotal?base.center[m.name]/base.centerTotal*100:null;return[m.name,s==null?'-':s.toFixed(1),type==='all'?'-':diffHtml(s,bs),c==null?'-':c.toFixed(1),type==='all'?'-':diffHtml(c,bc)]});document.getElementById('analysisReleaseBody').innerHTML='<div class="analysis-card"><h3>対象楽曲一覧</h3><p class="analysis-song-list">'+(type==='all'?'全曲対象':songs.map(s=>escapeHtml(s.name)).join(' / '))+'</p></div><div class="analysis-card"><h3>メンバー別 平均割合</h3>'+genericTable(['メンバー','平均歌唱割合(%)','全形態比較','平均センター割合(%)','全形態比較'],rows,true)+'</div>';}
  function renderOtherRecord(){const all=analysisData.otherAllSongsData,s=[],c=[];all.forEach(x=>{analysisData.members.forEach(m=>{if(x.singTotal>0&&x.singSec[m.name]!=null)s.push({song:x.name,member:m.name,val:x.singSec[m.name]});if(x.centerTotal>0&&x.centerSec[m.name]!=null)c.push({song:x.name,member:m.name,val:x.centerSec[m.name]})})});s.sort((a,b)=>b.val-a.val);c.sort((a,b)=>b.val-a.val);const top=list=>list.slice(0,10).map((x,i)=>[i+1,x.member,x.song,x.val]),mm=analysisData.members.map(m=>{const l=s.filter(x=>x.member===m.name);return l.length?[m.name,l[0].song+' ('+l[0].val+'秒)',l[l.length-1].song+' ('+l[l.length-1].val+'秒)']:[m.name,'-','-']});otherShell('レコード','<div class="analysis-card"><h3>歴代歌唱秒数ランキング（TOP10）</h3>'+genericTable(['順位','メンバー','楽曲','秒数'],top(s))+'</div><div class="analysis-card"><h3>歴代センター秒数ランキング（TOP10）</h3>'+genericTable(['順位','メンバー','楽曲','秒数'],top(c))+'</div><div class="analysis-card"><h3>メンバー別 最多・最少歌唱秒数楽曲</h3>'+genericTable(['メンバー','最多秒数 楽曲','最少秒数 楽曲'],mm)+'</div>');}
  function genericTable(headers,rows,raw){return '<div class="analysis-table-wrap"><table class="analysis-table"><thead><tr>'+headers.map(h=>'<th>'+escapeHtml(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+(raw?String(v):escapeHtml(String(v)))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
  function diffHtml(a,b){if(a==null||b==null)return'-';const d=a-b;if(d>0)return'<span class="analysis-diff-plus">+'+d.toFixed(1)+'</span>';if(d<0)return'<span class="analysis-diff-minus">'+d.toFixed(1)+'</span>';return'<span class="analysis-diff-zero">±0.0</span>';}
  function chartOptions(){return{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{labels:{color:'#dce5ee'}},datalabels:{display:false}},scales:{x:{ticks:{color:'#9ca8b6',maxRotation:45,minRotation:45},grid:{color:'rgba(255,255,255,.05)'}},y:{beginAtZero:true,ticks:{color:'#9ca8b6'},grid:{color:'rgba(255,255,255,.07)'}}}};}
  function destroyAnalysisCharts(){analysisCharts.forEach(c=>{try{c.destroy()}catch(e){}});analysisCharts=[];}
  function showAnalysisRanking(title,rows,key){showAnalysisModal(title,'<div class="analysis-table-wrap"><table class="analysis-table">'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+escapeHtml(r.songName)+'</td><td class="num">'+Number(r[key]).toFixed(1)+'%</td></tr>').join('')+'</table></div>');}
  function showAnalysisSongList(title,rows){showAnalysisModal(title,'<p class="analysis-song-list">'+(rows.length?rows.map(r=>escapeHtml(r.songName)).join('<br>'):'データなし')+'</p>');}
  function showAnalysisModal(title,html){let m=document.getElementById('analysisModal');if(!m){m=document.createElement('div');m.id='analysisModal';m.className='analysis-modal';m.innerHTML='<div class="analysis-modal-card"><div class="analysis-modal-head"><h2 id="analysisModalTitle"></h2><button class="u-btn" onclick="closeAnalysisModal()">CLOSE</button></div><div id="analysisModalBody"></div></div>';document.body.appendChild(m);}document.getElementById('analysisModalTitle').textContent=title;document.getElementById('analysisModalBody').innerHTML=html;m.hidden=false;}
  function closeAnalysisModal(){const m=document.getElementById('analysisModal');if(m)m.hidden=true;}
  function htmlJson(value){return JSON.stringify(value).replace(/</g,'\\u003c').replace(/>/g,'\\u003e');}
</script>

    function buildMinimalStarField() {
      if (!starField || starField.childElementCount) return;

      // Deterministic pseudo-random field so it does not "jump" on every render.
      let seed = 1988;
      function rand() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      }

      const fragment = document.createDocumentFragment();
      const count = window.innerWidth < 560 ? 52 : 76;

      for (let i = 0; i < count; i++) {
        const star = document.createElement('span');
        const size = 0.7 + rand() * 1.25;
        const alpha = 0.20 + rand() * 0.42;
        const glow = 2 + rand() * 5;

        star.className = 'space-star' + (i % 11 === 0 ? ' star-cyan' : '');
        star.style.left = `${rand() * 100}%`;
        star.style.top = `${rand() * 100}%`;
        star.style.setProperty('--star-size', `${size}px`);
        star.style.setProperty('--star-alpha', alpha.toFixed(2));
        star.style.setProperty('--star-glow', `${glow}px`);
        fragment.appendChild(star);
      }

      starField.appendChild(fragment);
    }


    function lockAppOverscroll() {
      const scroller = document.querySelector('.page-wrap');
      if (!scroller || scroller.dataset.overscrollLocked === 'true') return;
      scroller.dataset.overscrollLocked = 'true';

      let touchStartY = 0;
      scroller.addEventListener('touchstart', event => {
        if (event.touches.length === 1) touchStartY = event.touches[0].clientY;
      }, { passive: true });

      scroller.addEventListener('touchmove', event => {
        if (event.touches.length !== 1) return;
        const deltaY = event.touches[0].clientY - touchStartY;
        const atTop = scroller.scrollTop <= 0;
        const atBottom = Math.ceil(scroller.scrollTop + scroller.clientHeight) >= scroller.scrollHeight;
        if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) event.preventDefault();
      }, { passive: false });
    }

    buildMinimalStarField();
    lockAppOverscroll();

</script>

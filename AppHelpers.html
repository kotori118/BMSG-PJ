<script>
    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Escape') return;
      if (stateOverlay.classList.contains('open')) return closeStateOverlay();
      if (stateCheckOverlay.classList.contains('open')) return closeStateCheck();
      if (settingsOverlay.classList.contains('open')) return closeSettings();
      if (searchOverlay.classList.contains('open')) return closeSearch();
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }


    function scrollAppToTop(behavior = 'smooth') {
      const scroller = document.querySelector('.page-wrap');
      if (scroller) {
        scroller.scrollTo({ top: 0, left: 0, behavior });
        return;
      }
      window.scrollTo({ top: 0, left: 0, behavior });
    }

    function setTheme(theme) {
      document.body.classList.toggle(
        'theme-light',
        theme === 'light'
      );
    }

    function setPageAtmosphere(route) {
      document.body.classList.toggle(
        'is-home',
        route === 'home'
      );
      const isSectionRoot = ['home', 'data', 'lab'].includes(route);
      document.body.classList.toggle('is-section-root', isSectionRoot);
      const utilityHome = document.querySelector('.utility-home');
      if (utilityHome) utilityHome.hidden = isSectionRoot;

      const bottomNavRoutes = ['home', 'data', 'lab'];
      document.body.classList.toggle(
        'nav-hidden',
        !bottomNavRoutes.includes(route)
      );
    }

    function setActiveNav(parent) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle(
          'active',
          btn.dataset.nav === parent
        );
      });
    }

</script>

    <section id="searchOverlay" class="screen-overlay" aria-label="Search">
      <div class="overlay-inner">
        <header class="overlay-head">
          <h2 class="overlay-title">SEARCH</h2>
          <button class="overlay-close" onclick="closeSearch()" aria-label="Close search">×</button>
        </header>

        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.2"></circle>
            <path d="M15.4 15.4L20 20"></path>
          </svg>
          <input
            id="globalSearchInput"
            class="search-input"
            type="search"
            placeholder="Search BMSG Universe"
            autocomplete="off"
            oninput="runPageSearch(this.value)"
          >
        </label>

        <div id="searchStatus" class="search-status">PAGES</div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </section>

    <div id="settingsOverlay" class="modal-overlay" onclick="closeOnBackdrop(event, 'settingsOverlay')">
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="modal-head">
          <div><p class="settings-eyebrow">BMSG UNIVERSE</p><h2 id="settingsTitle" class="modal-title">SETTINGS</h2></div>
          <button class="overlay-close" onclick="closeSettings()" aria-label="Close settings">×</button>
        </header>

        <section class="settings-group">
          <p class="settings-section-title">ACCOUNT</p>
          <div class="settings-row">
            <div class="settings-row-copy"><small>CURRENT USER</small><strong id="settingsUserName">ももたん</strong></div>
            <button class="settings-action" onclick="cycleDemoUser()">CHANGE</button>
          </div>
        </section>

        <section id="lyricsSettingsSection" class="settings-group">
          <p class="settings-section-title">LYRICS</p>
          <button class="settings-row settings-row-button" onclick="toggleLyricsEditMode()">
            <span class="settings-row-copy"><strong>歌詞編集</strong><small>歌詞・歌割りを変更</small></span>
            <span id="lyricsEditModeStatus" class="settings-switch">OFF</span>
          </button>
        </section>

        <section class="settings-group">
          <p class="settings-section-title">TOOLS</p>
          <button class="settings-row settings-row-button" onclick="openPerformanceTool()">
            <span class="settings-row-copy"><strong>歌唱・センター秒数計測</strong><small>PERFORMANCE TIMER</small></span>
            <span class="settings-arrow">›</span>
          </button>
        </section>
      </section>   </div>

    <div id="stateCheckOverlay" class="modal-overlay" onclick="closeOnBackdrop(event, 'stateCheckOverlay')">
      <section class="state-panel" role="dialog" aria-modal="true" aria-labelledby="stateCheckTitle">
        <header class="modal-head">
          <h2 id="stateCheckTitle" class="modal-title">STATE CHECK</h2>
          <button class="overlay-close" onclick="closeStateCheck()" aria-label="Close state check">×</button>
        </header>

        <div class="state-actions">
          <button class="state-test-btn" onclick="showLoadingState()">LOADING</button>
          <button class="state-test-btn" onclick="showInfoState('NO DATA', 'まだデータがありません。')">NO DATA</button>
          <button class="state-test-btn" onclick="showInfoState('NO RESULTS', '条件に一致する結果がありません。')">NO RESULTS</button>
          <button class="state-test-btn" onclick="showInfoState('ERROR', '読み込みに失敗しました。もう一度お試しください。')">ERROR</button>
          <button class="state-test-btn" onclick="showSkeletonState()">SKELETON</button>
          <button class="state-test-btn" onclick="showToast()">TOAST</button>
        </div>
      </section>
    </div>

    <div id="stateOverlay" class="state-overlay">
      <div id="stateContent"></div>
    </div>

    <div
      id="toastRegion"
      class="toast-region"
      aria-live="polite"
      aria-atomic="true"
    ></div>

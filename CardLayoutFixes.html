<style>
  /* TRADING CARD final mobile/cosmic polish. Shared ButtonSystem remains button authority. */
  .card-page{padding-top:86px;min-width:0;overscroll-behavior-y:none;}
  .card-header{display:block!important;margin-bottom:30px;}
  .card-header>div{min-width:0;}
  .card-title{line-height:.94;max-width:100%;}
  .card-page.is-gacha-mode .card-header{margin-bottom:12px!important;}
  .card-page.is-gacha-mode .card-book-btn{display:none!important;}

  .card-book-btn,.card-reveal-back,.card-collection-close,.card-gacha-tool{
    width:46px!important;height:46px!important;min-width:46px!important;min-height:46px!important;padding:0!important;
    display:grid!important;place-items:center!important;flex:0 0 46px!important;
  }
  .card-book-btn{margin:16px 0 0 auto!important;}
  .card-book-btn svg,.card-gacha-tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .card-reveal-back,.card-gacha-tool.is-back{font-size:28px!important;line-height:1!important;}
  .card-collection-close{font-size:25px!important;line-height:1!important;}

  .card-gacha-scene{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;padding:10px 0 4px;overscroll-behavior:none;}
  .card-gacha-scene::before{content:'';position:absolute;z-index:-3;inset:0;background:radial-gradient(circle at 20% 18%,rgba(156,236,255,.07),transparent 22%),radial-gradient(circle at 82% 38%,rgba(118,74,190,.07),transparent 26%),radial-gradient(circle at 54% 80%,rgba(176,28,48,.035),transparent 18%);pointer-events:none;}
  .card-space-field{position:absolute;z-index:-2;inset:0;overflow:hidden;pointer-events:none;}
  .card-space-star{position:absolute;width:var(--s,1.5px);height:var(--s,1.5px);border-radius:50%;opacity:var(--o,.65);animation:cardSpaceTwinkle var(--d,4s) ease-in-out infinite;animation-delay:var(--delay,0s);}
  .card-space-star.tone-white{background:#fff;box-shadow:0 0 5px rgba(255,255,255,.35)}
  .card-space-star.tone-cyan{background:#8feaff;box-shadow:0 0 8px rgba(100,224,255,.62)}
  .card-space-star.tone-red{background:#ff6d79;box-shadow:0 0 8px rgba(255,75,92,.42)}
  .card-shooting-star{position:absolute;z-index:-1;left:-38%;width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(156,236,255,.10),rgba(230,252,255,.84),transparent);transform:rotate(-20deg);opacity:0;filter:drop-shadow(0 0 4px rgba(156,236,255,.42));animation:cardShoot var(--shoot-duration,12s) linear infinite;animation-delay:var(--shoot-delay,3s);}
  .card-shooting-star.shoot-1{width:95px;transform:rotate(-27deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.72),transparent)}

  .card-gacha-toolbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;}
  .card-gacha-head{position:relative;z-index:2;margin:0 0 12px!important;align-items:flex-end!important;}
  .card-gacha-title{font-size:clamp(28px,8vw,44px)!important;line-height:1!important;}
  .card-progress{padding:7px 10px;border:1px solid rgba(156,236,255,.16);border-radius:999px;background:rgba(3,8,14,.64);color:rgba(220,248,255,.8);}
  .card-draw-stage{position:relative;z-index:1;min-height:365px!important;padding:20px 18px 18px!important;border-color:rgba(156,236,255,.22)!important;background:radial-gradient(circle at 50% 40%,rgba(156,236,255,.09),transparent 28%),linear-gradient(180deg,rgba(3,9,15,.58),rgba(2,5,9,.68))!important;box-shadow:inset 0 0 70px rgba(156,236,255,.02),0 18px 50px rgba(0,0,0,.10);}
  .card-draw-stage::before{display:none!important;}
  .card-portal-shell{position:relative;width:min(62vw,270px);aspect-ratio:1;margin:0 auto 12px;display:grid;place-items:center;isolation:isolate;}
  .card-portal-shell::before,.card-portal-shell::after{content:'';position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(156,236,255,.17);box-shadow:0 0 28px rgba(156,236,255,.04);animation:cardIdleOrbit 8s linear infinite;}
  .card-portal-shell::after{inset:20%;border-color:rgba(177,151,255,.14);animation-duration:5.5s;animation-direction:reverse;}
  .card-portal-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08);}
  .card-portal-ring.r1{inset:1%;transform:rotate(18deg) scaleY(.52);}
  .card-portal-ring.r2{inset:13%;transform:rotate(-32deg) scaleY(.64);border-color:rgba(156,236,255,.13);}
  .card-portal-ring.r3{inset:27%;transform:rotate(58deg) scaleY(.78);border-color:rgba(255,255,255,.06);}
  .card-portal-core{position:relative;z-index:2;width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 42% 35%,rgba(255,255,255,.12),rgba(156,236,255,.06) 30%,rgba(3,8,14,.94) 72%);border:1px solid rgba(156,236,255,.22);box-shadow:0 0 34px rgba(156,236,255,.07),inset 0 0 28px rgba(156,236,255,.05);}
  .card-portal-core::before{content:'';position:absolute;inset:-18%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18%,rgba(156,236,255,.1) 24%,transparent 31% 60%,rgba(177,151,255,.08) 68%,transparent 76%);filter:blur(2px);animation:cardPortalSpin 9s linear infinite;z-index:-1;}
  .card-portal-core strong{display:block;font:700 13px 'Orbitron',sans-serif;letter-spacing:.18em;color:#eafdff;}
  .card-portal-core span{display:block;margin-top:6px;font:600 9px 'Exo 2',sans-serif;letter-spacing:.2em;color:rgba(226,248,255,.46);}
  .card-draw-mark{font-size:11px!important;letter-spacing:.28em!important;color:#baf4ff;opacity:.75!important;}
  .card-draw-copy{margin-top:7px!important;font:500 12px 'Exo 2',sans-serif!important;letter-spacing:.08em;color:rgba(240,249,255,.50);}
  .card-rarity-track{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px;}
  .card-rarity-chip{min-width:0;padding:8px 4px 7px;border-radius:10px;text-align:center;border:1px solid rgba(255,255,255,.075);background:rgba(2,6,11,.52);}
  .card-rarity-chip b{display:block;font:800 10px 'Orbitron',sans-serif;letter-spacing:.08em;}
  .card-rarity-chip small{display:block;margin-top:4px;font:600 8px 'Exo 2',sans-serif;letter-spacing:.08em;opacity:.48;}
  .card-rarity-chip.rarity-n b{color:#b9c7d0}.card-rarity-chip.rarity-r b{color:#c98955}.card-rarity-chip.rarity-sr b{color:#e8f2fb;text-shadow:0 0 8px rgba(220,238,255,.22)}.card-rarity-chip.rarity-ssr b{color:#ffd76a;text-shadow:0 0 10px rgba(255,215,106,.26)}
  .card-draw-actions{position:relative;z-index:2;margin-top:12px!important;display:block!important;}
  .card-draw-main{width:100%;letter-spacing:.12em;font-weight:700;}

  .card-reveal{--rarity-accent:#9cecff!important;--rarity-soft:rgba(156,236,255,.14)!important;background:radial-gradient(circle at 50% 45%,#10151b 0,#05070a 45%,#010203 100%)!important;}
  .card-reveal::before{display:none!important;}
  .card-reveal-kicker:empty{opacity:0!important;}
  .card-reveal-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .card-reveal-stars .card-space-star,.card-reveal-stars .card-shooting-star{z-index:0;}

  /* Safari-safe flip: prevent the back from bleeding through the front. */
  .card-flip-inner{-webkit-transform-style:preserve-3d!important;transform-style:preserve-3d!important;}
  .card-back-face,.card-front-face{-webkit-backface-visibility:hidden!important;backface-visibility:hidden!important;outline:0!important;}
  .card-back-face{transform:rotateY(0deg) translateZ(.6px)!important;}
  .card-front-face{transform:rotateY(180deg) translateZ(.6px)!important;background:transparent!important;border:0!important;box-shadow:none!important;}
  .card-front-face img{border-radius:19px!important;display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;}
  .card-reveal.is-revealed .card-back-face{visibility:hidden;transition:visibility 0s linear .44s;}
  .card-reveal.is-rarity-burst .card-flip-wrap::before{opacity:1!important;}
  .card-reveal:not(.is-rarity-burst) .card-flip-wrap::before{opacity:0!important;}

  /* Clean shared back: matte black + quiet orbital seal, no diamond / logo image. */
  .card-back-face{background:#000!important;border:1px solid rgba(156,236,255,.24)!important;box-shadow:inset 0 0 58px rgba(156,236,255,.025)!important;}
  .card-back-face::before{content:'';position:absolute;inset:10px;border:1px solid rgba(255,255,255,.055);border-radius:13px;pointer-events:none;}
  .card-back-face::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 49%,rgba(156,236,255,.055),transparent 34%);pointer-events:none;}
  .card-back-design{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;}
  .card-back-orbit{position:absolute;left:50%;top:50%;border:1px solid rgba(156,236,255,.13);border-radius:50%;transform:translate(-50%,-50%);}
  .card-back-orbit.o1{width:64%;height:64%;}
  .card-back-orbit.o2{width:76%;height:33%;transform:translate(-50%,-50%) rotate(24deg);border-color:rgba(255,255,255,.08);}
  .card-back-orbit.o3{width:72%;height:29%;transform:translate(-50%,-50%) rotate(-38deg);border-color:rgba(168,143,223,.08);}
  .card-back-seal{position:relative;z-index:2;width:42%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020406;border:1px solid rgba(156,236,255,.22);box-shadow:0 0 24px rgba(156,236,255,.055),inset 0 0 22px rgba(156,236,255,.035);}
  .card-back-seal small{font:600 8px 'Exo 2',sans-serif;letter-spacing:.32em;color:rgba(190,239,249,.58);margin-left:.32em;}
  .card-back-seal strong{margin-top:6px;font:700 12px 'Orbitron',sans-serif;letter-spacing:.11em;color:#f6fdff;text-shadow:0 0 10px rgba(156,236,255,.16);}
  .card-back-seal i{width:22px;height:1px;margin-top:10px;background:linear-gradient(90deg,transparent,#9cecff,transparent);opacity:.7;}
  .card-back-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.4);}
  .card-back-star.s1{left:18%;top:21%}.card-back-star.s2{right:17%;top:31%;background:#9cecff}.card-back-star.s3{left:24%;bottom:20%;background:#9cecff}.card-back-star.s4{right:25%;bottom:17%;width:1px;height:1px}.card-back-star.s5{right:10%;top:58%;width:1px;height:1px;background:#ff7a85}

  .card-reveal:not(.is-rarity-burst) .card-reveal-orbit,.card-reveal:not(.is-rarity-burst) .card-reveal-burst,.card-reveal:not(.is-rarity-burst) .card-reveal-meteors,.card-reveal:not(.is-rarity-burst) .card-reveal-sparks{animation:none!important;opacity:0!important;}
  .card-reveal.is-rarity-burst.rarity-n{--rarity-accent:#aab7c2!important;--rarity-soft:rgba(170,183,194,.18)!important;}
  .card-reveal.is-rarity-burst.rarity-r{--rarity-accent:#c98955!important;--rarity-soft:rgba(201,137,85,.28)!important;background:radial-gradient(circle at 50% 45%,#23160f 0,#080604 46%,#010203 100%)!important;}
  .card-reveal.is-rarity-burst.rarity-sr{--rarity-accent:#edf5ff!important;--rarity-soft:rgba(220,234,248,.32)!important;background:radial-gradient(circle at 50% 45%,#18232f 0,#06090d 46%,#010203 100%)!important;}
  .card-reveal.is-rarity-burst.rarity-ssr{--rarity-accent:#ffd76a!important;--rarity-soft:rgba(255,215,106,.36)!important;background:radial-gradient(circle at 50% 45%,#2a210c 0,#0b0803 46%,#010203 100%)!important;}

  .card-collection-overlay{position:fixed!important;inset:0!important;width:100%!important;height:100dvh!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-y:contain!important;touch-action:pan-y!important;}
  .card-collection-panel{width:min(920px,100%)!important;height:auto!important;min-height:100dvh!important;overflow:visible!important;touch-action:pan-y!important;padding-bottom:calc(56px + env(safe-area-inset-bottom))!important;}
  .card-collection-head{top:0!important;padding:calc(18px + env(safe-area-inset-top)) 0 16px!important;}
  .card-collection-body{min-height:1px;touch-action:pan-y!important;}

  @keyframes cardIdleOrbit{to{transform:rotate(360deg)}}
  @keyframes cardPortalSpin{to{transform:rotate(360deg)}}
  @keyframes cardSpaceTwinkle{0%,100%{opacity:calc(var(--o,.65)*.42);transform:scale(.75)}48%{opacity:var(--o,.65);transform:scale(1.18)}70%{opacity:calc(var(--o,.65)*.66);transform:scale(.92)}}
  @keyframes cardShoot{0%,13%{left:-38%;opacity:0}16%{opacity:.72}34%{left:112%;opacity:.22}36%,100%{left:112%;opacity:0}}

  @media(max-width:560px){
    .card-page{padding-top:92px;}
    .card-header{margin-bottom:30px!important;}
    .card-book-btn{margin:14px 0 0 auto!important;}
    .card-title{font-size:clamp(31px,9.2vw,44px)!important;white-space:nowrap;}
    .card-gacha-scene{border-radius:20px;padding-top:4px;}
    .card-draw-stage{min-height:345px!important;padding-top:16px!important;}
    .card-portal-shell{width:min(58vw,240px);}
  }
  @media(prefers-reduced-motion:reduce){.card-portal-shell::before,.card-portal-shell::after,.card-portal-core::before,.card-space-star,.card-shooting-star{animation:none!important;}}
</style>

<style>
  /* TRADING CARD mobile/layout + experience refinements */
  .card-page{padding-top:86px;}
  .card-header{display:block!important;margin-bottom:30px;}
  .card-header>div{min-width:0;}
  .card-title{line-height:.94;max-width:100%;}

  .card-book-btn,
  .card-reveal-back,
  .card-collection-close{
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;
    padding:0!important;
    display:grid!important;
    place-items:center!important;
    flex:0 0 46px!important;
    border-radius:14px!important;
    border:1px solid var(--btn-line-dark)!important;
    color:var(--white)!important;
    background:var(--btn-bg-dark)!important;
    box-shadow:var(--btn-shadow-dark)!important;
  }
  .card-book-btn{margin:16px 0 0 auto!important;}
  .card-book-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .card-reveal-back{font-size:28px!important;line-height:1!important;}
  .card-collection-close{font-size:25px!important;line-height:1!important;}

  .card-gacha-head{margin:0 0 14px!important;align-items:flex-end!important;}
  .card-gacha-title{font-size:clamp(28px,8vw,44px)!important;line-height:1!important;}
  .card-progress{padding:7px 10px;border:1px solid rgba(156,236,255,.16);border-radius:999px;background:rgba(156,236,255,.045);color:rgba(220,248,255,.8);}

  .card-draw-stage{
    min-height:430px!important;
    padding:26px 18px 22px!important;
    border-color:rgba(156,236,255,.24)!important;
    background:
      radial-gradient(circle at 50% 42%,rgba(156,236,255,.12),transparent 25%),
      radial-gradient(circle at 76% 18%,rgba(154,115,255,.10),transparent 24%),
      linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012))!important;
    box-shadow:inset 0 0 70px rgba(156,236,255,.025),0 18px 50px rgba(0,0,0,.12);
  }
  .card-draw-stage::before{display:none!important;}
  .card-portal-shell{position:relative;width:min(76vw,330px);aspect-ratio:1;margin:0 auto 18px;display:grid;place-items:center;isolation:isolate;}
  .card-portal-shell::before,
  .card-portal-shell::after{content:'';position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(156,236,255,.19);box-shadow:0 0 28px rgba(156,236,255,.05);animation:cardIdleOrbit 8s linear infinite;}
  .card-portal-shell::after{inset:20%;border-color:rgba(177,151,255,.17);animation-duration:5.5s;animation-direction:reverse;}
  .card-portal-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.09);}
  .card-portal-ring.r1{inset:1%;transform:rotate(18deg) scaleY(.52);}
  .card-portal-ring.r2{inset:13%;transform:rotate(-32deg) scaleY(.64);border-color:rgba(156,236,255,.14);}
  .card-portal-ring.r3{inset:27%;transform:rotate(58deg) scaleY(.78);border-color:rgba(255,255,255,.07);}
  .card-portal-core{position:relative;z-index:2;width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 42% 35%,rgba(255,255,255,.16),rgba(156,236,255,.07) 30%,rgba(6,12,20,.92) 72%);border:1px solid rgba(156,236,255,.26);box-shadow:0 0 30px rgba(156,236,255,.08),inset 0 0 28px rgba(156,236,255,.06);}
  .card-portal-core::before{content:'';position:absolute;inset:-18%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18%,rgba(156,236,255,.12) 24%,transparent 31% 60%,rgba(177,151,255,.10) 68%,transparent 76%);filter:blur(2px);animation:cardPortalSpin 9s linear infinite;z-index:-1;}
  .card-portal-core strong{display:block;font:700 13px 'Orbitron',sans-serif;letter-spacing:.18em;color:#eafdff;}
  .card-portal-core span{display:block;margin-top:6px;font:600 9px 'Exo 2',sans-serif;letter-spacing:.2em;color:rgba(226,248,255,.48);}
  .card-portal-stars{position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(circle at 22% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 76% 20%,#9cecff 0 1.5px,transparent 2px),radial-gradient(circle at 84% 68%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 17% 76%,#bcaeff 0 1.5px,transparent 2px),radial-gradient(circle at 63% 85%,#9cecff 0 1px,transparent 1.5px);opacity:.8;animation:cardStarPulse 2.8s ease-in-out infinite;}
  .card-draw-mark{font-size:11px!important;letter-spacing:.28em!important;color:#baf4ff;opacity:.78!important;}
  .card-draw-copy{margin-top:8px!important;font:500 12px 'Exo 2',sans-serif!important;letter-spacing:.08em;color:rgba(240,249,255,.52);}
  .card-rarity-track{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:20px;}
  .card-rarity-chip{min-width:0;padding:9px 4px 8px;border-radius:10px;text-align:center;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);}
  .card-rarity-chip b{display:block;font:800 10px 'Orbitron',sans-serif;letter-spacing:.08em;}
  .card-rarity-chip small{display:block;margin-top:4px;font:600 8px 'Exo 2',sans-serif;letter-spacing:.08em;opacity:.48;}
  .card-rarity-chip.rarity-n b{color:#b9c7d0}.card-rarity-chip.rarity-r b{color:#c98955}.card-rarity-chip.rarity-sr b{color:#e8f2fb;text-shadow:0 0 8px rgba(220,238,255,.22)}.card-rarity-chip.rarity-ssr b{color:#ffd76a;text-shadow:0 0 10px rgba(255,215,106,.26)}
  .card-draw-actions{margin-top:14px!important;}
  .card-draw-main{position:relative;overflow:hidden;border-color:rgba(156,236,255,.28)!important;background:linear-gradient(145deg,rgba(156,236,255,.11),rgba(255,255,255,.025))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 26px rgba(156,236,255,.035)!important;letter-spacing:.12em;font-weight:700;}

  .card-collection-overlay{
    position:fixed!important;
    inset:0!important;
    width:100%!important;
    height:100dvh!important;
    overflow-x:hidden!important;
    overflow-y:auto!important;
    -webkit-overflow-scrolling:touch!important;
    overscroll-behavior-y:contain!important;
    touch-action:pan-y!important;
  }
  .card-collection-panel{
    width:min(920px,100%)!important;
    height:auto!important;
    min-height:100dvh!important;
    overflow:visible!important;
    touch-action:pan-y!important;
    padding-bottom:calc(56px + env(safe-area-inset-bottom))!important;
  }
  .card-collection-head{top:0!important;padding:calc(18px + env(safe-area-inset-top)) 0 16px!important;}
  .card-collection-body{min-height:1px;touch-action:pan-y!important;}

  @keyframes cardIdleOrbit{to{transform:rotate(360deg)}}
  @keyframes cardPortalSpin{to{transform:rotate(360deg)}}
  @keyframes cardStarPulse{0%,100%{opacity:.45;transform:scale(.98)}50%{opacity:.95;transform:scale(1.02)}}

  @media(max-width:560px){
    .card-page{padding-top:92px;}
    .card-header{display:block!important;margin-bottom:30px!important;}
    .card-book-btn{margin:14px 0 0 auto!important;}
    .card-title{font-size:clamp(31px,9.2vw,44px)!important;white-space:nowrap;}
    .card-group-grid{margin-top:2px;}
    .card-draw-stage{min-height:410px!important;}
    .card-portal-shell{width:min(78vw,310px);}
  }
  @media(prefers-reduced-motion:reduce){.card-portal-shell::before,.card-portal-shell::after,.card-portal-core::before,.card-portal-stars{animation:none!important;}}
</style>

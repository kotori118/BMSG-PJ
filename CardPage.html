<template id="cardPageTemplate">
  <section class="view card-page" id="cardPageRoot">
    <header class="card-header">
      <div>
        <p class="eyebrow">LAB</p>
        <h1 class="card-title">TRADING CARD</h1>
      </div>
      <button type="button" class="u-btn card-book-btn" onclick="openCardCollection()" aria-label="Collection">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="10.5" height="14" rx="2"></rect><path d="M9 5.2V4.5A1.5 1.5 0 0 1 10.5 3h7A1.5 1.5 0 0 1 19 4.5v11A1.5 1.5 0 0 1 17.5 17H15"></path><path d="M7.5 9h4.5M7.5 12h4.5M7.5 15h3"></path></svg>
      </button>
    </header>
    <div id="cardApp" class="card-app" aria-live="polite"></div>
  </section>

  <div id="cardReveal" class="card-reveal" aria-hidden="true">
    <div class="card-reveal-stars" aria-hidden="true"></div>
    <div class="card-reveal-orbit orbit-a" aria-hidden="true"></div>
    <div class="card-reveal-orbit orbit-b" aria-hidden="true"></div>
    <div class="card-reveal-orbit orbit-c" aria-hidden="true"></div>
    <div class="card-reveal-burst" aria-hidden="true"></div>
    <div class="card-reveal-meteors" aria-hidden="true"></div>
    <div class="card-reveal-sparks" aria-hidden="true"></div>
    <button type="button" class="u-btn card-reveal-back" onclick="closeCardReveal()" aria-label="Back">‹</button>
    <div class="card-reveal-stage">
      <div class="card-reveal-kicker" id="cardRevealKicker"></div>
      <div class="card-flip-wrap" id="cardFlipWrap">
        <div class="card-flip-inner">
          <div class="card-back-face" aria-label="BMSG Universe card back">
            <div class="card-back-cosmos" aria-hidden="true">
              <i class="card-back-orbit orbit-1"></i>
              <i class="card-back-orbit orbit-2"></i>
              <i class="card-back-orbit orbit-3"></i>
              <i class="card-back-star star-a"></i>
              <i class="card-back-star star-b"></i>
              <i class="card-back-star star-c"></i>
              <div class="card-back-core"><span>BMSG</span><strong>UNIVERSE</strong></div>
            </div>
          </div>
          <div class="card-front-face"><img id="cardRevealImage" alt="Trading card"></div>
        </div>
      </div>
      <div class="card-result-meta" id="cardResultMeta">
        <div class="card-result-rarity" id="cardResultRarity"></div>
        <div class="card-result-name" id="cardResultName"></div>
        <div class="card-result-new" id="cardResultNew"></div>
      </div>
      <div class="card-result-actions" id="cardResultActions">
        <button type="button" class="u-btn" onclick="drawTradingCardFromReveal()">DRAW AGAIN</button>
        <button type="button" class="u-btn" onclick="closeCardReveal()">BACK</button>
      </div>
    </div>
  </div>

  <div id="cardCollectionOverlay" class="card-collection-overlay" aria-hidden="true">
    <div class="card-collection-panel">
      <div class="card-collection-head">
        <div class="card-collection-head-main">
          <p class="eyebrow">TRADING CARD</p>
          <h2>COLLECTION</h2>
          <div id="cardCollectionProgress" class="card-collection-progress"></div>
          <div class="card-collection-meter" aria-hidden="true"><span id="cardCollectionMeterFill"></span></div>
        </div>
        <button type="button" class="u-btn card-collection-close" onclick="closeCardCollection()" aria-label="Close collection">×</button>
      </div>
      <div class="card-collection-intro"><span>ORBIT ARCHIVE</span><small>Collect every rarity and complete the constellation.</small></div>
      <div id="cardCollectionBody" class="card-collection-body"></div>
      <button id="cardResetCollectionBtn" type="button" class="u-btn card-reset-btn" onclick="resetCardCollection()" hidden>RESET COLLECTION</button>
    </div>
  </div>
</template>

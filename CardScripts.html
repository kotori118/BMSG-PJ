<script>
  const cardState={ready:false,userId:'',groups:[],cards:[],currentGroup:'ALL',totalCount:0,collectedCount:0,drawing:false,brandLogoDriveFileId:''};
  function renderCards(){const template=document.getElementById('cardPageTemplate');return template?template.innerHTML:'<section class="view"><h1 class="title">TRADING CARD</h1></section>';}
  function portalizeCardOverlays(){['cardReveal','cardCollectionOverlay'].forEach(function(id){const local=document.getElementById('pageContent')?document.getElementById('pageContent').querySelector('#'+id):null;if(!local)return;document.querySelectorAll('body > #'+id).forEach(function(old){old.remove();});document.body.appendChild(local);});}
  function initCardPage(){portalizeCardOverlays();const userId=typeof getUniverseUserId==='function'?getUniverseUserId():'';if(!userId){cardState.ready=false;cardState.userId='';const host=document.getElementById('cardApp');if(host)host.innerHTML='<div class="placeholder"><p>USERを選択してください。</p></div>';if(typeof openUserChooser==='function')openUserChooser(true);return;}cardState.userId=userId;renderCardLoading();google.script.run.withSuccessHandler(function(data){cardState.ready=true;cardState.groups=data.groups||[];cardState.cards=data.cards||[];cardState.brandLogoDriveFileId=String(data.brandLogoDriveFileId||'');cardState.totalCount=Number(data.totalCount||0);cardState.collectedCount=Number(data.collectedCount||0);cardState.currentGroup='ALL';renderCardGroupSelection();}).withFailureHandler(cardFailure).getTradingCardBootstrap(userId);}
  function renderCardLoading(){const host=document.getElementById('cardApp');if(host)host.innerHTML=typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING...','#9cecff'):'<div>LOADING...</div>';}
  function renderCardGroupSelection(){const host=document.getElementById('cardApp');if(!host)return;host.innerHTML='<div class="card-group-grid">'+cardState.groups.map(function(group){const count=getCardGroupCards(group.name).length;return '<button type="button" class="u-btn card-group-btn" style="--card-group-color:'+escapeHtml(group.color||'#9cecff')+'" onclick="selectTradingCardGroup(\''+escapeHtml(group.name).replaceAll("'","\\'")+'\')"><span class="card-group-name">'+escapeHtml(group.name)+'</span><span class="card-group-sub">'+count+' CARDS</span></button>';}).join('')+'</div>';}
  function selectTradingCardGroup(groupName){cardState.currentGroup=groupName||'ALL';renderCardGacha();scrollAppToTop('smooth');}
  function renderCardGacha(){const host=document.getElementById('cardApp');if(!host)return;const groupCards=getCardGroupCards(cardState.currentGroup);const drawn=groupCards.filter(function(card){return card.isDrawn;}).length;host.innerHTML='<div class="card-gacha-toolbar"><button type="button" class="u-btn card-gacha-tool is-back" onclick="renderCardGroupSelection()" aria-label="Back to groups">‹</button><button type="button" class="u-btn card-gacha-tool" onclick="openCardCollection()" aria-label="Collection"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="5" width="10.5" height="14" rx="2"></rect><path d="M9 5.2V4.5A1.5 1.5 0 0 1 10.5 3h7A1.5 1.5 0 0 1 19 4.5v11A1.5 1.5 0 0 1 17.5 17H15"></path><path d="M7.5 9h4.5M7.5 12h4.5M7.5 15h3"></path></svg></button></div><div class="card-gacha-head"><h2 class="card-gacha-title">'+escapeHtml(cardState.currentGroup)+'</h2><div class="card-progress">'+drawn+' / '+groupCards.length+'</div></div><div class="card-draw-stage"><div class="card-portal-shell" aria-hidden="true"><div class="card-portal-stars"></div><i class="card-portal-ring r1"></i><i class="card-portal-ring r2"></i><i class="card-portal-ring r3"></i><div class="card-portal-core"><div><strong>CARD PORTAL</strong><span>ORBIT READY</span></div></div></div><div class="card-draw-mark">BMSG UNIVERSE</div><div class="card-draw-copy">Pull one card from the orbit.</div><div class="card-rarity-track" aria-label="Rarity rates"><div class="card-rarity-chip rarity-n"><b>N</b><small>70%</small></div><div class="card-rarity-chip rarity-r"><b>R</b><small>24%</small></div><div class="card-rarity-chip rarity-sr"><b>SR</b><small>5%</small></div><div class="card-rarity-chip rarity-ssr"><b>SSR</b><small>1%</small></div></div></div><div class="card-draw-actions"><button type="button" class="u-btn card-draw-main" onclick="drawTradingCard()">DRAW</button></div>';}
  function getCardGroupCards(groupName){const group=cardState.groups.find(function(item){return item.name===groupName;});if(!group||groupName==='ALL')return cardState.cards.slice();const allowed={};(group.memberIds||[]).forEach(function(id){allowed[String(id)]=true;});return cardState.cards.filter(function(card){return allowed[String(card.memberId)];});}
  function getCurrentCardGroup(){return cardState.groups.find(function(item){return item.name===cardState.currentGroup;})||null;}
  function setCardBackLogo(){const group=getCurrentCardGroup();const fileId=cardState.currentGroup==='ALL'?cardState.brandLogoDriveFileId:String(group&&group.logoDriveFileId||cardState.brandLogoDriveFileId||'');const image=document.getElementById('cardBackLogo');const label=document.getElementById('cardBackGroup');if(image){if(fileId){image.src='https://lh3.googleusercontent.com/d/'+encodeURIComponent(fileId);image.hidden=false;}else{image.removeAttribute('src');image.hidden=true;}}if(label)label.textContent=cardState.currentGroup==='ALL'?'BMSG':cardState.currentGroup;}
  function seedCardRevealStars(){const host=document.querySelector('#cardReveal .card-reveal-stars');if(!host)return;let html='';const count=52;for(let i=0;i<count;i++){const left=(3+Math.random()*94).toFixed(2),top=(3+Math.random()*94).toFixed(2),size=(.7+Math.random()*2.1).toFixed(2),opacity=(.28+Math.random()*.62).toFixed(2),duration=(2.2+Math.random()*4.8).toFixed(2),delay=(-Math.random()*5).toFixed(2);html+='<i class="card-star" style="left:'+left+'%;top:'+top+'%;--s:'+size+'px;--o:'+opacity+';--d:'+duration+'s;--delay:'+delay+'s"></i>';}host.innerHTML=html;}
  function drawTradingCard(){if(cardState.drawing)return;cardState.drawing=true;openCardRevealPending();google.script.run.withSuccessHandler(function(result){cardState.drawing=false;if(result&&result.card){const found=cardState.cards.find(function(card){return String(card.imageId)===String(result.card.imageId);});if(found)found.isDrawn=true;cardState.totalCount=Number(result.totalCount||cardState.totalCount);cardState.collectedCount=Number(result.collectedCount||cardState.collectedCount);runCardReveal(result.card,!!result.isNew);}else{closeCardReveal();cardNotify('カードを取得できませんでした。');}}).withFailureHandler(function(error){cardState.drawing=false;closeCardReveal();cardFailure(error);}).drawTradingCard(cardState.userId,cardState.currentGroup);}
  function drawTradingCardFromReveal(){if(cardState.drawing)return;const overlay=document.getElementById('cardReveal');if(overlay)overlay.className='card-reveal is-open';drawTradingCard();}
  function openCardRevealPending(){const overlay=document.getElementById('cardReveal');if(!overlay)return;overlay.className='card-reveal is-open';overlay.setAttribute('aria-hidden','false');seedCardRevealStars();setCardBackLogo();const kicker=document.getElementById('cardRevealKicker');if(kicker)kicker.textContent='OPENING PORTAL...';const image=document.getElementById('cardRevealImage');if(image)image.removeAttribute('src');document.getElementById('cardResultRarity').textContent='';document.getElementById('cardResultName').textContent='';document.getElementById('cardResultNew').textContent='';}
  function runCardReveal(card,isNew){const overlay=document.getElementById('cardReveal');if(!overlay)return;const rarity=String(card.rarity||'N').toLowerCase();const image=document.getElementById('cardRevealImage');image.src='https://lh3.googleusercontent.com/d/'+encodeURIComponent(card.driveFileId);document.getElementById('cardResultRarity').textContent=String(card.rarity||'');document.getElementById('cardResultName').textContent=String(card.memberName||'');document.getElementById('cardResultNew').textContent=isNew?'NEW COLLECTION':'';const kicker=document.getElementById('cardRevealKicker');if(kicker)kicker.textContent='CARD FOUND';const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;window.setTimeout(function(){overlay.classList.add('is-revealed');window.setTimeout(function(){overlay.classList.add('rarity-'+rarity,'is-rarity-burst');const labels={n:'NORMAL SIGNAL',r:'BRONZE METEOR',sr:'SILVER NEBULA',ssr:'GOLD SUPERNOVA'};if(kicker)kicker.textContent=labels[rarity]||'CARD FOUND';},reduced?0:620);},reduced?0:70);}
  function closeCardReveal(){const overlay=document.getElementById('cardReveal');if(!overlay)return;overlay.className='card-reveal';overlay.setAttribute('aria-hidden','true');if(currentRoute==='cards')renderCardGacha();}
  function openCardCollection(){if(!cardState.ready)return;const overlay=document.getElementById('cardCollectionOverlay');if(!overlay)return;renderCardCollection();overlay.classList.add('is-open');overlay.setAttribute('aria-hidden','false');overlay.scrollTop=0;}
  function closeCardCollection(){const overlay=document.getElementById('cardCollectionOverlay');if(!overlay)return;overlay.classList.remove('is-open');overlay.setAttribute('aria-hidden','true');}
  function renderCardCollection(){const body=document.getElementById('cardCollectionBody');const progress=document.getElementById('cardCollectionProgress');const meter=document.getElementById('cardCollectionMeterFill');if(!body||!progress)return;const cards=getCardGroupCards(cardState.currentGroup||'ALL');const collected=cards.filter(function(card){return card.isDrawn;}).length;const percent=cards.length?Math.round(collected/cards.length*100):0;progress.textContent=(cardState.currentGroup||'ALL')+'  '+collected+' / '+cards.length+'  ('+percent+'%)';if(meter)meter.style.width=percent+'%';const byMember={};cards.forEach(function(card){if(!byMember[card.memberId])byMember[card.memberId]=[];byMember[card.memberId].push(card);});body.innerHTML=Object.keys(byMember).map(function(memberId){const memberCards=byMember[memberId];const first=memberCards[0];const order={N:0,R:1,SR:2,SSR:3};memberCards.sort(function(a,b){return order[a.rarity]-order[b.rarity];});const owned=memberCards.filter(function(card){return card.isDrawn;}).length;return '<section class="card-collection-member" style="--member-color:'+escapeHtml(first.memberColor||'#9cecff')+'"><div class="card-collection-member-title-row"><div class="card-collection-member-title">'+escapeHtml(first.memberName)+'</div><div class="card-collection-member-count">'+owned+' / '+memberCards.length+'</div></div><div class="card-collection-grid">'+memberCards.map(function(card){const rarity=String(card.rarity||'N').toLowerCase();return '<div class="card-collection-item rarity-'+rarity+(card.isDrawn?' is-owned':'')+'">'+(card.isDrawn?'<img src="https://lh3.googleusercontent.com/d/'+encodeURIComponent(card.driveFileId)+'" alt="'+escapeHtml(card.memberName)+' '+escapeHtml(card.rarity)+'">':'<div class="card-collection-locked">?</div>')+'<span class="card-collection-rarity">'+escapeHtml(card.rarity)+'</span></div>';}).join('')+'</div></section>';}).join('')||'<div class="placeholder"><p>カードがありません。</p></div>';const reset=document.getElementById('cardResetCollectionBtn');if(reset)reset.hidden=!(cardState.totalCount>0&&cardState.collectedCount>=cardState.totalCount);}
  function resetCardCollection(){if(!(cardState.totalCount>0&&cardState.collectedCount>=cardState.totalCount))return;if(!window.confirm('コレクションを0%へリセットしますか？'))return;google.script.run.withSuccessHandler(function(){cardState.cards.forEach(function(card){card.isDrawn=false;});cardState.collectedCount=0;renderCardCollection();cardNotify('コレクションをリセットしました。');}).withFailureHandler(cardFailure).resetTradingCardCollection(cardState.userId);}
  function cardFailure(error){const message=error&&error.message?error.message:String(error||'エラーが発生しました。');cardNotify(message);}function cardNotify(message){if(typeof showToast==='function'){showToast(message);return;}window.alert(message);}
</script>

<div id="catalogManagementOverlay" class="modal-overlay catalog-overlay" onclick="cmCloseBackdrop_(event)">
  <section class="settings-panel management-panel catalog-panel" role="dialog" aria-modal="true" aria-labelledby="catalogTitle">
    <header class="modal-head">
      <div><h2 id="catalogTitle" class="modal-title">データ管理</h2>
        <p class="management-lead">Group / Member / Unit / Song / Profile Fields</p></div>
      <button class="overlay-close" type="button" aria-label="閉じる" onclick="closeCatalogManagement()">×</button>
    </header>
    <div id="catalogManagementBody" aria-live="polite"></div>
  </section>
</div>
<style>
  .catalog-panel{width:min(620px,calc(100vw - 24px));max-height:90dvh;overflow-y:auto}
  .cm-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 16px}
  .cm-tabs .u-btn{min-height:44px;padding:8px 2px;font-size:12px}
  .cm-tabs .cm-selected{border-color:rgba(156,236,255,.75)}
  .cm-forms{display:grid;gap:12px}
  .cm-note{font-size:12px;line-height:1.65;opacity:.72}
  .cm-section{margin:0 0 8px;font-size:14px}
  .cm-busy{opacity:.65;pointer-events:none}
  .cm-forms .management-card{margin:0}
  .cm-message{margin:10px 0;padding:10px 12px;border:1px solid rgba(156,236,255,.23);border-radius:12px;font-size:12px}
  .cm-danger{border-color:rgba(255,120,120,.34)}
  .cm-actions{display:flex;gap:8px;flex-wrap:wrap}
  .cm-actions .u-btn{min-height:44px}
  .cm-field input[type=color]{min-height:48px;padding:4px 8px}
  @media(max-width:390px){.cm-tabs .u-btn{font-size:10px}.catalog-panel{padding:14px}}
</style>
<script>
  const cmState={bootstrap:null,tab:'groups',busy:false,message:'',audit:null,profileFields:null};
  function cmEscape_(v){
    return String(v==null?'':v).replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function cmSelected_(a,b){return String(a)===String(b)?' selected':'';}
  function cmOption_(id,label,selected){return '<option value="'+cmEscape_(id)+'"'+cmSelected_(id,selected)+'>'+cmEscape_(label)+'</option>';}
  function cmOptions_(rows,idKey,labelKey,selected){
    return '<option value="">選択してください</option>'+rows.map(function(r){return cmOption_(r[idKey],r[labelKey],selected);}).join('');
  }
  function cmField_(id,label,control){
    return '<label class="management-field cm-field" for="'+id+'"><span>'+cmEscape_(label)+'</span>'+control+'</label>';
  }
  function cmInput_(id,type,value,placeholder){
    return '<input class="management-input" type="'+type+'" id="'+id+'" value="'+cmEscape_(value||'')+'" placeholder="'+cmEscape_(placeholder||'')+'">';
  }
  function cmSelect_(id,html){
    return '<select id="'+id+'">'+html+'</select>';
  }
  function cmValue_(id){const e=document.getElementById(id);return e?e.value:'';}
  function cmChecked_(id){const e=document.getElementById(id);return !!(e&&e.checked);}
  function cmNotify_(msg){cmState.message=msg;cmRender_();}
  function openCatalogManagement(){
    if(typeof closeSettings==='function')closeSettings();
    const overlay=document.getElementById('catalogManagementOverlay');
    if(!overlay)return;
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
    cmReload_();
  }
  function closeCatalogManagement(){
    const overlay=document.getElementById('catalogManagementOverlay');
    if(overlay)overlay.classList.remove('open');
    document.body.style.overflow='';
  }
  function cmCloseBackdrop_(event){if(event.target&&event.target.id==='catalogManagementOverlay')closeCatalogManagement();}
  function cmReload_(){
    const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(!uid){cmNotify_('利用ユーザーを選択してください。');return;}
    cmState.busy=true;cmState.message='読み込み中...';cmRender_();
    google.script.run.withSuccessHandler(function(v){
      cmState.bootstrap=v;cmState.busy=false;cmState.message='';
      if(cmState.tab==='fields'&&v.schema&&v.schema.ready){cmState.profileFields=null;cmLoadProfileFields_();}
      else cmRender_();
    }).withFailureHandler(function(e){
      cmState.busy=false;cmState.message='読み込み失敗: '+(e.message||e);cmRender_();
    }).getCatalogManagementBootstrap(uid);
  }
  function cmCall_(name,payload){
    if(cmState.busy)return;
    const runner=google.script.run;
    cmState.busy=true;cmState.message='保存中...';cmRender_();
    runner.withSuccessHandler(function(result){
      cmState.busy=false;
      if(result&&!result.ok){cmNotify_('保存結果を確認してください。');return;}
      cmReload_();
      if(typeof showToast==='function')showToast('保存しました。');
    }).withFailureHandler(function(e){
      cmState.busy=false;
      cmState.message='保存できませんでした: '+(e.message||e);cmRender_();
    })[name](Object.assign({userId:getUniverseUserId()},payload||{}));
  }
  function cmTab_(name){
    if(cmState.busy)return;
    cmState.tab=name;cmState.message='';
    if(name==='fields'&&!cmState.profileFields){
      cmLoadProfileFields_();
      return;
    }
    cmRender_();
  }
  function cmLoadProfileFields_(){
    if(cmState.busy)return;
    const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(!uid){cmNotify_('利用ユーザーを選択してください。');return;}
    cmState.busy=true;cmState.message='プロフィール項目を読み込み中...';cmRender_();
    google.script.run.withSuccessHandler(function(result){
      cmState.busy=false;cmState.message='';
      cmState.profileFields=result&&result.ok?(result.fields||[]):null;
      if(!cmState.profileFields)cmState.message='項目情報の読み込み結果を確認できません。';
      cmRender_();
    }).withFailureHandler(function(error){
      cmState.busy=false;cmState.message='項目の読込失敗: '+(error.message||error);cmRender_();
    }).getCatalogManagementProfileFields(uid);
  }
  function cmAuditDatabase_(){
    if(cmState.busy)return;
    const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(!uid){cmNotify_('利用ユーザーを選択してください。');return;}
    cmState.busy=true;cmState.message='データ構造を読み取り診断中...';cmRender_();
    google.script.run.withSuccessHandler(function(result){
      cmState.busy=false;cmState.audit=result;cmState.message='DB診断が完了しました（変更なし）。';cmRender_();
    }).withFailureHandler(function(e){
      cmState.busy=false;cmState.message='DB診断に失敗: '+(e.message||e);cmRender_();
    }).auditCatalogManagementDatabase(uid);
  }
  function cmRender_(){
    const root=document.getElementById('catalogManagementBody');if(!root)return;
    const d=cmState.bootstrap;
    if(!d){root.innerHTML='<p class="cm-note">'+cmEscape_(cmState.message||'読み込み中...')+'</p>';return;}
    const b=['groups','members','units','songs','fields'];
    const titles=['グループ','メンバー','ユニット','楽曲','プロフィール項目'];
    let html='<div class="cm-tabs" role="tablist">'+b.map(function(tab,i){
      return '<button class="u-btn '+(tab===cmState.tab?'cm-selected':'')+'" type="button" role="tab" aria-selected="'+(tab===cmState.tab)+'" onclick="cmTab_(\''+tab+'\')">'+titles[i]+'</button>';
    }).join('')+'</div>';
    if(cmState.message)html+='<p class="cm-message">'+cmEscape_(cmState.message)+'</p>';
    html+='<div class="cm-actions"><button class="u-btn" type="button" onclick="cmAuditDatabase_()">DB構造を診断（読み取りのみ）</button></div>';
    if(cmState.audit){
      const a=cmState.audit, ct=a.counts||{}, warns=a.warnings||[];
      html+='<section class="management-card"><h3 class="cm-section">DB点検結果</h3>'+
        '<p class="cm-note">本体 '+cmEscape_(a.coreTabCount)+'タブ／ログ '+cmEscape_(a.logTabCount)+'タブ。グループ'+cmEscape_(ct.groups)+'件、メンバー'+cmEscape_(ct.members)+'人、曲'+cmEscape_(ct.songs)+'曲、歌詞パート'+cmEscape_(ct.lyrics)+'件。</p>'+
        '<p class="cm-note">旧入力タブ '+cmEscape_((a.legacyInputTabs||[]).length)+'件。構造上の注意 '+cmEscape_(warns.length)+'件'+(a.warningsTruncated?'（一部のみ表示）':'')+'。</p>'+
        '<details><summary>点検の詳細</summary><ul>'+warns.map(function(w){return '<li>'+cmEscape_(w.code+'：'+w.detail)+'</li>';}).join('')+'</ul></details></section>';
    }
    if(d.schema&&!d.schema.ready){
      html+='<section class="management-card"><h3 class="cm-section">データ構造の準備が必要</h3><p class="cm-note">既存データのバックアップを取得し、管理者設定を確認してから移行します。通常の利用はここで停止します。</p><p class="cm-note">'+cmEscape_(d.schema.missing.join(' / '))+'</p>'+
        '<button class="u-btn" type="button" onclick="cmRunMigration_()">バックアップ確認後にスキーマを移行</button></section>';
      root.innerHTML=html;return;
    }
    if(cmState.tab==='groups')html+=cmGroupsHtml_(d);
    else if(cmState.tab==='members')html+=cmMembersHtml_(d);
    else if(cmState.tab==='units')html+=cmUnitsHtml_(d);
    else if(cmState.tab==='fields')html+=cmProfileFieldsHtml_();
    else html+=cmSongsHtml_(d);
    root.innerHTML='<div class="'+(cmState.busy?'cm-busy':'')+'">'+html+'</div>';
  }
  function cmGroupActive_(g){return String(g.RecordStatus||'ACTIVE').toUpperCase()!=='ARCHIVED';}
  function cmGroupKind_(g){return String(g.GroupKind||(Number(g.GroupID)<=4?'GROUP':'UNIT'));}
  function cmMemberActive_(m){return String(m.RecordStatus||'ACTIVE').toUpperCase()!=='ARCHIVED';}
  function cmRunMigration_(){
    const typed=window.prompt('バックアップを作成・確認した場合だけ MIGRATE_CATALOG_V1 と入力してください。');
    if(typed!=='MIGRATE_CATALOG_V1')return;
    if(!window.confirm('本番DBへ列を追加します。現在のシートのバックアップは別ファイルに保管済みですか？'))return;
    cmCall_('catalogManagementMigrateSchema',{confirm:typed});
  }
  function cmProfileFieldsHtml_(){
    if(!cmState.profileFields){
      return '<section class="management-card"><h3 class="cm-section">プロフィール項目</h3>'+
        '<p class="cm-note">プロフィールの項目定義を読み込んでください。値の編集は既存の「プロフィール管理」で行います。</p>'+
        '<button class="u-btn" type="button" onclick="cmLoadProfileFields_()">項目を再読み込み</button></section>';
    }
    const fields=cmState.profileFields;
    const options=fields.map(function(f){
      return {value:f.profileId,caption:f.label+'（'+f.profileId+'）'+(f.isActive?'':' [非表示]')};
    });
    const opts='<option value="">項目を選択してください</option>'+
      options.map(function(o){return cmOption_(o.value,o.caption);}).join('');
    const active=fields.filter(function(f){return f.isActive;}).length;
    return '<div class="cm-forms"><section class="management-card">'+
      '<h3 class="cm-section">新しいプロフィール項目を追加</h3>'+
      cmField_('cmProfileFieldName','項目名',cmInput_('cmProfileFieldName','text','','例：好きな映画'))+
      cmField_('cmProfileFieldType','値の形式',cmSelect_('cmProfileFieldType',
        cmOption_('TEXT','文字列')+cmOption_('NUMBER','数値')+cmOption_('DATE','日付')))+
      cmField_('cmProfileFieldGroup','表示分類',cmInput_('cmProfileFieldGroup','text','基本','例：基本・好み・活動'))+
      '<label class="management-field cm-field"><span>複数入力</span><span>'+
        '<input id="cmProfileFieldMulti" type="checkbox"> 文字列を複数登録できるようにする</span></label>'+
      '<p class="cm-note">ProfileIDは自動採番。既存メンバーの新項目は空欄のまま作成し、プロフィール編集画面から入力できます。プロフィールクイズは廃止予定のため、新項目からのクイズ出題はありません。</p>'+
      '<div class="cm-actions"><button class="u-btn" type="button" onclick="cmCreateProfileField_()">項目を追加</button></div>'+
      '</section><section class="management-card">'+
      '<h3 class="cm-section">既存項目の非表示・再表示</h3>'+
      '<p class="cm-note">項目'+fields.length+'件（表示中 '+active+'件）。非表示にしてもプロフィール値、列、ProfileIDは消えません。</p>'+
      cmField_('cmProfileFieldTarget','項目','<select id="cmProfileFieldTarget" onchange="cmShowProfileField_()">'+opts+'</select>')+
      '<p id="cmProfileFieldInfo" class="cm-note" role="status">項目を選択すると現在の設定を確認できます。</p>'+
      '<div class="cm-actions">'+
        '<button class="u-btn" type="button" onclick="cmSetProfileFieldActive_(false)">非表示にする</button>'+
        '<button class="u-btn" type="button" onclick="cmSetProfileFieldActive_(true)">再表示する</button>'+
      '</div><p class="cm-note">「呼ばれ順（P000）」は基礎項目のため非表示にできません。</p>'+
      '</section></div>';
  }
  function cmSelectedProfileField_(){
    return (cmState.profileFields||[]).find(function(x){
      return x.profileId===cmValue_('cmProfileFieldTarget');
    });
  }
  function cmShowProfileField_(){
    const p=cmSelectedProfileField_(),target=document.getElementById('cmProfileFieldInfo');
    if(!target)return;
    target.textContent=p?
      p.profileId+'｜'+p.displayGroup+'｜'+p.dataType+
      (p.isMultiValue?'・複数入力':'')+'｜'+(p.isActive?'表示中':'非表示中'):
      '項目を選択すると現在の設定を確認できます。';
  }
  function cmCreateProfileField_(){
    const name=cmValue_('cmProfileFieldName').trim();
    const type=cmValue_('cmProfileFieldType');
    const isMulti=cmChecked_('cmProfileFieldMulti');
    if(!name){cmNotify_('項目名を入力してください。');return;}
    if(isMulti&&type!=='TEXT'){cmNotify_('複数入力にできるのは文字列のみです。');return;}
    if(!window.confirm('新しいプロフィール項目「'+name+'」を追加します。既存データの値は変更しません。続けますか？'))return;
    cmCall_('catalogManagementCreateProfileField',{
      name:name,dataType:type,isMultiValue:isMulti,
      displayGroup:cmValue_('cmProfileFieldGroup')
    });
  }
  function cmSetProfileFieldActive_(isActive){
    const field=cmSelectedProfileField_();
    if(!field){cmNotify_('対象項目を選択してください。');return;}
    if(field.isActive===isActive){cmNotify_('すでに'+(isActive?'表示中':'非表示中')+'です。');return;}
    if(!isActive&&field.profileId==='P000'){cmNotify_('呼ばれ順は非表示にできません。');return;}
    const action=isActive?'再表示':'非表示';
    if(!window.confirm('「'+field.label+'」を'+action+'にしますか？\nプロフィールの値は消しません。'))return;
    cmCall_('catalogManagementSetProfileFieldActive',{
      profileId:field.profileId,isActive:isActive,expectedActive:field.isActive
    });
  }

  function cmGroupsHtml_(d){
    const g=d.groups.filter(cmGroupActive_);
    return '<div class="cm-forms"><section class="management-card"><h3 class="cm-section">グループ・ユニットを追加</h3>'+
      cmField_('cmGroupName','名称',cmInput_('cmGroupName','text','','グループ名'))+
      cmField_('cmGroupKind','種類',cmSelect_('cmGroupKind',cmOption_('GROUP','グループ')+cmOption_('UNIT','ユニット')))+
      cmField_('cmGroupColor','カラー',cmInput_('cmGroupColor','color','#777777'))+
      '<div class="cm-actions"><button class="u-btn" type="button" onclick="cmCreateGroup_()">登録</button></div></section>'+
      '<section class="management-card"><h3 class="cm-section">既存グループの編集</h3>'+
      cmField_('cmEditGroup','対象',cmSelect_('cmEditGroup',cmOptions_(g,'GroupID','GroupName')))+
      cmField_('cmEditGroupName','名称',cmInput_('cmEditGroupName','text',''))+
      cmField_('cmEditGroupColor','カラー',cmInput_('cmEditGroupColor','color','#777777'))+
      '<div class="cm-actions"><button class="u-btn" onclick="cmFillGroup_()" type="button">読込</button><button class="u-btn" onclick="cmSaveGroup_()" type="button">保存</button></div><p class="cm-note">曲などで使用中のグループ名は変更できません。カラーは更新可能です。同じカラーコードを持つ別のグループ・メンバーがいる場合は登録できません。</p></section></div>';
  }
  /** Fast feedback only. BMSG-DB performs authoritative validation under lock. */
  function cmColorAvailable_(hex,kind,id){
    const normalized=String(hex||'').trim().toUpperCase();
    if(!/^#[0-9A-F]{6}$/.test(normalized)){cmNotify_('カラーは #RRGGBB 形式で指定してください。');return false;}
    const d=cmState.bootstrap||{},g=d.groups||[],m=d.members||[];
    const own=(kind==='GROUP'?g:m).find(function(x){
      return String(kind==='GROUP'?x.GroupID:x.MemberID)===String(id);
    });
    if(own&&String(own.ColorHex||'').toUpperCase()===normalized)return true;
    const conflicts=g.map(function(x){return {kind:'GROUP',id:x.GroupID,name:x.GroupName,hex:x.ColorHex};})
      .concat(m.map(function(x){return {kind:'MEMBER',id:x.MemberID,name:x.DisplayName,hex:x.ColorHex};}))
      .filter(function(x){
        return String(x.hex||'').toUpperCase()===normalized&&
          !(x.kind===kind&&String(x.id)===String(id));
      });
    if(conflicts.length){
      cmNotify_('カラー '+normalized+' はすでに '+conflicts.map(function(x){return x.name;}).join('・')+' が使用しています。別の色を選んでください。');
      return false;
    }
    return true;
  }
  function cmCreateGroup_(){
    const color=cmValue_('cmGroupColor');
    if(!cmColorAvailable_(color,'GROUP',''))return;
    cmCall_('catalogManagementCreateGroup',{name:cmValue_('cmGroupName'),kind:cmValue_('cmGroupKind'),color:color});
  }
  function cmFillGroup_(){
    const g=cmState.bootstrap.groups.find(x=>String(x.GroupID)===cmValue_('cmEditGroup'));if(!g)return;
    document.getElementById('cmEditGroupName').value=g.GroupName||'';
    document.getElementById('cmEditGroupColor').value=g.ColorHex||'#777777';
  }
  function cmSaveGroup_(){const id=cmValue_('cmEditGroup');if(!id){cmNotify_('グループを選択してください。');return;}
    const color=cmValue_('cmEditGroupColor');if(!cmColorAvailable_(color,'GROUP',id))return;
    cmCall_('catalogManagementUpdateGroup',{groupId:id,name:cmValue_('cmEditGroupName'),color:color});}
  function cmMembersHtml_(d){
    const main=d.groups.filter(x=>cmGroupActive_(x)&&cmGroupKind_(x)==='GROUP');
    const members=d.members.filter(cmMemberActive_);
    return '<div class="cm-forms"><section class="management-card"><h3 class="cm-section">メンバー追加</h3>'+
      cmField_('cmMemberName','表示名',cmInput_('cmMemberName','text','','名前'))+
      cmField_('cmMemberMain','主所属グループ',cmSelect_('cmMemberMain',cmOptions_(main,'GroupID','GroupName')))+
      cmField_('cmMemberColor','カラー',cmInput_('cmMemberColor','color','#777777'))+
      '<p class="cm-note">カラーコードは既存グループ・ユニット・メンバーと重複できません。</p>'+
      '<div class="cm-actions"><button class="u-btn" onclick="cmCreateMember_()" type="button">登録</button></div></section>'+
      '<section class="management-card"><h3 class="cm-section">既存メンバーを編集</h3>'+
      cmField_('cmEditMember','対象',cmSelect_('cmEditMember',cmOptions_(members,'MemberID','DisplayName')))+
      cmField_('cmEditMemberName','名前',cmInput_('cmEditMemberName','text',''))+
      cmField_('cmEditMemberColor','カラー',cmInput_('cmEditMemberColor','color','#777777'))+
      '<div class="cm-actions"><button class="u-btn" onclick="cmFillMember_()" type="button">読込</button><button class="u-btn" onclick="cmSaveMember_()" type="button">保存</button></div></section></div>';
  }
  function cmCreateMember_(){const color=cmValue_('cmMemberColor');if(!cmColorAvailable_(color,'MEMBER',''))return;
    cmCall_('catalogManagementCreateMember',{name:cmValue_('cmMemberName'),primaryGroupId:cmValue_('cmMemberMain'),color:color});}
  function cmFillMember_(){const m=cmState.bootstrap.members.find(x=>String(x.MemberID)===cmValue_('cmEditMember'));if(!m)return;
    document.getElementById('cmEditMemberName').value=m.DisplayName||'';
    document.getElementById('cmEditMemberColor').value=m.ColorHex||'#777777';
  }
  function cmSaveMember_(){const id=cmValue_('cmEditMember');if(!id){cmNotify_('メンバーを選択してください。');return;}
    const color=cmValue_('cmEditMemberColor');if(!cmColorAvailable_(color,'MEMBER',id))return;
    cmCall_('catalogManagementUpdateMember',{memberId:id,name:cmValue_('cmEditMemberName'),color:color});}
  function cmUnitsHtml_(d){
    const units=d.groups.filter(x=>cmGroupActive_(x)&&cmGroupKind_(x)==='UNIT');
    const members=d.members.filter(cmMemberActive_);
    return '<div class="cm-forms"><section class="management-card"><h3 class="cm-section">ユニットへメンバー追加</h3>'+
      cmField_('cmUnitTarget','ユニット',cmSelect_('cmUnitTarget',cmOptions_(units,'GroupID','GroupName')))+
      cmField_('cmUnitMember','メンバー',cmSelect_('cmUnitMember',cmOptions_(members,'MemberID','DisplayName')))+
      '<p class="cm-note">メンバーの主所属は変わりません。同じメンバーを複数ユニットに所属させられます。</p>'+
      '<div class="cm-actions"><button class="u-btn" onclick="cmAddUnitMember_()" type="button">所属を追加</button></div></section></div>';
  }
  function cmAddUnitMember_(){cmCall_('catalogManagementAddUnitMember',{groupId:cmValue_('cmUnitTarget'),memberId:cmValue_('cmUnitMember')});}
  function cmSongsHtml_(d){
    const songs=d.songs||[],artists=d.groups.filter(cmGroupActive_).map(x=>({id:x.GroupName,label:x.GroupName}));
    d.members.filter(cmMemberActive_).forEach(x=>artists.push({id:x.DisplayName,label:x.DisplayName}));
    artists.push({id:'UNIT',label:'UNIT'});
    const singers=d.members.filter(x=>cmMemberActive_(x)&&d.groups.some(g=>g.GroupID==x.GroupID&&g.GroupName==='BE:FIRST'));
    const opts=cmOptions_(songs,'SongID','Title');
    return '<div class="cm-forms"><section class="management-card"><h3 class="cm-section">歌詞なし楽曲を新規登録</h3>'+
      cmField_('cmNewSongTitle','曲名',cmInput_('cmNewSongTitle','text','','曲名'))+
      cmField_('cmNewSongArtist','Artist',cmSelect_('cmNewSongArtist','<option value="">選択してください</option>'+artists.map(x=>cmOption_(x.id,x.label)).join('')))+
      cmField_('cmNewSongDate','初回音源リリース日',cmInput_('cmNewSongDate','date',''))+
      cmField_('cmNewSongForm','形式',cmSelect_('cmNewSongForm','<option value="">未設定</option>'+['シングル','アルバム','デジタルリリース','その他'].map(x=>cmOption_(x,x)).join('')))+
      cmField_('cmNewSongCd','収録作品名',cmInput_('cmNewSongCd','text',''))+
      '<label class="management-field cm-field"><span>表題曲</span><span><input type="checkbox" id="cmNewSongTitleTrack"> 表題曲</span></label>'+
      cmField_('cmNewSongType','曲区分',cmSelect_('cmNewSongType',cmOption_('NORMAL','通常曲')+cmOption_('SOLO','ソロ曲')))+
      cmField_('cmNewSoloMember','ソロ担当',cmSelect_('cmNewSoloMember',cmOptions_(singers,'MemberID','DisplayName')))+
      '<p class="cm-note">ソロ曲はArtistにBE:FIRSTを選び、担当メンバーを指定。歌詞は後から楽曲・歌詞管理で入力できます。</p>'+
      '<div class="cm-actions"><button class="u-btn" onclick="cmCreateSong_()" type="button">楽曲を登録</button></div></section>'+
      '<section class="management-card"><h3 class="cm-section">既存曲の分類・削除</h3>'+
      cmField_('cmSongSearch','曲名を検索',cmInput_('cmSongSearch','search','','曲名で絞り込み'))+
      cmField_('cmSelectSong','対象曲',cmSelect_('cmSelectSong',opts))+
      cmField_('cmSongType','曲区分',cmSelect_('cmSongType',cmOption_('NORMAL','通常曲')+cmOption_('SOLO','ソロ曲')))+
      cmField_('cmSoloMember','ソロ担当',cmSelect_('cmSoloMember',cmOptions_(singers,'MemberID','DisplayName')))+
      '<div class="cm-actions"><button class="u-btn" onclick="cmSaveSongClass_()" type="button">分類を保存</button><button class="u-btn cm-danger" onclick="cmDeleteSong_()" type="button">楽曲を削除</button></div><p class="cm-note">削除すると曲と紐付いた歌詞・クレジット・秒数等のデータも消え、サイトから復元はできません。事前に依存関係を検査し、他機能から参照される曲は削除を止めます。SongIDは再利用しません。YouTube・セットリスト等の外部参照は事前に別途確認してください。</p></section></div>';
  }
  function cmCreateSong_(){
    cmCall_('catalogManagementCreateSongDraft',{
      song:{title:cmValue_('cmNewSongTitle'),artist:cmValue_('cmNewSongArtist'),
        releaseDate:cmValue_('cmNewSongDate'),form:cmValue_('cmNewSongForm'),cdTitle:cmValue_('cmNewSongCd'),
        isTitleTrack:cmChecked_('cmNewSongTitleTrack')},
      songType:cmValue_('cmNewSongType'),soloMemberId:cmValue_('cmNewSoloMember')});
  }
  function cmSaveSongClass_(){
    const songId=cmValue_('cmSelectSong');if(!songId){cmNotify_('曲を選択してください。');return;}
    cmCall_('catalogManagementSaveSongClass',{songId:songId,songType:cmValue_('cmSongType'),soloMemberId:cmValue_('cmSoloMember')});
  }
  function cmDeleteSong_(){
    const songId=cmValue_('cmSelectSong');
    const song=(cmState.bootstrap&&cmState.bootstrap.songs||[]).find(function(x){return String(x.SongID)===songId;});
    if(!song){cmNotify_('削除する曲を選択してください。');return;}
    if(cmState.busy)return;
    cmState.busy=true;cmState.message='関連データを確認中...';cmRender_();
    google.script.run.withSuccessHandler(function(preview){
      cmState.busy=false;
      if(!preview||!preview.ok){cmNotify_('依存関係を確認できません。削除は中止します。');return;}
      if(!preview.canDelete){
        cmNotify_('削除できません。先に参照関係を整理してください: '+(preview.blockers||[]).join(' / '));
        return;
      }
      const parts=preview.counts||{};
      const detail=Object.keys(parts).map(function(k){return k+'：'+parts[k]+'件';}).join('\n');
      if(!window.confirm('「'+song.Title+'」(SongID '+songId+')を完全削除します。\n'+detail+'\n関連データも消え、サイトから復元できません。続けますか？'))return;
      const typed=window.prompt('完全削除を確定するにはSongID「'+songId+'」を入力してください。');
      if(typed!==songId)return;
      if(!window.confirm('YouTube・セットリスト等の外部連携先にこのSongIDが残っていないことを確認しましたか？\n未確認ならキャンセルしてください。'))return;
      cmCall_('catalogManagementDeleteSong',{
        songId:songId,confirm:songId,confirmTitle:song.Title,externalReferencesChecked:true
      });
    }).withFailureHandler(function(e){
      cmState.busy=false;cmNotify_('関連データの確認に失敗しました: '+(e.message||e));
    }).getCatalogManagementDeletePreview({userId:getUniverseUserId(),songId:songId});
  }
  // Dedicated event delegation, scoped to the catalog overlay.
  document.addEventListener('input',function(ev){
    if(ev.target&&ev.target.id==='cmSongSearch'){
      const v=ev.target.value.toLowerCase(),select=document.getElementById('cmSelectSong');
      if(!select)return;
      select.innerHTML=cmOptions_((cmState.bootstrap.songs||[]).filter(x=>String(x.Title||'').toLowerCase().includes(v)),'SongID','Title');
    }
  });
</script>

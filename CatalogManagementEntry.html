<style>#catalogManagementSettingsRow[hidden]{display:none!important}</style>
<script>
  function ensureCatalogManagementSettingsEntry(){
    if(document.getElementById('catalogManagementSettingsRow'))return;
    const panel=document.querySelector('#settingsOverlay .settings-panel');
    if(!panel)return;
    let section=document.getElementById('imageManagementSettingsGroup');
    if(!section){
      section=document.createElement('section');
      section.className='settings-group';
      section.id='imageManagementSettingsGroup';
      section.innerHTML='<p class="settings-section-title">管理</p>';
      panel.appendChild(section);
    }
    const button=document.createElement('button');
    button.id='catalogManagementSettingsRow';
    button.className='settings-row settings-row-button';
    button.type='button';
    button.hidden=true;
    button.onclick=openCatalogManagement;
    button.innerHTML='<span class="settings-row-copy"><strong>データ管理</strong><small>グループ・メンバー・ユニット・楽曲・プロフィール項目</small></span><span class="settings-arrow">›</span>';
    section.appendChild(button);
  }
  function refreshCatalogManagementSettingsAccess(){
    ensureCatalogManagementSettingsEntry();
    const button=document.getElementById('catalogManagementSettingsRow');
    if(!button)return;
    const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    button.hidden=true;
    if(!uid)return;
    google.script.run.withSuccessHandler(function(data){
      button.hidden=!(data&&data.enabled===true);
    }).withFailureHandler(function(){
      button.hidden=true;
    }).getCatalogManagementAccess(uid);
  }
  ensureCatalogManagementSettingsEntry();
</script>

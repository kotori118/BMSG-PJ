<style>
  /* COVER MAKER final light/card polish. Shared ButtonSystem remains interaction authority. */

  /* Pure white means the whole visible COVER canvas, not only the inner section. */
  body:has(#pageContent > .cover-page),
  .app-shell:has(#pageContent > .cover-page),
  .page-wrap:has(#pageContent > .cover-page),
  .page-content:has(> .cover-page){
    background:#fff!important;
  }
  .app-shell:has(#pageContent > .cover-page) .cosmic-bg,
  .app-shell:has(#pageContent > .cover-page) .home-glow{
    display:none!important;
  }

  .cover-page{
    min-width:0;
    padding-top:86px!important;
    background:#fff!important;
    color:var(--ink,#151820)!important;
  }
  .cover-app{background:#fff!important;}

  /* Shared utility buttons keep ButtonSystem surface/interaction authority. COVER only sets stacking. */
  .app-shell:has(#pageContent > .cover-page) .utility-actions{
    z-index:40;
  }

  /* Local COVER navigation no longer competes horizontally with the page title. */
  .cover-header{
    display:flex!important;
    flex-direction:column!important;
    align-items:flex-start!important;
    gap:14px!important;
    margin:0 0 28px!important;
  }
  .cover-back-btn{
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;
    padding:0!important;
    display:grid!important;
    place-items:center!important;
    font-size:28px!important;
    line-height:1!important;
  }
  .cover-page.is-cover-home .cover-back-btn{display:none!important;}
  .cover-title{
    margin:0!important;
    max-width:100%;
    font-size:clamp(30px,8vw,48px)!important;
    line-height:.96!important;
    letter-spacing:.04em!important;
  }

  .cover-section-title{
    margin:0 0 16px!important;
    font-size:14px!important;
    letter-spacing:.08em!important;
  }

  /* Destination group / source artist: use the TRADING CARD content-card geometry. */
  .cover-page.is-cover-choice .cover-choice-stack{
    max-width:none!important;
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:12px!important;
  }
  .cover-page.is-cover-choice .cover-content-card{
    position:relative!important;
    isolation:isolate;
    overflow:hidden!important;
    min-height:108px!important;
    padding:18px!important;
    justify-content:flex-start!important;
    align-items:flex-end!important;
    text-align:left!important;
    border:1px solid color-mix(in srgb,var(--cover-accent,#9cecff) 38%,rgba(21,24,32,.22))!important;
    border-radius:24px!important;
    background:linear-gradient(145deg,#151b22,#080b10)!important;
    box-shadow:0 10px 28px rgba(9,14,20,.10),inset 0 1px 0 rgba(255,255,255,.05)!important;
    color:#fff!important;
  }
  .cover-page.is-cover-choice .cover-content-card::after{
    content:'';
    position:absolute;
    z-index:-1;
    right:-28px;
    bottom:-44px;
    width:112px;
    height:112px;
    border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--cover-accent,#9cecff) 52%,transparent),transparent 70%);
    filter:blur(1px);
    pointer-events:none;
  }
  .cover-page.is-cover-choice .cover-content-card strong{
    position:relative;
    z-index:1;
    display:block;
    color:#fff!important;
    font-family:'Exo 2','Zen Kaku Gothic New',sans-serif!important;
    font-size:17px!important;
    font-weight:700!important;
    line-height:1.2!important;
    letter-spacing:.02em!important;
    overflow-wrap:anywhere;
  }
  .cover-page.is-cover-group .cover-content-card:last-child:nth-child(odd){
    grid-column:1 / -1!important;
  }

  /* Source songs and saved projects stay light, but use the same substantial card proportion. */
  .cover-song-row,.cover-project-row{
    min-height:68px!important;
    padding:15px 17px!important;
    border-left:0!important;
    border-bottom:3px solid var(--cover-accent,#9cecff)!important;
    border-radius:18px!important;
    background:linear-gradient(145deg,#fff,#f9fdff)!important;
    box-shadow:0 7px 20px rgba(21,24,32,.045)!important;
  }
  .cover-song-row .cover-row-meta{display:none!important;}

  .cover-search{
    height:52px!important;
    border-radius:16px!important;
    background:#fff!important;
  }

  /* Editor: remove the dead top pocket and keep the two main tools visually central. */
  .cover-page.is-cover-editor .cover-header{margin-bottom:16px!important;}
  .cover-page.is-cover-editor .cover-editor-head{
    top:0!important;
    padding:0 0 14px!important;
    background:#fff!important;
  }
  .cover-page.is-cover-editor .cover-tabs,
  .cover-page.is-cover-editor .cover-tools{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,152px))!important;
    justify-content:center!important;
    gap:10px!important;
    max-width:none!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }
  .cover-page.is-cover-editor .cover-tabs{margin-bottom:10px!important;}
  .cover-page.is-cover-editor .cover-tab,
  .cover-page.is-cover-editor .cover-tools .u-btn{
    width:100%!important;
    min-width:0!important;
    min-height:52px!important;
    padding:0 12px!important;
    justify-content:center!important;
    text-align:center!important;
    border-radius:18px!important;
  }
  .cover-page.is-cover-editor .cover-tools .u-btn{
    font-weight:700!important;
  }

  /* Member picker follows the single-column mobile sheet spec. */
  .cover-page .cover-member-list{
    grid-template-columns:1fr!important;
    gap:10px;
  }
  .cover-page .cover-member-option{
    min-height:54px!important;
    padding:10px!important;
    justify-content:center!important;
    text-align:center!important;
    border-left:0!important;
    border-bottom:3px solid var(--member-color,#9cecff)!important;
    border-radius:17px!important;
  }
  .cover-page .cover-assignee{
    min-height:44px!important;
    padding-block:8px!important;
  }

  @media(max-width:600px){
    .cover-page{padding-top:82px!important;}
    .cover-title{font-size:clamp(28px,9vw,40px)!important;}
    .cover-page.is-cover-choice .cover-content-card{min-height:98px!important;padding:16px!important;border-radius:22px!important;}
    .cover-page.is-cover-choice .cover-content-card strong{font-size:16px!important;}
    .cover-page.is-cover-editor .cover-tab,
    .cover-page.is-cover-editor .cover-tools .u-btn{min-height:50px!important;}
  }

  @media(max-width:380px){
    .cover-page.is-cover-choice .cover-choice-stack{gap:9px!important;}
    .cover-page.is-cover-choice .cover-content-card{min-height:90px!important;padding:13px!important;}
    .cover-page.is-cover-choice .cover-content-card strong{font-size:14px!important;}
  }
</style>
<script>
(function(){
  function coverPageElement(){return document.querySelector('#pageContent > .cover-page') || document.querySelector('.cover-page');}
  function setCoverVisualMode(mode){
    var page=coverPageElement();
    if(!page)return;
    ['home','group','artist','songs','projects','editor'].forEach(function(name){
      page.classList.toggle('is-cover-'+name,mode===name);
    });
    page.classList.toggle('is-cover-choice',mode==='group'||mode==='artist');
    if(mode==='group'||mode==='artist')decorateCoverChoiceCards();
  }
  function decorateCoverChoiceCards(){
    var page=coverPageElement();
    if(!page)return;
    var groups=(window.coverState&&coverState.bootstrap&&coverState.bootstrap.groups)||[];
    var colors={};
    groups.forEach(function(group){colors[String(group.groupName||'')]=group.color||'#9cecff';});
    page.querySelectorAll('.cover-content-card').forEach(function(card){
      var label=card.querySelector('strong');
      var name=label?String(label.textContent||'').trim():'';
      if(colors[name])card.style.setProperty('--cover-accent',colors[name]);
    });
  }
  function wrapCoverRender(name,mode){
    var original=window[name];
    if(typeof original!=='function')return;
    window[name]=function(){
      var result=original.apply(this,arguments);
      setCoverVisualMode(mode);
      return result;
    };
  }

  wrapCoverRender('renderCoverHome','home');
  wrapCoverRender('openCoverGroupSelect','group');
  wrapCoverRender('openCoverArtistSelect','artist');
  wrapCoverRender('renderCoverSongs','songs');
  wrapCoverRender('openCoverProjects','projects');
  wrapCoverRender('renderCoverEditor','editor');
})();
</script>

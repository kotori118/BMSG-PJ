<style>
  /* COVER MAKER v4: saved-view navigation + personal project list polish. */

  /* Saved/project cards are neutral white rows, not accent-heavy cards. */
  .cover-page .cover-project-row{
    min-height:70px!important;
    padding:14px 16px!important;
    border:1px solid rgba(21,24,32,.12)!important;
    border-bottom:1px solid rgba(21,24,32,.12)!important;
    border-radius:16px!important;
    background:#fff!important;
    color:var(--ink,#151820)!important;
    box-shadow:none!important;
    filter:none!important;
  }
  .cover-page .cover-project-row:not(:disabled):active{
    background:#fff!important;
    border-color:rgba(21,24,32,.20)!important;
    box-shadow:none!important;
    filter:none!important;
  }
  @media(hover:hover){
    .cover-page .cover-project-row:not(:disabled):hover{
      background:#fff!important;
      border-color:rgba(21,24,32,.18)!important;
      box-shadow:none!important;
      filter:none!important;
    }
  }
  .cover-page .cover-project-row:focus-visible{
    outline:2px solid rgba(21,24,32,.28)!important;
    outline-offset:2px!important;
    box-shadow:none!important;
  }
  .cover-page .cover-project-row strong{
    font-size:16px!important;
    line-height:1.35!important;
  }
  .cover-page .cover-project-row .cover-row-meta{
    margin-top:5px!important;
    font-size:12px!important;
    color:rgba(21,24,32,.56)!important;
    opacity:1!important;
  }

  /* Explicit local BACK is always available inside editor/view content. */
  .cover-inline-back{
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;
    padding:0!important;
    margin:0 0 16px!important;
    display:grid!important;
    place-items:center!important;
    font-size:28px!important;
    line-height:1!important;
  }

  /* Saved-cover viewing is normal document flow: no sticky title/tabs/tools. */
  .cover-page.is-cover-saved-view .cover-editor-head{
    position:static!important;
    top:auto!important;
  }
  .cover-page.is-cover-saved-view .cover-editor-head::before{
    display:none!important;
    content:none!important;
  }

  .cover-page.is-cover-saved-view .cover-view-actions{
    margin:14px 0 18px!important;
  }
</style>
<script>
(function(){
  function coverPageElementV4(){
    return document.querySelector('#pageContent > .cover-page')||document.querySelector('.cover-page');
  }

  function setCoverVisualModeV4(mode){
    var page=coverPageElementV4();
    if(!page)return;
    ['home','group','artist','songs','projects','editor'].forEach(function(name){
      page.classList.toggle('is-cover-'+name,mode===name);
    });
    page.classList.toggle('is-cover-choice',mode==='group'||mode==='artist');
  }

  function currentCoverUserId(){
    return typeof getUniverseUserId==='function' ? String(getUniverseUserId()||'') : '';
  }

  function ownCoverProjects(projects){
    var uid=currentCoverUserId();
    return (projects||[]).filter(function(project){
      return String(project&&project.creatorUserId||'')===uid;
    });
  }

  /* Only the current user's projects are surfaced on HOME / projects list. */
  window.renderCoverHome=function(){
    coverState.screen='home';
    coverState.dirty=false;
    var app=document.getElementById('coverApp');
    if(!app)return;
    var projects=ownCoverProjects(coverState.bootstrap&&coverState.bootstrap.projects||[]);
    app.innerHTML='<div class="cover-home-actions">'+
      '<button class="u-btn" type="button" onclick="openCoverGroupSelect()">新しく作る</button>'+
      '<button class="u-btn" type="button" onclick="openCoverProjects()">作ったカバーを見る</button></div>'+
      '<h2 class="cover-section-title">RECENT</h2>'+renderCoverProjectRows(projects.slice(0,3),true);
    setCoverVisualModeV4('home');
  };

  window.openCoverProjects=function(){
    coverState.screen='projects';
    var app=document.getElementById('coverApp');
    if(!app)return;
    var projects=ownCoverProjects(coverState.bootstrap&&coverState.bootstrap.projects||[]);
    app.innerHTML='<h2 class="cover-section-title">作ったカバー</h2>'+renderCoverProjectRows(projects,false);
    setCoverVisualModeV4('projects');
  };

  window.renderCoverProjectRows=function(projects,compact){
    if(!projects||!projects.length)return '<div class="cover-empty">まだカバーがありません。</div>';
    return '<div class="cover-stack">'+projects.map(function(p){
      return '<button type="button" class="u-btn cover-project-row" onclick="openSavedCover(\''+escapeHtml(p.projectId)+'\')">'+
        '<span><strong>'+escapeHtml(p.title||p.sourceTitle)+'</strong>'+
        '<span class="cover-row-meta">'+escapeHtml(p.sourceArtist)+' → '+escapeHtml(p.coverGroupName)+'</span>'+
        '<span class="cover-project-badges">'+(p.isComplete?'':'<span class="cover-badge is-draft">編集中</span>')+'</span></span></button>';
    }).join('')+'</div>';
  };

  /* Add an in-content BACK after every editor/view render and separate view from edit layout. */
  var originalRenderCoverEditor=window.renderCoverEditor;
  if(typeof originalRenderCoverEditor==='function'){
    window.renderCoverEditor=function(){
      var result=originalRenderCoverEditor.apply(this,arguments);
      var page=coverPageElementV4();
      var head=document.querySelector('.cover-editor-head');
      var isSavedView=coverState.screen==='view';
      setCoverVisualModeV4('editor');
      if(page){
        page.classList.toggle('is-cover-saved-view',isSavedView);
        page.classList.toggle('is-cover-live-editor',!isSavedView);
      }
      if(head&&!head.querySelector('.cover-inline-back')){
        var back=document.createElement('button');
        back.type='button';
        back.className='u-btn cover-inline-back';
        back.setAttribute('aria-label','Back');
        back.textContent='‹';
        back.onclick=function(){coverNavigateBack();};
        head.insertBefore(back,head.firstChild);
      }
      return result;
    };
  }
})();
</script>

<script>
  const coverState={ready:false,busy:false,screen:'home',bootstrap:null,coverGroup:null,artist:'',songs:[],editor:null,viewMode:'cover',dirty:false,memberSheetOrder:null,dialogAction:null,libraryProjects:[],returnScreen:'projects',allStarMemberIds:[],externalDraft:null,externalParts:[]};

  function renderCover(){const tpl=document.getElementById('coverPageTemplate');return tpl?tpl.innerHTML:'<section class="view cover-page"><div id="coverApp"></div></section>';}

  function initCoverPage(){
    coverState.ready=false;coverState.busy=false;coverState.screen='home';coverState.dirty=false;coverState.editor=null;coverState.libraryProjects=[];coverState.returnScreen='projects';coverState.allStarMemberIds=[];coverState.externalDraft=null;coverState.externalParts=[];
    renderCoverLoading();
    const userId=getUniverseUserId();
    if(!userId){if(typeof openUserChooser==='function')openUserChooser(true);renderCoverMessage('利用ユーザーを選択してください。');return;}
    google.script.run.withSuccessHandler(function(data){coverState.ready=true;coverState.bootstrap=data||{};renderCoverHome();})
      .withFailureHandler(showCoverError).getCoverMakerBootstrap(userId);
  }

  function renderCoverLoading(){
    const app=document.getElementById('coverApp');if(!app)return;
    if(coverState.screen==='home'){
      app.innerHTML='<div class="cover-home-actions"><button class="u-btn" type="button" disabled><span class="skeleton-block" style="display:block;width:54%;height:14px;border-radius:7px;margin:auto"></span></button><button class="u-btn" type="button" disabled><span class="skeleton-block" style="display:block;width:62%;height:14px;border-radius:7px;margin:auto"></span></button><button class="u-btn" type="button" disabled><span class="skeleton-block" style="display:block;width:44%;height:14px;border-radius:7px;margin:auto"></span></button></div>';
      setCanonicalCoverVisualMode('home');return;
    }
    if(coverState.screen==='songs'){
      const row='<button type="button" class="u-btn cover-song-row" disabled aria-hidden="true"><strong class="skeleton-block" style="display:block;width:52%;height:15px;border-radius:7px"></strong></button>';
      app.innerHTML='<h2 class="cover-section-title">'+escapeHtml(coverState.artist||'')+'</h2><div class="cover-search-wrap"><div class="cover-search" aria-hidden="true"><span class="skeleton-block" style="display:block;width:42%;height:14px;border-radius:7px"></span></div></div><div class="cover-stack">'+row+row+row+row+'</div>';
      setCanonicalCoverVisualMode('songs');return;
    }
    app.innerHTML=typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING...','#9cecff'):'<div class="cover-empty">LOADING...</div>';
  }
  function renderCoverMessage(message){const app=document.getElementById('coverApp');if(app)app.innerHTML='<div class="cover-empty">'+escapeHtml(message)+'</div>';}
  function showCoverError(error){coverState.busy=false;setCoverSavingState(false);const msg=error&&error.message?error.message:String(error||'エラーが発生しました。');if(typeof showToast==='function')showToast(msg);else renderCoverMessage(msg);}
  function selectCoverGroup(groupId){
    const groups=coverState.bootstrap.groups||[];
    coverState.coverGroup=groups.find(function(g){return String(g.groupId)===String(groupId);})||null;
    if(!coverState.coverGroup)return;
    coverState.artist='';
    coverState.songs=[];
    coverState.externalDraft=null;
    coverState.externalParts=[];
    if(String(coverState.coverGroup.groupId)==='8'||String(coverState.coverGroup.groupName)==='BMSG ALLSTARS'){
      coverState.allStarMemberIds=[];
      openCoverAllStarsMemberSelect();
      return;
    }
    coverState.allStarMemberIds=[];
    openCoverArtistSelect();
  }
  function selectCoverArtist(artist){coverState.artist=artist;coverState.screen='songs';renderCoverLoading();google.script.run.withSuccessHandler(function(songs){coverState.songs=songs||[];renderCoverSongs();}).withFailureHandler(showCoverError).getCoverSourceSongs(artist);}

  function startCoverEditor(songId){
    if(!coverState.coverGroup)return;
    renderCoverLoading();
    google.script.run.withSuccessHandler(function(data){
      coverState.editor=data;
      coverState.viewMode='cover';
      coverState.dirty=false;
      renderCoverEditor();
    }).withFailureHandler(showCoverError).getCoverEditorData({
      userId:getUniverseUserId(),
      coverGroupId:coverState.coverGroup.groupId,
      songId:songId,
      allStarMemberIds:coverState.allStarMemberIds
    });
  }
  function openSavedCover(projectId,returnScreen){coverState.returnScreen=returnScreen||coverState.returnScreen||'projects';renderCoverLoading();google.script.run.withSuccessHandler(function(data){coverState.editor=data;coverState.coverGroup=data.coverGroup;coverState.viewMode='cover';coverState.dirty=false;coverState.screen='view';renderCoverEditor();}).withFailureHandler(showCoverError).getCoverProject({userId:getUniverseUserId(),projectId:projectId});}
  function editSavedCover(){if(!coverState.editor||!coverState.editor.isCreator)return;coverState.screen='editor';coverState.dirty=false;renderCoverEditor();}

  function coverSavingIndicatorMarkup(label){return typeof renderUniverseLoading==='function'?renderUniverseLoading(label||'保存しています…','#9cecff'):'<div class="universe-loading" role="status" aria-live="polite"><span>'+escapeHtml(label||'保存しています…')+'</span></div>';}
  function coverOverlayMarkup(){return '<div id="coverSheet" class="cover-sheet" hidden onclick="closeCoverSheetOnBackdrop(event)"><div id="coverSheetPanel" class="cover-sheet-panel"></div></div><div id="coverDialog" class="cover-dialog" hidden onclick="closeCoverDialogOnBackdrop(event)"><div class="cover-dialog-panel"><p id="coverDialogMessage" class="cover-dialog-message"></p><div class="cover-dialog-actions"><button id="coverDialogCancel" type="button" class="u-btn" onclick="closeCoverDialog()">キャンセル</button><button id="coverDialogConfirm" type="button" class="u-btn" onclick="confirmCoverDialog()">OK</button></div></div></div><div id="coverSaving" class="cover-dialog cover-saving" hidden aria-busy="true"><div class="cover-dialog-panel cover-saving-panel"><div id="coverSavingIndicator">'+coverSavingIndicatorMarkup('保存しています…')+'</div><span id="coverSavingDetail">歌割りを安全に記録しています。</span></div></div>';}
  function setCoverSavingState(isSaving,title,detail){
    const overlay=document.getElementById('coverSaving'),button=document.querySelector('.cover-save-button');
    if(button){button.disabled=!!isSaving;button.textContent=isSaving?'保存中…':'保存';}
    if(!overlay)return;
    const indicator=document.getElementById('coverSavingIndicator'),detailNode=document.getElementById('coverSavingDetail');
    if(indicator)indicator.innerHTML=coverSavingIndicatorMarkup(title||'保存しています…');
    if(detailNode)detailNode.textContent=detail||'歌割りを安全に記録しています。';
    overlay.hidden=!isSaving;
  }
  function setCoverViewMode(mode){coverState.viewMode=mode==='original'?'original':'cover';renderCoverEditor();}
  function coverAssignmentMap(){const map={};(coverState.editor&&coverState.editor.assignments||[]).forEach(function(a){map[String(a.order)]=String(a.memberId||'');});return map;}
  function coverMemberMap(){const map={};(coverState.editor&&coverState.editor.members||[]).forEach(function(m){map[String(m.memberId)]=m;});return map;}
  function coverOriginalSingerNameMap(){const map={};(coverState.editor&&coverState.editor.parts||[]).forEach(function(part){const ids=String(part.originalSinger||'').split(',');const labels=String(part.originalSingerLabel||'').split(' / ');ids.forEach(function(token,index){const id=String(token||'').trim().replace(/_(up|down|sub)$/i,'');const label=String(labels[index]||'').trim().replace(/\s(?:↑|↓|SUB)$/i,'');if(id&&label&&!map[id])map[id]=label;});});return map;}

  function openCoverMemberSheet(order){if(coverState.screen!=='editor')return;coverState.memberSheetOrder=Number(order);const panel=document.getElementById('coverSheetPanel'),sheet=document.getElementById('coverSheet');if(!panel||!sheet)return;panel.innerHTML='<h3 class="cover-sheet-title">担当MEMBER</h3><div class="cover-member-list">'+(coverState.editor.members||[]).map(function(m){return '<button type="button" class="u-btn cover-member-option" style="--member-color:'+escapeHtml(m.color)+'" onclick="setCoverMember(\''+escapeHtml(m.memberId)+'\')">'+escapeHtml(m.name)+'</button>';}).join('')+'</div>';sheet.hidden=false;document.body.style.overflow='hidden';}
  function setCoverMember(memberId){const order=coverState.memberSheetOrder;(coverState.editor.assignments||[]).forEach(function(a){if(Number(a.order)===Number(order))a.memberId=String(memberId);});coverState.dirty=true;closeCoverSheet();renderCoverEditor();}
  function closeCoverSheet(){const sheet=document.getElementById('coverSheet');if(sheet)sheet.hidden=true;coverState.memberSheetOrder=null;document.body.style.overflow='';}
  function closeCoverSheetOnBackdrop(event){if(event.target&&event.target.id==='coverSheet')closeCoverSheet();}

  function openCoverRatio(){const members=coverState.editor.members||[],map=coverAssignmentMap(),counts={};Object.keys(map).forEach(function(k){counts[map[k]]=(counts[map[k]]||0)+1;});const total=Math.max(1,Object.keys(map).length);const panel=document.getElementById('coverSheetPanel'),sheet=document.getElementById('coverSheet');panel.innerHTML='<h3 class="cover-sheet-title">割合確認</h3><div class="cover-ratio-list">'+members.filter(function(m){return counts[m.memberId];}).map(function(m){const count=counts[m.memberId]||0,p=Math.round(count/total*1000)/10;return '<div class="cover-ratio-row"><span>'+escapeHtml(m.name)+'</span><div class="cover-ratio-track"><div class="cover-ratio-fill" style="--member-color:'+escapeHtml(m.color)+';width:'+p+'%"></div></div><strong>'+count+' / '+p+'%</strong></div>';}).join('')+'</div>';sheet.hidden=false;document.body.style.overflow='hidden';}
  function openCoverBulkChange(){const members=coverState.editor.members||[],map=coverAssignmentMap();const used=[...new Set(Object.keys(map).map(function(k){return map[k];}))];const labelMap=coverMemberMap(),originalMap=coverOriginalSingerNameMap();const sourceOpts=used.map(function(id){const label=labelMap[id]?labelMap[id].name:(originalMap[id]||id);return '<option value="'+escapeHtml(id)+'">'+escapeHtml(label)+'</option>';}).join('');const targetOpts=members.map(function(m){return '<option value="'+escapeHtml(m.memberId)+'">'+escapeHtml(m.name)+'</option>';}).join('');const panel=document.getElementById('coverSheetPanel'),sheet=document.getElementById('coverSheet');panel.innerHTML='<h3 class="cover-sheet-title">パート変更</h3><div class="cover-bulk-grid"><select id="coverBulkFrom" class="cover-bulk-select">'+sourceOpts+'</select><select id="coverBulkTo" class="cover-bulk-select">'+targetOpts+'</select></div><button type="button" class="u-btn cover-bulk-apply" onclick="applyCoverBulkChange()">変更する</button>';sheet.hidden=false;document.body.style.overflow='hidden';}
  function applyCoverBulkChange(){const from=document.getElementById('coverBulkFrom').value,to=document.getElementById('coverBulkTo').value;if(!from||!to||from===to){closeCoverSheet();return;}(coverState.editor.assignments||[]).forEach(function(a){if(String(a.memberId)===from)a.memberId=to;});coverState.dirty=true;closeCoverSheet();renderCoverEditor();}

  function saveCurrentCover(confirmIncomplete){
    if(coverState.busy||!coverState.editor||!coverState.editor.isCreator)return;
    coverState.busy=true;
    setCoverSavingState(true,'保存しています…','歌割りを安全に記録しています。');
    const data=coverState.editor;
    const payload={
      userId:getUniverseUserId(),
      projectId:data.projectId||'',
      songId:data.sourceSong&&data.sourceSong.songId||'',
      coverGroupId:data.coverGroup.groupId,
      allStarMemberIds:data.selectedMemberIds||coverState.allStarMemberIds||[],
      sourceSnapshot:data.sourceSnapshot||null,
      assignments:data.assignments,
      confirmIncomplete:!!confirmIncomplete
    };
    google.script.run.withSuccessHandler(function(result){
      if(result&&result.requiresConfirm){
        coverState.busy=false;
        setCoverSavingState(false);
        openCoverDialog(result.message||'原曲担当のまま残っているパートがあります。','編集に戻る','このまま保存',function(){saveCurrentCover(true);});
        return;
      }
      if(result&&result.ok){
        coverState.dirty=false;
        setCoverSavingState(true,'保存しました','画面を更新しています…');
        refreshCoverHomeAfterSave();
        return;
      }
      showCoverError(new Error('保存結果を確認できませんでした。'));
    }).withFailureHandler(showCoverError).saveCoverProject(payload);
  }
  function refreshCoverHomeAfterSave(){
    google.script.run.withSuccessHandler(function(data){
      coverState.busy=false;
      coverState.bootstrap=data||coverState.bootstrap;
      coverState.editor=null;
      coverState.coverGroup=null;
      coverState.artist='';
      coverState.songs=[];
      coverState.viewMode='cover';
      coverState.dirty=false;
      coverState.allStarMemberIds=[];
      coverState.externalDraft=null;
      coverState.externalParts=[];
      renderCoverHome();
      if(typeof showToast==='function')showToast('保存しました');
    }).withFailureHandler(showCoverError).getCoverMakerBootstrap(getUniverseUserId());
  }

  function setCurrentCoverSharing(isShared){if(coverState.busy||!coverState.editor||!coverState.editor.isCreator||!coverState.editor.isSaved)return;coverState.busy=true;google.script.run.withSuccessHandler(function(result){coverState.busy=false;if(!result||!result.ok)return;coverState.editor.isShared=!!result.isShared;coverState.editor.sharedAt=result.sharedAt||'';if(typeof showToast==='function')showToast(result.isShared?'共有しました':'共有を解除しました');renderCoverEditor();}).withFailureHandler(showCoverError).setCoverProjectShared({userId:getUniverseUserId(),projectId:coverState.editor.projectId,isShared:!!isShared});}
  function requestDeleteCover(){if(!coverState.editor||!coverState.editor.isCreator)return;openCoverDialog('このカバーを削除しますか？','キャンセル','削除',function(){deleteCurrentCover();});}
  function deleteCurrentCover(){const id=coverState.editor.projectId,returnScreen=coverState.returnScreen;renderCoverLoading();google.script.run.withSuccessHandler(function(){if(typeof showToast==='function')showToast('削除しました');google.script.run.withSuccessHandler(function(data){coverState.bootstrap=data||{};coverState.editor=null;coverState.dirty=false;if(returnScreen==='library')openCoverLibrary();else openCoverProjects();}).withFailureHandler(showCoverError).getCoverMakerBootstrap(getUniverseUserId());}).withFailureHandler(showCoverError).deleteCoverProject({userId:getUniverseUserId(),projectId:id});}

  function openCoverDialog(message,cancelLabel,confirmLabel,onConfirm){const dialog=document.getElementById('coverDialog');if(!dialog){if(onConfirm)onConfirm();return;}document.getElementById('coverDialogMessage').textContent=message;document.getElementById('coverDialogCancel').textContent=cancelLabel||'キャンセル';document.getElementById('coverDialogConfirm').textContent=confirmLabel||'OK';coverState.dialogAction=onConfirm||null;dialog.hidden=false;document.body.style.overflow='hidden';}
  function closeCoverDialog(){const d=document.getElementById('coverDialog');if(d)d.hidden=true;coverState.dialogAction=null;document.body.style.overflow='';}
  function confirmCoverDialog(){const action=coverState.dialogAction;closeCoverDialog();if(action)action();}
  function closeCoverDialogOnBackdrop(event){if(event.target&&event.target.id==='coverDialog')closeCoverDialog();}

  function coverNavigateBack(){if(coverState.screen==='home'){navigateTo('lab');return;}if(coverState.screen==='editor'&&coverState.dirty){openCoverDialog('保存していない変更があります。画面を離れますか？','キャンセル','離れる',function(){coverState.dirty=false;coverReturnFromEditor();});return;}coverReturnFromScreen();}
  function coverReturnFromEditor(){
    if(coverState.editor&&coverState.editor.isSaved){
      coverState.screen='view';
      renderCoverEditor();
      return;
    }
    if(coverState.editor&&coverState.editor.sourceSong&&coverState.editor.sourceSong.isExternal){
      renderCoverExternalPreview();
      return;
    }
    renderCoverSongs();
  }
  function coverReturnFromScreen(){
    if(coverState.screen==='group')return renderCoverHome();
    if(coverState.screen==='allstars')return openCoverGroupSelect();
    if(coverState.screen==='artist'){
      if(coverState.coverGroup&&(String(coverState.coverGroup.groupId)==='8'||String(coverState.coverGroup.groupName)==='BMSG ALLSTARS'))return openCoverAllStarsMemberSelect();
      return openCoverGroupSelect();
    }
    if(coverState.screen==='songs')return openCoverArtistSelect();
    if(coverState.screen==='external')return openCoverArtistSelect();
    if(coverState.screen==='externalPreview')return openCoverExternalSongForm(false);
    if(coverState.screen==='projects'||coverState.screen==='library')return renderCoverHome();
    if(coverState.screen==='view')return coverState.returnScreen==='library'?openCoverLibrary():openCoverProjects();
    if(coverState.screen==='editor')return coverReturnFromEditor();
    renderCoverHome();
  }
  function coverConfirmExternalNavigation(route){if(currentRoute!=='cover'||!coverState.dirty)return false;openCoverDialog('保存していない変更があります。画面を離れますか？','キャンセル','離れる',function(){coverState.dirty=false;navigateTo(route);});return true;}
  window.addEventListener('beforeunload',function(event){if(currentRoute==='cover'&&coverState.dirty){event.preventDefault();event.returnValue='';}});

  /* Canonical COVER runtime authority. */
  function coverCanonicalPage(){return document.querySelector('#pageContent > .cover-page')||document.querySelector('.cover-page');}
  function decorateCanonicalCoverChoiceCards(){const page=coverCanonicalPage();if(!page)return;const groups=(coverState&&coverState.bootstrap&&coverState.bootstrap.groups)||[];const colors={};groups.forEach(function(group){colors[String(group.groupName||'')]=group.color||'#9cecff';});page.querySelectorAll('.cover-content-card').forEach(function(card){const label=card.querySelector('strong');const name=label?String(label.textContent||'').trim():'';if(colors[name])card.style.setProperty('--cover-accent',colors[name]);});}
  function setCanonicalCoverVisualMode(mode){
    const page=coverCanonicalPage();if(!page)return;
    ['home','group','allstars','artist','songs','external','externalPreview','projects','library','editor'].forEach(function(name){page.classList.toggle('is-cover-'+name,mode===name);});
    page.classList.toggle('is-cover-choice',mode==='group'||mode==='artist'||mode==='allstars');
    if(mode==='group'||mode==='artist'||mode==='allstars')decorateCanonicalCoverChoiceCards();
  }
  function currentCanonicalCoverUserId(){return typeof getUniverseUserId==='function'?String(getUniverseUserId()||''):'';}
  function ownCanonicalCoverProjects(projects){const uid=currentCanonicalCoverUserId();return (projects||[]).filter(function(project){return String(project&&project.creatorUserId||'')===uid;});}

  function renderCoverHome(){
    coverState.screen='home';coverState.dirty=false;const app=document.getElementById('coverApp');if(!app)return;
    app.innerHTML='<div class="cover-home-actions"><button class="u-btn" type="button" onclick="openCoverGroupSelect()">新しく作る</button><button class="u-btn" type="button" onclick="openCoverProjects()">作ったカバーを見る</button><button class="u-btn" type="button" onclick="openCoverLibrary()">ライブラリ</button></div>';
    setCanonicalCoverVisualMode('home');
  }

  function openCoverGroupSelect(){
    coverState.screen='group';const groups=coverState.bootstrap&&coverState.bootstrap.groups||[];const app=document.getElementById('coverApp');
    app.innerHTML='<h2 class="cover-section-title">歌うアーティスト</h2><div class="cover-stack cover-choice-stack">'+groups.map(function(g){return '<button type="button" class="u-btn cover-content-card" style="--cover-accent:'+escapeHtml(g.color)+'" onclick="selectCoverGroup(\''+escapeHtml(g.groupId)+'\')"><strong>'+escapeHtml(g.groupName)+'</strong></button>';}).join('')+'</div>';
    setCanonicalCoverVisualMode('group');
  }

  function openCoverArtistSelect(){
    coverState.screen='artist';
    const app=document.getElementById('coverApp');
    const artists=coverState.bootstrap.sourceArtists||[];
    const artistCards=artists.map(function(a){
      return '<button type="button" class="u-btn cover-content-card" style="--cover-accent:#9cecff" onclick="selectCoverArtist(\''+escapeHtml(a).replaceAll("'","&#039;")+'\')"><strong>'+escapeHtml(a)+'</strong></button>';
    }).join('');
    const registerCard='<button type="button" class="u-btn cover-content-card cover-register-song-card" style="--cover-accent:#9cecff" onclick="openCoverExternalSongForm(true)"><strong>曲を登録する</strong></button>';
    app.innerHTML='<h2 class="cover-section-title">カバーする原曲</h2><div class="cover-stack cover-choice-stack">'+artistCards+registerCard+'</div>';
    setCanonicalCoverVisualMode('artist');
  }


  function openCoverAllStarsMemberSelect(){
    coverState.screen='allstars';
    const app=document.getElementById('coverApp');
    if(!app)return;
    const members=coverState.bootstrap&&coverState.bootstrap.allStarMembers||[];
    const selected={};
    (coverState.allStarMemberIds||[]).forEach(function(id){selected[String(id)]=true;});
    const cards=members.map(function(member){
      const id=String(member.memberId||'');
      const active=!!selected[id];
      return '<button type="button" class="u-btn cover-content-card cover-allstar-member-card '+(active?'is-selected':'')+'" style="--cover-accent:'+escapeHtml(member.color||'#9cecff')+'" aria-pressed="'+(active?'true':'false')+'" onclick="toggleCoverAllStarMember(\''+escapeHtml(id)+'\')"><strong>'+escapeHtml(member.name)+'</strong><span class="cover-member-select-state">'+(active?'選択中':'')+'</span></button>';
    }).join('');
    app.innerHTML='<h2 class="cover-section-title">参加メンバーを選択</h2><div class="cover-stack cover-choice-stack cover-allstar-grid">'+cards+'</div><div class="cover-choice-next"><button type="button" class="u-btn" onclick="continueCoverAllStarsMembers()" '+((coverState.allStarMemberIds||[]).length?'':'disabled')+'>原曲を選ぶ</button></div>';
    setCanonicalCoverVisualMode('allstars');
  }

  function toggleCoverAllStarMember(memberId){
    const id=String(memberId||'');
    const current=(coverState.allStarMemberIds||[]).slice();
    const index=current.indexOf(id);
    if(index>=0)current.splice(index,1);else current.push(id);
    coverState.allStarMemberIds=current;
    openCoverAllStarsMemberSelect();
  }

  function continueCoverAllStarsMembers(){
    if(!(coverState.allStarMemberIds||[]).length){
      if(typeof showToast==='function')showToast('参加メンバーを1人以上選択してください。');
      return;
    }
    openCoverArtistSelect();
  }

  function openCoverExternalSongForm(resetDraft){
    coverState.screen='external';
    const app=document.getElementById('coverApp');
    if(!app)return;
    if(resetDraft||!coverState.externalDraft){
      coverState.externalDraft={title:'',artist:'',rawText:''};
      coverState.externalParts=[];
    }else if((coverState.externalParts||[]).length){
      coverState.externalDraft.rawText=coverState.externalParts.map(function(part){
        return String(part.singerLabel||'').trim()+'\n'+String(part.lyrics||'').trim();
      }).join('\n\n');
    }
    const draft=coverState.externalDraft;
    app.innerHTML='<h2 class="cover-section-title">曲を登録する</h2><div class="cover-external-form">'
      +'<label class="cover-field"><span>曲名</span><input id="coverExternalTitle" type="text" value="'+escapeHtml(draft.title||'')+'" oninput="updateCoverExternalDraft(\'title\',this.value)"></label>'
      +'<label class="cover-field"><span>原アーティスト</span><input id="coverExternalArtist" type="text" value="'+escapeHtml(draft.artist||'')+'" oninput="updateCoverExternalDraft(\'artist\',this.value)"></label>'
      +'<label class="cover-field"><span>歌割り</span><textarea id="coverExternalLyrics" rows="14" placeholder="ソウマ&#10;こんにちは&#10;&#10;レン&#10;こんばんは" oninput="updateCoverExternalDraft(\'rawText\',this.value)">'+escapeHtml(draft.rawText||'')+'</textarea></label>'
      +'<button type="button" class="u-btn cover-external-primary" onclick="analyzeCoverExternalLyrics()">歌割りを確認する</button>'
      +'</div>';
    setCanonicalCoverVisualMode('external');
  }

  function updateCoverExternalDraft(field,value){
    if(!coverState.externalDraft)coverState.externalDraft={title:'',artist:'',rawText:''};
    if(field==='title'||field==='artist'||field==='rawText')coverState.externalDraft[field]=String(value||'');
  }

  function parseCoverExternalLyricsText(rawText){
    const text=String(rawText||'').replace(/\r\n?/g,'\n').trim();
    if(!text)return {parts:[],error:'歌割りを入力してください。'};
    const blocks=text.split(/\n\s*\n+/).map(function(block){return block.trim();}).filter(Boolean);
    const parts=[];
    for(let i=0;i<blocks.length;i++){
      const lines=blocks[i].split('\n');
      const singer=String(lines.shift()||'').trim();
      const lyrics=lines.join('\n').trim();
      if(!singer||!lyrics)return {parts:[],error:(i+1)+'番目の歌割りを判定できません。歌唱者の次の行に歌詞を入力してください。'};
      parts.push({order:i+1,singerLabel:singer,lyrics:lyrics});
    }
    return {parts:parts,error:''};
  }

  function analyzeCoverExternalLyrics(){
    const draft=coverState.externalDraft||{title:'',artist:'',rawText:''};
    draft.title=String((document.getElementById('coverExternalTitle')||{}).value!==undefined?document.getElementById('coverExternalTitle').value:draft.title||'').trim();
    draft.artist=String((document.getElementById('coverExternalArtist')||{}).value!==undefined?document.getElementById('coverExternalArtist').value:draft.artist||'').trim();
    draft.rawText=String((document.getElementById('coverExternalLyrics')||{}).value!==undefined?document.getElementById('coverExternalLyrics').value:draft.rawText||'');
    coverState.externalDraft=draft;
    if(!draft.title){if(typeof showToast==='function')showToast('曲名を入力してください。');return;}
    if(!draft.artist){if(typeof showToast==='function')showToast('原アーティスト名を入力してください。');return;}
    const parsed=parseCoverExternalLyricsText(draft.rawText);
    if(parsed.error){if(typeof showToast==='function')showToast(parsed.error);return;}
    coverState.externalParts=parsed.parts;
    renderCoverExternalPreview();
  }

  function renderCoverExternalPreview(){
    coverState.screen='externalPreview';
    const app=document.getElementById('coverApp');
    if(!app)return;
    const draft=coverState.externalDraft||{};
    const parts=coverState.externalParts||[];
    app.innerHTML='<h2 class="cover-section-title">歌割りプレビュー</h2><div class="cover-external-summary"><strong>'+escapeHtml(draft.title||'')+'</strong><span>'+escapeHtml(draft.artist||'')+'</span></div>'
      +'<div class="cover-external-preview">'+parts.map(function(part,index){
        return '<div class="cover-external-part"><label class="cover-field"><span>歌唱者</span><input type="text" value="'+escapeHtml(part.singerLabel||'')+'" oninput="updateCoverExternalPart('+index+',\'singerLabel\',this.value)"></label><label class="cover-field"><span>歌詞</span><textarea rows="4" oninput="updateCoverExternalPart('+index+',\'lyrics\',this.value)">'+escapeHtml(part.lyrics||'')+'</textarea></label></div>';
      }).join('')+'</div>'
      +'<div class="cover-external-actions"><button type="button" class="u-btn" onclick="openCoverExternalSongForm(false)">入力に戻る</button><button type="button" class="u-btn" onclick="startCoverExternalEditor()">カバーを作る</button></div>';
    setCanonicalCoverVisualMode('externalPreview');
  }

  function updateCoverExternalPart(index,field,value){
    const part=(coverState.externalParts||[])[Number(index)];
    if(!part)return;
    if(field==='singerLabel'||field==='lyrics')part[field]=String(value||'');
  }

  function startCoverExternalEditor(){
    if(!coverState.coverGroup)return;
    const draft=coverState.externalDraft||{};
    const parts=(coverState.externalParts||[]).map(function(part,index){
      return {order:index+1,singerLabel:String(part.singerLabel||'').trim(),lyrics:String(part.lyrics||'').trim()};
    });
    if(!String(draft.title||'').trim()||!String(draft.artist||'').trim()||!parts.length||parts.some(function(part){return !part.singerLabel||!part.lyrics;})){
      if(typeof showToast==='function')showToast('歌割りプレビューの空欄を修正してください。');
      return;
    }
    renderCoverLoading();
    google.script.run.withSuccessHandler(function(data){
      coverState.editor=data;
      coverState.viewMode='cover';
      coverState.dirty=false;
      renderCoverEditor();
    }).withFailureHandler(showCoverError).getCoverExternalEditorData({
      userId:getUniverseUserId(),
      coverGroupId:coverState.coverGroup.groupId,
      allStarMemberIds:coverState.allStarMemberIds,
      sourceSnapshot:{isExternal:true,title:String(draft.title||'').trim(),artist:String(draft.artist||'').trim(),parts:parts}
    });
  }

  function renderCoverSongs(query){
    coverState.screen='songs';const app=document.getElementById('coverApp');if(!app)return;const q=String(query||'').trim().toLocaleLowerCase();const songs=(coverState.songs||[]).filter(function(s){return !q||String(s.title||'').toLocaleLowerCase().startsWith(q);});
    app.innerHTML='<h2 class="cover-section-title">'+escapeHtml(coverState.artist)+'</h2><div class="cover-search-wrap"><input class="cover-search" type="search" placeholder="曲名から検索" oninput="renderCoverSongs(this.value)" value="'+escapeHtml(query||'')+'"></div><div class="cover-stack">'+(songs.length?songs.map(function(s){return '<button type="button" class="u-btn cover-song-row" onclick="startCoverEditor(\''+escapeHtml(s.songId)+'\')"><strong>'+escapeHtml(s.title)+'</strong></button>';}).join(''):'<div class="cover-empty">曲が見つかりません。</div>')+'</div>';
    setCanonicalCoverVisualMode('songs');
  }

  function openCoverProjects(){
    coverState.screen='projects';coverState.returnScreen='projects';const app=document.getElementById('coverApp');if(!app)return;const projects=ownCanonicalCoverProjects(coverState.bootstrap&&coverState.bootstrap.projects||[]);
    app.innerHTML='<h2 class="cover-section-title">作ったカバー</h2>'+renderCoverProjectRows(projects,false,false);setCanonicalCoverVisualMode('projects');
  }

  function openCoverLibrary(){
    coverState.screen='library';coverState.returnScreen='library';const app=document.getElementById('coverApp');if(!app)return;app.innerHTML=typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING...','#9cecff'):'<div class="cover-empty">LOADING...</div>';setCanonicalCoverVisualMode('library');
    google.script.run.withSuccessHandler(function(projects){coverState.libraryProjects=projects||[];if(coverState.screen!=='library')return;app.innerHTML='<h2 class="cover-section-title">ライブラリ</h2>'+renderCoverProjectRows(coverState.libraryProjects,false,true);}).withFailureHandler(showCoverError).getCoverLibrary(getUniverseUserId());
  }

  function renderCoverProjectRows(projects,compact,libraryMode){
    if(!projects||!projects.length)return '<div class="cover-empty">'+(libraryMode?'共有されたカバーはまだありません。':'まだカバーがありません。')+'</div>';
    const returnScreen=libraryMode?'library':'projects';
    return '<div class="cover-stack">'+projects.map(function(p){const creator=libraryMode&&p.creatorDisplayName?'<span class="cover-row-meta">'+escapeHtml(p.creatorDisplayName)+' のカバー</span>':'';const badges=(p.isComplete?'':'<span class="cover-badge is-draft">編集中</span>')+(p.isShared?'<span class="cover-badge">共有中</span>':'');return '<button type="button" class="u-btn cover-project-row" onclick="openSavedCover(\''+escapeHtml(p.projectId)+'\',\''+returnScreen+'\')"><span><strong>'+escapeHtml(p.title||p.sourceTitle)+'</strong><span class="cover-row-meta">'+escapeHtml(p.sourceArtist)+' → '+escapeHtml(p.coverGroupName)+'</span>'+creator+'<span class="cover-project-badges">'+badges+'</span></span></button>';}).join('')+'</div>';
  }
  function renderCoverEditor(){
    const data=coverState.editor;if(!data)return;coverState.screen=data.isSaved&&!data.isCreator?'view':(coverState.screen==='view'?'view':'editor');const editing=coverState.screen==='editor'&&data.isCreator;const app=document.getElementById('coverApp');const assignmentMap=coverAssignmentMap();const memberMap=coverMemberMap();const isSavedView=coverState.screen==='view';
    let html='<div class="cover-editor-head"><button type="button" class="u-btn cover-inline-back" aria-label="戻る" onclick="coverNavigateBack()">‹</button><h2 class="cover-song-heading">'+escapeHtml(data.title||data.sourceSong.title)+'</h2><div class="cover-song-context">'+escapeHtml(data.sourceSong.artist)+' → '+escapeHtml(data.coverGroup.groupName)+(data.creatorDisplayName?' / '+escapeHtml(data.creatorDisplayName):'')+'</div><div class="cover-tabs"><button type="button" class="u-btn cover-tab '+(coverState.viewMode==='original'?'is-active':'')+'" onclick="setCoverViewMode(\'original\')">ORIGINAL</button><button type="button" class="u-btn cover-tab '+(coverState.viewMode==='cover'?'is-active':'')+'" onclick="setCoverViewMode(\'cover\')">COVER</button></div>';
    if(editing)html+='<div class="cover-tools"><button type="button" class="u-btn" onclick="openCoverBulkChange()">パート変更</button><button type="button" class="u-btn" onclick="openCoverRatio()">割合確認</button></div>';html+='</div>';
    if(data.isSaved&&coverState.screen==='view'&&data.isCreator){html+='<div class="cover-view-actions" style="display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><button type="button" class="u-btn" style="width:100%!important;min-width:0!important" onclick="editSavedCover()">編集</button><button type="button" class="u-btn" style="width:100%!important;min-width:0!important" onclick="requestDeleteCover()">削除</button><button type="button" class="u-btn" style="width:100%!important;min-width:0!important" onclick="setCurrentCoverSharing('+(!data.isShared)+')">'+(data.isShared?'共有解除':'共有')+'</button></div>';}
    html+='<div class="cover-lyrics">'+data.parts.map(function(part){if(coverState.viewMode==='original')return '<div class="cover-lyric-row"><div class="cover-original-label">'+escapeHtml(part.originalSingerLabel)+'</div><div class="cover-lyric-text">'+escapeHtml(part.lyrics)+'</div></div>';const memberId=assignmentMap[String(part.order)]||'';const member=memberMap[memberId];const label=member?member.name:(memberId===part.originalMemberId?part.originalSingerLabel:(memberId||'未設定'));const color=member?member.color:'#777777';return '<div class="cover-lyric-row"><button type="button" class="cover-assignee" style="--cover-member-color:'+escapeHtml(color)+'" '+(editing?'onclick="openCoverMemberSheet('+Number(part.order)+')"':'disabled')+'><span class="cover-assignee-dot"></span>'+escapeHtml(label)+'</button><div class="cover-lyric-text">'+escapeHtml(part.lyrics)+'</div></div>';}).join('')+'</div>';
    if(editing)html+='<div class="cover-save-bar"><div class="cover-save-inner"><button type="button" class="u-btn cover-save-button" onclick="saveCurrentCover(false)" '+(coverState.busy?'disabled':'')+'>'+(coverState.busy?'保存中…':'保存')+'</button></div></div>';html+=coverOverlayMarkup();app.innerHTML=html;
    setCanonicalCoverVisualMode('editor');const page=coverCanonicalPage();if(page){page.classList.toggle('is-cover-saved-view',isSavedView);page.classList.toggle('is-cover-live-editor',!isSavedView);}
  }
</script>

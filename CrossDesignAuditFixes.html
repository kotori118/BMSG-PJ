<style>
  /* =========================================================
     Universe Cross-Screen Design Audit Authority
     2026-09-09
     - service header: 46px ‹ + title
     - actions/explanations/status: Japanese by default
     - service/proper names may remain English
     ========================================================= */
  :is(.profile-service-back,.lyrics-service-back,.karaoke-service-back,.analysis-service-back,.card-service-back,.poker-home-btn,.audit-local-back){
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;
    flex:0 0 46px!important;
    padding:0!important;
    border-radius:14px!important;
    display:grid!important;
    place-items:center!important;
    font-size:32px!important;
    line-height:1!important;
  }

  :is(.profile-header,.lyrics-page-head,.karaoke-head,.analysis-header,.poker-header){
    display:flex!important;
    align-items:center!important;
    gap:14px!important;
  }

  :is(.profile-heading,.lyrics-page-head h1,.karaoke-head h1,.analysis-header>div,.poker-header>div){
    min-width:0;
  }

  .card-header{
    display:grid!important;
    grid-template-columns:46px minmax(0,1fr) 46px!important;
    align-items:center!important;
    gap:14px!important;
  }
  .card-header>div{min-width:0}

  .song-gacha-reveal-back,
  .lyrics-list-back.audit-local-back{
    width:46px!important;
    min-width:46px!important;
    height:46px!important;
    min-height:46px!important;
    padding:0!important;
    border-radius:14px!important;
    font-size:32px!important;
    letter-spacing:0!important;
    display:grid!important;
    place-items:center!important;
  }

  .song-gacha-stage-label{display:none!important}
</style>
<script>
(function(){
  'use strict';

  const BUTTON_TEXT = new Map([
    ['DRAW','引く'],
    ['DRAW AGAIN','もう一度引く'],
    ['RETRY','再試行'],
    ['CLOSE','閉じる'],
    ['START','開始'],
    ['FINALIZE','確定'],
    ['SAVE','保存'],
    ['RESET','リセット'],
    ['RESET COLLECTION','コレクションをリセット'],
    ['CHANGE','変更'],
    ['RANDOM','ランダム振り分け']
  ]);

  function setText(el,text){
    if(el && el.textContent !== text) el.textContent=text;
  }

  function normalizeButton(button){
    if(!button || button.nodeType!==1) return;
    const raw=(button.textContent||'').trim();
    if(!raw) return;

    if(raw==='BACK'){
      if(button.closest('.card-result-actions')){
        button.remove();
        return;
      }
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
      return;
    }

    const replacement=BUTTON_TEXT.get(raw);
    if(replacement) setText(button,replacement);
  }

  function normalizeLanguage(root){
    const scope=root&&root.querySelectorAll?root:document;

    scope.querySelectorAll('button').forEach(normalizeButton);

    scope.querySelectorAll('.song-gacha-group span').forEach(function(el){
      const text=(el.textContent||'').trim();
      if(text==='IN') setText(el,'ON');
      if(text==='OUT') setText(el,'OFF');
    });

    scope.querySelectorAll('.song-gacha-count').forEach(function(el){
      const match=(el.textContent||'').trim().match(/^(\d+)\s+SONGS IN GACHA$/i);
      if(match) setText(el,'対象曲 '+match[1]+'曲');
    });

    scope.querySelectorAll('.lyrics-gacha-card span').forEach(function(el){
      if((el.textContent||'').trim()==='DRAW A SONG') setText(el,'曲を引く');
    });

    scope.querySelectorAll('.lyrics-label').forEach(function(el){
      if((el.textContent||'').trim()==='EDIT PART') setText(el,'パート編集');
    });

    scope.querySelectorAll('.karaoke-loading').forEach(function(el){
      if((el.textContent||'').trim()==='読み込み中') setText(el,'LOADING...');
    });

    scope.querySelectorAll('.analysis-card h2').forEach(function(el){
      if((el.textContent||'').trim()==='LOADING ERROR') setText(el,'読み込みに失敗しました');
    });

    const searchInput=document.getElementById('globalSearchInput');
    if(searchInput && searchInput.placeholder!=='BMSG Universeを検索') searchInput.placeholder='BMSG Universeを検索';

    const searchStatus=document.getElementById('searchStatus');
    if(searchStatus){
      const text=(searchStatus.textContent||'').trim();
      if(text==='PAGES') setText(searchStatus,'ページ');
      const match=text.match(/^(\d+)\s+RESULTS?$/i);
      if(match) setText(searchStatus,'検索結果 '+match[1]+'件');
    }

    scope.querySelectorAll('.search-no-results-title').forEach(function(el){
      if((el.textContent||'').trim()==='NO RESULTS') setText(el,'該当なし');
    });
  }

  function normalizeNavigation(root){
    const scope=root&&root.querySelectorAll?root:document;

    scope.querySelectorAll('.lyrics-list-back').forEach(function(button){
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
    });

    scope.querySelectorAll('.song-gacha-reveal-back').forEach(function(button){
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
    });
  }

  function normalize(root){
    normalizeLanguage(root);
    normalizeNavigation(root);
  }

  let scheduled=false;
  function schedule(root){
    if(scheduled) return;
    scheduled=true;
    requestAnimationFrame(function(){
      scheduled=false;
      normalize(root||document);
    });
  }

  function start(){
    normalize(document);
    const observer=new MutationObserver(function(mutations){
      for(const mutation of mutations){
        if(mutation.type==='characterData'){
          schedule(document);
          return;
        }
        if(mutation.addedNodes&&mutation.addedNodes.length){
          schedule(document);
          return;
        }
      }
    });
    observer.observe(document.body,{subtree:true,childList:true,characterData:true});
    window.__universeCrossDesignAuditObserver=observer;
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

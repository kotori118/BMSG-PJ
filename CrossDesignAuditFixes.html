<style>
  /* =========================================================
     Universe Cross-Screen Design Audit Authority
     2026-09-09
     - service header: 46px ‹ + title
     - actions/explanations/status: Japanese by default
     - service/proper names may remain English
     ========================================================= */
  :is(.profile-service-back,.lyrics-service-back,.karaoke-service-back,.analysis-service-back,.card-service-back,.poker-home-btn,.audit-local-back,.cover-back-btn){
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;
    flex:0 0 46px!important;
    padding:0!important;
    border-radius:14px!important;
    display:grid!important;
    place-items:center!important;
    font-size:32px!important;
    line-height:1!important;
  }

  :is(.profile-header,.lyrics-page-head,.karaoke-head,.analysis-header,.poker-header,.cover-header){
    display:flex!important;
    flex-direction:row!important;
    align-items:center!important;
    justify-content:flex-start!important;
    gap:14px!important;
  }

  :is(.profile-heading,.lyrics-page-head h1,.karaoke-head h1,.analysis-header>div,.poker-header>div,.cover-title){
    min-width:0;
  }

  /* COVER MAKER service top must expose its DATA/LAB hierarchy back control. */
  .cover-page.is-cover-home .cover-back-btn{
    display:grid!important;
  }

  /* TRADING CARD top is a two-column service header: back + title. */
  .card-header{
    display:grid!important;
    grid-template-columns:46px minmax(0,1fr)!important;
    align-items:center!important;
    gap:14px!important;
  }
  .card-header>div{min-width:0}
  .card-header .card-title{
    min-width:0!important;
    max-width:100%!important;
    font-size:clamp(27px,7.5vw,42px)!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:clip!important;
  }
  .card-collection-entry{
    margin-top:14px!important;
  }
  .card-collection-entry-btn{
    width:100%!important;
    min-height:54px!important;
    justify-content:center!important;
    text-align:center!important;
  }
  .card-page.is-gacha-mode .card-collection-entry{
    display:none!important;
  }

  .song-gacha-reveal-back,
  .lyrics-list-back.audit-local-back{
    width:46px!important;
    min-width:46px!important;
    height:46px!important;
    min-height:46px!important;
    padding:0!important;
    border-radius:14px!important;
    font-size:32px!important;
    letter-spacing:0!important;
    display:grid!important;
    place-items:center!important;
  }

  .song-gacha-stage-label{display:none!important}

  /* Persistent UI is star-free. Stars remain allowed only inside reveal/game-motion layers. */
  .card-gacha-scene .card-space-field{display:none!important}

  /* LYRICS group selection follows COVER MAKER's white two-column group-card language. */
  .lyrics-groups{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:12px!important;
  }
  .lyrics-groups .lyrics-group-card{
    position:relative!important;
    isolation:isolate;
    overflow:hidden!important;
    min-width:0!important;
    min-height:94px!important;
    padding:16px!important;
    align-items:center!important;
    justify-content:flex-start!important;
    text-align:left!important;
    border:1px solid color-mix(in srgb,var(--lyrics-group-accent,#9cecff) 38%,rgba(21,24,32,.18))!important;
    border-radius:22px!important;
    background:#fff!important;
    color:var(--ink,#151820)!important;
    box-shadow:0 6px 18px rgba(21,24,32,.045),inset 0 1px 0 rgba(255,255,255,1)!important;
    filter:none!important;
  }
  .lyrics-groups .lyrics-group-card::after{
    content:'';
    position:absolute;
    z-index:-1;
    width:76px;
    height:76px;
    right:-28px;
    bottom:-30px;
    border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--lyrics-group-accent,#9cecff) 16%,transparent),transparent 72%)!important;
    pointer-events:none;
  }
  .lyrics-groups .lyrics-group-card strong{
    position:relative;
    z-index:1;
    color:var(--ink,#151820)!important;
    font-size:16px!important;
    line-height:1.2!important;
    overflow-wrap:anywhere;
  }
  .lyrics-groups .lyrics-group-card span{
    position:relative;
    z-index:1;
  }
  .lyrics-groups .lyrics-group-card:last-child:nth-child(odd){
    grid-column:1!important;
  }
  .lyrics-groups .lyrics-group-card:not(:disabled):active{
    background:#fff!important;
    box-shadow:0 3px 10px rgba(21,24,32,.035)!important;
    filter:none!important;
  }
  @media(hover:hover){
    .lyrics-groups .lyrics-group-card:not(:disabled):hover{
      background:#fff!important;
      box-shadow:0 6px 18px rgba(21,24,32,.045)!important;
      filter:none!important;
    }
  }
</style>
<script>
(function(){
  'use strict';

  const BUTTON_TEXT = new Map([
    ['DRAW','引く'],
    ['DRAW AGAIN','もう一度引く'],
    ['RETRY','再試行'],
    ['CLOSE','閉じる'],
    ['START','開始'],
    ['FINALIZE','確定'],
    ['SAVE','保存'],
    ['RESET','リセット'],
    ['RESET COLLECTION','コレクションをリセット'],
    ['CHANGE','変更'],
    ['RANDOM','ランダム振り分け']
  ]);

  function setText(el,text){
    if(el && el.textContent !== text) el.textContent=text;
  }

  function normalizeButton(button){
    if(!button || button.nodeType!==1) return;
    const raw=(button.textContent||'').trim();
    if(!raw) return;

    if(raw==='← BACK' && button.classList.contains('profile-chemistry-back')){
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
      return;
    }

    if(raw==='BACK'){
      if(button.closest('.card-result-actions')){
        button.remove();
        return;
      }
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
      return;
    }

    const replacement=BUTTON_TEXT.get(raw);
    if(replacement) setText(button,replacement);
  }

  function normalizeLanguage(root){
    const scope=root&&root.querySelectorAll?root:document;

    scope.querySelectorAll('button').forEach(normalizeButton);

    scope.querySelectorAll('input[placeholder="SEARCH TAGS / MEMBERS"]').forEach(function(input){
      input.placeholder='タグ・メンバーを検索';
    });

    scope.querySelectorAll('.song-gacha-group span').forEach(function(el){
      const text=(el.textContent||'').trim();
      if(text==='IN') setText(el,'ON');
      if(text==='OUT') setText(el,'OFF');
    });

    scope.querySelectorAll('.song-gacha-count').forEach(function(el){
      const match=(el.textContent||'').trim().match(/^(\d+)\s+SONGS IN GACHA$/i);
      if(match) setText(el,'対象曲 '+match[1]+'曲');
    });

    scope.querySelectorAll('.song-gacha-overlay-actions button').forEach(function(button){
      if((button.textContent||'').trim()==='KARAOKE') setText(button,'歌う');
    });

    scope.querySelectorAll('.lyrics-gacha-card span').forEach(function(el){
      if((el.textContent||'').trim()==='DRAW A SONG') setText(el,'曲を引く');
    });

    scope.querySelectorAll('.lyrics-label').forEach(function(el){
      if((el.textContent||'').trim()==='EDIT PART') setText(el,'パート編集');
    });

    scope.querySelectorAll('.karaoke-loading').forEach(function(el){
      if((el.textContent||'').trim()==='読み込み中') setText(el,'LOADING...');
    });

    scope.querySelectorAll('.analysis-card h2').forEach(function(el){
      if((el.textContent||'').trim()==='LOADING ERROR') setText(el,'読み込みに失敗しました');
    });

    const searchInput=document.getElementById('globalSearchInput');
    if(searchInput && searchInput.placeholder!=='BMSG Universeを検索') searchInput.placeholder='BMSG Universeを検索';

    const searchStatus=document.getElementById('searchStatus');
    if(searchStatus){
      const text=(searchStatus.textContent||'').trim();
      if(text==='PAGES') setText(searchStatus,'ページ');
      const match=text.match(/^(\d+)\s+RESULTS?$/i);
      if(match) setText(searchStatus,'検索結果 '+match[1]+'件');
    }

    scope.querySelectorAll('.search-no-results-title').forEach(function(el){
      if((el.textContent||'').trim()==='NO RESULTS') setText(el,'該当なし');
    });
  }

  function normalizeNavigation(root){
    const scope=root&&root.querySelectorAll?root:document;

    scope.querySelectorAll('.lyrics-list-back').forEach(function(button){
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
    });

    scope.querySelectorAll('.song-gacha-reveal-back').forEach(function(button){
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
    });

    scope.querySelectorAll('.karaoke-top-back').forEach(function(button){
      setText(button,'‹');
      button.classList.add('audit-local-back');
      button.setAttribute('aria-label','戻る');
    });

    scope.querySelectorAll('.cover-back-btn,.cover-inline-back').forEach(function(button){
      button.setAttribute('aria-label','戻る');
    });
  }

  function normalizeKaraoke(root){
    const scope=root&&root.querySelectorAll?root:document;
    scope.querySelectorAll('.karaoke-title>p').forEach(function(el){
      if((el.textContent||'').trim()==='KARAOKE') el.remove();
    });
  }

  function decorateLyricsGroupCards(){
    if(!document.querySelector('.lyrics-groups')) return;
    document.querySelectorAll('.lyrics-groups .lyrics-group-card').forEach(function(card){
      const label=card.querySelector('strong');
      const name=label?String(label.textContent||'').trim():'';
      let color='#9cecff';
      if(window.lyricsState&&lyricsState.groupColors&&lyricsState.groupColors[name]) color=lyricsState.groupColors[name];
      else if(typeof window.lyricsGroupColor==='function') color=window.lyricsGroupColor(name)||color;
      card.style.setProperty('--lyrics-group-accent',color);
    });
  }

  function normalize(root){
    normalizeLanguage(root);
    normalizeNavigation(root);
    normalizeKaraoke(root);
    decorateLyricsGroupCards();
  }

  let scheduled=false;
  function schedule(root){
    if(scheduled) return;
    scheduled=true;
    requestAnimationFrame(function(){
      scheduled=false;
      normalize(root||document);
    });
  }

  function start(){
    normalize(document);
    const observer=new MutationObserver(function(mutations){
      for(const mutation of mutations){
        if(mutation.type==='characterData'){
          schedule(document);
          return;
        }
        if(mutation.addedNodes&&mutation.addedNodes.length){
          schedule(document);
          return;
        }
      }
    });
    observer.observe(document.body,{subtree:true,childList:true,characterData:true});
    window.__universeCrossDesignAuditObserver=observer;
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

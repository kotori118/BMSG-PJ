<style>
  /* =========================================================
     Universe shared polish — SEARCH / SETTINGS
     Soft Cyan is the primary accent in both dark and light UI.
     ========================================================= */
  :root{
    --cyan-ink:#2f7382;
    --u-btn-radius:18px;
    --u-btn-line:rgba(156,236,255,.24);
    --u-btn-light-line:rgba(75,165,184,.24);
    --u-btn-light-bg:linear-gradient(145deg,#fff,rgba(156,236,255,.07));
  }

  /* Top utility Search / Settings buttons */
  .utility-actions .utility-btn:not(.utility-home){
    border-color:rgba(156,236,255,.26);
    color:var(--cyan-strong);
    background:linear-gradient(145deg,rgba(156,236,255,.12),rgba(4,9,16,.74));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 0 22px rgba(156,236,255,.045);
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--fast) var(--ease);
  }
  @media(hover:hover){
    .utility-actions .utility-btn:not(.utility-home):hover{
      border-color:rgba(156,236,255,.46);
      color:#effdff;
      background:linear-gradient(145deg,rgba(156,236,255,.18),rgba(4,9,16,.78));
    }
  }

  /* SEARCH */
  #searchOverlay{
    background:radial-gradient(ellipse at 18% 4%,rgba(96,208,232,.12),transparent 32%),rgba(3,7,13,.988);
  }
  #searchOverlay .overlay-title{
    color:var(--cyan-strong);
    text-shadow:0 0 28px rgba(156,236,255,.08);
  }
  #searchOverlay .search-field{
    border-color:rgba(156,236,255,.36);
    background:linear-gradient(145deg,rgba(156,236,255,.075),rgba(255,255,255,.028));
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
  }
  #searchOverlay .search-field:focus-within{
    border-color:rgba(156,236,255,.66);
    background:linear-gradient(145deg,rgba(156,236,255,.105),rgba(255,255,255,.035));
    box-shadow:0 0 0 3px rgba(156,236,255,.065),0 0 30px rgba(156,236,255,.04);
  }
  #searchOverlay .search-field svg{stroke:var(--cyan)}
  #searchOverlay .search-status,
  #searchOverlay .page-directory-label{color:rgba(198,246,255,.58)}
  #searchOverlay .search-result{
    border-color:rgba(156,236,255,.115);
    background:linear-gradient(145deg,rgba(156,236,255,.035),rgba(255,255,255,.018));
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),transform var(--fast) var(--ease);
  }
  #searchOverlay .search-result-parent{color:rgba(156,236,255,.46)}
  @media(hover:hover){
    #searchOverlay .search-result:hover{
      border-color:rgba(156,236,255,.28);
      background:linear-gradient(145deg,rgba(156,236,255,.07),rgba(255,255,255,.024));
    }
  }
  #searchOverlay .search-result:focus-visible{
    outline:1px solid rgba(156,236,255,.6);
    outline-offset:2px;
  }

  /* SETTINGS */
  #settingsOverlay .settings-panel{
    border-color:rgba(156,236,255,.18);
    background:radial-gradient(circle at 0 0,rgba(156,236,255,.075),transparent 34%),linear-gradient(180deg,rgba(11,17,28,.99),rgba(5,10,18,.99));
  }
  #settingsOverlay .modal-title{
    color:var(--cyan-strong);
    text-shadow:0 0 28px rgba(156,236,255,.07);
  }
  #settingsOverlay .settings-eyebrow,
  #settingsOverlay .settings-section-title{color:rgba(198,246,255,.64)}
  #settingsOverlay .settings-row{
    border-color:rgba(156,236,255,.11);
    background:linear-gradient(145deg,rgba(156,236,255,.032),rgba(255,255,255,.018));
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),transform var(--fast) var(--ease);
  }
  #settingsOverlay .settings-action{
    border-color:rgba(156,236,255,.28);
    color:var(--cyan-strong);
    background:rgba(156,236,255,.065);
  }
  #settingsOverlay .settings-arrow{color:rgba(156,236,255,.56)}
  @media(hover:hover){
    #settingsOverlay .settings-row-button:hover{
      border-color:rgba(156,236,255,.24);
      background:rgba(156,236,255,.055);
    }
    #settingsOverlay .settings-action:hover{
      border-color:rgba(156,236,255,.44);
      background:rgba(156,236,255,.11);
    }
  }

  /* Light Theme — keep cyan visible without losing readability */
  body.theme-light .utility-actions .utility-btn:not(.utility-home){
    border-color:rgba(73,151,170,.32);
    color:var(--cyan-ink);
    background:rgba(156,236,255,.26);
    box-shadow:none;
  }
  body.theme-light #searchOverlay{
    background:radial-gradient(ellipse at 18% 4%,rgba(156,236,255,.20),transparent 34%),#fff;
  }
  body.theme-light #searchOverlay .overlay-title,
  body.theme-light #settingsOverlay .modal-title{color:var(--cyan-ink);text-shadow:none}
  body.theme-light #searchOverlay .search-field{
    border-color:rgba(73,151,170,.28);
    background:rgba(156,236,255,.10);
  }
  body.theme-light #searchOverlay .search-field:focus-within{
    border-color:rgba(73,151,170,.52);
    background:rgba(156,236,255,.16);
    box-shadow:0 0 0 3px rgba(156,236,255,.20);
  }
  body.theme-light #searchOverlay .search-field svg{stroke:var(--cyan-ink)}
  body.theme-light #searchOverlay .search-status,
  body.theme-light #searchOverlay .page-directory-label,
  body.theme-light #searchOverlay .search-result-parent{color:rgba(47,115,130,.64)}
  body.theme-light #searchOverlay .search-result{
    border-color:rgba(73,151,170,.16);
    background:rgba(156,236,255,.055);
  }
  body.theme-light #settingsOverlay .settings-panel{
    border-color:rgba(73,151,170,.20);
    background:radial-gradient(circle at 0 0,rgba(156,236,255,.16),transparent 36%),#fff;
  }
  body.theme-light #settingsOverlay .settings-eyebrow,
  body.theme-light #settingsOverlay .settings-section-title{color:rgba(47,115,130,.68)}
  body.theme-light #settingsOverlay .settings-row{
    border-color:rgba(73,151,170,.15);
    background:rgba(156,236,255,.045);
  }
  body.theme-light #settingsOverlay .settings-action{
    border-color:rgba(73,151,170,.28);
    color:var(--cyan-ink);
    background:rgba(156,236,255,.18);
  }
  body.theme-light #settingsOverlay .settings-arrow{color:rgba(47,115,130,.58)}

  /* LYRICS room — use cyan as an accent, not a full slab CTA. */
  body.theme-light .lyrics-room-card.is-active .lyrics-room-primary{
    position:relative;
    min-height:48px;
    padding:0 44px 0 18px;
    border:1px solid rgba(75,165,184,.32);
    border-radius:14px;
    color:var(--ink);
    background:rgba(156,236,255,.12);
    box-shadow:none;
    font-size:14px;
    font-weight:600;
    letter-spacing:.015em;
    text-align:left;
  }
  body.theme-light .lyrics-room-card.is-active .lyrics-room-primary:not(:disabled)::after{
    content:'›';
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-52%);
    color:var(--cyan-ink);
    font:500 25px/1 Roboto,sans-serif;
  }
  body.theme-light .lyrics-room-card.is-active .lyrics-room-primary:not(:disabled):active{
    background:rgba(156,236,255,.20);
  }

  /* =========================================================
     Shared Button Component v1 — HOME design language
     HOME is the visual source of truth. Existing DOM and click
     handlers stay intact; legacy service classes are mapped here.
     ========================================================= */
  :is(
    .u-btn,
    .profile-universe-home,
    .profile-detail-back,
    .profile-retry-button,
    .lyrics-list-back,
    .lyrics-karaoke-icon,
    .lyrics-editor-actions button,
    .lyrics-room-join button,
    .lyrics-room-subactions button,
    .karaoke-primary,
    .karaoke-secondary,
    .karaoke-join button,
    .karaoke-actions button,
    .karaoke-back-link,
    .karaoke-top-back,
    .karaoke-history-heading button,
    .karaoke-song-footer button
  ){
    border:1px solid var(--dark-line);
    border-radius:var(--u-btn-radius);
    color:var(--white);
    background:linear-gradient(145deg,rgba(255,255,255,.052),rgba(255,255,255,.022));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
    cursor:pointer;
    transform:translateZ(0);
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),color var(--fast) var(--ease),transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
  }

  :is(
    .u-btn,
    .profile-universe-home,
    .profile-detail-back,
    .profile-retry-button,
    .lyrics-list-back,
    .lyrics-karaoke-icon,
    .lyrics-editor-actions button,
    .lyrics-room-join button,
    .lyrics-room-subactions button,
    .karaoke-primary,
    .karaoke-secondary,
    .karaoke-join button,
    .karaoke-actions button,
    .karaoke-back-link,
    .karaoke-top-back,
    .karaoke-history-heading button,
    .karaoke-song-footer button
  ):active{transform:scale(.985)}

  @media(hover:hover){
    :is(
      .u-btn,
      .profile-universe-home,
      .profile-detail-back,
      .profile-retry-button,
      .lyrics-list-back,
      .lyrics-karaoke-icon,
      .lyrics-editor-actions button,
      .lyrics-room-join button,
      .lyrics-room-subactions button,
      .karaoke-primary,
      .karaoke-secondary,
      .karaoke-join button,
      .karaoke-actions button,
      .karaoke-back-link,
      .karaoke-top-back,
      .karaoke-history-heading button,
      .karaoke-song-footer button
    ):hover{
      border-color:var(--dark-line-strong);
      background:linear-gradient(145deg,rgba(255,255,255,.066),rgba(255,255,255,.027));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }
  }

  body.theme-light :is(
    .u-btn,
    .lyrics-list-back,
    .lyrics-karaoke-icon,
    .lyrics-editor-actions button,
    .lyrics-room-join button,
    .lyrics-room-subactions button,
    .karaoke-primary,
    .karaoke-secondary,
    .karaoke-join button,
    .karaoke-actions button,
    .karaoke-back-link,
    .karaoke-top-back,
    .karaoke-history-heading button,
    .karaoke-song-footer button
  ){
    border-color:var(--u-btn-light-line);
    color:var(--ink);
    background:var(--u-btn-light-bg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
  }

  body.theme-light :is(
    .lyrics-editor-actions button:last-child,
    .karaoke-primary,
    .karaoke-start,
    .lyrics-karaoke-icon
  ){
    border-color:rgba(75,165,184,.38)!important;
    color:var(--ink)!important;
    background:linear-gradient(145deg,rgba(156,236,255,.28),rgba(156,236,255,.08))!important;
  }

  body.theme-light :is(
    .lyrics-group-card,
    .lyrics-song-card,
    .lyrics-gacha-card,
    .karaoke-groups button,
    .karaoke-song-list button,
    .karaoke-history-list button
  ){
    border-color:rgba(21,24,32,.12);
    background:linear-gradient(145deg,#fff,rgba(156,236,255,.025));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.82);
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease),transform var(--fast) var(--ease),box-shadow var(--fast) var(--ease);
  }
  body.theme-light :is(
    .lyrics-group-card,
    .lyrics-song-card,
    .lyrics-gacha-card,
    .karaoke-groups button,
    .karaoke-song-list button,
    .karaoke-history-list button
  ):active{transform:scale(.985)}
  @media(hover:hover){
    body.theme-light :is(
      .lyrics-group-card,
      .lyrics-song-card,
      .lyrics-gacha-card,
      .karaoke-groups button,
      .karaoke-song-list button,
      .karaoke-history-list button
    ):hover{
      border-color:rgba(75,165,184,.30);
      background:linear-gradient(145deg,#fff,rgba(156,236,255,.07));
    }
  }

  /* =========================================================
     2026-09-04 refinement — HOME texture + Room rhythm
     ========================================================= */
  body.theme-light .utility-actions .utility-btn{
    border-color:rgba(75,165,184,.34);
    color:var(--ink);
    background:linear-gradient(145deg,#fff,rgba(156,236,255,.34));
    box-shadow:0 7px 20px rgba(75,165,184,.10),inset 0 1px 0 rgba(255,255,255,.86);
  }

  body.theme-light .lyrics-room-card.is-active .lyrics-room-primary,
  body.theme-light .lyrics-room-card.is-active .lyrics-room-subactions button{
    min-height:50px;
    border:1px solid rgba(75,165,184,.28);
    border-radius:15px;
    color:var(--ink);
    background:linear-gradient(145deg,#fff,rgba(156,236,255,.18));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.86);
  }
  body.theme-light .lyrics-room-card.is-active .lyrics-room-primary{
    width:100%;
    padding:0 44px 0 18px;
  }
  body.theme-light .lyrics-room-card.is-active .lyrics-room-subactions{
    gap:10px;
    margin-top:10px;
  }
  body.theme-light .lyrics-room-card.is-active .lyrics-room-subactions button{
    margin:0;
  }

  /* =========================================================
     Shared State System v1 — Loading is intentionally excluded.
     Loading visual will be redesigned separately after approval.
     ========================================================= */
  :root{
    --u-state-radius:18px;
    --u-state-line-dark:rgba(194,232,244,.12);
    --u-state-line-light:rgba(75,165,184,.18);
    --u-state-light-bg:linear-gradient(145deg,#fff,rgba(156,236,255,.055));
  }

  :is(.state-card,.profile-members-state,.karaoke-history-empty,.lyrics-empty){
    border-radius:var(--u-state-radius);
  }

  body.theme-light :is(.state-card,.profile-members-state,.karaoke-history-empty,.lyrics-empty){
    border-color:var(--u-state-line-light);
    color:rgba(21,24,32,.50);
    background:var(--u-state-light-bg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.84);
  }

  :is(.skeleton-block,.profile-member-skeleton){
    position:relative;
    overflow:hidden;
  }
  :is(.skeleton-block,.profile-member-skeleton)::after{
    content:"";
    position:absolute;
    inset:0;
    transform:translateX(-110%);
    background:linear-gradient(90deg,transparent,rgba(156,236,255,.10),transparent);
    animation:skeleton-scan 1.3s ease-in-out infinite;
  }
  body.theme-light :is(.skeleton-block,.profile-member-skeleton){
    background:rgba(47,115,130,.07);
  }

  .universe-toast{
    border:1px solid rgba(156,236,255,.22);
    border-radius:16px;
    background:linear-gradient(145deg,rgba(10,16,26,.96),rgba(5,10,18,.98));
    box-shadow:0 18px 46px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.04);
  }
  body.theme-light .universe-toast{
    border-color:rgba(75,165,184,.24);
    color:var(--ink);
    background:linear-gradient(145deg,#fff,rgba(156,236,255,.13));
    box-shadow:0 16px 36px rgba(21,24,32,.12),inset 0 1px 0 rgba(255,255,255,.86);
  }

  @media(prefers-reduced-motion:reduce){
    :is(.u-btn,.profile-universe-home,.profile-detail-back,.profile-retry-button,.lyrics-list-back,.lyrics-karaoke-icon,.lyrics-editor-actions button,.lyrics-room-join button,.lyrics-room-subactions button,.karaoke-primary,.karaoke-secondary,.karaoke-join button,.karaoke-actions button,.karaoke-back-link,.karaoke-top-back,.karaoke-history-heading button,.karaoke-song-footer button,.lyrics-group-card,.lyrics-song-card,.lyrics-gacha-card,.karaoke-groups button,.karaoke-song-list button,.karaoke-history-list button){transition:none}
    :is(.skeleton-block,.profile-member-skeleton)::after{animation:none;display:none}
  }
</style>

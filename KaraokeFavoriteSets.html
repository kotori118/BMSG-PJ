<style>
  .karaoke-title.is-favorite-ready{display:flex;align-items:center;justify-content:center;gap:10px;padding-right:0!important}
  .karaoke-favorite-star{position:static!important;transform:none!important;width:44px;height:44px;min-width:44px;padding:0!important;border:0!important;border-radius:12px!important;background:transparent!important;box-shadow:none!important;font-size:27px;line-height:1;display:grid;place-items:center;color:var(--ink)}
  .karaoke-favorite-star.is-applied{color:var(--cyan-ink,#2f7382)}

  /* Favorite settings is a SETTINGS sub-screen, not a floating service card. */
  .karaoke-favorite-settings-modal{z-index:1220;background:#fff!important;align-items:stretch!important;justify-content:center!important;padding:0!important}
  .karaoke-favorite-settings-panel{width:min(100%,680px)!important;max-width:680px!important;min-height:100dvh;max-height:100dvh!important;margin:0!important;padding:clamp(24px,6vw,48px) clamp(22px,6vw,42px) 40px!important;border:0!important;border-radius:0!important;background:#fff!important;box-shadow:none!important;overflow:auto}
  .karaoke-favorite-settings-panel .modal-head{position:sticky;top:0;z-index:2;margin:-8px 0 8px;padding:8px 0 18px;background:#fff!important;backdrop-filter:none!important}
  .karaoke-favorite-settings-panel .modal-title{font-family:"Zen Kaku Gothic New",Roboto,sans-serif}
  .karaoke-favorite-settings-panel .settings-eyebrow{color:var(--gray)}
  .karaoke-favorite-category-row{margin:10px 0 18px}
  .karaoke-favorite-category-row label{display:block;margin-bottom:7px;color:var(--gray);font:600 10px "Exo 2",Roboto,sans-serif;letter-spacing:.12em}
  .karaoke-favorite-category-select{width:100%;min-height:50px;padding:0 14px;border:1px solid rgba(75,165,184,.28);border-radius:15px;background:linear-gradient(145deg,#fff,rgba(156,236,255,.10));color:var(--ink);font:600 14px "Zen Kaku Gothic New",Roboto,sans-serif;box-shadow:0 8px 22px rgba(75,165,184,.06),inset 0 1px 0 rgba(255,255,255,.9)}
  .karaoke-favorite-member-list{border-top:1px solid rgba(21,24,32,.09)}
  .karaoke-favorite-member-row{display:grid;grid-template-columns:minmax(100px,1fr) minmax(0,2.25fr);gap:14px;align-items:center;padding:17px 0;border-bottom:1px solid rgba(21,24,32,.09)}
  .karaoke-favorite-member-name{font:700 15px "Zen Kaku Gothic New",Roboto,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .karaoke-favorite-user-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .karaoke-favorite-user-options .u-btn{min-height:44px;padding:0 6px;border-radius:14px!important;font-size:12px;box-shadow:none!important}
  body.theme-light .karaoke-favorite-user-options .u-btn.is-selected{border-color:rgba(75,165,184,.62)!important;background:linear-gradient(145deg,#fff,rgba(156,236,255,.28))!important;box-shadow:inset 0 0 0 1px rgba(156,236,255,.24)!important;color:var(--cyan-ink,#2f7382)!important}
  .karaoke-favorite-save{width:100%;min-height:50px;margin-top:20px;border-radius:15px!important}
  .karaoke-favorite-empty{padding:28px 12px;text-align:center;color:var(--gray);font-size:13px}
  #karaokeFavoriteSettingsBody>.universe-loading{min-height:160px;justify-content:center}
  .toast-region{z-index:1400!important}
  @media(max-width:520px){
    .karaoke-favorite-settings-panel{padding:24px 22px 34px!important}
    .karaoke-favorite-member-row{grid-template-columns:1fr;gap:10px;padding:16px 0}
    .karaoke-favorite-user-options .u-btn{font-size:11px}
  }
</style>

<script>
  const karaokeFavoriteState={
    setupApplied:false,
    setupGroupId:'',
    setupAssignments:null,
    settings:null,
    settingsLoading:false,
    settingsWaiters:[],
    editGroupId:'',
    editAssignments:{},
    busy:false
  };

  function getKaraokeCurrentGroupName(){
    if(typeof karaokeState==='undefined'||!karaokeState.song)return'';
    const meta=(karaokeState.songs||[]).find(function(item){return String(item.songId)===String(karaokeState.song.songId);});
    if(!meta)return'';
    if(['BE:FIRST','MAZZEL','STARGLOW','HANA'].indexOf(String(meta.category||meta.artist||''))>=0)return String(meta.category||meta.artist);
    return String(meta.unitCategory||'');
  }

  function getKaraokeCurrentFavoriteGroup(){
    if(!karaokeFavoriteState.settings)return null;
    const groupName=getKaraokeCurrentGroupName();
    if(!groupName)return null;
    return (karaokeFavoriteState.settings.categories||[]).find(function(item){return item.groupName===groupName;})||null;
  }

  function injectKaraokeFavoriteStar(){
    if(typeof karaokeState==='undefined'||karaokeState.screen!=='setup')return;
    const title=document.querySelector('#karaokeView .karaoke-title');
    if(!title)return;
    const existing=title.querySelector('.karaoke-favorite-star');
    const group=getKaraokeCurrentFavoriteGroup();
    if(!group){
      if(existing)existing.remove();
      title.classList.remove('is-favorite-ready');
      if(!karaokeFavoriteState.settings&&!karaokeFavoriteState.settingsLoading){
        preloadKaraokeFavoriteSettings(function(){injectKaraokeFavoriteStar();});
      }
      return;
    }
    if(existing)return;
    title.classList.add('is-favorite-ready');
    const button=document.createElement('button');
    button.type='button';
    button.className='u-btn karaoke-favorite-star'+(karaokeFavoriteState.setupApplied?' is-applied':'');
    button.textContent=karaokeFavoriteState.setupApplied?'★':'☆';
    button.setAttribute('aria-label',karaokeFavoriteState.setupApplied?'推しセット適用済み':'推しセットを適用');
    button.onclick=applyKaraokeFavoriteSet;
    title.appendChild(button);
  }

  function applyKaraokeFavoriteMap(group,map){
    if(!Object.keys(map||{}).length){
      if(typeof showToast==='function')showToast('このグループの推しセットはまだ未設定です');
      return;
    }
    karaokeState.assignments={};
    karaokeSingers().forEach(function(singer){if(map[singer.key])karaokeState.assignments[singer.key]=map[singer.key];});
    karaokeFavoriteState.setupApplied=true;
    karaokeFavoriteState.setupGroupId=group.groupId;
    karaokeFavoriteState.setupAssignments=map;
    renderKaraokeSetup();
    if(typeof showToast==='function')showToast(group.groupName+' の推しセットを適用しました');
  }

  function applyKaraokeFavoriteSet(){
    if(karaokeFavoriteState.busy||typeof karaokeState==='undefined'||!karaokeState.song)return;
    const group=getKaraokeCurrentFavoriteGroup();
    if(!group)return;
    if(group.assignments){applyKaraokeFavoriteMap(group,group.assignments||{});return;}
    karaokeFavoriteState.busy=true;
    google.script.run.withSuccessHandler(function(data){
      karaokeFavoriteState.busy=false;
      applyKaraokeFavoriteMap(group,data&&data.assignments?data.assignments:{});
    }).withFailureHandler(function(error){karaokeFavoriteState.busy=false;showKaraokeError(error);}).getKaraokeFavoriteSet(group.groupId);
  }

  function clearKaraokeFavoriteApplied(){
    karaokeFavoriteState.setupApplied=false;
    karaokeFavoriteState.setupGroupId='';
    karaokeFavoriteState.setupAssignments=null;
  }

  (function bindKaraokeFavoriteSetup(){
    if(typeof renderKaraokeSetup==='function'){
      const baseRender=renderKaraokeSetup;
      renderKaraokeSetup=function(){baseRender();injectKaraokeFavoriteStar();};
    }
    if(typeof openKaraokeSetup==='function'){
      const baseOpen=openKaraokeSetup;
      openKaraokeSetup=function(songId,pushUrl){clearKaraokeFavoriteApplied();return baseOpen(songId,pushUrl);};
    }
    if(typeof toggleKaraokeSinger==='function'){
      const baseToggle=toggleKaraokeSinger;
      toggleKaraokeSinger=function(encoded,userId,input){clearKaraokeFavoriteApplied();return baseToggle(encoded,userId,input);};
    }
    if(typeof randomizeKaraoke==='function'){
      const baseRandom=randomizeKaraoke;
      randomizeKaraoke=function(){clearKaraokeFavoriteApplied();return baseRandom();};
    }
    if(typeof resetKaraoke==='function'){
      const baseReset=resetKaraoke;
      resetKaraoke=function(){clearKaraokeFavoriteApplied();return baseReset();};
    }
  })();

  function ensureKaraokeFavoriteSettingsEntry(){
    const settings=document.getElementById('settingsOverlay');
    if(!settings||settings.querySelector('#karaokeFavoriteSettingsSection'))return;
    const tools=settings.querySelector('.settings-group:last-of-type');
    const section=document.createElement('section');
    section.id='karaokeFavoriteSettingsSection';
    section.className='settings-group';
    section.innerHTML='<p class="settings-section-title">KARAOKE</p><button class="settings-row settings-row-button" type="button" onclick="openKaraokeFavoriteSettings()"><span class="settings-row-copy"><strong>推しセット</strong><small>正式グループごとの担当を設定</small></span><span class="settings-arrow">›</span></button>';
    if(tools&&tools.parentNode)tools.parentNode.insertBefore(section,tools);else settings.querySelector('.settings-panel').appendChild(section);
  }

  function ensureKaraokeFavoriteSettingsModal(){
    if(document.getElementById('karaokeFavoriteSettingsOverlay'))return;
    const overlay=document.createElement('div');
    overlay.id='karaokeFavoriteSettingsOverlay';
    overlay.className='modal-overlay karaoke-favorite-settings-modal';
    overlay.innerHTML='<section class="settings-panel karaoke-favorite-settings-panel" role="dialog" aria-modal="true" aria-labelledby="karaokeFavoriteSettingsTitle"><header class="modal-head"><div><p class="settings-eyebrow">KARAOKE</p><h2 id="karaokeFavoriteSettingsTitle" class="modal-title">推しセット</h2></div><button class="overlay-close" type="button" onclick="closeKaraokeFavoriteSettings()" aria-label="推しセット設定を閉じる">×</button></header><div id="karaokeFavoriteSettingsBody"></div></section>';
    document.body.appendChild(overlay);
  }

  function flushKaraokeFavoriteSettingsWaiters(error){
    const waiters=karaokeFavoriteState.settingsWaiters.slice();
    karaokeFavoriteState.settingsWaiters=[];
    waiters.forEach(function(callback){if(typeof callback==='function')callback(error,karaokeFavoriteState.settings);});
  }

  function preloadKaraokeFavoriteSettings(callback){
    if(karaokeFavoriteState.settings){if(typeof callback==='function')callback(null,karaokeFavoriteState.settings);return;}
    if(typeof callback==='function')karaokeFavoriteState.settingsWaiters.push(callback);
    if(karaokeFavoriteState.settingsLoading)return;
    karaokeFavoriteState.settingsLoading=true;
    google.script.run.withSuccessHandler(function(data){
      karaokeFavoriteState.settingsLoading=false;
      karaokeFavoriteState.settings=data;
      if(!karaokeFavoriteState.editGroupId&&data&&data.categories&&data.categories.length)karaokeFavoriteState.editGroupId=data.categories[0].groupId;
      flushKaraokeFavoriteSettingsWaiters(null);
    }).withFailureHandler(function(error){
      karaokeFavoriteState.settingsLoading=false;
      flushKaraokeFavoriteSettingsWaiters(error);
    }).getKaraokeFavoriteSettings();
  }

  function openKaraokeFavoriteSettings(){
    ensureKaraokeFavoriteSettingsModal();
    if(typeof closeSettings==='function')closeSettings();
    const overlay=document.getElementById('karaokeFavoriteSettingsOverlay');
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
    const body=document.getElementById('karaokeFavoriteSettingsBody');
    if(karaokeFavoriteState.settings){
      loadKaraokeFavoriteEditGroup(karaokeFavoriteState.editGroupId);
      return;
    }
    if(body)body.innerHTML=typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING...','#9cecff'):'';
    preloadKaraokeFavoriteSettings(function(error,data){
      if(error){
        if(body)body.innerHTML='<div class="karaoke-favorite-empty">読み込みに失敗しました</div>';
        if(typeof showToast==='function')showToast(error&&error.message?error.message:String(error||'読み込みに失敗しました'));
        return;
      }
      if(!karaokeFavoriteState.editGroupId&&data.categories&&data.categories.length)karaokeFavoriteState.editGroupId=data.categories[0].groupId;
      loadKaraokeFavoriteEditGroup(karaokeFavoriteState.editGroupId);
    });
  }

  function closeKaraokeFavoriteSettings(){
    const overlay=document.getElementById('karaokeFavoriteSettingsOverlay');
    if(overlay)overlay.classList.remove('open');
    document.body.style.overflow='';
  }

  function loadKaraokeFavoriteEditGroup(groupId){
    karaokeFavoriteState.editGroupId=String(groupId||'');
    const data=karaokeFavoriteState.settings||{categories:[],users:[]};
    const category=(data.categories||[]).find(function(item){return item.groupId===karaokeFavoriteState.editGroupId;});
    karaokeFavoriteState.editAssignments=Object.assign({},category&&category.assignments||{});
    renderKaraokeFavoriteSettingsEditor();
  }

  function setKaraokeFavoriteMember(memberId,userId){
    karaokeFavoriteState.editAssignments[String(memberId)]=String(userId);
    renderKaraokeFavoriteSettingsEditor();
  }

  function renderKaraokeFavoriteSettingsEditor(){
    const body=document.getElementById('karaokeFavoriteSettingsBody');
    if(!body)return;
    const data=karaokeFavoriteState.settings||{categories:[],users:[]};
    const category=(data.categories||[]).find(function(item){return item.groupId===karaokeFavoriteState.editGroupId;});
    if(!category){body.innerHTML='<div class="karaoke-favorite-empty">設定対象がありません</div>';return;}
    const options=(data.categories||[]).map(function(item){return '<option value="'+escapeLyrics(item.groupId)+'"'+(item.groupId===category.groupId?' selected':'')+'>'+escapeLyrics(item.groupName)+'</option>';}).join('');
    const members=(category.members||[]).map(function(member){
      const buttons=(data.users||[]).map(function(user){
        const selected=karaokeFavoriteState.editAssignments[member.memberId]===user.userId;
        return '<button type="button" class="u-btn'+(selected?' is-selected':'')+'" onclick="setKaraokeFavoriteMember(\''+escapeLyrics(member.memberId)+'\',\''+escapeLyrics(user.userId)+'\')">'+escapeLyrics(user.displayName)+'</button>';
      }).join('');
      return '<div class="karaoke-favorite-member-row"><div class="karaoke-favorite-member-name" style="color:'+escapeLyrics(member.color||'#777777')+'">'+escapeLyrics(member.name)+'</div><div class="karaoke-favorite-user-options">'+buttons+'</div></div>';
    }).join('');
    const complete=(category.members||[]).length>0&&(category.members||[]).every(function(member){return !!karaokeFavoriteState.editAssignments[member.memberId];});
    body.innerHTML='<div class="karaoke-favorite-category-row"><label>GROUP</label><select class="karaoke-favorite-category-select" onchange="loadKaraokeFavoriteEditGroup(this.value)">'+options+'</select></div><div class="karaoke-favorite-member-list">'+members+'</div><button class="u-btn karaoke-favorite-save" type="button" onclick="saveKaraokeFavoriteSettings()"'+(complete?'':' disabled')+'>保存</button>';
  }

  function saveKaraokeFavoriteSettings(){
    if(karaokeFavoriteState.busy)return;
    karaokeFavoriteState.busy=true;
    google.script.run.withSuccessHandler(function(result){
      karaokeFavoriteState.busy=false;
      const category=(karaokeFavoriteState.settings.categories||[]).find(function(item){return item.groupId===result.groupId;});
      if(category)category.assignments=Object.assign({},result.assignments||{});
      if(typeof showToast==='function')showToast('保存しました');
      renderKaraokeFavoriteSettingsEditor();
    }).withFailureHandler(function(error){
      karaokeFavoriteState.busy=false;
      if(typeof showToast==='function')showToast(error&&error.message?error.message:String(error||'保存に失敗しました'));
    }).saveKaraokeFavoriteSet({groupId:karaokeFavoriteState.editGroupId,assignments:karaokeFavoriteState.editAssignments});
  }

  (function bindKaraokeFavoriteSettings(){
    ensureKaraokeFavoriteSettingsEntry();
    ensureKaraokeFavoriteSettingsModal();
    if(typeof openSettings==='function'){
      const baseOpenSettings=openSettings;
      openSettings=function(){
        ensureKaraokeFavoriteSettingsEntry();
        preloadKaraokeFavoriteSettings();
        return baseOpenSettings();
      };
    }
  })();
</script>

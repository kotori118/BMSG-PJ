<script>
  const karaokeState={users:[{userId:'U001',displayName:'ももたん'},{userId:'U002',displayName:'みおたん'},{userId:'U003',displayName:'りおたん'}],room:null,history:[],songs:[],partsBySong:{},song:null,assignments:{},screen:'entry',busy:false,roomReady:false,pendingSave:null,resultView:false,backParams:{}};

  function renderKaraoke(){return document.getElementById('karaokePageTemplate').innerHTML;}

  function initKaraokePage(params){
    params=params||{};
    karaokeState.backParams={group:params.group||'',unit:params.unit||''};
    const cached=sessionStorage.getItem('bmsgLyricsDataV4');
    if(cached){
      try{applyKaraokeCatalog(JSON.parse(cached),params);return;}catch(error){}
    }
    google.script.run.withSuccessHandler(function(data){
      try{sessionStorage.setItem('bmsgLyricsDataV4',JSON.stringify(data));}catch(error){}
      applyKaraokeCatalog(data,params);
    }).withFailureHandler(showKaraokeError).getLyricsCatalog();
  }

  function applyKaraokeCatalog(data,params){
    karaokeState.songs=data.songs||[];
    karaokeState.partsBySong=data.partsBySong||{};
    if(params&&params.mode==='latest'){
      document.getElementById('karaokeView').innerHTML='<div class="karaoke-loading">読み込み中</div>';
      loadKaraokeRoom(params.room,function(){
        if(karaokeState.history.length)openKaraokeResultSong(karaokeState.history[0]);
        else{renderKaraokeEntry();showKaraokeError('まだ振り分け結果がありません。');}
      });
      return;
    }
    if(params&&params.song){openKaraokeSetup(params.song,false);loadKaraokeRoom(params&&params.room);return;}
    renderKaraokeEntry();
    loadKaraokeRoom(params&&params.room);
  }

  function loadKaraokeRoom(roomId,done){
    karaokeState.roomReady=false;
    google.script.run.withSuccessHandler(function(data){
      karaokeState.roomReady=true;
      karaokeState.users=data.users&&data.users.length?data.users:karaokeState.users;
      karaokeState.room=data.room||null;
      karaokeState.history=data.history||[];
      updateKaraokeRoomCard();
      if(karaokeState.pendingSave&&karaokeState.room){
        const payload=karaokeState.pendingSave;
        karaokeState.pendingSave=null;
        payload.roomId=karaokeState.room.roomId;
        saveKaraokeResult(payload);
      }
      if(typeof done==='function')done();
    }).withFailureHandler(function(error){
      karaokeState.roomReady=true;
      karaokeState.room=null;
      updateKaraokeRoomCard();
      karaokeState.pendingSave=null;
      showKaraokeError(error);
      if(typeof done==='function')done();
    }).getKaraokeBootstrap(getUniverseUserId(),roomId);
  }

  function renderKaraokeEntry(){
    karaokeState.screen='entry';
    document.getElementById('karaokeView').innerHTML=
      '<button class="karaoke-top-back" type="button" onclick="navigateTo(\'lyrics\')">‹ <span>BACK</span></button>'+
      '<section class="karaoke-room-card"><div id="karaokeRoomBody"></div></section>'+
      '<section id="karaokeHistoryArea" class="karaoke-history-area"></section>';
    updateKaraokeRoomCard();
  }

  function updateKaraokeRoomCard(){
    const body=document.getElementById('karaokeRoomBody');
    if(!body)return;
    if(!karaokeState.room){
      body.innerHTML='<button class="karaoke-primary" type="button" onclick="createKaraokeRoomUI()">カラオケルームを作る</button><div class="karaoke-join"><input id="karaokeRoomInput" inputmode="numeric" maxlength="4" placeholder="4桁のルームID"><button type="button" onclick="joinKaraokeRoomUI()">参加</button></div>';
      renderKaraokeHistory();
      return;
    }
    body.innerHTML='<div class="karaoke-active-room"><span>ROOM ID</span><strong>'+escapeLyrics(karaokeState.room.roomId)+'</strong></div><button class="karaoke-secondary" type="button" onclick="leaveKaraokeRoomUI()">ルームを抜ける</button>';
    renderKaraokeHistory();
  }

  function karaokeHistoryRows(item){
    return karaokeState.users.map(function(user){
      const slots=(item.assignments&&item.assignments[user.userId])||[];
      const names=slots.map(function(slot){return '<i style="color:'+escapeLyrics(slot.color||'#777777')+'">'+escapeLyrics(typeof slot==='string'?slot:(slot.name||slot.memberId||''))+'</i>';}).join('<em>/</em>');
      return '<div class="karaoke-history-row"><span>'+escapeLyrics(user.displayName)+'</span><strong>'+(names||'—')+'</strong></div>';
    }).join('');
  }

  function karaokeDayKey(value){
    try{return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));}
    catch(error){return'';}
  }

  function openKaraokeRanking(){
    karaokeState.screen='ranking';
    const today=karaokeDayKey(new Date());
    const daily=karaokeState.history.filter(function(item){return karaokeDayKey(item.createdAt)===today;});
    document.getElementById('karaokeView').innerHTML='<button class="karaoke-top-back" type="button" onclick="renderKaraokeEntry()">‹ <span>BACK</span></button><div class="karaoke-title"><p>本日の集計</p><h2>担当者ランキング</h2></div><section class="karaoke-member-ranking">'+karaokeState.users.map(function(user){
      const counts={};
      daily.forEach(function(item){((item.assignments&&item.assignments[user.userId])||[]).forEach(function(slot){const name=typeof slot==='string'?slot:(slot.name||slot.memberId||'');if(name)counts[name]=(counts[name]||0)+1;});});
      const rows=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b,'ja');});
      return '<article><h3>'+escapeLyrics(user.displayName)+'</h3>'+(rows.length?'<ol>'+rows.map(function(name,index){return '<li><b>'+(index+1)+'</b><span>'+escapeLyrics(name)+'</span><strong>'+counts[name]+'回</strong></li>';}).join('')+'</ol>':'<p>今日の振り分けはまだありません</p>')+'</article>';
    }).join('')+'</section><button class="karaoke-back-link" type="button" onclick="renderKaraokeEntry()">履歴へ戻る</button>';
    scrollKaraokeTop();
  }

  function renderKaraokeHistory(){
    const area=document.getElementById('karaokeHistoryArea');
    if(!area)return;
    if(!karaokeState.room){area.innerHTML='<p class="karaoke-section-label">履歴</p><div class="karaoke-history-empty">ルームに参加すると履歴が表示されます</div>';return;}
    area.innerHTML='<div class="karaoke-history-heading"><p class="karaoke-section-label">履歴</p><button type="button" onclick="openKaraokeRanking()">担当者ランキング</button></div>'+(karaokeState.history.length?'<div class="karaoke-history-list">'+karaokeState.history.map(function(item){return '<article class="karaoke-history-card"><header><strong>'+escapeLyrics(item.title||'曲名なし')+'</strong><small>'+escapeLyrics(formatKaraokeTime(item.createdAt))+'</small></header><div>'+karaokeHistoryRows(item)+'</div></article>';}).join('')+'</div>':'<div class="karaoke-history-empty">まだ振り分け履歴はありません</div>');
  }

  function openKaraokeHistory(index){
    const item=karaokeState.history[index];if(!item)return;
    karaokeState.screen='history';
    document.getElementById('karaokeView').innerHTML='<button class="karaoke-top-back" type="button" onclick="renderKaraokeEntry()">‹ <span>BACK</span></button><div class="karaoke-title"><p>HISTORY</p><h2>'+escapeLyrics(item.title||'')+'</h2></div><section class="karaoke-history-result">'+karaokeState.users.map(function(user){const slots=(item.assignments&&item.assignments[user.userId])||[];return '<article><span>'+escapeLyrics(user.displayName)+'</span><strong>'+slots.map(function(slot){return '<i style="color:'+escapeLyrics(slot.color||'#777777')+'">'+escapeLyrics(typeof slot==='string'?slot:(slot.name||slot.memberId||''))+'</i>';}).join('<em>/</em>')+'</strong></article>';}).join('')+'</section>';
    scrollKaraokeTop();
  }

  function formatKaraokeTime(value){try{return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));}catch(error){return'';}}

  function createKaraokeRoomUI(){
    if(karaokeState.busy)return;
    karaokeState.busy=true;
    google.script.run.withSuccessHandler(function(room){
      karaokeState.busy=false;karaokeState.room=room;karaokeState.history=[];updateKaraokeRoomCard();
      if(typeof showToast==='function')showToast('ルーム '+room.roomId+' を作成しました');
    }).withFailureHandler(karaokeFailure).createKaraokeRoom(getUniverseUserId());
  }

  function joinKaraokeRoomUI(){
    const input=document.getElementById('karaokeRoomInput');
    const value=input?input.value.trim():'';
    if(!/^\d{4}$/.test(value)){showKaraokeError('4桁のルームIDを入力してね。');return;}
    karaokeState.busy=true;
    google.script.run.withSuccessHandler(function(data){
      karaokeState.busy=false;karaokeState.room=data.room;karaokeState.history=data.history||[];updateKaraokeRoomCard();
      if(typeof showToast==='function')showToast('ルーム '+data.room.roomId+' に参加しました');
    }).withFailureHandler(karaokeFailure).joinKaraokeRoom(getUniverseUserId(),value);
  }

  function leaveKaraokeRoomUI(){
    google.script.run.withSuccessHandler(function(){karaokeState.room=null;karaokeState.history=[];updateKaraokeRoomCard();}).withFailureHandler(showKaraokeError).leaveKaraokeRoom(getUniverseUserId());
  }

  function karaokeFailure(error){karaokeState.busy=false;showKaraokeError(error);}

  function openKaraokeSetup(songId,pushUrl){
    const id=decodeURIComponent(String(songId));
    const meta=karaokeState.songs.find(function(item){return String(item.songId)===id;});
    if(!meta){showKaraokeError('曲が見つかりません。');return;}
    karaokeState.song={songId:id,title:meta.title,artist:meta.artist,parts:karaokeState.partsBySong[id]||[]};
    karaokeState.assignments={};
    karaokeState.resultView=false;
    karaokeState.screen='setup';
    if(pushUrl!==false)setKaraokeUrl('setup');
    renderKaraokeSetup();
    scrollKaraokeTop();
  }

  function karaokeSingerKey(item){return String(item.raw||item.name||'').replace(/_(up|down|sub)$/i,'');}

  function karaokeSingers(){
    const seen={};
    const out=[];
    (karaokeState.song.parts||[]).forEach(function(part){
      const items=part.singers&&part.singers.length?part.singers:[{raw:part.singer,name:part.singer,color:'#777777'}];
      items.forEach(function(item){
        const key=karaokeSingerKey(item);
        if(!key||key==='99'||seen[key])return;
        seen[key]=true;
        out.push({key:key,name:item.name||key,color:item.color||'#777777'});
      });
    });
    return out;
  }

  function renderKaraokeSetup(){
    const singers=karaokeSingers();
    document.getElementById('karaokeView').innerHTML=
      '<button class="karaoke-top-back" type="button" onclick="backToLyricsSong()">‹ <span>BACK</span></button><div class="karaoke-title"><p>KARAOKE</p><h2>カラオケ設定</h2></div>'+
      '<section class="karaoke-user-settings">'+karaokeState.users.map(function(user){
        return '<article><h3>'+escapeLyrics(user.displayName)+'</h3><div>'+singers.map(function(singer){
          const checked=karaokeState.assignments[singer.key]===user.userId?' checked':'';
          return '<label><input type="checkbox"'+checked+' onchange="toggleKaraokeSinger(\''+encodeURIComponent(singer.key)+'\',\''+user.userId+'\',this)"><span></span><b>'+escapeLyrics(singer.name)+'</b></label>';
        }).join('')+'</div></article>';
      }).join('')+'</section>'+
      '<div class="karaoke-actions"><button class="karaoke-random" type="button" onclick="randomizeKaraoke()">ランダム振り分け</button><button class="karaoke-reset" type="button" onclick="resetKaraoke()">リセット</button><button class="karaoke-start" type="button" onclick="startKaraoke()">カラオケ開始</button><button class="karaoke-top-link" type="button" onclick="navigateTo(\'lyrics\')">トップページへ戻る</button></div>';
  }

  function toggleKaraokeSinger(encoded,userId,input){
    const key=decodeURIComponent(encoded);
    const singer=karaokeSingers().find(function(item){return item.key===key;});
    const current=karaokeState.assignments[key];
    if(input.checked&&current&&current!==userId){
      input.checked=false;
      showKaraokeError((singer?singer.name:key)+'は既に選択済みです');
      return;
    }
    if(input.checked)karaokeState.assignments[key]=userId;
    else if(current===userId)delete karaokeState.assignments[key];
  }

  function randomizeKaraoke(){
    const singers=karaokeSingers().slice();
    for(let i=singers.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=singers[i];singers[i]=singers[j];singers[j]=t;}
    karaokeState.assignments={};
    singers.forEach(function(singer,index){karaokeState.assignments[singer.key]=karaokeState.users[index%karaokeState.users.length].userId;});
    renderKaraokeSetup();
  }

  function resetKaraoke(){karaokeState.assignments={};renderKaraokeSetup();}

  function buildKaraokeResultAssignments(){
    const result={};
    karaokeState.users.forEach(function(user){result[user.userId]=[];});
    karaokeSingers().forEach(function(singer){
      const userId=karaokeState.assignments[singer.key];
      if(result[userId])result[userId].push({memberId:singer.key,name:singer.name,color:singer.color});
    });
    return result;
  }

  function showKaraokeSong(){
    karaokeState.screen='song';
    setKaraokeUrl('song');
    renderKaraokeSong();
    scrollKaraokeTop();
  }

  function saveKaraokeResult(payload){
    karaokeState.busy=true;
    google.script.run.withSuccessHandler(function(result){
      karaokeState.busy=false;
      karaokeState.history=karaokeState.history.filter(function(item){return item.createdAt!==result.createdAt;});
      karaokeState.history.unshift(result);
    }).withFailureHandler(karaokeFailure).saveKaraokeAssignment(payload);
  }

  function startKaraoke(){
    const missing=karaokeSingers().find(function(singer){return !karaokeState.assignments[singer.key];});
    if(missing){showKaraokeError(missing.name+'が未設定です');return;}
    if(karaokeState.busy)return;
    const payload={
      userId:getUniverseUserId(),
      roomId:karaokeState.room&&karaokeState.room.roomId,
      songId:karaokeState.song.songId,
      assignments:buildKaraokeResultAssignments()
    };
    showKaraokeSong();
    if(!karaokeState.roomReady){karaokeState.pendingSave=payload;return;}
    if(karaokeState.room)saveKaraokeResult(payload);
  }

  function openKaraokeResultSong(item){
    if(!item)return;
    const id=String(item.songId||'');
    const meta=karaokeState.songs.find(function(song){return String(song.songId)===id;})||item;
    karaokeState.song={songId:id,title:meta.title||item.title||'',artist:meta.artist||item.artist||'',parts:karaokeState.partsBySong[id]||[]};
    karaokeState.assignments={};
    Object.keys(item.assignments||{}).forEach(function(userId){
      (item.assignments[userId]||[]).forEach(function(slot){
        const memberId=typeof slot==='string'?slot:slot.memberId;
        if(memberId)karaokeState.assignments[String(memberId)]=userId;
      });
    });
    karaokeState.resultView=true;
    karaokeState.screen='song';
    renderKaraokeSong();
    scrollKaraokeTop();
  }

  function backFromKaraokeResult(){
    const params={page:'lyrics'};
    google.script.history.push(params,params,'');
    renderRoute('lyrics',params);
  }

  function karaokePartOwners(part){
    const items=part.singers&&part.singers.length?part.singers:[{raw:part.singer,name:part.singer,color:'#777777'}];
    const owners=[];
    items.forEach(function(item){
      const key=karaokeSingerKey(item);
      if(key==='99'){owners.push({label:'ALL',color:item.color||'#777777'});return;}
      const userId=karaokeState.assignments[key];
      const user=karaokeState.users.find(function(person){return person.userId===userId;});
      const label=(user?user.displayName:'未設定')+'（'+(item.name||key)+'）';
      if(!owners.some(function(owner){return owner.label===label;}))owners.push({label:label,color:item.color||'#777777'});
    });
    return owners;
  }

  function renderKaraokeSong(){
    const song=karaokeState.song;
    const backAction=karaokeState.resultView?'backFromKaraokeResult()':"renderKaraokeSetup();karaokeState.screen='setup';setKaraokeUrl('setup')";
    document.getElementById('karaokeView').innerHTML=
      '<button class="karaoke-top-back" type="button" onclick="'+backAction+'">‹ <span>BACK</span></button><div class="karaoke-title"><p>KARAOKE</p><h2>'+escapeLyrics(song.title)+' <small>（カラオケ）</small></h2></div>'+
      '<section class="karaoke-lyrics">'+song.parts.map(function(part){
        return '<article><div class="karaoke-owner">'+karaokePartOwners(part).map(function(owner){return '<span style="color:'+escapeLyrics(owner.color)+'">'+escapeLyrics(owner.label)+'</span>';}).join(' / ')+'</div><p>'+escapeLyrics(part.lyrics)+'</p></article>';
      }).join('')+'</section><div class="karaoke-song-footer"><button type="button" onclick="'+backAction+'">BACK</button><button type="button" onclick="navigateTo(\'lyrics\')">トップページへ戻る</button></div>';
  }

  function setKaraokeUrl(mode){
    const params={page:'karaoke',song:karaokeState.song&&karaokeState.song.songId,mode:mode,group:karaokeState.backParams.group,unit:karaokeState.backParams.unit};
    google.script.history.push(params,params,'');
  }

  function backToLyricsSong(){
    const params={page:'lyrics',song:karaokeState.song.songId,group:karaokeState.backParams.group,unit:karaokeState.backParams.unit};
    google.script.history.push(params,params,'');
    renderRoute('lyrics',params);
  }

  function scrollKaraokeTop(){const scroller=document.querySelector('.page-wrap');if(scroller)scroller.scrollTo({top:0,behavior:'smooth'});}
  function showKaraokeError(error){const message=error&&error.message?error.message:String(error);if(typeof showToast==='function')showToast(message);else alert(message);}
</script>

<script>
  const karaokeState={users:[],room:null,history:[],songs:[],category:'',busy:false};
  const KARAOKE_GROUPS=['BE:FIRST','MAZZEL','STARGLOW','HANA','BMSG ALLSTARS'];
  function renderKaraoke(){return document.getElementById('karaokePageTemplate').innerHTML;}
  function initKaraokePage(params){
    const userId=getUniverseUserId();
    const cached=sessionStorage.getItem('bmsgLyricsDataV3');
    if(cached){try{karaokeState.songs=JSON.parse(cached).songs||[];}catch(error){}}
    let ready=0;function finish(){ready++;if(ready<2)return;renderKaraokeState();}
    if(karaokeState.songs.length)finish();else google.script.run.withSuccessHandler(function(data){karaokeState.songs=data.songs||[];try{sessionStorage.setItem('bmsgLyricsDataV3',JSON.stringify(data));}catch(error){}finish();}).withFailureHandler(showKaraokeError).getLyricsCatalog();
    google.script.run.withSuccessHandler(function(data){karaokeState.users=data.users||[];karaokeState.room=data.room||null;karaokeState.history=data.history||[];finish();}).withFailureHandler(showKaraokeError).getKaraokeBootstrap(userId,params&&params.room);
  }
  function renderKaraokeState(){if(!karaokeState.room)renderKaraokeEntry();else if(karaokeState.category)renderKaraokeSongs();else renderKaraokeRoom();}
  function renderKaraokeEntry(){document.getElementById('karaokeView').innerHTML='<section class="karaoke-entry"><p class="karaoke-label">3 PERSON ROOM</p><button class="karaoke-primary" type="button" onclick="createKaraokeRoomUI()">CREATE ROOM</button><div class="karaoke-join"><input id="karaokeRoomInput" inputmode="numeric" maxlength="4" placeholder="4 DIGIT ROOM ID"><button type="button" onclick="joinKaraokeRoomUI()">JOIN</button></div></section><button class="karaoke-back-link" type="button" onclick="navigateTo(\'lyrics\')">BACK TO LYRICS</button>';}
  function createKaraokeRoomUI(){if(karaokeState.busy)return;karaokeState.busy=true;google.script.run.withSuccessHandler(function(room){karaokeState.busy=false;karaokeState.room=room;karaokeState.history=[];setKaraokeUrl();renderKaraokeRoom();}).withFailureHandler(karaokeFailure).createKaraokeRoom(getUniverseUserId());}
  function joinKaraokeRoomUI(){const value=document.getElementById('karaokeRoomInput').value;if(!/^\d{4}$/.test(value)){showKaraokeError('4桁のルームIDを入力してね。');return;}karaokeState.busy=true;google.script.run.withSuccessHandler(function(data){karaokeState.busy=false;karaokeState.room=data.room;karaokeState.history=data.history||[];setKaraokeUrl();renderKaraokeRoom();}).withFailureHandler(karaokeFailure).joinKaraokeRoom(getUniverseUserId(),value);}
  function karaokeFailure(error){karaokeState.busy=false;showKaraokeError(error);}
  function setKaraokeUrl(){const params={page:'karaoke'};if(karaokeState.room)params.room=karaokeState.room.roomId;google.script.history.push(params,params,'');}
  function renderKaraokeRoom(){karaokeState.category='';document.getElementById('karaokeView').innerHTML='<section class="karaoke-room-bar"><div><small>ROOM</small><strong>'+karaokeState.room.roomId+'</strong></div><button type="button" onclick="newKaraokeRoom()">NEW ROOM</button></section><p class="karaoke-label">SELECT ARTIST</p><section class="karaoke-groups">'+KARAOKE_GROUPS.map(function(group){return '<button type="button" onclick="openKaraokeGroup(\''+encodeURIComponent(group)+'\')">'+escapeLyrics(group)+'</button>';}).join('')+'</section>'+renderKaraokeHistory();}
  function newKaraokeRoom(){google.script.run.withSuccessHandler(function(){karaokeState.room=null;karaokeState.history=[];karaokeState.category='';setKaraokeUrl();renderKaraokeEntry();}).withFailureHandler(showKaraokeError).leaveKaraokeRoom(getUniverseUserId());}
  function karaokeGroupSongs(group){return karaokeState.songs.filter(function(song){if(group==='BMSG ALLSTARS')return song.category==='UNIT';return song.category===group;}).sort(function(a,b){return Date.parse(b.releaseDate||'')-Date.parse(a.releaseDate||'')||(Number(b.songId)||0)-(Number(a.songId)||0);});}
  function openKaraokeGroup(encoded){karaokeState.category=decodeURIComponent(encoded);renderKaraokeSongs();scrollKaraokeTop();}
  function renderKaraokeSongs(){const songs=karaokeGroupSongs(karaokeState.category);document.getElementById('karaokeView').innerHTML='<div class="karaoke-subhead"><button onclick="renderKaraokeRoom()">‹</button><h2>'+escapeLyrics(karaokeState.category)+'</h2></div><button class="karaoke-gacha" type="button" onclick="karaokeGacha()">RANDOM SONG</button><section class="karaoke-songs">'+songs.map(function(song){return '<button type="button" onclick="runKaraokeShuffle(\''+encodeURIComponent(song.songId)+'\')">'+escapeLyrics(song.title)+'<span>›</span></button>';}).join('')+'</section>';}
  function karaokeGacha(){const songs=karaokeGroupSongs(karaokeState.category);if(!songs.length)return;runKaraokeShuffle(encodeURIComponent(songs[Math.floor(Math.random()*songs.length)].songId));}
  function runKaraokeShuffle(encoded){if(karaokeState.busy)return;karaokeState.busy=true;google.script.run.withSuccessHandler(function(result){karaokeState.busy=false;karaokeState.history.unshift(result);renderKaraokeResult(result);scrollKaraokeTop();}).withFailureHandler(karaokeFailure).shuffleKaraokeSong({userId:getUniverseUserId(),roomId:karaokeState.room.roomId,songId:decodeURIComponent(encoded)});}
  function renderKaraokeResult(result){document.getElementById('karaokeView').innerHTML='<div class="karaoke-subhead"><button onclick="renderKaraokeSongs()">‹</button><div><small>SHUFFLE RESULT</small><h2>'+escapeLyrics(result.title)+'</h2></div></div><section class="karaoke-assignments">'+result.users.map(function(user){const slots=result.assignments[user.userId]||[];return '<article><p>'+escapeLyrics(user.displayName)+'</p><strong>'+slots.map(function(slot){return escapeLyrics(typeof slot==='string'?slot:slot.name);}).join(' / ')+'</strong></article>';}).join('')+'</section><button class="karaoke-primary" type="button" onclick="runKaraokeShuffle(\''+encodeURIComponent(result.songId)+'\')">SHUFFLE AGAIN</button>';}
  function renderKaraokeHistory(){if(!karaokeState.history.length)return'';return '<section class="karaoke-history"><p class="karaoke-label">HISTORY</p>'+karaokeState.history.slice(0,10).map(function(item){return '<button type="button" onclick="showKaraokeHistoryItem('+karaokeState.history.indexOf(item)+')"><strong>'+escapeLyrics(item.title)+'</strong><span>'+formatKaraokeTime(item.createdAt)+'</span></button>';}).join('')+'</section>';}
  function showKaraokeHistoryItem(index){renderKaraokeResult(karaokeState.history[index]);}
  function formatKaraokeTime(value){try{return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value));}catch(error){return'';}}
  function scrollKaraokeTop(){const scroller=document.querySelector('.page-wrap');if(scroller)scroller.scrollTo({top:0,behavior:'smooth'});}
  function showKaraokeError(error){const message=error&&error.message?error.message:String(error);if(typeof showToast==='function')showToast(message);else alert(message);}
</script>

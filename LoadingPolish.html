<style>
  /* =========================================================
     Universe Shared Loading System v4
     PROFILE ring spinner is the visual source of truth.
     renderUniverseLoading() is the shared loading markup authority.
     ========================================================= */
  :root{
    --u-loading-accent:#9cecff;
    --u-loading-track-dark:rgba(247,251,255,.16);
    --u-loading-track-light:rgba(21,24,32,.16);
    --u-loading-size:18px;
    --u-loading-ring:2px;
    --u-loading-gap:12px;
    --u-loading-speed:.8s;
    --u-loading-label-dark:rgba(232,242,247,.62);
    --u-loading-label-light:rgba(21,24,32,.46);
  }

  .universe-loading,
  .profile-detail-loading,
  .profile-map-loading,
  .profile-search-loading,
  .karaoke-loading,
  .lyrics-loading{
    --loading-accent:var(--u-loading-accent);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:var(--u-loading-gap);
    color:var(--u-loading-label-dark);
    font:600 10px "Exo 2",Roboto,sans-serif;
    letter-spacing:.12em;
  }

  body.theme-light :is(.universe-loading,.profile-detail-loading,.profile-map-loading,.profile-search-loading,.karaoke-loading,.lyrics-loading){
    color:var(--u-loading-label-light);
  }

  .universe-spinner,
  .profile-detail-spinner,
  .profile-map-spinner,
  .profile-search-spinner,
  .karaoke-loading::before,
  .lyrics-loading::before{
    box-sizing:border-box;
    width:var(--u-loading-size);
    height:var(--u-loading-size);
    flex:0 0 auto;
    border:var(--u-loading-ring) solid var(--u-loading-track-dark)!important;
    border-top-color:var(--loading-accent,var(--u-loading-accent))!important;
    border-right-color:var(--loading-accent,var(--u-loading-accent))!important;
    border-radius:50%;
    animation:universeSpinner var(--u-loading-speed) linear infinite!important;
    box-shadow:0 0 12px rgba(156,236,255,.12);
  }

  body.theme-light :is(.universe-spinner,.profile-detail-spinner,.profile-map-spinner,.profile-search-spinner,.karaoke-loading::before,.lyrics-loading::before){
    border-color:var(--u-loading-track-light)!important;
    border-top-color:var(--loading-accent,var(--u-loading-accent))!important;
    border-right-color:var(--loading-accent,var(--u-loading-accent))!important;
  }

  .karaoke-loading::before,
  .lyrics-loading::before{content:""}

  /* Direct shared-renderer hosts must never receive a legacy pseudo spinner. */
  .karaoke-loading.is-shared::before,
  .lyrics-loading.is-shared::before{display:none!important;content:none!important}

  /* Member detail uses Member Color when legacy markup is encountered. */
  .profile-member-detail .profile-detail-loading{
    --loading-accent:var(--member-accent,var(--u-loading-accent));
  }

  /* General legacy loader hosts are always Soft Cyan unless an explicit inline accent is supplied. */
  .profile-map-loading,
  .profile-search-loading,
  .karaoke-loading,
  .lyrics-loading{
    --loading-accent:#9cecff;
  }

  /* Room bootstrap renders the shared spinner directly; no pseudo duplicate. */
  .lyrics-room-card.is-loading{
    min-height:118px;
    display:grid;
    place-items:center;
  }
  .lyrics-room-card.is-loading::before{display:none!important;content:none!important}
  .lyrics-room-card.is-loading .universe-loading{gap:0}

  /* Full-screen / shared state loader. */
  .loading-space{
    --loading-accent:#9cecff;
    display:grid;
    place-items:center;
    gap:14px;
    min-height:220px;
    color:var(--u-loading-label-dark);
  }
  body.theme-light .loading-space{color:var(--u-loading-label-light)}
  .loading-space .loading-svg,
  .loading-space .loading-label{display:none!important}
  .loading-space::before{
    content:"";
    box-sizing:border-box;
    width:22px;
    height:22px;
    border:2px solid var(--u-loading-track-dark)!important;
    border-top-color:var(--loading-accent)!important;
    border-right-color:var(--loading-accent)!important;
    border-radius:50%;
    animation:universeSpinner var(--u-loading-speed) linear infinite!important;
    box-shadow:0 0 14px rgba(156,236,255,.14);
  }
  body.theme-light .loading-space::before{
    border-color:var(--u-loading-track-light)!important;
    border-top-color:var(--loading-accent)!important;
    border-right-color:var(--loading-accent)!important;
  }
  .loading-space::after{
    content:"LOADING UNIVERSE";
    font:600 10px "Exo 2",Roboto,sans-serif;
    letter-spacing:.13em;
  }

  .loading-space.loading-space-shared::before,
  .loading-space.loading-space-shared::after{display:none}
  .loading-space.loading-space-shared .universe-loading{flex-direction:column;gap:14px}
  .loading-space.loading-space-shared .universe-spinner{width:22px;height:22px}

  @keyframes universeSpinner{to{transform:rotate(360deg)}}

  @media(prefers-reduced-motion:reduce){
    .universe-spinner,.profile-detail-spinner,.profile-map-spinner,.profile-search-spinner,.karaoke-loading::before,.lyrics-loading::before,.loading-space::before{animation:none!important}
  }
</style>
<script>
  function normalizeUniverseLoadingAccent(value){
    const color=String(value||'').trim();
    return /^#[0-9a-f]{6}$/i.test(color)?color:'#9cecff';
  }

  function renderUniverseLoading(label,accent){
    const safeAccent=normalizeUniverseLoadingAccent(accent);
    const hasLabel=label!==false&&label!==null;
    const text=hasLabel?String(label||'読み込み中'):'';
    const safeLabel=typeof escapeHtml==='function'?escapeHtml(text):text;
    return '<div class="universe-loading" role="status" aria-live="polite" style="--loading-accent:'+safeAccent+'"><span class="universe-spinner" aria-hidden="true"></span>'+(hasLabel?'<span>'+safeLabel+'</span>':'')+'</div>';
  }
</script>

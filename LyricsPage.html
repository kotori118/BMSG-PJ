<template id="lyricsPageTemplate">
  <section class="lyrics-page">
    <header class="lyrics-page-head">
      <button class="u-btn lyrics-service-back" type="button" onclick="navigateTo('data')" aria-label="DATAへ戻る">‹</button>
      <h1>LYRICS</h1>
    </header>
    <main id="lyricsView" class="lyrics-view">
      <div class="lyrics-loading is-shared is-page-layout" role="status" aria-live="polite" aria-label="LYRICSを読み込み中">
        <section class="lyrics-page-skeleton-room" aria-hidden="true">
          <span class="skeleton-block lyrics-page-skeleton-kicker"></span>
          <span class="skeleton-block lyrics-page-skeleton-primary"></span>
          <div class="lyrics-page-skeleton-join">
            <span class="skeleton-block lyrics-page-skeleton-input"></span>
            <span class="skeleton-block lyrics-page-skeleton-join-button"></span>
          </div>
        </section>
        <section class="lyrics-page-skeleton-groups" aria-hidden="true">
          <article class="lyrics-page-skeleton-group"><span class="skeleton-block lyrics-page-skeleton-name"></span><span class="skeleton-block lyrics-page-skeleton-count"></span></article>
          <article class="lyrics-page-skeleton-group"><span class="skeleton-block lyrics-page-skeleton-name"></span><span class="skeleton-block lyrics-page-skeleton-count"></span></article>
          <article class="lyrics-page-skeleton-group"><span class="skeleton-block lyrics-page-skeleton-name"></span><span class="skeleton-block lyrics-page-skeleton-count"></span></article>
          <article class="lyrics-page-skeleton-group"><span class="skeleton-block lyrics-page-skeleton-name"></span><span class="skeleton-block lyrics-page-skeleton-count"></span></article>
          <article class="lyrics-page-skeleton-group"><span class="skeleton-block lyrics-page-skeleton-name"></span><span class="skeleton-block lyrics-page-skeleton-count"></span></article>
        </section>
        <section class="lyrics-page-skeleton-gacha" aria-hidden="true">
          <span class="skeleton-block lyrics-page-skeleton-gacha-title"></span>
          <span class="skeleton-block lyrics-page-skeleton-gacha-copy"></span>
        </section>
      </div>
    </main>
  </section>
  <div id="lyricsEditor" class="lyrics-editor" hidden>
    <section class="lyrics-editor-card" role="dialog" aria-modal="true">
      <button class="lyrics-editor-close" type="button" onclick="closeLyricsEditor()">×</button>
      <p class="lyrics-label">パート編集</p><h2>歌詞を編集</h2>
      <label>歌唱者<input id="lyricsSingerInput" type="text"></label>
      <label>歌詞<textarea id="lyricsTextInput" rows="6"></textarea></label>
      <div id="lyricsPreview" hidden></div>
      <div class="lyrics-editor-actions"><button id="lyricsSaveButton" type="button" onclick="saveLyricsEdit()">保存</button></div>
    </section>
  </div>
</template>

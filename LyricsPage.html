<template id="lyricsPageTemplate">
  <section class="lyrics-page">
    <header class="lyrics-page-head">
      <button class="u-btn lyrics-service-back" type="button" onclick="navigateTo('data')" aria-label="DATAへ戻る">‹</button>
      <h1>LYRICS</h1>
    </header>
    <main id="lyricsView" class="lyrics-view">
      <section class="lyrics-room-card is-loading" aria-hidden="true">
        <span class="skeleton-block" style="display:block;width:28%;height:11px;border-radius:6px"></span>
        <span class="skeleton-block" style="display:block;width:72%;height:18px;margin-top:14px;border-radius:8px"></span>
        <span class="skeleton-block" style="display:block;width:100%;height:50px;margin-top:16px;border-radius:15px"></span>
      </section>
      <section class="lyrics-groups" aria-hidden="true">
        <div class="lyrics-group-card"><span class="skeleton-block" style="display:block;width:42%;height:20px;border-radius:8px"></span><span class="skeleton-block" style="display:block;width:24%;height:10px;margin-top:9px;border-radius:6px"></span></div>
        <div class="lyrics-group-card"><span class="skeleton-block" style="display:block;width:48%;height:20px;border-radius:8px"></span><span class="skeleton-block" style="display:block;width:22%;height:10px;margin-top:9px;border-radius:6px"></span></div>
        <div class="lyrics-group-card"><span class="skeleton-block" style="display:block;width:38%;height:20px;border-radius:8px"></span><span class="skeleton-block" style="display:block;width:26%;height:10px;margin-top:9px;border-radius:6px"></span></div>
      </section>
    </main>
  </section>
  <div id="lyricsEditor" class="lyrics-editor" hidden>
    <section class="lyrics-editor-card" role="dialog" aria-modal="true">
      <button class="lyrics-editor-close" type="button" onclick="closeLyricsEditor()">×</button>
      <p class="lyrics-label">パート編集</p><h2>歌詞を編集</h2>
      <label>歌唱者<input id="lyricsSingerInput" type="text"></label>
      <label>歌詞<textarea id="lyricsTextInput" rows="6"></textarea></label>
      <div class="lyrics-editor-actions"><button id="lyricsSaveButton" type="button" onclick="saveLyricsEdit()">保存</button></div>
    </section>
  </div>
</template>

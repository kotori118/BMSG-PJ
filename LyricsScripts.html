<script>
  const lyricsState={catalog:[],partsBySong:{},groupColors:{},group:'',unit:'',query:'',song:null,editing:null,previewed:false,initialParams:{},karaokeRoom:null,karaokeHistory:[],karaokeRoomReady:false,karaokeBusy:false};
  const LYRICS_GROUPS=['BE:FIRST','MAZZEL','STARGLOW','HANA','BMSG ALLSTARS'];
  const LYRICS_UNITS=['ALL','BMSG ALLSTARS','ShowMinorSavage','BMSG POSSE','BMSG EAST','BMSG WEST','BMSG SKY','BMSG GAIA','BMSG MARINE','BMSG STRIKERS','その他UNIT'];
  function renderLyrics(){return document.getElementById('lyricsPageTemplate').innerHTML.replace('__LYRICS_LOADING__',renderUniverseLoading('LOADING...','#9cecff'));}
  function applyLyricsData(data){
    lyricsState.catalog=data.songs||[];
    lyricsState.partsBySong=data.partsBySong||{};
    lyricsState.groupColors=data.groupColors||{};
    const params=lyricsState.initialParams||{};
    if(params.song){
      lyricsState.group=params.group||'';
      lyricsState.unit=params.unit||'';
      openLyricsSong(lyricArg(params.song),false);
    }else if(params.group){
      lyricsState.group=params.group;
      lyricsState.unit=params.unit||'';
      if(params.group==='BMSG ALLSTARS')renderLyricsAllStars();
      else renderLyricsGroupSongs();
    }else showLyricsGroups(false);
  }
  function initLyricsPage(params){
    lyricsState.initialParams=params||{};
    loadLyricsKaraokeRoom();
    try{const cached=sessionStorage.getItem('bmsgLyricsDataV4');if(cached){applyLyricsData(JSON.parse(cached));return;}}catch(error){}
    google.script.run.withSuccessHandler(function(data){try{sessionStorage.setItem('bmsgLyricsDataV4',JSON.stringify(data));}catch(error){}applyLyricsData(data);}).withFailureHandler(showLyricsError).getLyricsCatalog();
  }
  function setLyricsUrl(values){
    const params={page:'lyrics'};
    Object.keys(values||{}).forEach(function(key){if(values[key])params[key]=values[key];});
    google.script.history.push(params,params,'');
  }
  function lyricArg(value){return encodeURIComponent(String(value));}
  function lyricsGroupColor(name){return lyricsState.groupColors[name]||'#ffffff';}
  function lyricsGroupTextColor(name){
    const color=lyricsGroupColor(name);
    const match=color.match(/^#([0-9a-f]{6})$/i);
    if(!match)return'var(--ink)';
    const value=parseInt(match[1],16),r=(value>>16)&255,g=(value>>8)&255,b=value&255;
    return (.299*r+.587*g+.114*b)>170?'var(--ink)':'#ffffff';
  }
  function lyricsGroupButtonStyle(){return 'color:var(--ink);';}
  function unitSongs(unit){return lyricsState.catalog.filter(function(song){if(unit==='ALL')return song.category==='UNIT';return song.category==='UNIT'&&song.unitCategory===unit;});}
  function groupSongs(group){if(group==='BMSG ALLSTARS')return unitSongs('ALL');return lyricsState.catalog.filter(function(song){return song.category===group;});}
  function showLyricsGroups(pushUrl){lyricsState.group='';lyricsState.unit='';lyricsState.song=null;if(pushUrl!==false)setLyricsUrl({});document.getElementById('lyricsView').innerHTML='<div id="lyricsKaraokeRoom">'+renderLyricsKaraokeRoom()+'</div><section class="lyrics-groups">'+LYRICS_GROUPS.map(function(group){return '<button class="lyrics-group-card is-colored" style="'+lyricsGroupButtonStyle(group)+'" type="button" onclick="showLyricsGroup(\''+lyricArg(group)+'\')"><strong>'+escapeLyrics(group)+'</strong><span>'+groupSongs(group).length+' SONGS</span></button>';}).join('')+'</section><button class="lyrics-gacha-card" type="button" disabled><strong>SONG GACHA</strong><span>COMING NEXT</span></button>';scrollLyricsTop();}

  function renderLyricsKaraokeRoom(){
    if(!lyricsState.karaokeRoomReady)return '<section class="lyrics-room-card is-loading">'+renderUniverseLoading(false,'#9cecff')+'</section>';
    if(!lyricsState.karaokeRoom){
      return '<section class="lyrics-room-card"><p>KARAOKE ROOM</p><button class="lyrics-room-primary" type="button" onclick="createLyricsKaraokeRoom()">ルームを作る</button><div class="lyrics-room-join"><input id="lyricsRoomInput" inputmode="numeric" maxlength="4" placeholder="4桁のルームID"><button type="button" onclick="joinLyricsKaraokeRoom()">参加</button></div></section>';
    }
    const hasLatest=lyricsState.karaokeHistory.length>0;
    return '<section class="lyrics-room-card is-active"><div class="lyrics-room-id"><span>ROOM ID</span><strong>'+escapeLyrics(lyricsState.karaokeRoom.roomId)+'</strong></div><button class="lyrics-room-primary" type="button"'+(hasLatest?' onclick="openLatestLyricsKaraoke()"':' disabled')+'>'+(hasLatest?'最新結果を見る':'まだ結果がありません')+'</button><div class="lyrics-room-subactions"><button type="button" onclick="navigateTo(\'karaoke\')">履歴</button><button type="button" onclick="leaveLyricsKaraokeRoom()">退出</button></div></section>';
  }

  function updateLyricsKaraokeRoom(){
    const target=document.getElementById('lyricsKaraokeRoom');
    if(target)target.innerHTML=renderLyricsKaraokeRoom();
  }

  function requireLyricsUniverseUser(){
    const userId=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(userId)return userId;
    if(typeof openUserChooser==='function')openUserChooser(true);
    return '';
  }

  function loadLyricsKaraokeRoom(){
    lyricsState.karaokeRoomReady=false;
    const userId=requireLyricsUniverseUser();
    if(!userId){
      lyricsState.karaokeRoomReady=true;
      lyricsState.karaokeRoom=null;
      lyricsState.karaokeHistory=[];
      updateLyricsKaraokeRoom();
      return;
    }
    google.script.run.withSuccessHandler(function(data){
      lyricsState.karaokeRoomReady=true;
      lyricsState.karaokeRoom=data.room||null;
      lyricsState.karaokeHistory=data.history||[];
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){
      lyricsState.karaokeRoomReady=true;
      lyricsState.karaokeRoom=null;
      lyricsState.karaokeHistory=[];
      updateLyricsKaraokeRoom();
      showLyricsError(error);
    }).getKaraokeBootstrap(userId);
  }

  function createLyricsKaraokeRoom(){
    if(lyricsState.karaokeBusy)return;
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    lyricsState.karaokeBusy=true;
    google.script.run.withSuccessHandler(function(room){
      lyricsState.karaokeBusy=false;
      lyricsState.karaokeRoom=room;
      lyricsState.karaokeHistory=[];
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){lyricsState.karaokeBusy=false;showLyricsError(error);}).createKaraokeRoom(userId);
  }

  function joinLyricsKaraokeRoom(){
    if(lyricsState.karaokeBusy)return;
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    const input=document.getElementById('lyricsRoomInput');
    const roomId=input?input.value.trim():'';
    if(!/^\d{4}$/.test(roomId)){showLyricsError('4桁のルームIDを入力してね。');return;}
    lyricsState.karaokeBusy=true;
    google.script.run.withSuccessHandler(function(data){
      lyricsState.karaokeBusy=false;
      lyricsState.karaokeRoom=data.room;
      lyricsState.karaokeHistory=data.history||[];
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){lyricsState.karaokeBusy=false;showLyricsError(error);}).joinKaraokeRoom(userId,roomId);
  }

  function leaveLyricsKaraokeRoom(){
    if(lyricsState.karaokeBusy)return;
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    lyricsState.karaokeBusy=true;
    google.script.run.withSuccessHandler(function(){
      lyricsState.karaokeBusy=false;
      lyricsState.karaokeRoom=null;
      lyricsState.karaokeHistory=[];
      updateLyricsKaraokeRoom();
    }).withFailureHandler(function(error){lyricsState.karaokeBusy=false;showLyricsError(error);}).leaveKaraokeRoom(userId);
  }

  function openLatestLyricsKaraoke(){
    if(!lyricsState.karaokeRoom||!lyricsState.karaokeHistory.length)return;
    const params={page:'karaoke',mode:'latest',room:lyricsState.karaokeRoom.roomId};
    google.script.history.push(params,params,'');
    renderRoute('karaoke',params);
  }

  function showLyricsGroup(encoded,pushUrl){const group=decodeURIComponent(encoded);lyricsState.group=group;lyricsState.unit='';lyricsState.query='';if(pushUrl!==false)setLyricsUrl({group:group});if(group==='BMSG ALLSTARS')renderLyricsAllStars();else renderLyricsGroupSongs();scrollLyricsTop();}
  function renderLyricsAllStars(){
    lyricsState.unit='';
    const units=LYRICS_UNITS.filter(function(unit){return unit!=='ALL'&&unitSongs(unit).length;});
    document.getElementById('lyricsView').innerHTML='<div class="lyrics-subhead"><button type="button" onclick="showLyricsGroups()">‹</button><div><h2>BMSG ALLSTARS</h2></div></div><section class="lyrics-allstars-groups">'+units.map(function(unit){
      const songs=unitSongs(unit).slice().sort(function(a,b){return songTime(b)-songTime(a)||(Number(b.songId)||0)-(Number(a.songId)||0);});
      return '<section class="lyrics-allstars-section"><h3 class="'+(unit==='BMSG POSSE'?'is-posse':'')+'" style="color:var(--ink)">'+escapeLyrics(unit)+'</h3><div class="lyrics-song-list">'+songs.map(function(song){return '<button class="lyrics-song-card" type="button" onclick="openLyricsAllStarsSong(\''+lyricArg(unit)+'\',\''+lyricArg(song.songId)+'\')"><strong>'+escapeLyrics(song.title)+'</strong><b>›</b></button>';}).join('')+'</div></section>';
    }).join('')+'</section>';
    scrollLyricsTop();
  }

  function openLyricsAllStarsSong(encodedUnit,encodedSong){
    lyricsState.unit=decodeURIComponent(encodedUnit);
    openLyricsSong(encodedSong);
  }

  function showLyricsUnit(encoded,pushUrl){lyricsState.unit=decodeURIComponent(encoded);lyricsState.query='';if(pushUrl!==false)setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit});renderLyricsGroupSongs();scrollLyricsTop();}
  function songTime(song){const time=Date.parse(song.releaseDate||'');return Number.isFinite(time)?time:0;}
  function activeSongs(){const songs=lyricsState.group==='BMSG ALLSTARS'?unitSongs(lyricsState.unit||'ALL'):groupSongs(lyricsState.group);return songs.slice().sort(function(a,b){return songTime(b)-songTime(a)||(Number(b.songId)||0)-(Number(a.songId)||0);});}
  function activeTitle(){return lyricsState.group==='BMSG ALLSTARS'?(lyricsState.unit||'ALL'):lyricsState.group;}
  function backFromSongs(){if(lyricsState.group==='BMSG ALLSTARS'){setLyricsUrl({group:lyricsState.group});renderLyricsAllStars();}else showLyricsGroups();}
  function renderLyricsGroupSongs(){const songs=activeSongs().filter(function(song){const q=lyricsState.query;return !q||song.title.toLowerCase().startsWith(q);});document.getElementById('lyricsView').innerHTML='<div class="lyrics-subhead"><button type="button" onclick="backFromSongs()">‹</button><div><h2>'+escapeLyrics(activeTitle())+'</h2></div></div><input id="lyricsSearch" class="lyrics-search" type="search" placeholder="曲名を検索" value="'+escapeLyrics(lyricsState.query)+'"><p class="lyrics-count">'+songs.length+' SONGS</p><section class="lyrics-song-list">'+(songs.length?songs.map(function(song){return '<button class="lyrics-song-card" type="button" onclick="openLyricsSong(\''+lyricArg(song.songId)+'\')"><strong>'+escapeLyrics(song.title)+'</strong><b>›</b></button>';}).join(''):'<p class="lyrics-empty">NO SONGS</p>')+'</section>';document.getElementById('lyricsSearch').addEventListener('input',function(e){lyricsState.query=e.target.value.trim().toLowerCase();renderLyricsGroupSongs();const input=document.getElementById('lyricsSearch');input.focus();input.setSelectionRange(input.value.length,input.value.length);});}
  function openLyricsSong(encoded,pushUrl){
    const songId=decodeURIComponent(encoded);
    const meta=lyricsState.catalog.find(function(item){return item.songId===songId;});
    if(!meta){showLyricsError('曲が見つかりません。');return;}
    lyricsState.song={songId:songId,title:meta.title,artist:meta.artist,parts:lyricsState.partsBySong[songId]||[]};
    if(pushUrl!==false)setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit,song:songId});
    renderLyricsSong();scrollLyricsTop();
  }
  function backToLyricsSongs(){setLyricsUrl({group:lyricsState.group,unit:lyricsState.unit});renderLyricsGroupSongs();scrollLyricsTop();}
  function renderLyricsSinger(part){
    const items=(part.singers&&part.singers.length)?part.singers:[{name:part.singer,color:'#777777',harmony:''}];
    return items.map(function(singer){
      const mark=singer.harmony==='up'?' ↑':singer.harmony==='down'?' ↓':singer.harmony==='sub'?' (SUB)':'';
      return '<span style="color:'+escapeLyrics(singer.color)+'">'+escapeLyrics(singer.name+mark)+'</span>';
    }).join('<span class="lyrics-singer-separator"> / </span>');
  }
  function lyricsMicrophoneIcon(){
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"></path></svg>';
  }
  function lyricsSongActions(){
    return '<div class="lyrics-song-actions"><button class="lyrics-list-back" type="button" onclick="backToLyricsSongs()">BACK</button><button class="lyrics-karaoke-icon" type="button" aria-label="カラオケ設定" onclick="openKaraokeFromLyrics(\''+lyricArg(lyricsState.song.songId)+'\')">'+lyricsMicrophoneIcon()+'<span>KARAOKE</span></button></div>';
  }
  function renderLyricsSong(){
    const song=lyricsState.song;
    const editing=typeof isLyricsEditMode==='function'&&isLyricsEditMode();
    document.getElementById('lyricsView').innerHTML='<div class="lyrics-song-title"><h2>'+escapeLyrics(song.title)+'</h2></div>'+lyricsSongActions()+'<section class="lyrics-parts '+(editing?'is-editing':'')+'">'+song.parts.map(function(part){
      const tag=editing?'button':'div';
      const action=editing?' type="button" onclick="openLyricsEditor('+part.partOrder+')"':'';
      return '<'+tag+' class="lyrics-part"'+action+'><div class="lyrics-singer">'+renderLyricsSinger(part)+'</div><p>'+escapeLyrics(part.lyrics)+'</p>'+(editing?'<small>EDIT</small>':'')+'</'+tag+'>';
    }).join('')+'</section>'+lyricsSongActions();
  }
  function openKaraokeFromLyrics(encoded){const songId=decodeURIComponent(encoded);const params={page:'karaoke',song:songId,group:lyricsState.group||'',unit:lyricsState.unit||''};google.script.history.push(params,params,'');renderRoute('karaoke',params);}
  function openLyricsEditor(order){const part=lyricsState.song.parts.find(function(p){return p.partOrder===order;});if(!part)return;lyricsState.editing=part;lyricsState.previewed=false;document.getElementById('lyricsSingerInput').value=part.singer;document.getElementById('lyricsTextInput').value=part.lyrics;document.getElementById('lyricsPreview').innerHTML='<p>プレビュー</p>';const saveButton=document.getElementById('lyricsSaveButton');saveButton.disabled=false;saveButton.textContent='保存';document.getElementById('lyricsEditor').hidden=false;}
  function closeLyricsEditor(){document.getElementById('lyricsEditor').hidden=true;lyricsState.editing=null;}
  function previewLyricsEdit(){const singer=document.getElementById('lyricsSingerInput').value.trim(),lyrics=document.getElementById('lyricsTextInput').value.trim();if(!singer||!lyrics){showLyricsError('歌唱者と歌詞を入力してね。');return;}document.getElementById('lyricsPreview').innerHTML='<strong>'+escapeLyrics(singer)+'</strong><p>'+escapeLyrics(lyrics)+'</p>';lyricsState.previewed=true;document.getElementById('lyricsSaveButton').disabled=false;}
  function saveLyricsEdit(){
    if(!lyricsState.editing)return;
    const singerInput=document.getElementById('lyricsSingerInput');
    const lyricsInput=document.getElementById('lyricsTextInput');
    const singer=singerInput.value.trim();
    const lyrics=lyricsInput.value.trim();
    if(!singer||!lyrics){showLyricsError('歌唱者と歌詞を入力してね。');return;}
    const userId=requireLyricsUniverseUser();
    if(!userId)return;
    const button=document.getElementById('lyricsSaveButton');
    button.disabled=true;
    google.script.run.withSuccessHandler(function(saved){
      const part=lyricsState.song.parts.find(function(p){return p.partOrder===saved.partOrder;});
      part.singer=saved.singer;
      part.lyrics=saved.lyrics;
      part.singers=saved.singers||part.singers;
      try{sessionStorage.setItem('bmsgLyricsDataV4',JSON.stringify({songs:lyricsState.catalog,partsBySong:lyricsState.partsBySong,groupColors:lyricsState.groupColors}));}catch(error){}
      closeLyricsEditor();
      renderLyricsSong();
      if(typeof showToast==='function')showToast('保存しました');
    }).withFailureHandler(function(error){
      button.disabled=false;
      showLyricsError(error);
    }).updateLyricsPart({userId:userId,songId:lyricsState.song.songId,partOrder:lyricsState.editing.partOrder,singer:singer,lyrics:lyrics});
  }
  function scrollLyricsTop(){const scroller=document.querySelector('.page-wrap');if(scroller)scroller.scrollTo({top:0,behavior:'smooth'});}
  function showLyricsError(error){const message=error&&error.message?error.message:String(error);if(typeof showToast==='function')showToast(message);else alert(message);}
  function escapeLyrics(value){const div=document.createElement('div');div.textContent=String(value==null?'':value);return div.innerHTML;}
</script>

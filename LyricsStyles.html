<style>
  .lyrics-page{
    box-sizing:border-box;min-height:100%;padding:82px 0 72px;color:var(--ink);
    background:#fff;font-family:Roboto,"Zen Kaku Gothic New",sans-serif;
  }
  .lyrics-page-head,.lyrics-view{width:min(100%,820px);margin-inline:auto}
  .lyrics-page-head{margin-bottom:28px}
  .lyrics-page-head p,.lyrics-label,.lyrics-subhead p{
    margin:0 0 6px;color:var(--cyan);font:600 10px "Exo 2",Roboto,sans-serif;letter-spacing:.18em
  }
  .lyrics-page-head h1{margin:0;color:var(--ink);font:600 clamp(40px,8vw,68px)/.95 Orbitron,sans-serif;letter-spacing:.025em}
  .lyrics-loading,.lyrics-empty{padding:48px 0;text-align:center;color:rgba(21,24,32,.42);font:600 11px "Exo 2",sans-serif;letter-spacing:.14em}

  .lyrics-groups{display:grid;gap:12px}.lyrics-song-list{display:grid;gap:7px}
  .lyrics-group-card,.lyrics-song-card,.lyrics-gacha-card{
    box-sizing:border-box;width:100%;border:1px solid rgba(21,24,32,.12);border-radius:20px;
    color:var(--ink);background:#fff;box-shadow:none;cursor:pointer;-webkit-tap-highlight-color:transparent
  }
  .lyrics-group-card{min-height:92px;padding:20px;text-align:left}
  .lyrics-group-card strong,.lyrics-gacha-card strong{display:block;font:600 21px Orbitron,"Zen Kaku Gothic New",sans-serif;letter-spacing:.01em}
  .lyrics-group-card span,.lyrics-gacha-card span{display:block;margin-top:6px;color:rgba(21,24,32,.42);font:600 9px "Exo 2",sans-serif;letter-spacing:.13em}
  .lyrics-unit-card{min-height:78px}
  .lyrics-gacha-card{min-height:86px;margin-top:28px;padding:20px;text-align:left;opacity:.55}

  .lyrics-subhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .lyrics-subhead button{
    width:46px;height:46px;flex:0 0 auto;border:1px solid rgba(21,24,32,.13);border-radius:14px;
    color:var(--ink);background:#fff;font-size:29px;line-height:1;cursor:pointer
  }
  .lyrics-subhead h2{margin:2px 0 0;color:var(--ink);font:600 clamp(25px,5vw,36px)/1.1 Orbitron,"Zen Kaku Gothic New",sans-serif}
  .lyrics-search{
    box-sizing:border-box;width:100%;height:54px;padding:0 17px;border:1px solid rgba(21,24,32,.13);
    border-radius:16px;outline:0;color:var(--ink);background:#fff;font:500 15px Roboto,"Zen Kaku Gothic New",sans-serif
  }
  .lyrics-count{margin:24px 2px 12px;color:rgba(21,24,32,.42);font:600 10px "Exo 2",sans-serif;letter-spacing:.14em}
  .lyrics-song-card{position:relative;display:block;min-height:56px;padding:15px 42px 15px 17px;text-align:left}
  .lyrics-song-card strong{font:600 15px Roboto,"Zen Kaku Gothic New",sans-serif}
  .lyrics-song-card span{color:rgba(21,24,32,.48);font-size:11px}
  .lyrics-song-card b{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:rgba(21,24,32,.3);font-size:24px}

  .lyrics-page:has(.lyrics-song-title){padding-top:82px;background:#fff}
  .lyrics-page:has(.lyrics-song-title) .lyrics-page-head{display:none}
  .lyrics-view:has(.lyrics-song-title){box-sizing:border-box;padding:0 4px;background:#fff}
  .lyrics-song-title{padding:0 0 18px;margin:0 0 18px;text-align:center;border-bottom:1px solid rgba(21,24,32,.65)}
  .lyrics-song-title h2{margin:0;color:var(--ink);font:600 clamp(25px,5.5vw,34px)/1.2 Orbitron,"Zen Kaku Gothic New",sans-serif}
  .lyrics-list-back{
    width:auto;min-height:46px;margin:0 0 36px;padding:0 17px;border:1px solid rgba(21,24,32,.13);
    border-radius:14px;color:var(--ink);background:#fff;font:600 12px "Zen Kaku Gothic New",sans-serif;cursor:pointer
  }
  .lyrics-parts{display:block;width:100%;background:#fff}
  .lyrics-part{
    position:relative;box-sizing:border-box;display:block;width:100%;margin:0 0 30px;padding:0;
    text-align:left;border:0;color:#111;background:transparent
  }
  .lyrics-singer{font:700 15px "Exo 2",Roboto,sans-serif;letter-spacing:.01em}
  .lyrics-singer-separator{color:rgba(21,24,32,.35)}
  .lyrics-part p{margin:8px 0 0;font:400 18px/1.85 "Zen Kaku Gothic New",Roboto,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
  .lyrics-part small{display:none}
  .lyrics-parts.is-editing .lyrics-part{padding:13px;border:1px dashed rgba(21,24,32,.28);border-radius:14px;cursor:pointer}
  .lyrics-parts.is-editing .lyrics-part small{position:absolute;right:10px;top:10px;display:block;color:rgba(21,24,32,.42);font:600 9px "Exo 2",sans-serif}

  .lyrics-editor[hidden]{display:none}
  .lyrics-editor{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:rgba(8,14,22,.56)}
  .lyrics-editor-card{position:relative;box-sizing:border-box;width:min(600px,100%);max-height:88dvh;overflow:auto;padding:24px;border:1px solid rgba(21,24,32,.12);border-radius:24px;color:var(--ink);background:#fff}
  .lyrics-editor-card h2{margin:0 0 20px;font:600 25px Orbitron,"Zen Kaku Gothic New",sans-serif}
  .lyrics-editor-card label{display:grid;gap:7px;margin:13px 0;font-size:13px;font-weight:700}
  .lyrics-editor-card input,.lyrics-editor-card textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid rgba(21,24,32,.15);border-radius:13px;font:400 16px "Zen Kaku Gothic New",Roboto,sans-serif}
  .lyrics-editor-close{position:absolute;right:14px;top:12px;width:40px;height:40px;border:1px solid rgba(21,24,32,.12);border-radius:50%;color:var(--ink);background:#fff;font-size:23px}
  .lyrics-preview{min-height:60px;margin:16px 0;padding:13px;border-radius:14px;background:var(--star-off-white)}
  .lyrics-preview p{white-space:pre-wrap}
  .lyrics-editor-actions{display:flex;justify-content:flex-end;gap:9px}
  .lyrics-editor-actions button{min-height:44px;padding:0 15px;border:0;border-radius:13px;background:#eceff1}
  .lyrics-editor-actions button:last-child{color:#fff;background:var(--ink)}
  .lyrics-editor-actions button:disabled{opacity:.4}

  body.theme-light .screen-overlay{color:var(--ink);background:rgba(248,250,249,.99)}
  body.theme-light .screen-overlay .overlay-close,body.theme-light .modal-overlay .overlay-close{border-color:rgba(21,24,32,.13);color:var(--ink);background:#fff}
  body.theme-light .search-field{border-color:rgba(21,24,32,.13);background:#fff}
  body.theme-light .search-field svg{stroke:rgba(21,24,32,.58)}
  body.theme-light .search-input{color:var(--ink)}
  body.theme-light .search-input::placeholder{color:rgba(21,24,32,.34)}
  body.theme-light .search-status{color:rgba(21,24,32,.42)}
  body.theme-light .search-result{border-color:rgba(21,24,32,.1);color:var(--ink);background:#fff}
  body.theme-light .search-result-parent,body.theme-light .search-result-copy{color:rgba(21,24,32,.48)}
  body.theme-light .modal-overlay{background:rgba(236,240,239,.82)}
  body.theme-light .settings-panel,body.theme-light .state-panel{border-color:rgba(21,24,32,.12);color:var(--ink);background:#fff;box-shadow:0 28px 80px rgba(8,14,22,.16)}
  body.theme-light .settings-user-card,body.theme-light .tool-button{border-color:rgba(21,24,32,.1);color:var(--ink);background:var(--star-off-white)}
  body.theme-light .settings-label,body.theme-light .settings-note,body.theme-light .settings-section-title{color:rgba(21,24,32,.45)}
  body.theme-light .settings-user{color:var(--ink)}
  body.theme-light .settings-change{border-color:rgba(21,24,32,.12);color:var(--ink);background:#fff}
  body.theme-light .tool-status{color:rgba(21,24,32,.46)}

  @media(max-width:720px){
    .lyrics-page{padding:76px 0 68px}
    .lyrics-page:has(.lyrics-song-title){padding-top:76px}
    .lyrics-group-card{min-height:86px}
    .lyrics-view:has(.lyrics-song-title){padding:0}
    .lyrics-song-title{margin-bottom:16px}
    .lyrics-list-back{margin-bottom:30px}
    .lyrics-part{margin-bottom:28px}
    .lyrics-part p{font-size:17px;line-height:1.85}
  }

  body.theme-light .app-shell,body.theme-light .page-wrap,body.theme-light .page-content{background:#fff}
  body.theme-light .lyrics-page button{-webkit-tap-highlight-color:transparent;transition:none}
  body.theme-light .lyrics-page button:focus{outline:none}
  body.theme-light .lyrics-page button:focus-visible{outline:1px solid rgba(21,24,32,.28);outline-offset:2px}
  body.theme-light .lyrics-page button:active{filter:none;box-shadow:none;background-color:#f7f8f8}

  .lyrics-karaoke-entry{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:66px;margin-bottom:18px;padding:0 18px;border:1px solid rgba(21,24,32,.12);border-radius:18px;color:var(--ink);background:#f4f7f7;text-align:left;-webkit-tap-highlight-color:transparent}
  .lyrics-karaoke-entry strong{font:600 17px Orbitron,sans-serif}
  .lyrics-karaoke-entry span{color:rgba(21,24,32,.45);font:600 9px "Exo 2",sans-serif;letter-spacing:.12em}
  .lyrics-karaoke-mode{box-sizing:border-box;width:100%;min-height:54px;margin:8px 0 16px;border:1px solid rgba(21,24,32,.13);border-radius:16px;color:var(--ink);background:rgba(156,236,255,.09);font:600 12px "Exo 2","Zen Kaku Gothic New",sans-serif;letter-spacing:.08em}

  .lyrics-room-card{box-sizing:border-box;width:100%;margin:0 0 22px;padding:24px;border:1px solid rgba(21,24,32,.12);border-radius:22px;color:var(--ink);background:var(--star-off-white)}
  .lyrics-room-card>p{margin:0 0 8px;color:rgba(21,24,32,.46);font:600 10px "Exo 2",sans-serif;letter-spacing:.17em}
  .lyrics-room-card>h2{margin:0 0 20px;font:600 21px Orbitron,"Zen Kaku Gothic New",sans-serif}
  .lyrics-room-card.is-loading>strong{font:600 15px "Zen Kaku Gothic New",sans-serif}
  .lyrics-room-id{display:flex;align-items:baseline;justify-content:space-between;margin:-2px 0 18px;padding:14px 0;border-top:1px solid rgba(21,24,32,.1);border-bottom:1px solid rgba(21,24,32,.1)}
  .lyrics-room-id span{color:rgba(21,24,32,.45);font:600 10px "Exo 2",sans-serif;letter-spacing:.15em}
  .lyrics-room-id strong{font:600 28px Orbitron,sans-serif;letter-spacing:.1em}
  .lyrics-room-primary{box-sizing:border-box;width:100%;min-height:58px;border:0;border-radius:16px;color:#fff;background:var(--ink);font:600 15px "Zen Kaku Gothic New",sans-serif}
  .lyrics-room-primary:disabled{color:rgba(21,24,32,.38);background:rgba(21,24,32,.07)}
  .lyrics-room-join{display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:10px;margin-top:12px}
  .lyrics-room-join input,.lyrics-room-join button,.lyrics-room-subactions button{box-sizing:border-box;min-height:50px;border:1px solid rgba(21,24,32,.13);border-radius:15px;color:var(--ink);background:#fff;font:600 13px "Zen Kaku Gothic New",sans-serif}
  .lyrics-room-join input{width:100%;padding:0 15px;outline:0;font-size:16px;font-weight:400}
  .lyrics-room-subactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

  .lyrics-song-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 34px}
  .lyrics-song-actions:last-child{margin:14px 0 0}
  .lyrics-song-actions .lyrics-list-back{margin:0}
  .lyrics-karaoke-icon{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 16px;border:1px solid rgba(21,24,32,.13);border-radius:14px;color:var(--ink);background:#fff;font:600 9px "Exo 2",sans-serif;letter-spacing:.12em}
  .lyrics-karaoke-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .lyrics-room-card.is-active{padding:18px}
  .lyrics-room-card.is-active .lyrics-room-id{margin:0 0 12px;padding:0 0 13px;border-top:0}
  .lyrics-room-card.is-active .lyrics-room-primary{min-height:50px}
  .lyrics-karaoke-icon{border-color:rgba(69,126,140,.32);background:rgba(156,236,255,.28)}

  .lyrics-room-card>p{font-size:12px}
  .lyrics-room-id span{font-size:12px}
  .lyrics-allstars-groups{display:grid;gap:30px}
  .lyrics-allstars-section h3{margin:0 2px 11px;color:var(--ink);font:600 17px Orbitron,"Zen Kaku Gothic New",sans-serif;letter-spacing:.01em}
</style>

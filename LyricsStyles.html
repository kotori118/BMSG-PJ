<style>
  .lyrics-page{min-height:100%;padding:clamp(24px,5vw,64px);color:#102231;background:linear-gradient(145deg,#f8fdff,#eef9fb 55%,#fff)}
  .lyrics-hero h1{margin:0;font:700 clamp(42px,8vw,88px)/.9 Orbitron,sans-serif;letter-spacing:.04em}.lyrics-hero p{margin:12px 0 0}.lyrics-kicker{font:600 11px Orbitron,sans-serif;letter-spacing:.22em;color:#16a7bd}
  .lyrics-toolbar{position:sticky;top:0;z-index:3;padding:20px 0 12px;background:rgba(248,253,255,.9);backdrop-filter:blur(12px)}.lyrics-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.lyrics-tab{white-space:nowrap;border:1px solid #bedde3;background:#fff;border-radius:999px;padding:9px 14px;color:#31525c}.lyrics-tab.active{background:#102f3b;color:#fff;border-color:#102f3b}.lyrics-search{width:100%;border:1px solid #c9e0e5;border-radius:12px;padding:13px 15px;background:#fff;font:inherit}.lyrics-status{margin:14px 0;color:#5a7a82;font:600 11px Orbitron,sans-serif;letter-spacing:.14em}
  .lyrics-layout{display:grid;grid-template-columns:minmax(230px,34%) 1fr;gap:22px}.lyrics-song-list{display:grid;gap:8px;align-content:start;max-height:65vh;overflow:auto}.lyrics-song{display:grid;gap:5px;text-align:left;border:1px solid #d7e8eb;border-radius:14px;background:#fff;padding:15px;color:#132b34}.lyrics-song span{font-size:11px;color:#668088}.lyrics-detail{border:1px solid #d7e8eb;border-radius:20px;background:#fff;padding:22px;min-height:300px}.lyrics-detail h2{margin:4px 0 20px;font-size:28px}.lyrics-detail header p{margin:0;color:#16a7bd}.lyrics-parts{display:grid;gap:8px}.lyrics-part{position:relative;text-align:left;border:0;border-left:3px solid #60c8d6;background:#f4fbfc;padding:13px 42px 13px 14px;color:#18343e}.lyrics-part span{font-weight:700;color:#078ca1}.lyrics-part p{margin:5px 0 0;line-height:1.8;white-space:normal}.lyrics-part small{position:absolute;right:10px;top:12px;color:#6b8b92}.lyrics-empty{color:#779198}
  .lyrics-editor[hidden]{display:none}.lyrics-editor{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:rgba(6,25,32,.6)}.lyrics-editor-card{position:relative;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:20px;background:#fff;padding:24px}.lyrics-editor-card h2{margin:5px 0 18px}.lyrics-editor-card label{display:grid;gap:7px;margin:13px 0;font-weight:700}.lyrics-editor-card input,.lyrics-editor-card textarea{border:1px solid #c8dfe4;border-radius:10px;padding:12px;font:inherit}.lyrics-editor-close{position:absolute;right:15px;top:12px;border:0;background:none;font-size:28px}.lyrics-preview{min-height:70px;margin:16px 0;padding:14px;border-radius:12px;background:#f0fafb}.lyrics-preview p{white-space:pre-wrap}.lyrics-editor-actions{display:flex;justify-content:flex-end;gap:9px}.lyrics-editor-actions button{border:0;border-radius:10px;padding:11px 15px;background:#dceff2}.lyrics-editor-actions button:last-child{background:#102f3b;color:#fff}.lyrics-editor-actions button:disabled{opacity:.4}
  @media(max-width:720px){.lyrics-page{padding:22px 15px 80px}.lyrics-layout{grid-template-columns:1fr}.lyrics-song-list{max-height:none}.lyrics-detail{padding:16px}.lyrics-hero h1{font-size:46px}.lyrics-toolbar{top:0}}
</style>

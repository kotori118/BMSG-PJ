<script>
(function(){
  const MEMBER_IDS=['101','102','103','104','105','106'];
  const TYPE_LABELS={SING:'歌唱',DANCE:'ダンス'};
  const state={
    bootstrap:null,songId:'',songTitle:'',type:'',started:false,running:false,activeMemberId:'',pendingMemberId:'',
    elapsed:{},totalElapsedMs:0,totalRunningSince:0,memberRunningSince:0,
    history:[],eventLog:[],saved:{sing:{},dance:{}},dirty:false,tickId:null,loading:false
  };
  MEMBER_IDS.forEach(id=>state.elapsed[id]=0);
  window.performanceTimerState=state;

  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
  function now(){return Date.now();}
  function fmt(ms){return (Math.max(0,Number(ms)||0)/1000).toFixed(2)+'s';}
  function currentElapsedAt(id,ts){let value=Number(state.elapsed[id]||0);if(state.running&&state.activeMemberId===id&&state.memberRunningSince)value+=Math.max(0,ts-state.memberRunningSince);return value;}
  function totalElapsedAt(ts){let value=Number(state.totalElapsedMs||0);if(state.running&&state.totalRunningSince)value+=Math.max(0,ts-state.totalRunningSince);return value;}
  function currentElapsed(id){return currentElapsedAt(id,now());}
  function totalElapsed(){return totalElapsedAt(now());}
  function settleAt(ts){
    if(!state.running)return;
    if(state.totalRunningSince)state.totalElapsedMs+=Math.max(0,ts-state.totalRunningSince);
    if(state.activeMemberId&&state.memberRunningSince)state.elapsed[state.activeMemberId]=Number(state.elapsed[state.activeMemberId]||0)+Math.max(0,ts-state.memberRunningSince);
    state.totalRunningSince=ts;
    state.memberRunningSince=state.activeMemberId?ts:0;
  }
  function snapshotAt(ts){
    const elapsed={};MEMBER_IDS.forEach(id=>elapsed[id]=currentElapsedAt(id,ts));
    return {at:ts,started:state.started,running:state.running,activeMemberId:state.activeMemberId,pendingMemberId:state.pendingMemberId,elapsed:elapsed,totalElapsedMs:totalElapsedAt(ts)};
  }
  function logEvent(label,ts,elapsedMs){
    state.eventLog.push({label:label,at:ts,elapsedMs:Number.isFinite(Number(elapsedMs))?Number(elapsedMs):totalElapsedAt(ts)});
    if(state.eventLog.length>40)state.eventLog.shift();
  }
  function pushHistory(ts,label,kind){
    state.history.push({kind:kind||'generic',snapshot:snapshotAt(ts),label:label});
    if(state.history.length>40)state.history.shift();
    logEvent(label,ts,totalElapsedAt(ts));
  }
  function restoreSnapshot(snapshot){
    if(!snapshot)return;
    state.started=!!snapshot.started;state.running=!!snapshot.running;state.activeMemberId=snapshot.activeMemberId||'';state.pendingMemberId=snapshot.pendingMemberId||'';
    state.elapsed=Object.assign({},snapshot.elapsed||{});MEMBER_IDS.forEach(id=>{if(!Number.isFinite(Number(state.elapsed[id])))state.elapsed[id]=0;});
    state.totalElapsedMs=Number(snapshot.totalElapsedMs||0);
    state.totalRunningSince=state.running?now():0;
    state.memberRunningSince=state.running&&state.activeMemberId?state.totalRunningSince:0;
    state.dirty=true;
  }
  function rollbackSwitch(entry){
    const snapshot=entry&&entry.snapshot;if(!snapshot)return;
    state.started=true;state.running=false;state.activeMemberId='';state.pendingMemberId='';
    state.elapsed=Object.assign({},snapshot.elapsed||{});MEMBER_IDS.forEach(id=>{if(!Number.isFinite(Number(state.elapsed[id])))state.elapsed[id]=0;});
    state.totalElapsedMs=Number(snapshot.totalElapsedMs||0);state.totalRunningSince=0;state.memberRunningSince=0;state.dirty=true;
  }
  function stopTick(){if(state.tickId){clearInterval(state.tickId);state.tickId=null;}}
  function startTick(){stopTick();state.tickId=setInterval(updateTimes,100);}
  function updateTimes(){const ts=now();MEMBER_IDS.forEach(id=>{const el=document.querySelector('[data-pt-time="'+id+'"]');if(el)el.textContent=fmt(currentElapsedAt(id,ts));});const total=document.getElementById('ptTotalTime');if(total)total.textContent=fmt(totalElapsedAt(ts));}
  function resyncTimer(){if(!document.body.classList.contains('performance-timer-active'))return;updateTimes();if(state.running)startTick();}
  function selectedSong(){return state.bootstrap&&state.bootstrap.songs?state.bootstrap.songs.find(x=>String(x.songId)===String(state.songId)):null;}
  function memberInfo(id){return state.bootstrap&&state.bootstrap.members?state.bootstrap.members.find(x=>String(x.memberId)===String(id)):null;}
  function savedValue(id){const block=state.type==='SING'?state.saved.sing:state.saved.dance;const v=block&&Object.prototype.hasOwnProperty.call(block,id)?block[id]:null;return v===null||typeof v==='undefined'?'—':Number(v).toFixed(2)+'s';}
  function notify(message){if(typeof showToast==='function')showToast(message);else window.alert(message);}
  function clearMeasurement(){stopTick();MEMBER_IDS.forEach(id=>state.elapsed[id]=0);state.totalElapsedMs=0;state.started=false;state.running=false;state.totalRunningSince=0;state.memberRunningSince=0;state.activeMemberId='';state.pendingMemberId='';state.history=[];state.eventLog=[];state.dirty=false;state.loading=false;}
  function clearAll(){clearMeasurement();state.songId='';state.songTitle='';state.type='';state.saved={sing:{},dance:{}};}

  document.addEventListener('visibilitychange',function(){if(!document.hidden)resyncTimer();});
  window.addEventListener('focus',resyncTimer);
  window.addEventListener('pageshow',resyncTimer);

  window.initPerformanceTimerPage=function(){
    document.body.classList.add('performance-timer-active');
    const host=document.getElementById('performanceTimerApp');if(!host)return;
    host.innerHTML='<div class="pt-panel pt-loading">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING...','#9cecff'):'LOADING...')+'</div>';
    google.script.run.withSuccessHandler(function(data){state.bootstrap=data||{songs:[],members:[]};renderTimerBody();}).withFailureHandler(renderLoadError).getPerformanceTimerBootstrap();
  };
  window.cleanupPerformanceTimerPage=function(){if(state.running)settleAt(now());clearAll();document.body.classList.remove('performance-timer-active');closePtDialog();};
  window.performanceTimerOpenSettings_=function(){if(typeof openSettings==='function')openSettings();};

  function renderLoadError(){const host=document.getElementById('performanceTimerApp');if(!host)return;host.innerHTML='<div class="pt-error">読み込みに失敗しました</div><button class="u-btn" onclick="initPerformanceTimerPage()">再読み込み</button>';}

  function renderTimerBody(){
    const host=document.getElementById('performanceTimerApp');if(!host||!state.bootstrap)return;
    const locked=state.started;
    const statusClass=state.running?'is-running':(state.started?'is-paused':'');
    const statusMemberId=state.running?state.activeMemberId:state.pendingMemberId;
    const statusMember=statusMemberId?memberInfo(statusMemberId):null;
    let status='準備';
    if(statusMember)status=statusMember.name||statusMemberId;
    else if(state.started&&!state.running)status='一時停止';
    else if(state.running)status='メンバー未選択';
    const statusColor=statusMember?(statusMember.color||'#9cecff'):'';
    const song=selectedSong();
    const setup=locked?`<section class="pt-context"><strong>${esc(state.songTitle)}</strong><span>${esc(TYPE_LABELS[state.type]||'')}</span></section>`:`
      <section class="pt-panel pt-setup-panel">
        <div class="pt-search-wrap">
          <div class="pt-search-line">
            <input id="ptSongSearch" class="pt-search-input" type="search" autocomplete="off" aria-label="曲を選択" placeholder="曲名を検索" value="${esc(song?state.songTitle:'')}" onfocus="performanceTimerSearchSongs_(this.value,true)" oninput="performanceTimerSearchSongs_(this.value,false)">
            <button type="button" class="u-btn pt-clear" aria-label="曲選択をクリア" onclick="performanceTimerClearSong_()">×</button>
          </div>
          <div id="ptSongResults" class="pt-song-results" hidden></div>
        </div>
        <div class="pt-type-grid">
          <button type="button" class="u-btn pt-type ${state.type==='SING'?'is-selected':''}" onclick="performanceTimerSelectType_('SING')">歌唱</button>
          <button type="button" class="u-btn pt-type ${state.type==='DANCE'?'is-selected':''}" onclick="performanceTimerSelectType_('DANCE')">ダンス</button>
        </div>
      </section>`;
    host.innerHTML=`${setup}
      <section class="pt-timer-panel ${statusClass}">
        <div class="pt-status-main"><span class="pt-status-dot"></span><span class="pt-status-label ${statusMember?'is-member':''}"${statusColor?' style="--pt-status-member-color:'+esc(statusColor)+'"':''}>${esc(status)}</span></div>
        <div id="ptTotalTime" class="pt-total">${fmt(totalElapsed())}</div>
      </section>
      <section class="pt-panel pt-actions-panel">
        <div class="pt-main-actions">
          <button type="button" class="u-btn pt-action-primary" ${(!state.songId||!state.type)?'disabled':''} onclick="performanceTimerToggleRun_()">${state.running?'一時停止':(state.started?'再開':'開始')}</button>
          <button type="button" class="u-btn" ${!state.started?'disabled':''} onclick="performanceTimerOpenSummary_()">保存</button>
        </div>
        <div class="pt-secondary-actions">
          <button type="button" class="u-btn" ${!state.history.length?'disabled':''} onclick="performanceTimerUndo_()">1つ戻る</button>
          <button type="button" class="u-btn" ${!state.started?'disabled':''} onclick="performanceTimerReset_()">リセット</button>
        </div>
      </section>
      <section class="pt-panel pt-member-panel">
        <div class="pt-members">${renderMembers()}</div>
        ${renderEventLog()}
      </section>`;
    if(state.running)startTick();else stopTick();
    setTimeout(function(){updateTimes();scrollLogToBottom_();},0);
  }

  function renderMembers(){return (state.bootstrap.members||[]).map(function(member){const id=String(member.memberId);const active=state.activeMemberId===id;const pending=!state.running&&state.pendingMemberId===id;return `<button type="button" class="u-btn pt-member ${active?'is-active':''} ${pending?'is-pending':''}" style="--member-accent:${esc(member.color||'#9cecff')}" onclick="performanceTimerSelectMember_('${esc(id)}')"><span class="pt-member-name">${esc(member.name)}</span><span class="pt-member-time" data-pt-time="${esc(id)}">${fmt(currentElapsed(id))}</span><span class="pt-member-saved">保存 ${esc(savedValue(id))}</span></button>`;}).join('');}
  function renderEventLog(){if(!state.started||!state.eventLog.length)return '';const rows=state.eventLog.map(x=>'<div class="pt-log-row"><time>'+esc(fmt(x.elapsedMs))+'</time><span>'+esc(x.label)+'</span></div>').join('');return '<div class="pt-event-log-wrap"><div class="pt-event-log-title">ログ</div><div id="ptEventLog" class="pt-event-log" aria-label="操作履歴">'+rows+'</div></div>';}
  function scrollLogToBottom_(){const log=document.getElementById('ptEventLog');if(log)log.scrollTop=log.scrollHeight;}

  window.performanceTimerSearchSongs_=function(query,showAll){if(state.started)return;const host=document.getElementById('ptSongResults');if(!host)return;const q=String(query||'').trim().toLowerCase();const songs=(state.bootstrap.songs||[]).filter(s=>(showAll&&!q)||String(s.title||'').toLowerCase().startsWith(q)).slice(0,12);host.hidden=false;host.innerHTML=songs.length?songs.map(s=>`<button type="button" class="pt-song-option" onclick="performanceTimerChooseSong_('${esc(s.songId)}')"><strong>${esc(s.title)}</strong></button>`).join(''):'<div class="pt-song-empty">該当なし</div>';};
  window.performanceTimerChooseSong_=function(songId){if(state.started)return;const song=(state.bootstrap.songs||[]).find(s=>String(s.songId)===String(songId));if(!song)return;state.songId=String(song.songId);state.songTitle=song.title;state.saved={sing:{},dance:{}};renderTimerBody();loadSnapshot();};
  window.performanceTimerClearSong_=function(){if(state.started)return;state.songId='';state.songTitle='';state.saved={sing:{},dance:{}};renderTimerBody();};
  window.performanceTimerSelectType_=function(type){if(state.started||!TYPE_LABELS[type])return;state.type=type;renderTimerBody();};

  function loadSnapshot(){
    if(!state.songId)return;
    const requestedSongId=String(state.songId);
    google.script.run.withSuccessHandler(function(data){
      if(String(state.songId)!==requestedSongId)return;
      ['sing','dance'].forEach(key=>{state.saved[key]={};(data&&data[key]||[]).forEach(item=>state.saved[key][String(item.memberId)]=item.value);});
      renderTimerBody();
    }).withFailureHandler(function(){if(String(state.songId)===requestedSongId)notify('保存値を取得できませんでした');}).getPerformanceTimerSnapshot(requestedSongId);
  }

  window.performanceTimerToggleRun_=function(){
    if(!state.songId||!state.type)return;
    const ts=now();
    if(!state.started){
      state.history=[];state.eventLog=[];state.started=true;state.running=true;state.totalElapsedMs=0;state.totalRunningSince=ts;state.activeMemberId=state.pendingMemberId||'';state.memberRunningSince=state.activeMemberId?ts:0;state.dirty=false;
      logEvent(state.activeMemberId?((memberInfo(state.activeMemberId)||{}).name||state.activeMemberId)+'で開始':'開始',ts,0);
    }else if(state.running){
      pushHistory(ts,'一時停止','pause');settleAt(ts);state.running=false;state.totalRunningSince=0;state.memberRunningSince=0;state.pendingMemberId=state.activeMemberId||state.pendingMemberId||'';state.activeMemberId='';
    }else{
      pushHistory(ts,'再開','resume');state.running=true;state.totalRunningSince=ts;state.activeMemberId=state.pendingMemberId||'';state.memberRunningSince=state.activeMemberId?ts:0;
    }
    renderTimerBody();
  };
  window.performanceTimerSelectMember_=function(memberId){
    const ts=now();const id=String(memberId);const info=memberInfo(id);if(!info)return;
    if(!state.started){state.pendingMemberId=state.pendingMemberId===id?'':id;renderTimerBody();return;}
    if(!state.running){
      pushHistory(ts,(state.pendingMemberId===id?'メンバー解除':info.name+'を選択'),'pending');
      state.pendingMemberId=state.pendingMemberId===id?'':id;state.activeMemberId='';state.memberRunningSince=0;state.dirty=true;renderTimerBody();return;
    }
    const next=state.activeMemberId===id?'':id;const nextMember=next?memberInfo(next):null;
    pushHistory(ts,nextMember?nextMember.name+'へ切替':'メンバー停止','switch');
    settleAt(ts);state.activeMemberId=next;state.pendingMemberId=next;state.memberRunningSince=next?ts:0;state.dirty=true;renderTimerBody();
  };
  window.performanceTimerUndo_=function(){
    if(!state.history.length)return;
    const entry=state.history.pop();
    const stoppedMemberId=entry&&entry.kind==='switch'&&entry.snapshot?entry.snapshot.activeMemberId:'';
    const stoppedMember=stoppedMemberId?memberInfo(stoppedMemberId):null;
    if(state.eventLog.length)state.eventLog.pop();
    if(entry.kind==='switch')rollbackSwitch(entry);else restoreSnapshot(entry.snapshot);
    logEvent(stoppedMember?stoppedMember.name+'が停止':'1つ戻る',now(),state.totalElapsedMs);
    renderTimerBody();
  };

  window.performanceTimerReset_=function(){if(!state.started)return;openPtDialog('リセットしますか？','今回の計測を0に戻します。',[{label:'キャンセル',action:'closePtDialog()'},{label:'リセット',primary:true,action:'performanceTimerResetConfirmed_()'}]);};
  window.performanceTimerResetConfirmed_=function(){closePtDialog();clearMeasurement();renderTimerBody();};
  window.performanceTimerChangeSelection_=function(){if(!state.started)return;openPtDialog('選択を変更しますか？','今回の計測は破棄されます。',[{label:'キャンセル',action:'closePtDialog()'},{label:'変更',primary:true,action:'performanceTimerChangeSelectionConfirmed_()'}]);};
  window.performanceTimerChangeSelectionConfirmed_=function(){closePtDialog();clearAll();renderTimerBody();};

  window.performanceTimerOpenSummary_=function(){if(!state.started)return;const ts=now();if(state.running)settleAt(ts);const items=(state.bootstrap.members||[]).map(m=>({name:m.name,value:Number(state.elapsed[String(m.memberId)]||0)/1000}));const html='<div class="pt-summary-head"><strong>'+esc(state.songTitle)+'</strong><span>'+esc(TYPE_LABELS[state.type])+'</span></div><ul class="pt-dialog-list">'+items.map(x=>'<li><span>'+esc(x.name)+'</span><strong>'+Number(x.value).toFixed(2)+'s</strong></li>').join('')+'</ul>';openPtDialog('保存',html,[{label:'閉じる',action:'closePtDialog()'},{label:'保存',primary:true,action:'performanceTimerSave_(false)'}],true);};

  window.performanceTimerSave_=function(overwriteConfirmed){
    if(state.loading)return;
    const ts=now();if(state.running)settleAt(ts);state.loading=true;
    const payload={songId:state.songId,type:state.type,overwriteConfirmed:!!overwriteConfirmed,values:{}};
    MEMBER_IDS.forEach(id=>payload.values[id]=Math.round((Number(state.elapsed[id]||0)/1000)*100)/100);
    const saveButton=document.getElementById('ptDialogPrimary');if(saveButton)saveButton.disabled=true;
    google.script.run.withSuccessHandler(function(result){
      state.loading=false;
      if(result&&result.requiresConfirmation){
        const old=(result.existing||[]).map(item=>{const m=memberInfo(String(item.memberId));return '<li><span>'+esc(m?m.name:item.memberId)+'</span><strong>'+(item.value===null?'—':Number(item.value).toFixed(2)+'s')+'</strong></li>';}).join('');
        openPtDialog('上書きしますか？','<ul class="pt-dialog-list">'+old+'</ul>',[{label:'キャンセル',action:'closePtDialog()'},{label:'上書き',primary:true,action:'performanceTimerSave_(true)'}],true);return;
      }
      if(result&&result.ok){closePtDialog();notify('保存しました');clearMeasurement();loadSnapshot();renderTimerBody();}
      else notify('保存できませんでした');
    }).withFailureHandler(function(error){state.loading=false;const button=document.getElementById('ptDialogPrimary');if(button)button.disabled=false;notify(error&&error.message?error.message:'保存に失敗しました');}).savePerformanceTimer(payload);
  };

  function openPtDialog(title,body,actions,bodyIsHtml){
    closePtDialog();
    const overlay=document.createElement('div');overlay.id='ptDialogBackdrop';overlay.className='pt-dialog-backdrop';
    overlay.innerHTML='<section class="pt-dialog" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><div class="pt-dialog-copy">'+(bodyIsHtml?body:esc(body))+'</div><div class="pt-dialog-actions">'+actions.map(function(a){return '<button '+(a.primary?'id="ptDialogPrimary" ':'')+'type="button" class="u-btn '+(a.primary?'pt-action-primary':'')+'" onclick="'+a.action+'">'+esc(a.label)+'</button>';}).join('')+'</div></section>';
    overlay.addEventListener('click',function(event){if(event.target===overlay)closePtDialog();});document.body.appendChild(overlay);
  }
  window.closePtDialog=closePtDialog;
  function closePtDialog(){const el=document.getElementById('ptDialogBackdrop');if(el)el.remove();}

  window.performanceTimerCanLeave_=function(){if(!state.started)return true;return window.confirm('計測を破棄して離れますか？');};
})();
</script>

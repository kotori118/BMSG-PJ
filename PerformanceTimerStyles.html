<style>
  body.performance-timer-active,
  body.performance-timer-active .app-shell,
  body.performance-timer-active .page-wrap,
  body.performance-timer-active .page-content{
    background:#fff !important;
  }
  body.performance-timer-active .cosmic-bg,
  body.performance-timer-active .home-glow{display:none !important}

  .performance-timer-page{
    --pt-cyan:#9cecff;
    --pt-cyan-ink:#2f7382;
    --pt-ink:#111820;
    --pt-muted:#6f7881;
    --pt-line:#dfe6ea;
    min-height:100%;
    padding:74px 16px calc(96px + env(safe-area-inset-bottom));
    color:var(--pt-ink);
    background:#fff;
    font-family:"Zen Kaku Gothic New",Roboto,sans-serif;
  }
  .performance-timer-header{max-width:760px;margin:0 auto 20px;display:flex;align-items:center;gap:14px;min-width:0}
  .performance-timer-back{width:46px!important;height:46px!important;min-width:46px!important;padding:0!important;border-radius:14px!important;font-size:30px!important;line-height:1!important;color:var(--pt-ink)!important}
  .performance-timer-title-wrap{min-width:0}
  .performance-timer-title{margin:0;font:700 clamp(22px,5.8vw,34px)/1.18 "Zen Kaku Gothic New",Roboto,sans-serif;letter-spacing:.01em;color:var(--pt-ink)}
  .performance-timer-app{max-width:760px;margin:0 auto;display:grid;gap:14px}
  .pt-panel{border:1px solid var(--pt-line);border-radius:20px;background:#fff;padding:16px;box-shadow:0 8px 24px rgba(17,24,32,.045)}
  .pt-section-title{margin:0 0 10px;font:700 13px/1.3 "Zen Kaku Gothic New",Roboto,sans-serif;color:var(--pt-ink)}
  .pt-help{margin:7px 0 0;font:500 12px/1.6 "Zen Kaku Gothic New",Roboto,sans-serif;color:var(--pt-muted)}

  .pt-search-wrap{position:relative}
  .pt-search-line{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
  .pt-search-input{width:100%;min-height:50px;border:1px solid #ccd7dc;border-radius:15px;background:#fff;color:var(--pt-ink);padding:0 15px;font:500 16px "Zen Kaku Gothic New",Roboto,sans-serif;outline:none}
  .pt-search-input:focus{border-color:#69cfe6;box-shadow:0 0 0 3px rgba(156,236,255,.24)}
  .pt-search-input:disabled{background:#f5f7f8;color:#8b949b}
  .pt-clear{width:44px!important;height:50px!important;min-width:44px!important;padding:0!important;border-radius:15px!important;font-size:20px!important}
  .pt-song-results{position:absolute;z-index:40;left:0;right:52px;top:56px;display:grid;max-height:282px;overflow:auto;border:1px solid #d5e0e4;border-radius:16px;background:#fff;box-shadow:0 14px 32px rgba(17,24,32,.14)}
  .pt-song-results[hidden]{display:none}
  .pt-song-option{min-height:52px;padding:10px 14px;border:0;border-bottom:1px solid #edf1f3;background:#fff;color:var(--pt-ink);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:0!important;box-shadow:none!important}
  .pt-song-option:last-child{border-bottom:0}
  .pt-song-option strong{font:600 14px/1.35 "Zen Kaku Gothic New",Roboto,sans-serif}
  .pt-song-option small{flex:0 0 auto;font:500 11px Roboto,sans-serif;color:#8a949b}
  .pt-song-empty{padding:16px;color:var(--pt-muted);font-size:13px}
  .pt-selected-song{margin-top:10px;padding:10px 12px;border-left:3px solid var(--pt-cyan);background:#f8fcfd;border-radius:0 12px 12px 0;font-size:13px}

  .pt-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pt-type{min-height:50px!important}
  .pt-type.is-selected{border-color:#66cce2!important;background:linear-gradient(145deg,#fff,rgba(156,236,255,.25))!important;color:var(--pt-cyan-ink)!important}
  .pt-type:disabled{opacity:.5}

  .pt-status-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--pt-line);border-radius:16px;background:#fafcfd}
  .pt-status-main{display:flex;align-items:center;gap:9px;min-width:0}
  .pt-status-dot{width:10px;height:10px;border-radius:50%;background:#aab2b8;box-shadow:0 0 0 5px rgba(170,178,184,.12)}
  .pt-status-bar.is-running .pt-status-dot{background:#42bed8;box-shadow:0 0 0 5px rgba(156,236,255,.3)}
  .pt-status-bar.is-paused .pt-status-dot{background:#77818a}
  .pt-status-label{font:700 13px "Zen Kaku Gothic New",Roboto,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt-total{font:700 14px/1 Roboto,sans-serif;font-variant-numeric:tabular-nums;color:var(--pt-muted)}

  .pt-members{display:grid;gap:8px}
  .pt-member{--member-accent:var(--pt-cyan);width:100%;min-height:66px!important;padding:10px 13px!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left!important;border-left:4px solid var(--member-accent)!important;background:#fff!important;color:var(--pt-ink)!important}
  .pt-member.is-active{background:linear-gradient(90deg,rgba(156,236,255,.17),#fff 38%)!important;border-color:var(--member-accent)!important;box-shadow:0 7px 20px rgba(17,24,32,.055)!important}
  .pt-member-name{font:700 15px "Zen Kaku Gothic New",Roboto,sans-serif}
  .pt-member-sub{display:block;margin-top:2px;color:var(--pt-muted);font:500 11px "Zen Kaku Gothic New",Roboto,sans-serif}
  .pt-member-time{font:700 21px/1 Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .pt-member-saved{display:block;margin-top:4px;text-align:right;color:#879199;font:500 10px Roboto,sans-serif}

  .pt-main-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pt-main-actions .u-btn{min-height:52px!important}
  .pt-action-primary{border-color:#68cee4!important;background:linear-gradient(145deg,#fff,rgba(156,236,255,.25))!important}
  .pt-secondary-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .pt-secondary-actions .u-btn{min-height:46px!important;padding:0 8px!important;font-size:12px!important}

  .pt-lock-note{margin-top:8px;padding:9px 11px;border-radius:12px;background:#f6f8f9;color:#707a82;font-size:11px;line-height:1.5}
  .pt-loading{min-height:160px;display:grid;place-items:center}
  .pt-error{padding:16px;border:1px solid #e8d5d5;border-radius:16px;background:#fffafa;color:#8d3e3e;font-size:13px;line-height:1.6}

  .pt-dialog-backdrop{position:fixed;z-index:1600;inset:0;display:grid;place-items:center;padding:20px;background:rgba(16,22,28,.34);backdrop-filter:blur(3px)}
  .pt-dialog{width:min(100%,440px);max-height:min(80dvh,620px);overflow:auto;border:1px solid #d8e2e6;border-radius:22px;background:#fff;padding:18px;box-shadow:0 22px 60px rgba(17,24,32,.22);color:var(--pt-ink)}
  .pt-dialog h2{margin:0 0 8px;font:700 19px "Zen Kaku Gothic New",Roboto,sans-serif}
  .pt-dialog p{margin:0 0 14px;color:var(--pt-muted);font:500 13px/1.65 "Zen Kaku Gothic New",Roboto,sans-serif}
  .pt-dialog-list{display:grid;gap:6px;margin:12px 0 16px;padding:0;list-style:none}
  .pt-dialog-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf1f3;font-size:13px}
  .pt-dialog-list li:last-child{border-bottom:0}
  .pt-dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pt-dialog-actions .u-btn{min-height:48px!important}

  @media(max-width:560px){
    .performance-timer-page{padding:70px 12px calc(92px + env(safe-area-inset-bottom))}
    .performance-timer-header{margin-bottom:15px}
    .pt-panel{padding:14px;border-radius:18px}
    .pt-secondary-actions{grid-template-columns:1fr 1fr}
    .pt-secondary-actions .u-btn:last-child{grid-column:1/-1}
    .pt-member{min-height:62px!important}
    .pt-member-time{font-size:20px}
  }
  @media(prefers-reduced-motion:reduce){
    .performance-timer-page *{scroll-behavior:auto!important}
  }
</style>

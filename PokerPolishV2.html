<style>
  /* Final POKER UI alignment: match shared Universe button/navigation language. */
  .poker-header{align-items:center!important;justify-content:flex-start!important;gap:14px!important;}
  .poker-header > div{min-width:0;}
  .poker-home-btn{order:-1!important;margin:0!important;flex:0 0 46px!important;}
  .poker-section-head{align-items:center!important;justify-content:flex-start!important;gap:14px!important;}
  .poker-section-head > div{min-width:0;}
  .poker-back{order:-1!important;margin:0!important;flex:0 0 46px!important;}
  .poker-section-head h2{text-align:left!important;}

  .poker-mode-card,.poker-rule-card{
    text-align:left!important;
    align-items:flex-start!important;
    justify-content:center!important;
  }
  .poker-mode-card strong,.poker-rule-card strong{
    display:block!important;
    width:100%!important;
    text-align:left!important;
  }
  .poker-mode-card.is-wide{
    flex-direction:column!important;
    align-items:flex-start!important;
    justify-content:center!important;
    text-align:left!important;
  }

  /* Use the shared .u-btn surface/interaction; only POKER layout stays local. */
  .poker-mode-card,.poker-rule-card,.poker-back,.poker-home-btn,.poker-actions .u-btn,.poker-vote-btn{
    font-family:inherit;
  }

  /* Highlight save confirmation uses the shared Universe button language. */
  .poker-confirm-overlay{
    position:fixed;
    inset:0;
    z-index:12000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
  }
  .poker-confirm-panel{
    width:min(100%,420px);
    box-sizing:border-box;
    padding:22px;
    border:1px solid rgba(156,236,255,.28);
    border-radius:22px;
    background:linear-gradient(145deg,rgba(18,23,31,.98),rgba(7,10,15,.98));
    box-shadow:0 22px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
  }
  .poker-confirm-panel h3{
    margin:0;
    color:#fff;
    font:700 20px 'Zen Kaku Gothic New',sans-serif;
    line-height:1.5;
    text-align:left;
  }
  .poker-confirm-panel p{
    margin:10px 0 0;
    color:rgba(255,255,255,.58);
    font-size:13px;
    line-height:1.7;
  }
  .poker-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .poker-confirm-actions .u-btn{min-height:50px;}
  @media(max-width:480px){.poker-confirm-actions{grid-template-columns:1fr;}}

  /* True two-sided card flip: back -> front. */
  .poker-slot{perspective:900px;transform-style:preserve-3d;transition:transform .2s ease,opacity .2s ease;}
  .poker-card{
    overflow:visible!important;
    transform-style:preserve-3d!important;
    -webkit-transform-style:preserve-3d!important;
    transform:rotateY(0deg);
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease!important;
  }
  .poker-card.is-back::before{display:none!important;}
  .poker-card.is-face-up{transform:rotateY(180deg)!important;}
  .poker-card.is-revealing{
    animation:pokerRealFlip .56s cubic-bezier(.2,.72,.2,1) both!important;
  }
  .poker-card-face{
    position:absolute;
    inset:0;
    border-radius:inherit;
    overflow:hidden;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }
  .poker-card-back-face{
    transform:rotateY(0deg);
    background:radial-gradient(circle at 50% 28%,rgba(156,236,255,.12),transparent 45%),#090d14;
  }
  .poker-card-back-face::before{
    content:'BMSG';
    position:absolute;
    inset:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(156,236,255,.24);
    border-radius:8px;
    color:rgba(255,255,255,.72);
    font:700 clamp(7px,2vw,13px) 'Orbitron',sans-serif;
    letter-spacing:.08em;
  }
  .poker-card-front-face{transform:rotateY(180deg);background:#090d14;}
  .poker-card-front-face img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .poker-card-front-face .poker-card-label{z-index:2;}

  /* Move selection offset to the slot so it never cancels rotateY(180deg). */
  .poker-slot.is-sort{transform:translateY(-10px)!important;}
  .poker-slot.is-exchange{transform:translateY(10px)!important;opacity:.48;}
  .poker-slot.is-sort .poker-card,
  .poker-slot.is-exchange .poker-card{transform:rotateY(180deg)!important;opacity:1!important;}

  @keyframes pokerRealFlip{
    0%{transform:rotateY(0deg) scale(.985);}
    44%{transform:rotateY(88deg) scale(.97);}
    56%{transform:rotateY(102deg) scale(.97);}
    100%{transform:rotateY(180deg) scale(1);}
  }
  @media(prefers-reduced-motion:reduce){
    .poker-card.is-revealing{animation:none!important;transform:rotateY(180deg)!important;}
    .poker-slot{transition:none!important;}
  }
</style>
<script>
  /* Keep reveal state alive for the full flip animation. */
  function markPokerFlip(indices){
    if(pokerState.flipTimer)clearTimeout(pokerState.flipTimer);
    pokerState.flipIndices=Array.isArray(indices)?indices.slice():[indices];
    pokerState.flipTimer=setTimeout(function(){
      pokerState.flipIndices=[];
      pokerState.flipTimer=null;
    },640);
  }

  /* Shared-style confirmation before writing a highlight. */
  let pokerHighlightConfirmAction=null;
  function openPokerHighlightConfirm(action){
    closePokerHighlightConfirm();
    pokerHighlightConfirmAction=typeof action==='function'?action:null;
    const overlay=document.createElement('div');
    overlay.className='poker-confirm-overlay';
    overlay.id='pokerHighlightConfirm';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-labelledby','pokerHighlightConfirmTitle');
    overlay.innerHTML='<div class="poker-confirm-panel">'
      +'<h3 id="pokerHighlightConfirmTitle">神回を保存しますか？</h3>'
      +'<p>このプレイ結果を神回として保存します。</p>'
      +'<div class="poker-confirm-actions">'
      +'<button type="button" class="u-btn" onclick="closePokerHighlightConfirm()">キャンセル</button>'
      +'<button type="button" class="u-btn poker-primary" onclick="confirmPokerHighlightSave()">保存する</button>'
      +'</div></div>';
    overlay.addEventListener('click',function(event){if(event.target===overlay)closePokerHighlightConfirm();});
    document.body.appendChild(overlay);
  }
  function closePokerHighlightConfirm(){
    const overlay=document.getElementById('pokerHighlightConfirm');
    if(overlay)overlay.remove();
    pokerHighlightConfirmAction=null;
  }
  function confirmPokerHighlightSave(){
    const action=pokerHighlightConfirmAction;
    const overlay=document.getElementById('pokerHighlightConfirm');
    if(overlay)overlay.remove();
    pokerHighlightConfirmAction=null;
    if(action)action();
  }

  function saveOfflinePoker(){
    const game=pokerState.offline;
    if(!game||game.saved||pokerState.busy)return;
    openPokerHighlightConfirm(function(){
      if(!pokerState.offline||pokerState.offline.saved||pokerState.busy)return;
      setPokerBusy(true);
      google.script.run.withSuccessHandler(function(result){
        setPokerBusy(false);
        game.saved=true;
        pokerNotify(result&&result.alreadySaved?'この神回は保存済みです。':'神回を保存しました。');
        renderOfflinePoker();
      }).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);})
        .saveOfflinePokerHighlight(pokerState.userId,{gameId:game.gameId,ruleType:game.ruleType,handImageIds:game.hand.map(function(card){return card.imageId;})});
    });
  }

  function saveOnlinePokerHighlight(){
    if(pokerState.busy||!pokerState.room||pokerState.room.highlightSaved)return;
    openPokerHighlightConfirm(function(){
      if(pokerState.busy||!pokerState.room||pokerState.room.highlightSaved)return;
      setPokerBusy(true);
      google.script.run.withSuccessHandler(function(result){
        setPokerBusy(false);
        pokerState.room.highlightSaved=true;
        pokerNotify(result&&result.alreadySaved?'この神回は保存済みです。':'神回を保存しました。');
        renderPokerRoom();
      }).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);})
        .savePokerHighlight(pokerState.userId,pokerState.room.roomId);
    });
  }

  /* Override only the hand renderer so all existing game logic remains untouched. */
  function renderPokerHand(hand,revealed,mode){
    const list=Array.isArray(hand)?hand:[];
    let html='<div class="poker-board">';
    for(let i=0;i<5;i++){
      const card=list[i],visible=!!(card&&i<revealed);
      const selected=pokerState.interaction==='exchange'?pokerState.exchangeIndices.indexOf(i)>=0:pokerState.sortIndex===i;
      const selectedClass=selected?(pokerState.interaction==='exchange'?' is-exchange':' is-sort'):'';
      const revealing=visible&&Array.isArray(pokerState.flipIndices)&&pokerState.flipIndices.indexOf(i)>=0;
      const action=(mode==='offline'||mode==='online')&&revealed>=5?'onclick="handlePokerCardTap('+i+',\''+mode+'\')"':'';
      const rarity=visible?String(card.rarity||'N').toLowerCase():'n';
      const memberLabel=visible?String(card.memberName||card.displayName||card.memberId||''):'';
      const cardClass=visible?'rarity-'+rarity+(revealing?' is-revealing':' is-face-up'):'is-back';
      html+='<button type="button" class="poker-slot'+selectedClass+'" '+action+' aria-label="カード '+(i+1)+'">'
        +'<span class="poker-card '+cardClass+'">'
        +'<span class="poker-card-face poker-card-back-face"></span>'
        +(visible?'<span class="poker-card-face poker-card-front-face"><img src="https://lh3.googleusercontent.com/d/'+encodeURIComponent(card.driveFileId)+'" alt="">'+(memberLabel?'<span class="poker-card-label">'+escapeHtml(memberLabel)+'</span>':'')+'</span>':'')
        +'</span></button>';
    }
    return html+'</div>';
  }
</script>

<script>
  const pokerState={userId:'',users:[],cards:[],brandLogoDriveFileId:'',room:null,screen:'menu',busy:false,pollTimer:null,sortIndex:-1,exchangeIndices:[],interaction:'sort',onlineRevealCount:0,offline:null,flipIndices:[],flipTimer:null,highlightConfirmAction:null};

  function renderPoker(){const template=document.getElementById('pokerPageTemplate');return template?template.innerHTML:'<section class="view"><h1 class="title">POKER</h1></section>';}
  function initPokerPage(params){stopPokerPolling();const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';if(!uid){const host=document.getElementById('pokerApp');if(host)host.innerHTML='<div class="poker-panel"><p>USERを選択してください。</p></div>';if(typeof openUserChooser==='function')openUserChooser(true);return;}pokerState.userId=uid;pokerState.screen='menu';pokerLoading();google.script.run.withSuccessHandler(function(data){pokerState.users=data.users||[];pokerState.cards=data.cards||[];pokerState.brandLogoDriveFileId=data.brandLogoDriveFileId||'';pokerState.room=data.room||null;if(data.room){pokerState.screen='online';renderPokerRoom();startPokerPolling();}else renderPokerMenu();}).withFailureHandler(pokerFailure).getPokerBootstrap(uid,params&&params.room?params.room:'');}
  function pokerLoading(){const host=document.getElementById('pokerApp');if(host)host.innerHTML=typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING POKER...','#9cecff'):'<div>LOADING...</div>';}

  function pokerRuleLabel(rule){return rule==='A'?'交換無制限モード':'交換1回モード';}
  function pokerModeLabel(mode){return String(mode||'').toUpperCase()==='ONLINE'?'みんなで':'1人で';}
  function markPokerFlip(indices){if(pokerState.flipTimer)clearTimeout(pokerState.flipTimer);pokerState.flipIndices=Array.isArray(indices)?indices.slice():[indices];pokerState.flipTimer=setTimeout(function(){pokerState.flipIndices=[];pokerState.flipTimer=null;},640);}

  function renderPokerMenu(){stopPokerPolling();pokerState.screen='menu';pokerState.room=null;pokerState.flipIndices=[];const host=document.getElementById('pokerApp');if(!host)return;host.innerHTML='<div class="poker-mode-grid"><button type="button" class="u-btn poker-mode-card" onclick="renderPokerOfflineRules()"><strong>1人で</strong></button><button type="button" class="u-btn poker-mode-card" onclick="renderPokerOnlineMenu()"><strong>みんなで</strong></button><button type="button" class="u-btn poker-mode-card is-wide" onclick="openPokerHighlights()"><strong>神回</strong></button></div>';}
  function pokerSectionHead(title,copy,back){return '<div class="poker-section-head"><div><h2>'+escapeHtml(title)+'</h2></div><button type="button" class="u-btn poker-back" onclick="'+back+'" aria-label="戻る">‹</button></div>';}
  function ruleCard(rule,handler){return '<button type="button" class="u-btn poker-rule-card" onclick="'+handler+'(\''+rule+'\')"><strong>'+pokerRuleLabel(rule)+'</strong></button>';}

  function renderPokerOfflineRules(){pokerState.screen='offline-rules';const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('1人で','','renderPokerMenu()')+'<div class="poker-rule-grid">'+ruleCard('A','startOfflinePoker')+ruleCard('B','startOfflinePoker')+'</div>';}
  function startOfflinePoker(rule){pokerState.offline={gameId:'OFF-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),ruleType:rule,hand:[],drawnIds:[],exchangeCount:0,finalized:false,saved:false,revealCount:0};pokerState.sortIndex=-1;pokerState.exchangeIndices=[];pokerState.interaction='sort';renderOfflinePoker();}
  function renderOfflinePoker(){pokerState.screen='offline';const game=pokerState.offline;if(!game)return renderPokerOfflineRules();const drawn=game.hand.length;const status=drawn<5?'カードを引く':(game.finalized?'手札確定':(pokerState.interaction==='exchange'?'交換するカードを選ぶ':'手札を並べ替える'));let actions='';if(drawn<5){actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="drawOfflinePokerCard()">カードを引く</button></div>';}else if(game.finalized){actions='<div class="poker-actions is-stack"><button type="button" class="u-btn poker-primary" '+(game.saved?'disabled':'onclick="saveOfflinePoker()"')+'>'+(game.saved?'保存済み':'保存する')+'</button><button type="button" class="u-btn" onclick="startOfflinePoker(\''+game.ruleType+'\')">もう一度プレイ</button><button type="button" class="u-btn" onclick="renderPokerMenu()">終了する</button></div>';}else if(pokerState.interaction==='exchange'){actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="executeOfflineExchange()">交換する</button><button type="button" class="u-btn" onclick="cancelPokerExchange()">キャンセル</button></div>';}else{const canExchange=game.ruleType==='A'||game.exchangeCount<1;actions='<div class="poker-actions"><button type="button" class="u-btn" '+(canExchange?'onclick="enterPokerExchange()"':'disabled')+'>交換する</button><button type="button" class="u-btn poker-primary" onclick="finalizeOfflinePoker()">確定する</button></div>';}const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('1人で','','confirmExitOfflinePoker()')+'<span class="poker-mode-badge">'+pokerRuleLabel(game.ruleType)+'</span><div class="poker-status"><strong>'+status+'</strong></div>'+renderPokerHand(game.hand,drawn,'offline')+actions;}
  function drawOfflinePokerCard(){const game=pokerState.offline;if(!game||game.hand.length>=5)return;const card=choosePokerClientCard(game.hand,game.drawnIds);if(!card)return pokerNotify('カードを引けませんでした。');game.hand.push(card);game.drawnIds.push(card.imageId);markPokerFlip(game.hand.length-1);renderOfflinePoker();}
  function choosePokerClientCard(kept,drawnIds){const used={};kept.forEach(function(card){used[card.memberId]=true;});const drawn={};drawnIds.forEach(function(id){drawn[id]=true;});let pool=pokerState.cards.filter(function(card){return !used[card.memberId]&&!drawn[card.imageId];});if(!pool.length)pool=pokerState.cards.filter(function(card){return !used[card.memberId];});if(!pool.length)return null;const weights={N:70,R:24,SR:5,SSR:1},by={N:[],R:[],SR:[],SSR:[]};pool.forEach(function(card){if(by[card.rarity])by[card.rarity].push(card);});const available=Object.keys(by).filter(function(r){return by[r].length;});let roll=Math.random()*available.reduce(function(sum,r){return sum+weights[r];},0),rarity=available[available.length-1];for(let i=0;i<available.length;i++){roll-=weights[available[i]];if(roll<0){rarity=available[i];break;}}const options=by[rarity];return options[Math.floor(Math.random()*options.length)];}
  function finalizeOfflinePoker(){pokerState.offline.finalized=true;pokerState.interaction='sort';pokerState.exchangeIndices=[];renderOfflinePoker();}
  function confirmExitOfflinePoker(){if(pokerState.offline&&!pokerState.offline.finalized&&!window.confirm('このゲームを終了しますか？'))return;renderPokerMenu();}

  function renderPokerOnlineMenu(){pokerState.screen='online-menu';const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('みんなで','','renderPokerMenu()')+'<div class="poker-panel"><span class="poker-panel-label">ルームを作る</span><div class="poker-rule-grid">'+ruleCard('A','createOnlinePokerRoom')+ruleCard('B','createOnlinePokerRoom')+'</div></div><div class="poker-panel"><span class="poker-panel-label">ルームに参加</span><div class="poker-join"><input id="pokerRoomInput" class="poker-input" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="ルームID"><button type="button" class="u-btn poker-primary" onclick="joinOnlinePokerRoom()">参加する</button></div></div>';}
  function createOnlinePokerRoom(rule){if(pokerState.busy)return;setPokerBusy(true);pokerLoading();google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;pokerState.screen='online';renderPokerRoom();startPokerPolling();pokerNotify('ROOM '+room.roomId+' を作成しました。');}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);renderPokerOnlineMenu();}).createPokerRoom(pokerState.userId,rule);}
  function joinOnlinePokerRoom(){const input=document.getElementById('pokerRoomInput');const id=String(input&&input.value||'').replace(/\D/g,'');if(id.length!==4)return pokerNotify('4桁のROOM IDを入力してください。');setPokerBusy(true);pokerLoading();google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;pokerState.screen='online';renderPokerRoom();startPokerPolling();pokerNotify('ROOM '+room.roomId+' に参加しました。');}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);renderPokerOnlineMenu();}).joinPokerRoom(pokerState.userId,id);}
  function leaveOnlinePokerRoom(){const room=pokerState.room;if(!room)return renderPokerMenu();const message=room.status==='WAITING'?(room.isCreator?'ROOMを削除しますか？':'ROOMから退出しますか？'):'ゲーム画面を閉じますか？';if(!window.confirm(message))return;stopPokerPolling();google.script.run.withSuccessHandler(function(){pokerState.room=null;renderPokerMenu();}).withFailureHandler(pokerFailure).leavePokerRoom(pokerState.userId,room.roomId);}
  function startOnlinePokerRoom(){if(pokerState.busy)return;setPokerBusy(true);google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;pokerState.onlineRevealCount=0;renderPokerRoom();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).startPokerRoom(pokerState.userId,pokerState.room.roomId);}
  function renderPokerRoom(){const room=pokerState.room;if(!room)return renderPokerOnlineMenu();if(room.status==='WAITING')return renderPokerLobby();if(room.status==='PLAYING')return renderPokerOnlinePlay();renderPokerRevealAndVote();}
  function renderPokerLobby(){const room=pokerState.room;const canStart=room.isCreator&&room.players.length>=2;const rows=room.players.map(function(player){return '<div class="poker-player-row"><strong>'+escapeHtml(player.displayName)+'</strong><span>'+(player.userId===room.creatorUserId?'作成者':'参加済み')+'</span></div>';}).join('');const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('みんなで','','leaveOnlinePokerRoom()')+'<div class="poker-panel"><div class="poker-room-meta"><div><span class="poker-panel-label">ルームID</span><div class="poker-room-code">'+escapeHtml(room.roomId)+'</div></div><div class="poker-room-rule">'+pokerRuleLabel(room.ruleType)+' · '+room.players.length+' / 3</div></div><div class="poker-player-list">'+rows+'</div>'+(room.isCreator?'<div class="poker-actions"><button type="button" class="u-btn poker-primary" '+(canStart?'onclick="startOnlinePokerRoom()"':'disabled')+'>開始する</button></div>':'')+'</div>';}
  function renderPokerOnlinePlay(){const room=pokerState.room,player=room.currentPlayer;if(player.isFinalized)return renderPokerWaitingFinal();const hand=player.hand||[];if(pokerState.onlineRevealCount>hand.length)pokerState.onlineRevealCount=hand.length;const revealed=Math.min(pokerState.onlineRevealCount,hand.length);let actions='';if(revealed<5){actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="revealNextOnlinePokerCard()">カードを引く</button></div>';}else if(pokerState.interaction==='exchange'){actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="executeOnlineExchange()">交換する</button><button type="button" class="u-btn" onclick="cancelPokerExchange()">キャンセル</button></div>';}else{const canExchange=room.ruleType==='A'||player.exchangeCount<1;actions='<div class="poker-actions"><button type="button" class="u-btn" '+(canExchange?'onclick="enterPokerExchange()"':'disabled')+'>交換する</button><button type="button" class="u-btn poker-primary" onclick="finalizeOnlinePoker()">確定する</button></div>';}const status=revealed<5?'カードを引く':(pokerState.interaction==='exchange'?'交換するカードを選ぶ':'手札を並べ替える');const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('みんなで','','leaveOnlinePokerRoom()')+'<span class="poker-mode-badge">'+pokerRuleLabel(room.ruleType)+'</span><div class="poker-status"><strong>'+status+'</strong></div>'+renderPokerHand(hand,revealed,'online')+actions;}
  function revealNextOnlinePokerCard(){const index=pokerState.onlineRevealCount;pokerState.onlineRevealCount=Math.min(5,pokerState.onlineRevealCount+1);markPokerFlip(index);renderPokerOnlinePlay();}
  function renderPokerWaitingFinal(){const room=pokerState.room;const rows=room.players.map(function(player){return '<div class="poker-player-row '+(player.isFinalized?'is-ready':'')+'"><strong>'+escapeHtml(player.displayName)+'</strong><span>'+(player.isFinalized?'確定済み':'プレイ中')+'</span></div>';}).join('');const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('みんなで','','leaveOnlinePokerRoom()')+'<div class="poker-panel"><div class="poker-status"><strong>全員の確定待ち</strong></div>'+renderPokerHand(room.currentPlayer.hand,5,'locked')+'<div class="poker-player-list">'+rows+'</div></div>';}
  function renderPokerRevealAndVote(){const room=pokerState.room,completed=room.status==='COMPLETED';const cards=room.players.map(function(player){const canVote=!completed&&!room.hasVoted&&player.userId!==pokerState.userId;return '<article class="poker-panel"><div class="poker-player-row is-ready"><strong>'+escapeHtml(player.displayName)+'</strong><span>'+(completed?(room.voteCounts[player.userId]||0)+'票':'')+'</span></div><div style="margin-top:12px">'+renderPokerHand(player.hand,5,'locked')+'</div>'+(canVote?'<button type="button" class="u-btn poker-primary poker-vote-btn" onclick="voteOnlinePoker(\''+escapeHtml(player.userId)+'\')">投票する</button>':'')+'</article>';}).join('');let result='';if(completed){const names=room.players.filter(function(player){return room.winnerUserIds.indexOf(player.userId)>=0;}).map(function(player){return player.displayName;});result='<div class="poker-panel poker-status"><strong>'+(names.length>1?'同点':'勝者')+'</strong><div class="poker-room-code" style="font-size:clamp(25px,8vw,46px)">'+escapeHtml(names.join(' / '))+'</div></div>';}else if(room.hasVoted){result='<div class="poker-panel poker-status"><strong>投票済み</strong></div>';}const save='<div class="poker-actions is-stack"><button type="button" class="u-btn poker-primary" '+(room.highlightSaved?'disabled':'onclick="saveOnlinePokerHighlight()"')+'>'+(room.highlightSaved?'保存済み':'保存する')+'</button><button type="button" class="u-btn" onclick="leaveOnlinePokerRoom()">終了する</button></div>';const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('結果','','leaveOnlinePokerRoom()')+result+'<div class="poker-reveal-list">'+cards+'</div>'+save;}
  function voteOnlinePoker(userId){if(pokerState.busy)return;setPokerBusy(true);google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;renderPokerRoom();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).votePokerWinner(pokerState.userId,pokerState.room.roomId,userId);}

  function openPokerHighlightConfirm(action){closePokerHighlightConfirm();pokerState.highlightConfirmAction=typeof action==='function'?action:null;const overlay=document.createElement('div');overlay.className='poker-confirm-overlay';overlay.id='pokerHighlightConfirm';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-labelledby','pokerHighlightConfirmTitle');overlay.innerHTML='<div class="poker-confirm-panel"><h3 id="pokerHighlightConfirmTitle">神回を保存しますか？</h3><p>このプレイ結果を神回として保存します。</p><div class="poker-confirm-actions"><button type="button" class="u-btn" onclick="closePokerHighlightConfirm()">キャンセル</button><button type="button" class="u-btn poker-primary" onclick="confirmPokerHighlightSave()">保存する</button></div></div>';overlay.addEventListener('click',function(event){if(event.target===overlay)closePokerHighlightConfirm();});document.body.appendChild(overlay);}
  function closePokerHighlightConfirm(){const overlay=document.getElementById('pokerHighlightConfirm');if(overlay)overlay.remove();pokerState.highlightConfirmAction=null;}
  function confirmPokerHighlightSave(){const action=pokerState.highlightConfirmAction;const overlay=document.getElementById('pokerHighlightConfirm');if(overlay)overlay.remove();pokerState.highlightConfirmAction=null;if(action)action();}
  function saveOfflinePoker(){const game=pokerState.offline;if(!game||game.saved||pokerState.busy)return;openPokerHighlightConfirm(function(){if(!pokerState.offline||pokerState.offline.saved||pokerState.busy)return;setPokerBusy(true);google.script.run.withSuccessHandler(function(result){setPokerBusy(false);game.saved=true;pokerNotify(result&&result.alreadySaved?'この神回は保存済みです。':'神回を保存しました。');renderOfflinePoker();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).saveOfflinePokerHighlight(pokerState.userId,{gameId:game.gameId,ruleType:game.ruleType,handImageIds:game.hand.map(function(card){return card.imageId;})});});}
  function saveOnlinePokerHighlight(){if(pokerState.busy||!pokerState.room||pokerState.room.highlightSaved)return;openPokerHighlightConfirm(function(){if(pokerState.busy||!pokerState.room||pokerState.room.highlightSaved)return;setPokerBusy(true);google.script.run.withSuccessHandler(function(result){setPokerBusy(false);pokerState.room.highlightSaved=true;pokerNotify(result&&result.alreadySaved?'この神回は保存済みです。':'神回を保存しました。');renderPokerRoom();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).savePokerHighlight(pokerState.userId,pokerState.room.roomId);});}

  function renderPokerHand(hand,revealed,mode){const list=Array.isArray(hand)?hand:[];let html='<div class="poker-board">';for(let i=0;i<5;i++){const card=list[i],visible=!!(card&&i<revealed);const selected=pokerState.interaction==='exchange'?pokerState.exchangeIndices.indexOf(i)>=0:pokerState.sortIndex===i;const selectedClass=selected?(pokerState.interaction==='exchange'?' is-exchange':' is-sort'):'';const revealing=visible&&Array.isArray(pokerState.flipIndices)&&pokerState.flipIndices.indexOf(i)>=0;const action=(mode==='offline'||mode==='online')&&revealed>=5?'onclick="handlePokerCardTap('+i+',\''+mode+'\')"':'';const rarity=visible?String(card.rarity||'N').toLowerCase():'n';const memberLabel=visible?String(card.memberName||card.displayName||card.memberId||''):'';const cardClass=visible?'rarity-'+rarity+(revealing?' is-revealing':' is-face-up'):'is-back';html+='<button type="button" class="poker-slot'+selectedClass+'" '+action+' aria-label="カード '+(i+1)+'"><span class="poker-card '+cardClass+'"><span class="poker-card-face poker-card-back-face"></span>'+(visible?'<span class="poker-card-face poker-card-front-face"><img src="https://lh3.googleusercontent.com/d/'+encodeURIComponent(card.driveFileId)+'" alt="">'+(memberLabel?'<span class="poker-card-label">'+escapeHtml(memberLabel)+'</span>':'')+'</span>':'')+'</span></button>';}return html+'</div>';}
  function handlePokerCardTap(index,mode){if(pokerState.interaction==='exchange'){const pos=pokerState.exchangeIndices.indexOf(index);if(pos>=0)pokerState.exchangeIndices.splice(pos,1);else pokerState.exchangeIndices.push(index);return mode==='offline'?renderOfflinePoker():renderPokerOnlinePlay();}if(pokerState.sortIndex<0){pokerState.sortIndex=index;return mode==='offline'?renderOfflinePoker():renderPokerOnlinePlay();}if(pokerState.sortIndex===index){pokerState.sortIndex=-1;return mode==='offline'?renderOfflinePoker():renderPokerOnlinePlay();}const from=pokerState.sortIndex;pokerState.sortIndex=-1;if(mode==='offline'){const hand=pokerState.offline.hand,temp=hand[from];hand[from]=hand[index];hand[index]=temp;renderOfflinePoker();}else{const hand=pokerState.room.currentPlayer.hand.slice(),temp=hand[from];hand[from]=hand[index];hand[index]=temp;setPokerBusy(true);google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;renderPokerOnlinePlay();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);refreshPokerRoom();}).reorderPokerHand({userId:pokerState.userId,roomId:pokerState.room.roomId,imageIds:hand.map(function(card){return card.imageId;})});}}
  function enterPokerExchange(){pokerState.interaction='exchange';pokerState.exchangeIndices=[];pokerState.sortIndex=-1;if(pokerState.screen==='offline')renderOfflinePoker();else renderPokerOnlinePlay();}
  function cancelPokerExchange(){pokerState.interaction='sort';pokerState.exchangeIndices=[];if(pokerState.screen==='offline')renderOfflinePoker();else renderPokerOnlinePlay();}
  function executeOfflineExchange(){const game=pokerState.offline,indices=pokerState.exchangeIndices.slice().sort();if(!indices.length)return pokerNotify('交換するカードを選択してください。');indices.forEach(function(index){const kept=game.hand.filter(function(card,i){return indices.indexOf(i)<0;}).concat(indices.slice(0,indices.indexOf(index)).map(function(done){return game.hand[done];}));const card=choosePokerClientCard(kept,game.drawnIds);if(card){game.hand[index]=card;game.drawnIds.push(card.imageId);}});game.exchangeCount++;pokerState.interaction='sort';pokerState.exchangeIndices=[];markPokerFlip(indices);renderOfflinePoker();}
  function executeOnlineExchange(){const indices=pokerState.exchangeIndices.slice();if(!indices.length)return pokerNotify('交換するカードを選択してください。');setPokerBusy(true);google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;pokerState.interaction='sort';pokerState.exchangeIndices=[];pokerState.onlineRevealCount=5;markPokerFlip(indices);renderPokerOnlinePlay();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).exchangePokerCards({userId:pokerState.userId,roomId:pokerState.room.roomId,indices:indices});}
  function finalizeOnlinePoker(){if(pokerState.busy)return;setPokerBusy(true);google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;renderPokerRoom();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).finalizePokerHand(pokerState.userId,pokerState.room.roomId);}

  function openPokerHighlights(){pokerState.screen='highlights';const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('神回','','renderPokerMenu()')+'<div class="poker-panel">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading('','#9cecff'):'')+'</div>';google.script.run.withSuccessHandler(renderPokerHighlights).withFailureHandler(pokerFailure).getPokerHighlights(pokerState.userId);}
  function renderPokerHighlights(items){const host=document.getElementById('pokerApp');const body=(items||[]).map(function(item){const mode=pokerModeLabel(item.mode);return '<article class="poker-panel"><div class="poker-room-meta"><span class="poker-panel-label">'+escapeHtml(mode)+' · '+escapeHtml(pokerRuleLabel(item.ruleType))+'</span><span class="poker-room-rule">'+escapeHtml(formatPokerDate(item.savedAt))+'</span></div><div class="poker-reveal-list">'+item.players.map(function(player){return '<div style="margin-top:14px"><div class="poker-player-row is-ready"><strong>'+escapeHtml(player.displayName)+'</strong></div><div style="margin-top:10px">'+renderPokerHand(player.hand,5,'locked')+'</div></div>';}).join('')+'</div></article>';}).join('')||'<div class="poker-panel poker-status"><strong>神回はまだありません</strong></div>';host.innerHTML=pokerSectionHead('神回','','renderPokerMenu()')+body;}
  function formatPokerDate(value){const date=new Date(value);if(!Number.isFinite(date.getTime()))return '';return date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}

  function startPokerPolling(){stopPokerPolling();pokerState.pollTimer=setInterval(function(){if(currentRoute!=='poker'||pokerState.screen!=='online')return stopPokerPolling();if(!pokerState.busy)refreshPokerRoom();},4000);}
  function stopPokerPolling(){if(pokerState.pollTimer){clearInterval(pokerState.pollTimer);pokerState.pollTimer=null;}}
  function refreshPokerRoom(){const room=pokerState.room;if(!room)return;google.script.run.withSuccessHandler(function(next){const changed=next.status!==room.status||next.players.length!==room.players.length||next.players.some(function(player,index){return !room.players[index]||player.isFinalized!==room.players[index].isFinalized;});pokerState.room=next;if(changed)renderPokerRoom();}).withFailureHandler(function(){}).getPokerRoomState(pokerState.userId,room.roomId);}
  function setPokerBusy(value){pokerState.busy=!!value;document.querySelectorAll('.poker-app button').forEach(function(button){if(value)button.dataset.pokerWasDisabled=button.disabled?'1':'0';button.disabled=value||button.dataset.pokerWasDisabled==='1';if(!value)delete button.dataset.pokerWasDisabled;});}
  function pokerFailure(error){const message=error&&error.message?error.message:String(error||'エラーが発生しました。');pokerNotify(message);}
  function pokerNotify(message){if(typeof showToast==='function')showToast(message);else window.alert(message);}
</script>

<style>
  .poker-page{--poker-cyan:#9cecff;--poker-line:rgba(156,236,255,.18);--poker-surface:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));max-width:980px;margin:0 auto;padding-bottom:50px;color:#fff}
  .poker-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.poker-header .title{margin:3px 0 0}.poker-home-btn{width:46px;height:46px;min-width:46px;padding:0;font-size:26px;line-height:1}
  .poker-app{min-height:440px}.poker-mode-grid,.poker-rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.poker-mode-card,.poker-rule-card{min-height:150px;padding:22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.poker-mode-card strong,.poker-rule-card strong{font:700 17px 'Orbitron',sans-serif;letter-spacing:.06em}.poker-mode-card span,.poker-rule-card span{font:500 12px 'Zen Kaku Gothic New',sans-serif;line-height:1.75;color:rgba(255,255,255,.58)}
  .poker-mode-card.is-wide{grid-column:1/-1;min-height:86px;flex-direction:row;align-items:center}.poker-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.poker-section-head h2{margin:0;font:700 clamp(20px,6vw,32px) 'Orbitron',sans-serif;letter-spacing:.06em}.poker-section-head p{margin:5px 0 0;color:rgba(255,255,255,.48);font-size:12px}.poker-back{width:46px;height:46px;min-width:46px;padding:0;font-size:24px}
  .poker-panel{border:1px solid var(--poker-line);border-radius:22px;background:var(--poker-surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);padding:18px}.poker-panel+.poker-panel{margin-top:14px}.poker-panel-label{display:block;margin-bottom:10px;color:var(--poker-cyan);font:700 10px 'Orbitron',sans-serif;letter-spacing:.18em}.poker-join{display:grid;grid-template-columns:1fr auto;gap:10px}.poker-input{min-width:0;height:50px;box-sizing:border-box;border:1px solid var(--poker-line);border-radius:15px;background:rgba(0,0,0,.25);color:#fff;padding:0 16px;font:700 18px 'Orbitron',sans-serif;letter-spacing:.18em;text-align:center;outline:none}.poker-input:focus{border-color:rgba(156,236,255,.58);box-shadow:0 0 0 3px rgba(156,236,255,.08)}.poker-join .u-btn{min-width:110px}
  .poker-room-code{font:700 clamp(36px,13vw,70px) 'Orbitron',sans-serif;letter-spacing:.18em;color:#fff;text-shadow:0 0 26px rgba(156,236,255,.22)}.poker-room-meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.poker-room-rule{font:700 11px 'Orbitron',sans-serif;letter-spacing:.1em;color:var(--poker-cyan)}
  .poker-player-list{display:grid;gap:8px;margin:16px 0}.poker-player-row{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 14px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}.poker-player-row strong{font-size:14px}.poker-player-row span{font:700 9px 'Orbitron',sans-serif;letter-spacing:.1em;color:rgba(255,255,255,.42)}.poker-player-row.is-ready{border-color:rgba(156,236,255,.25)}.poker-player-row.is-ready span{color:var(--poker-cyan)}
  .poker-actions{display:flex;gap:10px;margin-top:16px}.poker-actions .u-btn{flex:1;min-height:50px;padding:10px 14px}.poker-actions.is-stack{flex-direction:column}.poker-primary{border-color:rgba(156,236,255,.42)!important;background:linear-gradient(145deg,rgba(156,236,255,.16),rgba(156,236,255,.035))!important}.poker-danger{color:#ffb1bc!important}
  .poker-status{text-align:center;margin:8px 0 16px}.poker-status strong{display:block;font:700 11px 'Orbitron',sans-serif;letter-spacing:.16em;color:var(--poker-cyan)}.poker-status span{display:block;margin-top:7px;font-size:12px;color:rgba(255,255,255,.46)}
  .poker-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;width:100%;perspective:1000px}.poker-slot{position:relative;aspect-ratio:7/10;border:0;padding:0;border-radius:11px;background:transparent;min-width:0}.poker-card{position:absolute;inset:0;border-radius:11px;overflow:hidden;border:1px solid rgba(156,236,255,.18);background:radial-gradient(circle at 50% 22%,rgba(156,236,255,.12),transparent 42%),#090d14;box-shadow:0 12px 24px rgba(0,0,0,.34);transition:transform .22s ease,opacity .22s ease,border-color .22s ease}.poker-card.is-back::before{content:'BMSG';position:absolute;inset:9px;border:1px solid rgba(156,236,255,.22);border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.72);font:700 clamp(7px,2vw,13px) 'Orbitron',sans-serif;letter-spacing:.08em;background:radial-gradient(circle,rgba(156,236,255,.12),transparent 58%)}.poker-card img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.poker-card-label{position:absolute;left:4px;right:4px;bottom:4px;padding:4px 3px;border-radius:5px;background:rgba(2,4,8,.82);font:700 clamp(6px,1.7vw,9px) 'Orbitron',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.poker-rarity{position:absolute;top:4px;right:4px;padding:2px 4px;border-radius:4px;background:rgba(2,4,8,.82);font:800 7px 'Orbitron',sans-serif}.poker-card.rarity-r{border-color:#b87846}.poker-card.rarity-sr{border-color:#dbe5ef;box-shadow:0 0 14px rgba(219,229,239,.17),0 12px 24px rgba(0,0,0,.34)}.poker-card.rarity-ssr{border-color:#f2c64f;box-shadow:0 0 18px rgba(242,198,79,.25),0 12px 24px rgba(0,0,0,.38)}.poker-slot.is-sort .poker-card{transform:translateY(-10px);border-color:var(--poker-cyan);box-shadow:0 0 18px rgba(156,236,255,.25)}.poker-slot.is-exchange .poker-card{transform:translateY(10px);opacity:.48;border-color:#ff7b8d}.poker-slot:focus-visible{outline:2px solid var(--poker-cyan);outline-offset:3px}
  .poker-final-grid{display:grid;gap:14px}.poker-final-player{padding:15px;border:1px solid var(--poker-line);border-radius:20px;background:rgba(255,255,255,.025)}.poker-final-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.poker-final-head strong{font-size:15px}.poker-final-head span{font:700 9px 'Orbitron',sans-serif;color:var(--poker-cyan);letter-spacing:.1em}.poker-vote-btn{width:100%;min-height:44px;margin-top:12px}.poker-result{text-align:center;padding:22px}.poker-result-label{font:700 10px 'Orbitron',sans-serif;letter-spacing:.2em;color:var(--poker-cyan)}.poker-result-name{margin-top:8px;font:700 clamp(28px,9vw,48px) 'Orbitron',sans-serif}.poker-waiting{padding:28px;text-align:center;color:rgba(255,255,255,.62);line-height:1.8}
  .poker-highlight-list{display:grid;gap:14px}.poker-highlight-date{font:600 10px 'Exo 2',sans-serif;color:rgba(255,255,255,.42);letter-spacing:.08em}.poker-empty{padding:40px 18px;text-align:center;color:rgba(255,255,255,.5)}
  @media(max-width:560px){.poker-mode-grid,.poker-rule-grid{grid-template-columns:1fr}.poker-mode-card.is-wide{grid-column:auto}.poker-mode-card{min-height:118px}.poker-panel{padding:14px}.poker-board{gap:4px}.poker-card{border-radius:8px}.poker-card.is-back::before{inset:5px;border-radius:5px}.poker-actions{flex-direction:column}.poker-room-meta{align-items:flex-start;flex-direction:column}.poker-join{grid-template-columns:1fr}.poker-join .u-btn{min-height:50px}}
  @media(prefers-reduced-motion:reduce){.poker-card{transition:none!important}}
</style>

<style>
  /* POKER UX polish 2026-09-08 */
  .poker-page{padding-top:76px}
  .poker-header{align-items:center;margin-bottom:22px;min-height:52px}
  .poker-header .eyebrow{display:none!important}
  .poker-header .title{margin:0}
  .poker-home-btn{position:static!important;flex:0 0 46px}
  .poker-mode-card,.poker-rule-card{min-height:96px;align-items:center;justify-content:center;text-align:center}
  .poker-mode-card strong,.poker-rule-card strong{font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;letter-spacing:.02em}
  .poker-mode-card span,.poker-rule-card span,.poker-section-head p{display:none!important}
  .poker-section-head{align-items:center}
  .poker-section-head h2{font-family:'Zen Kaku Gothic New',sans-serif;letter-spacing:.02em}
  .poker-status strong{font-family:'Zen Kaku Gothic New',sans-serif;letter-spacing:.04em}
  .poker-card-label{color:#fff!important;background:rgba(2,4,8,.78)!important;font-family:'Zen Kaku Gothic New',sans-serif!important;letter-spacing:0!important;font-weight:700!important}
  .poker-card-rarity,.poker-rarity{display:none!important}
  .poker-card.rarity-n{border-color:#9cecff!important;box-shadow:0 0 9px rgba(156,236,255,.15),0 12px 24px rgba(0,0,0,.34)}
  .poker-card.rarity-r{border-color:#b87846!important;box-shadow:0 0 10px rgba(184,120,70,.18),0 12px 24px rgba(0,0,0,.34)}
  .poker-card.rarity-sr{border-color:#dbe5ef!important;box-shadow:0 0 12px rgba(219,229,239,.2),0 12px 24px rgba(0,0,0,.34)}
  .poker-card.rarity-ssr{border-color:#f2c64f!important;box-shadow:0 0 16px rgba(242,198,79,.25),0 12px 24px rgba(0,0,0,.38)}
  .poker-card.is-revealing{animation:pokerCardReveal .46s cubic-bezier(.2,.76,.25,1) both;transform-style:preserve-3d;transform-origin:center center}
  @keyframes pokerCardReveal{0%{transform:rotateY(-88deg) scale(.97);opacity:.45}58%{transform:rotateY(13deg) scale(1.015);opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
  @media(max-width:560px){.poker-page{padding-top:82px}.poker-mode-card,.poker-rule-card{min-height:78px}.poker-section-head h2{font-size:22px}}
  @media(prefers-reduced-motion:reduce){.poker-card.is-revealing{animation:none!important}}
</style>
<script>
  function pokerRuleLabel(rule){return rule==='A'?'交換無制限モード':'交換1回モード';}
  function pokerModeLabel(mode){return String(mode||'').toUpperCase()==='ONLINE'?'みんなで':'1人で';}
  function setPokerFlipIndices(indices){pokerState.flipIndices=Array.isArray(indices)?indices.slice():[];if(pokerState.flipTimer)clearTimeout(pokerState.flipTimer);pokerState.flipTimer=setTimeout(function(){pokerState.flipIndices=[];},520);}

  function renderPokerMenu(){
    stopPokerPolling();pokerState.screen='menu';pokerState.room=null;
    const host=document.getElementById('pokerApp');if(!host)return;
    host.innerHTML='<div class="poker-mode-grid">'
      +'<button type="button" class="u-btn poker-mode-card" onclick="renderPokerOfflineRules()"><strong>1人で</strong></button>'
      +'<button type="button" class="u-btn poker-mode-card" onclick="renderPokerOnlineMenu()"><strong>みんなで</strong></button>'
      +'<button type="button" class="u-btn poker-mode-card is-wide" onclick="openPokerHighlights()"><strong>神回</strong></button>'
      +'</div>';
  }

  function pokerSectionHead(title,copy,back){
    return '<div class="poker-section-head"><div><h2>'+escapeHtml(title)+'</h2></div><button type="button" class="u-btn poker-back" onclick="'+back+'" aria-label="戻る">‹</button></div>';
  }

  function ruleCard(rule,handler){
    return '<button type="button" class="u-btn poker-rule-card" onclick="'+handler+'(\''+rule+'\')"><strong>'+pokerRuleLabel(rule)+'</strong></button>';
  }

  function renderPokerOfflineRules(){
    pokerState.screen='offline-rules';const host=document.getElementById('pokerApp');
    host.innerHTML=pokerSectionHead('1人で','', 'renderPokerMenu()')+'<div class="poker-rule-grid">'+ruleCard('A','startOfflinePoker')+ruleCard('B','startOfflinePoker')+'</div>';
  }

  function renderOfflinePoker(){
    pokerState.screen='offline';const game=pokerState.offline;if(!game)return renderPokerOfflineRules();
    const drawn=game.hand.length;
    let status=drawn<5?'カードをめくる':(game.finalized?'手札確定':(pokerState.interaction==='exchange'?'交換するカードを選択':'カードを並べ替える'));
    let actions='';
    if(drawn<5){
      actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="drawOfflinePokerCard()">カードをめくる</button></div>';
    }else if(game.finalized){
      actions='<div class="poker-actions is-stack"><button type="button" class="u-btn poker-primary" '+(game.saved?'disabled':'onclick="saveOfflinePoker()"')+'>'+(game.saved?'保存済み':'保存する')+'</button><button type="button" class="u-btn" onclick="startOfflinePoker(\''+game.ruleType+'\')">もう一度プレイ</button><button type="button" class="u-btn" onclick="renderPokerMenu()">終了する</button></div>';
    }else if(pokerState.interaction==='exchange'){
      actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="executeOfflineExchange()">交換する</button><button type="button" class="u-btn" onclick="cancelPokerExchange()">戻る</button></div>';
    }else{
      const canExchange=game.ruleType==='A'||game.exchangeCount<1;
      actions='<div class="poker-actions"><button type="button" class="u-btn" '+(canExchange?'onclick="enterPokerExchange()"':'disabled')+'>交換する</button><button type="button" class="u-btn poker-primary" onclick="finalizeOfflinePoker()">確定する</button></div>';
    }
    const host=document.getElementById('pokerApp');
    host.innerHTML=pokerSectionHead('1人で','', 'confirmExitOfflinePoker()')+'<div class="poker-status"><strong>'+status+'</strong></div>'+renderPokerHand(game.hand,drawn,'offline')+actions;
  }

  function drawOfflinePokerCard(){
    const game=pokerState.offline;if(!game||game.hand.length>=5)return;
    const card=choosePokerClientCard(game.hand,game.drawnIds);if(!card)return pokerNotify('カードを引けませんでした。');
    game.hand.push(card);game.drawnIds.push(card.imageId);setPokerFlipIndices([game.hand.length-1]);renderOfflinePoker();
  }

  function renderPokerOnlineMenu(){
    pokerState.screen='online-menu';const host=document.getElementById('pokerApp');
    host.innerHTML=pokerSectionHead('みんなで','', 'renderPokerMenu()')
      +'<div class="poker-panel"><div class="poker-rule-grid">'+ruleCard('A','createOnlinePokerRoom')+ruleCard('B','createOnlinePokerRoom')+'</div></div>'
      +'<div class="poker-panel"><div class="poker-join"><input id="pokerRoomInput" class="poker-input" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="ルームID"><button type="button" class="u-btn poker-primary" onclick="joinOnlinePokerRoom()">参加する</button></div></div>';
  }

  function renderPokerLobby(){
    const room=pokerState.room;const canStart=room.isCreator&&room.players.length>=2;
    const rows=room.players.map(function(player){return '<div class="poker-player-row"><strong>'+escapeHtml(player.displayName)+'</strong><span>'+(player.userId===room.creatorUserId?'作成者':'参加中')+'</span></div>';}).join('');
    const host=document.getElementById('pokerApp');
    host.innerHTML=pokerSectionHead('みんなで','', 'leaveOnlinePokerRoom()')+'<div class="poker-panel"><div class="poker-room-meta"><div><span class="poker-panel-label">ROOM ID</span><div class="poker-room-code">'+escapeHtml(room.roomId)+'</div></div><div class="poker-room-rule">'+escapeHtml(pokerRuleLabel(room.ruleType))+' · '+room.players.length+' / 3</div></div><div class="poker-player-list">'+rows+'</div>'+(room.isCreator?'<div class="poker-actions"><button type="button" class="u-btn poker-primary" '+(canStart?'onclick="startOnlinePokerRoom()"':'disabled')+'>ゲームを始める</button></div>':'')+'</div>';
  }

  function renderPokerOnlinePlay(){
    const room=pokerState.room,player=room.currentPlayer;if(player.isFinalized)return renderPokerWaitingFinal();
    const hand=player.hand||[];if(pokerState.onlineRevealCount>hand.length)pokerState.onlineRevealCount=hand.length;
    const revealed=Math.min(pokerState.onlineRevealCount,hand.length);let actions='';
    if(revealed<5){actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="revealNextOnlinePokerCard()">カードをめくる</button></div>';}
    else if(pokerState.interaction==='exchange'){actions='<div class="poker-actions"><button type="button" class="u-btn poker-primary" onclick="executeOnlineExchange()">交換する</button><button type="button" class="u-btn" onclick="cancelPokerExchange()">戻る</button></div>';}
    else{const canExchange=room.ruleType==='A'||player.exchangeCount<1;actions='<div class="poker-actions"><button type="button" class="u-btn" '+(canExchange?'onclick="enterPokerExchange()"':'disabled')+'>交換する</button><button type="button" class="u-btn poker-primary" onclick="finalizeOnlinePoker()">確定する</button></div>';}
    const status=revealed<5?'カードをめくる':(pokerState.interaction==='exchange'?'交換するカードを選択':'カードを並べ替える');
    const host=document.getElementById('pokerApp');
    host.innerHTML=pokerSectionHead('みんなで','', 'leaveOnlinePokerRoom()')+'<div class="poker-status"><strong>'+status+'</strong></div>'+renderPokerHand(hand,revealed,'online')+actions;
  }

  function revealNextOnlinePokerCard(){
    const next=Math.min(5,pokerState.onlineRevealCount+1);setPokerFlipIndices([next-1]);pokerState.onlineRevealCount=next;renderPokerOnlinePlay();
  }

  function renderPokerWaitingFinal(){
    const room=pokerState.room;
    const rows=room.players.map(function(player){return '<div class="poker-player-row '+(player.isFinalized?'is-ready':'')+'"><strong>'+escapeHtml(player.displayName)+'</strong><span>'+(player.isFinalized?'確定':'プレイ中')+'</span></div>';}).join('');
    const host=document.getElementById('pokerApp');
    host.innerHTML=pokerSectionHead('みんなで','', 'leaveOnlinePokerRoom()')+'<div class="poker-panel">'+renderPokerHand(room.currentPlayer.hand,5,'locked')+'<div class="poker-player-list">'+rows+'</div></div>';
  }

  function renderPokerRevealAndVote(){
    const room=pokerState.room,completed=room.status==='COMPLETED';
    const cards=room.players.map(function(player){const canVote=!completed&&!room.hasVoted&&player.userId!==pokerState.userId;return '<article class="poker-panel"><div class="poker-player-row is-ready"><strong>'+escapeHtml(player.displayName)+'</strong><span>'+(completed?(room.voteCounts[player.userId]||0)+'票':'')+'</span></div><div style="margin-top:12px">'+renderPokerHand(player.hand,5,'locked')+'</div>'+(canVote?'<button type="button" class="u-btn poker-primary poker-vote-btn" onclick="voteOnlinePoker(\''+escapeHtml(player.userId)+'\')">投票する</button>':'')+'</article>';}).join('');
    let result='';
    if(completed){const names=room.players.filter(function(player){return room.winnerUserIds.indexOf(player.userId)>=0;}).map(function(player){return player.displayName;});result='<div class="poker-panel poker-status"><strong>'+(names.length>1?'引き分け':'勝者')+'</strong><div class="poker-room-code" style="font-size:clamp(25px,8vw,46px)">'+escapeHtml(names.join(' / '))+'</div></div>';}
    const save='<div class="poker-actions is-stack"><button type="button" class="u-btn poker-primary" '+(room.highlightSaved?'disabled':'onclick="saveOnlinePokerHighlight()"')+'>'+(room.highlightSaved?'保存済み':'保存する')+'</button><button type="button" class="u-btn" onclick="leaveOnlinePokerRoom()">終了する</button></div>';
    const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('最終手札','', 'leaveOnlinePokerRoom()')+result+'<div class="poker-reveal-list">'+cards+'</div>'+save;
  }

  function renderPokerHand(hand,revealed,mode){
    const list=Array.isArray(hand)?hand:[];const flips=Array.isArray(pokerState.flipIndices)?pokerState.flipIndices:[];let html='<div class="poker-board">';
    for(let i=0;i<5;i++){
      const card=list[i],visible=card&&i<revealed;let selected=pokerState.interaction==='exchange'?pokerState.exchangeIndices.indexOf(i)>=0:pokerState.sortIndex===i;
      const cls=selected?(pokerState.interaction==='exchange'?' is-exchange':' is-sort'):'';
      const action=(mode==='offline'||mode==='online')&&revealed>=5?'onclick="handlePokerCardTap('+i+',\''+mode+'\')"':'';
      const revealClass=visible&&flips.indexOf(i)>=0?' is-revealing':'';
      html+='<button type="button" class="poker-slot'+cls+'" '+action+' aria-label="カード '+(i+1)+'"><span class="poker-card '+(visible?'rarity-'+String(card.rarity||'N').toLowerCase():'is-back')+revealClass+'">'+(visible?'<img src="https://lh3.googleusercontent.com/d/'+encodeURIComponent(card.driveFileId)+'" alt=""><span class="poker-card-label">'+escapeHtml(card.memberName)+'</span>':'')+'</span></button>';
    }
    return html+'</div>';
  }

  function executeOfflineExchange(){
    const game=pokerState.offline,indices=pokerState.exchangeIndices.slice().sort();if(!indices.length)return pokerNotify('交換するカードを選択してください。');
    indices.forEach(function(index){const kept=game.hand.filter(function(card,i){return indices.indexOf(i)<0;}).concat(indices.slice(0,indices.indexOf(index)).map(function(done){return game.hand[done];}));const card=choosePokerClientCard(kept,game.drawnIds);if(card){game.hand[index]=card;game.drawnIds.push(card.imageId);}});
    game.exchangeCount++;pokerState.interaction='sort';pokerState.exchangeIndices=[];setPokerFlipIndices(indices);renderOfflinePoker();
  }

  function executeOnlineExchange(){
    const indices=pokerState.exchangeIndices.slice();if(!indices.length)return pokerNotify('交換するカードを選択してください。');
    setPokerBusy(true);google.script.run.withSuccessHandler(function(room){setPokerBusy(false);pokerState.room=room;pokerState.interaction='sort';pokerState.exchangeIndices=[];pokerState.onlineRevealCount=5;setPokerFlipIndices(indices);renderPokerOnlinePlay();}).withFailureHandler(function(error){setPokerBusy(false);pokerFailure(error);}).exchangePokerCards({userId:pokerState.userId,roomId:pokerState.room.roomId,indices:indices});
  }

  function openPokerHighlights(){
    pokerState.screen='highlights';const host=document.getElementById('pokerApp');host.innerHTML=pokerSectionHead('神回','', 'renderPokerMenu()')+'<div class="poker-panel">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING...','#9cecff'):'LOADING...')+'</div>';google.script.run.withSuccessHandler(renderPokerHighlights).withFailureHandler(pokerFailure).getPokerHighlights(pokerState.userId);
  }

  function renderPokerHighlights(items){
    const host=document.getElementById('pokerApp');
    const body=(items||[]).map(function(item){return '<article class="poker-panel"><div class="poker-room-meta"><span class="poker-panel-label">'+escapeHtml(pokerModeLabel(item.mode))+' · '+escapeHtml(pokerRuleLabel(item.ruleType))+'</span><span class="poker-room-rule">'+escapeHtml(formatPokerDate(item.savedAt))+'</span></div><div class="poker-reveal-list">'+item.players.map(function(player){return '<div style="margin-top:14px"><div class="poker-player-row is-ready"><strong>'+escapeHtml(player.displayName)+'</strong></div><div style="margin-top:10px">'+renderPokerHand(player.hand,5,'locked')+'</div></div>';}).join('')+'</div></article>';}).join('')||'<div class="poker-panel poker-empty">保存した神回はまだありません。</div>';
    host.innerHTML=pokerSectionHead('神回','', 'renderPokerMenu()')+body;
  }
</script>

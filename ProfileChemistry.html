<script>
  const profileChemistryState = {
    status: 'idle', fields: [], valuesByMemberId: {}, memberA: '', memberB: '', activeSlot: 'a', error: '',
    detailsByMemberId: {}, detailLoadingByMemberId: {}, detailErrorByMemberId: {}
  };

  function loadProfileChemistry(forceReload = false) {
    if (profileCurrentView !== 'chemistry') return;
    if (profileMembersState.status !== 'ready') {
      renderProfileChemistryLoading();
      if (profileMembersState.status === 'idle' || profileMembersState.status === 'error') loadProfileMembers(forceReload);
      return;
    }
    if (!forceReload && profileChemistryState.status === 'ready') return renderProfileChemistry();
    if (!forceReload && profileChemistryState.status === 'loading') return renderProfileChemistryLoading();

    profileChemistryState.status = 'loading';
    profileChemistryState.error = '';
    renderProfileChemistryLoading();
    google.script.run.withSuccessHandler(handleProfileChemistrySuccess)
      .withFailureHandler(handleProfileChemistryFailure).getProfileSearchData();
  }

  function handleProfileChemistrySuccess(response) {
    if (!response || !response.ok || !response.data) {
      return handleProfileChemistryFailure(response && response.error ? response.error.message : '比較データの読み込みに失敗しました。');
    }
    profileChemistryState.status = 'ready';
    profileChemistryState.fields = Array.isArray(response.data.fields) ? response.data.fields : [];
    profileChemistryState.valuesByMemberId = (Array.isArray(response.data.members) ? response.data.members : []).reduce((map, member) => {
      map[member.memberId] = member.values || {};
      return map;
    }, {});
    profileChemistryState.error = '';
    if (profileCurrentView === 'chemistry') renderProfileChemistry();
  }

  function handleProfileChemistryFailure(error) {
    profileChemistryState.status = 'error';
    profileChemistryState.error = error && error.message ? error.message : String(error || '比較データの読み込みに失敗しました。');
    if (profileCurrentView === 'chemistry') renderProfileChemistry();
  }

  function renderProfileChemistryLoading() {
    const panel = document.getElementById('profilePanel');
    if (!panel || profileCurrentView !== 'chemistry') return;
    panel.innerHTML = `<div class="profile-chemistry-head"><p class="profile-panel-eyebrow">TWO PEOPLE</p><h2 class="profile-chemistry-title">CHEMISTRY</h2></div><div class="profile-chemistry-loading" aria-live="polite"><span class="profile-detail-spinner"></span><span>LOADING CHEMISTRY...</span></div>`;
  }

  function selectProfileChemistrySlot(slot) {
    if (slot !== 'a' && slot !== 'b') return;
    profileChemistryState.activeSlot = slot;
    renderProfileChemistry();
  }

  function selectProfileChemistryMember(button) {
    const memberId = button && button.dataset ? button.dataset.memberId : '';
    if (!memberId) return;
    const slot = profileChemistryState.activeSlot;
    const otherSlot = slot === 'a' ? 'b' : 'a';
    const slotKey = slot === 'a' ? 'memberA' : 'memberB';
    const otherKey = otherSlot === 'a' ? 'memberA' : 'memberB';

    if (profileChemistryState[otherKey] === memberId) profileChemistryState[otherKey] = '';
    profileChemistryState[slotKey] = memberId;
    profileChemistryState.activeSlot = otherSlot;
    loadProfileChemistryDetail(memberId);
    renderProfileChemistry();
    if (profileChemistryState.memberA && profileChemistryState.memberB) {
      requestAnimationFrame(() => {
        const result = document.getElementById('profileChemistryResult');
        if (result) result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  }

  function loadProfileChemistryDetail(memberId, forceReload = false) {
    if (!memberId) return;
    if (!forceReload && profileChemistryState.detailsByMemberId[memberId]) return;
    if (!forceReload && profileChemistryState.detailLoadingByMemberId[memberId]) return;

    profileChemistryState.detailLoadingByMemberId[memberId] = true;
    delete profileChemistryState.detailErrorByMemberId[memberId];
    google.script.run
      .withSuccessHandler(response => handleProfileChemistryDetailSuccess(memberId, response))
      .withFailureHandler(error => handleProfileChemistryDetailFailure(memberId, error))
      .getProfileMemberDetail(memberId);
  }

  function handleProfileChemistryDetailSuccess(memberId, response) {
    profileChemistryState.detailLoadingByMemberId[memberId] = false;
    if (!response || !response.ok || !response.data) {
      return handleProfileChemistryDetailFailure(memberId, response && response.error ? response.error.message : 'プロフィール詳細の読み込みに失敗しました。');
    }
    profileChemistryState.detailsByMemberId[memberId] = Array.isArray(response.data.fields) ? response.data.fields : [];
    delete profileChemistryState.detailErrorByMemberId[memberId];
    if (profileCurrentView === 'chemistry') renderProfileChemistry();
  }

  function handleProfileChemistryDetailFailure(memberId, error) {
    profileChemistryState.detailLoadingByMemberId[memberId] = false;
    profileChemistryState.detailErrorByMemberId[memberId] = error && error.message ? error.message : String(error || 'プロフィール詳細の読み込みに失敗しました。');
    if (profileCurrentView === 'chemistry') renderProfileChemistry();
  }

  function clearProfileChemistryMember(slot, event) {
    if (event) event.stopPropagation();
    if (slot === 'a') profileChemistryState.memberA = '';
    if (slot === 'b') profileChemistryState.memberB = '';
    profileChemistryState.activeSlot = slot;
    renderProfileChemistry();
  }

  function getProfileChemistryMember(memberId) {
    return profileMembersState.members.find(member => member.memberId === memberId) || null;
  }

  function getProfileChemistryComparison(memberA, memberB) {
    const valuesA = profileChemistryState.valuesByMemberId[memberA.memberId] || {};
    const valuesB = profileChemistryState.valuesByMemberId[memberB.memberId] || {};
    const scoreFields = profileChemistryState.fields.filter(field =>
      field && field.profileId !== '_zodiac' && field.profileId !== '_chineseZodiac'
    );
    const matched = [];

    scoreFields.forEach(field => {
      const listA = Array.isArray(valuesA[field.profileId]) ? valuesA[field.profileId].filter(Boolean) : [];
      const listB = Array.isArray(valuesB[field.profileId]) ? valuesB[field.profileId].filter(Boolean) : [];
      const common = listA.filter(value => listB.includes(value));
      if (common.length) matched.push({ field, values: [...new Set(common)] });
    });

    return {
      score: scoreFields.length ? Math.round(matched.length / scoreFields.length * 100) : 0,
      comparedCount: scoreFields.length,
      matched
    };
  }

  function getProfileChemistryBirthdayMonth(value) {
    const text = String(value == null ? '' : value).trim();
    if (!text || text === '—') return '';
    const normalized = text.replace(/[年月.\-]/g, '/').replace(/日/g, '');
    const match = normalized.match(/(?:\d{4}\s*\/\s*)?(\d{1,2})\s*\/\s*\d{1,2}/);
    return match ? String(Number(match[1])) : '';
  }

  function isProfileChemistryComparableDetailProfileId(profileId) {
    if (!profileId) return false;
    return profileChemistryState.fields.some(field => {
      if (!field || !field.profileId) return false;
      if (field.profileId === '_zodiac' || field.profileId === '_chineseZodiac') return false;
      if (field.profileId === '_birthMonth') return profileId === 'P002';
      return field.profileId === profileId;
    });
  }

  function isProfileChemistryDetailRowMatch(row) {
    if (!row || !isProfileChemistryComparableDetailProfileId(row.profileId) || row.valueA === '—' || row.valueB === '—') return false;
    if (row.profileId === 'P002') {
      const monthA = getProfileChemistryBirthdayMonth(row.valueA);
      const monthB = getProfileChemistryBirthdayMonth(row.valueB);
      return Boolean(monthA && monthB && monthA === monthB);
    }
    return row.valueA === row.valueB;
  }

  function getProfileChemistryDetailRows(memberA, memberB) {
    const detailA = profileChemistryState.detailsByMemberId[memberA.memberId] || [];
    const detailB = profileChemistryState.detailsByMemberId[memberB.memberId] || [];
    const byIdA = detailA.reduce((map, field) => { map[field.profileId] = field; return map; }, {});
    const byIdB = detailB.reduce((map, field) => { map[field.profileId] = field; return map; }, {});
    const ids = [...new Set(detailA.concat(detailB)
      .filter(field => field && field.profileId && isProfileChemistryComparableDetailProfileId(field.profileId))
      .map(field => field.profileId))];

    return ids.map(profileId => {
      const fieldA = byIdA[profileId] || {};
      const fieldB = byIdB[profileId] || {};
      const orderA = Number(fieldA.displayOrder);
      const orderB = Number(fieldB.displayOrder);
      const displayOrder = Number.isFinite(orderA) ? orderA : Number.isFinite(orderB) ? orderB : 9999;
      return {
        profileId,
        label: fieldA.label || fieldB.label || profileId,
        displayGroup: fieldA.displayGroup || fieldB.displayGroup || 'PROFILE',
        displayOrder,
        valueA: fieldA.value || '—',
        valueB: fieldB.value || '—'
      };
    }).sort((a, b) => a.displayOrder - b.displayOrder || a.profileId.localeCompare(b.profileId));
  }

  function resetProfileChemistrySelection() {
    if (typeof returnProfileChemistryToDiscover === 'function' && returnProfileChemistryToDiscover()) return;
    profileChemistryState.memberA = '';
    profileChemistryState.memberB = '';
    profileChemistryState.activeSlot = 'a';
    renderProfileChemistry();
    requestAnimationFrame(() => {
      const panel = document.getElementById('profilePanel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function renderProfileChemistry() {
    const panel = document.getElementById('profilePanel');
    if (!panel || profileCurrentView !== 'chemistry') return;
    if (profileChemistryState.status === 'idle' || profileChemistryState.status === 'loading') return renderProfileChemistryLoading();
    if (profileChemistryState.status === 'error') {
      panel.innerHTML = `<article class="profile-members-state"><p class="profile-panel-eyebrow">CONNECTION ERROR</p><h2 class="profile-members-state-title">ERROR</h2><p class="profile-panel-copy">${escapeHtml(profileChemistryState.error)}</p><button class="profile-retry-button" type="button" onclick="loadProfileChemistry(true)">RETRY</button></article>`;
      return;
    }

    const memberA = getProfileChemistryMember(profileChemistryState.memberA);
    const memberB = getProfileChemistryMember(profileChemistryState.memberB);
    const members = getVisibleProfileMembers();
    const isResultMode = Boolean(memberA && memberB);

    panel.innerHTML = `<div class="profile-chemistry-head"><p class="profile-panel-eyebrow">TWO PEOPLE</p><h2 class="profile-chemistry-title">CHEMISTRY</h2>${isResultMode ? '<button class="profile-chemistry-back" type="button" onclick="resetProfileChemistrySelection()">← BACK</button>' : ''}</div>
      <div class="profile-chemistry-slots${isResultMode ? ' result' : ''}">
        ${renderProfileChemistrySlot('a', memberA, '01')}
        <span class="profile-chemistry-cross" aria-hidden="true">×</span>
        ${renderProfileChemistrySlot('b', memberB, '02')}
      </div>
      ${isResultMode
        ? renderProfileChemistryResult(memberA, memberB)
        : `<section class="profile-chemistry-picker"><div class="profile-chemistry-section-head"><h3>MEMBERS</h3><span>${members.length}</span></div><div class="profile-chemistry-member-grid">${members.map(renderProfileChemistryMemberButton).join('')}</div></section>`}`;
  }

  function renderProfileChemistrySlot(slot, member, number) {
    const active = profileChemistryState.activeSlot === slot;
    if (!member) {
      return `<button class="profile-chemistry-slot${active ? ' active' : ''}" type="button" onclick="selectProfileChemistrySlot('${slot}')"><span class="profile-chemistry-slot-number">${number}</span><span class="profile-chemistry-slot-empty">SELECT</span><span class="profile-chemistry-slot-plus">+</span></button>`;
    }
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '') ? member.colorHex : '#9cecff';
    const image = renderProfileChemistryImage(member);
    return `<button class="profile-chemistry-slot selected${active ? ' active' : ''}" style="--member-accent:${escapeHtml(accent)}" type="button" onclick="selectProfileChemistrySlot('${slot}')"><span class="profile-chemistry-slot-number">${number}</span><span class="profile-chemistry-slot-avatar">${image}</span><span class="profile-chemistry-slot-name">${escapeHtml(member.displayName)}</span><span class="profile-chemistry-slot-remove" role="button" aria-label="Remove" onclick="clearProfileChemistryMember('${slot}', event)">×</span></button>`;
  }

  function renderProfileChemistryMemberButton(member) {
    const selectedA = profileChemistryState.memberA === member.memberId;
    const selectedB = profileChemistryState.memberB === member.memberId;
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '') ? member.colorHex : '#9cecff';
    return `<button class="profile-chemistry-member${selectedA || selectedB ? ' selected' : ''}" style="--member-accent:${escapeHtml(accent)}" type="button" data-member-id="${escapeHtml(member.memberId)}" onclick="selectProfileChemistryMember(this)">${renderProfileChemistryImage(member)}<span>${escapeHtml(member.displayName)}</span>${selectedA || selectedB ? `<b>${selectedA ? '01' : '02'}</b>` : ''}</button>`;
  }

  function renderProfileChemistryImage(member) {
    const initial = String(member.displayName || '?').slice(0, 1).toUpperCase();
    return member.imageUrl
      ? `<img src="${escapeHtml(member.imageUrl)}" data-fallback-src="${escapeHtml(member.imageFallbackUrl || '')}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="handleProfileImageError(this)"><i aria-hidden="true">${escapeHtml(initial)}</i>`
      : `<i aria-hidden="true">${escapeHtml(initial)}</i>`;
  }

  function renderProfileChemistryResult(memberA, memberB) {
    const result = getProfileChemistryComparison(memberA, memberB);
    const detailA = profileChemistryState.detailsByMemberId[memberA.memberId];
    const detailB = profileChemistryState.detailsByMemberId[memberB.memberId];
    const errorA = profileChemistryState.detailErrorByMemberId[memberA.memberId];
    const errorB = profileChemistryState.detailErrorByMemberId[memberB.memberId];
    const loading = !detailA || !detailB;

    if (loading && !profileChemistryState.detailLoadingByMemberId[memberA.memberId] && !errorA) loadProfileChemistryDetail(memberA.memberId);
    if (loading && !profileChemistryState.detailLoadingByMemberId[memberB.memberId] && !errorB) loadProfileChemistryDetail(memberB.memberId);

    let comparisonBody = '';
    if (errorA || errorB) {
      comparisonBody = `<div class="profile-chemistry-detail-error"><p>${escapeHtml(errorA || errorB)}</p><button type="button" onclick="loadProfileChemistryDetail('${escapeHtml(errorA ? memberA.memberId : memberB.memberId)}', true)">RETRY</button></div>`;
    } else if (loading) {
      comparisonBody = `<div class="profile-chemistry-detail-loading"><span class="profile-detail-spinner"></span><span>LOADING PROFILES...</span></div>`;
    } else {
      const rows = getProfileChemistryDetailRows(memberA, memberB);
      comparisonBody = `<div class="profile-chemistry-compare-head"><strong>${escapeHtml(memberA.displayName)}</strong><span>PROFILE</span><strong>${escapeHtml(memberB.displayName)}</strong></div><div class="profile-chemistry-compare-rows">${rows.map(row => {
        const same = isProfileChemistryDetailRowMatch(row);
        return `<div class="profile-chemistry-compare-row${same ? ' match' : ''}"><dd>${escapeHtml(row.valueA)}</dd><dt>${escapeHtml(row.label)}</dt><dd>${escapeHtml(row.valueB)}</dd></div>`;
      }).join('')}</div>`;
    }

    return `<section id="profileChemistryResult" class="profile-chemistry-result"><div class="profile-chemistry-match-center"><p>MATCH</p><div class="profile-chemistry-score" style="--score:${result.score}"><div><strong>${result.score}</strong><span>%</span></div></div><small>${result.matched.length} / ${result.comparedCount}</small></div><div class="profile-chemistry-compare">${comparisonBody}</div></section>`;
  }
</script>

-score{--score:0;width:92px;height:92px;padding:6px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) calc(var(--score)*1%),rgba(255,255,255,.07) 0)}.profile-chemistry-score>div{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#071019}.profile-chemistry-score strong{color:#f5fbfd;font:600 27px Orbitron,sans-serif}.profile-chemistry-score span{margin:7px 0 0 2px;color:var(--cyan);font:700 10px "Exo 2",sans-serif}.profile-chemistry-result-copy{min-width:0}.profile-chemistry-result-copy p{margin:0 0 7px;color:var(--cyan);font:700 9px "Exo 2",sans-serif;letter-spacing:.16em}.profile-chemistry-result-copy h3{margin:0;overflow-wrap:anywhere;color:rgba(247,251,255,.92);font:600 17px/1.25 "Exo 2","Zen Kaku Gothic New",sans-serif}.profile-chemistry-result-copy small{display:block;margin-top:8px;color:rgba(238,248,252,.40);font:700 10px "Exo 2",sans-serif;letter-spacing:.10em}.profile-chemistry-compare{grid-column:1/-1;margin-top:5px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)}.profile-chemistry-compare-head,.profile-chemistry-compare-row{display:grid;grid-template-columns:minmax(76px,.82fr) minmax(0,1fr) minmax(0,1fr);gap:10px}.profile-chemistry-compare-head{padding:0 0 10px;border-bottom:1px solid rgba(156,236,255,.16);align-items:end}.profile-chemistry-compare-head span{color:rgba(238,248,252,.38);font:700 9px "Exo 2",sans-serif;letter-spacing:.12em}.profile-chemistry-compare-head strong{min-width:0;color:rgba(247,251,255,.78);font:700 11px "Exo 2","Zen Kaku Gothic New",sans-serif;overflow-wrap:anywhere}.profile-chemistry-compare-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.065);align-items:start}.profile-chemistry-compare-row dt{color:rgba(238,248,252,.46);font-size:11px;line-height:1.55;overflow-wrap:anywhere}.profile-chemistry-compare-row dd{margin:0;color:#f5fbfd;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.profile-chemistry-compare-row.match dd{color:var(--cyan)}.profile-chemistry-detail-loading{min-height:120px;display:flex;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.55);font:600 11px "Exo 2",sans-serif;letter-spacing:.10em}.profile-chemistry-detail-error{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.profile-chemistry-detail-error p{margin:0;color:rgba(255,255,255,.65);font-size:12px}.profile-chemistry-detail-error button{min-height:38px;padding:0 16px;border:1px solid rgba(156,236,255,.3);border-radius:999px;color:var(--cyan);background:rgba(156,236,255,.06);font:700 10px "Exo 2",sans-serif;letter-spacing:.10em}.profile-chemistry-empty{min-height:80px;display:grid;place-items:center;color:rgba(238,248,252,.38);font:700 12px "Exo 2",sans-serif;letter-spacing:.13em}.profile-chemistry-loading{min-height:240px;display:flex;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.60);font:600 12px "Exo 2",sans-serif;letter-spacing:.12em}

  @media(min-width:720px){.profile-chemistry-member-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.profile-chemistry-slots{max-width:620px}.profile-chemistry-result{grid-template-columns:112px minmax(0,1fr);padding:28px}.profile-chemistry-score{width:112px;height:112px}.profile-chemistry-compare-head,.profile-chemistry-compare-row{grid-template-columns:minmax(120px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:18px}.profile-chemistry-compare-row dt{font-size:12px}.profile-chemistry-compare-row dd{font-size:14px}}

  .profile-chemistry-back{margin-top:14px;padding:0;border:0;color:rgba(156,236,255,.76);background:transparent;font:700 11px "Exo 2",sans-serif;letter-spacing:.14em;cursor:pointer}

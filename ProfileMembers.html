<script>
  let profileMembersState = {
    status: 'idle',
    groups: [],
    members: [],
    error: ''
  };

  function loadProfileMembers(forceReload = false) {
    if (!forceReload && (profileMembersState.status === 'loading' || profileMembersState.status === 'ready')) {
      renderProfileMembersPanel();
      return;
    }

    profileMembersState.status = 'loading';
    profileMembersState.error = '';
    renderProfileMembersPanel();

    google.script.run
      .withSuccessHandler(handleProfileMembersSuccess)
      .withFailureHandler(handleProfileMembersFailure)
      .getProfileMembers();
  }

  function handleProfileMembersSuccess(response) {
    if (!response || !response.ok || !response.data) {
      handleProfileMembersFailure(
        response && response.error ? response.error.message : 'プロフィールの読み込みに失敗しました。'
      );
      return;
    }

    profileMembersState = {
      status: 'ready',
      groups: Array.isArray(response.data.groups) ? response.data.groups : [],
      members: Array.isArray(response.data.members) ? response.data.members : [],
      error: ''
    };
    renderProfileMembersPanel();
  }

  function handleProfileMembersFailure(error) {
    profileMembersState.status = 'error';
    profileMembersState.error = error && error.message
      ? error.message
      : String(error || 'プロフィールの読み込みに失敗しました。');
    renderProfileMembersPanel();
  }

  function getVisibleProfileMembers() {
    const members = profileMembersState.members.slice();

    if (profileCurrentGroup === 'all') {
      return members.sort((a, b) => a.displayOrder - b.displayOrder);
    }

    const selectedGroup = profileMembersState.groups.find(group => group.key === profileCurrentGroup);
    if (!selectedGroup) return [];

    return members.filter(member => member.groupIds.includes(selectedGroup.groupId)).sort((a, b) => {
      const orderA = Number(memberGroupOrder(a, selectedGroup.groupId));
      const orderB = Number(memberGroupOrder(b, selectedGroup.groupId));
      return orderA - orderB || a.displayOrder - b.displayOrder;
    });
  }

  function memberGroupOrder(member, groupId) {
    if (!member || !member.groupOrders) return 9999;
    const value = member.groupOrders[groupId];
    return Number.isFinite(Number(value)) ? Number(value) : 9999;
  }

  function renderProfileMembersPanel() {
    const panel = document.getElementById('profilePanel');
    if (!panel || profileCurrentView !== 'home') return;

    if (profileMembersState.status === 'loading' || profileMembersState.status === 'idle') {
      panel.innerHTML = renderProfileMemberSkeletons();
      return;
    }

    if (profileMembersState.status === 'error') {
      panel.innerHTML = `
        <article class="profile-members-state">
          <p class="profile-panel-eyebrow">CONNECTION ERROR</p>
          <h2 class="profile-members-state-title">ERROR</h2>
          <p class="profile-panel-copy">${escapeHtml(profileMembersState.error)}</p>
          <button class="profile-retry-button" type="button" onclick="loadProfileMembers(true)">RETRY</button>
        </article>
      `;
      return;
    }

    const members = getVisibleProfileMembers();
    if (!members.length) {
      panel.innerHTML = `
        <article class="profile-members-state">
          <p class="profile-panel-eyebrow">PROFILE HOME</p>
          <h2 class="profile-members-state-title">NO DATA</h2>
          <p class="profile-panel-copy">表示できるメンバーがいません。</p>
        </article>
      `;
      return;
    }

    panel.innerHTML = `
      <div class="profile-members-head">
        <div>
          <p class="profile-panel-eyebrow">PROFILE HOME</p>
          <h2 class="profile-members-title">MEMBERS</h2>
        </div>
        <span class="profile-members-count">${members.length}</span>
      </div>
      <div class="profile-member-grid">
        ${members.map(renderProfileMemberCard).join('')}
      </div>
    `;
  }

  function renderProfileMemberCard(member) {
    const initial = String(member.displayName || '?').slice(0, 1).toUpperCase();
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '')
      ? member.colorHex
      : '#9cecff';
    const image = member.imageUrl
      ? `<img
          src="${escapeHtml(member.imageUrl)}"
          data-fallback-src="${escapeHtml(member.imageFallbackUrl || '')}"
          alt=""
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
          onerror="handleProfileImageError(this)"
        >`
      : '';

    return `
      <article
        class="profile-member-card"
        style="--member-accent:${escapeHtml(accent)}"
        role="button"
        tabindex="0"
        data-member-id="${escapeHtml(member.memberId)}"
        aria-label="${escapeHtml(member.displayName)}のプロフィールを開く"
        onclick="openProfileMemberDetail(this.dataset.memberId)"
        onkeydown="handleProfileMemberCardKey(event, this.dataset.memberId)"
      >
        <div class="profile-member-visual">
          <span class="profile-member-fallback" aria-hidden="true">${escapeHtml(initial)}</span>
          ${image}
          <span class="profile-member-accent" aria-hidden="true"></span>
        </div>
        <div class="profile-member-body">
          <p class="profile-member-group">${escapeHtml(member.primaryGroupName || 'SOLO')}</p>
          <h3 class="profile-member-name">${escapeHtml(member.displayName)}</h3>
        </div>
      </article>
    `;
  }

  function handleProfileMemberCardKey(event, memberId) {
    if (!event || (event.key !== 'Enter' && event.key !== ' ')) return;
    event.preventDefault();
    openProfileMemberDetail(memberId);
  }

  function openProfileMemberDetail(memberId) {
    const member = profileMembersState.members.find(item => item.memberId === memberId);
    if (!member) return;

    profileSelectedMemberId = memberId;
    setProfileDetailMode(true);
    renderProfileMemberDetail();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeProfileMemberDetail() {
    profileSelectedMemberId = '';
    setProfileDetailMode(false);
    renderProfileMembersPanel();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderProfileMemberDetail() {
    const panel = document.getElementById('profilePanel');
    if (!panel) return;

    const member = profileMembersState.members.find(item => item.memberId === profileSelectedMemberId);
    if (!member) {
      closeProfileMemberDetail();
      return;
    }

    const initial = String(member.displayName || '?').slice(0, 1).toUpperCase();
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '')
      ? member.colorHex
      : '#9cecff';
    const image = member.imageUrl
      ? `<img
          src="${escapeHtml(member.imageUrl)}"
          data-fallback-src="${escapeHtml(member.imageFallbackUrl || '')}"
          alt="${escapeHtml(member.displayName)}"
          decoding="async"
          referrerpolicy="no-referrer"
          onerror="handleProfileImageError(this)"
        >`
      : '';

    panel.innerHTML = `
      <article class="profile-member-detail" style="--member-accent:${escapeHtml(accent)}">
        <button class="profile-detail-back" type="button" onclick="closeProfileMemberDetail()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.5 5.5L8 12l6.5 6.5"></path>
          </svg>
          <span>MEMBERS</span>
        </button>

        <div class="profile-detail-hero">
          <div class="profile-detail-visual">
            <span class="profile-member-fallback" aria-hidden="true">${escapeHtml(initial)}</span>
            ${image}
            <span class="profile-detail-line" aria-hidden="true"></span>
          </div>

          <div class="profile-detail-identity">
            <p class="profile-detail-group">${escapeHtml(member.primaryGroupName || 'SOLO')}</p>
            <h2 class="profile-detail-name">${escapeHtml(member.displayName)}</h2>
          </div>
        </div>
      </article>
    `;
  }

  function handleProfileImageError(image) {
    if (!image) return;

    const fallback = image.dataset.fallbackSrc || '';
    const fallbackTried = image.dataset.fallbackTried === 'true';

    if (fallback && !fallbackTried) {
      image.dataset.fallbackTried = 'true';
      image.src = fallback;
      return;
    }

    image.style.display = 'none';
  }

  function renderProfileMemberSkeletons() {
    return `
      <div class="profile-members-head profile-members-head-loading">
        <div>
          <span class="profile-member-skeleton profile-member-skeleton-label"></span>
          <span class="profile-member-skeleton profile-member-skeleton-heading"></span>
        </div>
      </div>
      <div class="profile-member-grid">
        ${Array.from({ length: 6 }, () => `
          <div class="profile-member-card profile-member-card-loading">
            <div class="profile-member-skeleton profile-member-skeleton-image"></div>
            <div class="profile-member-body">
              <span class="profile-member-skeleton profile-member-skeleton-copy"></span>
              <span class="profile-member-skeleton profile-member-skeleton-name"></span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
</script>

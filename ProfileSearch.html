<script>
  const profileSearchState = { status: 'idle', fields: [], members: [], selected: [], query: '', expandedFieldId: '', composing: false, error: '' };

  function loadProfileSearch(forceReload = false) {
    if (profileCurrentView !== 'search') return;
    if (!forceReload && profileSearchState.status === 'ready') return renderProfileSearch();
    if (!forceReload && profileSearchState.status === 'loading') return renderProfileSearchLoading();
    profileSearchState.status = 'loading';
    profileSearchState.error = '';
    renderProfileSearchLoading();
    google.script.run.withSuccessHandler(handleProfileSearchSuccess)
      .withFailureHandler(handleProfileSearchFailure).getProfileSearchData();
  }

  function handleProfileSearchSuccess(response) {
    if (!response || !response.ok || !response.data) {
      return handleProfileSearchFailure(response && response.error ? response.error.message : '検索データの読み込みに失敗しました。');
    }
    profileSearchState.status = 'ready';
    profileSearchState.fields = Array.isArray(response.data.fields) ? response.data.fields : [];
    profileSearchState.members = Array.isArray(response.data.members) ? response.data.members : [];
    profileSearchState.error = '';
    if (profileCurrentView === 'search') renderProfileSearch();
  }

  function handleProfileSearchFailure(error) {
    profileSearchState.status = 'error';
    profileSearchState.error = error && error.message ? error.message : String(error || '検索データの読み込みに失敗しました。');
    if (profileCurrentView === 'search') renderProfileSearch();
  }

  function renderProfileSearchLoading() {
    const panel = document.getElementById('profilePanel');
    if (!panel || profileCurrentView !== 'search') return;
    panel.innerHTML = `<div class="profile-search-head"><div><p class="profile-panel-eyebrow">TAG SEARCH</p><h2 class="profile-search-title">SEARCH</h2></div></div><div class="profile-search-loading" aria-live="polite"><span class="profile-detail-spinner"></span><span>LOADING SEARCH...</span></div>`;
  }

  function normalizeProfileSearchText(value) {
    return String(value || '').trim().toLocaleLowerCase('ja');
  }

  function handleProfileSearchInput(input) {
    if (profileSearchState.composing) return;
    profileSearchState.query = String(input && input.value || '');
    updateProfileSearchDynamic();
  }

  function handleProfileSearchCompositionStart() {
    profileSearchState.composing = true;
  }

  function handleProfileSearchCompositionEnd(input) {
    profileSearchState.composing = false;
    profileSearchState.query = String(input && input.value || '');
    updateProfileSearchDynamic();
  }

  function toggleProfileSearchTag(button) {
    const profileId = button && button.dataset ? button.dataset.profileId : '';
    const value = button && button.dataset ? button.dataset.value : '';
    if (!profileId || !value) return;
    const index = profileSearchState.selected.findIndex(item => item.profileId === profileId && item.value === value);
    if (index >= 0) profileSearchState.selected.splice(index, 1);
    else profileSearchState.selected.push({ profileId, value });
    updateProfileSearchDynamic();
  }

  function clearProfileSearchTags() {
    profileSearchState.selected = [];
    updateProfileSearchDynamic();
  }

  function toggleProfileSearchField(profileId) {
    profileSearchState.expandedFieldId = profileSearchState.expandedFieldId === profileId ? '' : profileId;
    updateProfileSearchDynamic();
  }

  function getProfileSearchDataView() {
    const visibleMembers = getVisibleProfileMembers();
    const visibleIds = new Set(visibleMembers.map(member => member.memberId));
    const valuesByMemberId = new Map(profileSearchState.members.map(member => [member.memberId, member.values || {}]));
    const query = normalizeProfileSearchText(profileSearchState.query);
    const results = visibleMembers.filter(member => {
      const values = valuesByMemberId.get(member.memberId) || {};
      if (!profileSearchState.selected.every(tag => Array.isArray(values[tag.profileId]) && values[tag.profileId].includes(tag.value))) return false;
      if (!query || normalizeProfileSearchText(member.displayName).startsWith(query)) return true;
      return Object.values(values).flat().some(value => normalizeProfileSearchText(value).startsWith(query));
    });
    return { visibleIds, results, query };
  }

  function getProfileSearchOptions(field, visibleIds) {
    const values = [];
    profileSearchState.members.forEach(member => {
      if (!visibleIds.has(member.memberId)) return;
      const list = member.values && Array.isArray(member.values[field.profileId]) ? member.values[field.profileId] : [];
      list.forEach(value => { if (value && !values.includes(value)) values.push(value); });
    });
    return values.sort((a, b) => String(a).localeCompare(String(b), 'ja', { numeric: true }));
  }

  function isProfileSearchTagSelected(profileId, value) {
    return profileSearchState.selected.some(item => item.profileId === profileId && item.value === value);
  }

  function renderProfileSearch() {
    const panel = document.getElementById('profilePanel');
    if (!panel || profileCurrentView !== 'search') return;
    if (profileSearchState.status === 'loading' || profileSearchState.status === 'idle') return renderProfileSearchLoading();
    if (profileSearchState.status === 'error') {
      panel.innerHTML = `<article class="profile-members-state"><p class="profile-panel-eyebrow">CONNECTION ERROR</p><h2 class="profile-members-state-title">ERROR</h2><p class="profile-panel-copy">${escapeHtml(profileSearchState.error)}</p><button class="profile-retry-button" type="button" onclick="loadProfileSearch(true)">RETRY</button></article>`;
      return;
    }

    panel.innerHTML = `<div class="profile-search-head"><div><p class="profile-panel-eyebrow">TAG SEARCH</p><h2 class="profile-search-title">SEARCH</h2></div><span id="profileSearchResultCount" class="profile-search-result-count">0</span></div>
      <label class="profile-search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"></circle><path d="M15.4 15.4L20 20"></path></svg><input id="profileSearchInput" type="search" value="${escapeHtml(profileSearchState.query)}" placeholder="SEARCH TAGS / MEMBERS" autocomplete="off" autocapitalize="none" spellcheck="false" oncompositionstart="handleProfileSearchCompositionStart()" oncompositionend="handleProfileSearchCompositionEnd(this)" oninput="handleProfileSearchInput(this)"></label>
      <div id="profileSearchSelectedHost"></div>
      <div id="profileSearchFieldsHost" class="profile-search-fields"></div>
      <section class="profile-search-results"><div class="profile-search-results-head"><h3>RESULTS</h3><span id="profileSearchResultsCount">0</span></div><div id="profileSearchResultsHost" class="profile-search-result-list"></div></section>`;
    updateProfileSearchDynamic();
  }

  function updateProfileSearchDynamic() {
    if (profileSearchState.status !== 'ready' || profileCurrentView !== 'search') return;
    const data = getProfileSearchDataView();
    const fieldsHost = document.getElementById('profileSearchFieldsHost');
    const selectedHost = document.getElementById('profileSearchSelectedHost');
    const resultsHost = document.getElementById('profileSearchResultsHost');
    const topCount = document.getElementById('profileSearchResultCount');
    const resultsCount = document.getElementById('profileSearchResultsCount');
    if (!fieldsHost || !selectedHost || !resultsHost) return;

    const fields = profileSearchState.fields.map(field => {
      const options = getProfileSearchOptions(field, data.visibleIds).filter(value =>
        !data.query || normalizeProfileSearchText(value).startsWith(data.query) || isProfileSearchTagSelected(field.profileId, value)
      );
      if (!options.length) return '';
      const isOpen = profileSearchState.expandedFieldId === field.profileId;
      const selectedCount = profileSearchState.selected.filter(item => item.profileId === field.profileId).length;
      return `<section class="profile-search-field${isOpen ? ' open' : ''}"><button class="profile-search-field-toggle" type="button" data-profile-id="${escapeHtml(field.profileId)}" aria-expanded="${isOpen}" onclick="toggleProfileSearchField(this.dataset.profileId)"><span>${escapeHtml(field.label || field.profileId)}</span><span class="profile-search-field-meta">${selectedCount ? `<b>${selectedCount}</b>` : ''}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9l5.5 5.5L17.5 9"></path></svg></span></button><div class="profile-search-field-options" ${isOpen ? '' : 'hidden'}><div class="profile-search-tags">${options.map(value => `<button class="profile-search-tag${isProfileSearchTagSelected(field.profileId, value) ? ' active' : ''}" type="button" data-profile-id="${escapeHtml(field.profileId)}" data-value="${escapeHtml(value)}" aria-pressed="${isProfileSearchTagSelected(field.profileId, value)}" onclick="toggleProfileSearchTag(this)">${escapeHtml(value)}</button>`).join('')}</div></div></section>`;
    }).join('');

    const selected = profileSearchState.selected;
    selectedHost.innerHTML = selected.length ? `<div class="profile-search-selected"><div class="profile-search-selected-head"><span>SELECTED</span><button type="button" onclick="clearProfileSearchTags()">CLEAR</button></div><div class="profile-search-tags">${selected.map(tag => `<button class="profile-search-tag active" type="button" data-profile-id="${escapeHtml(tag.profileId)}" data-value="${escapeHtml(tag.value)}" onclick="toggleProfileSearchTag(this)">${escapeHtml(tag.value)}<span aria-hidden="true">×</span></button>`).join('')}</div></div>` : '';
    fieldsHost.innerHTML = fields || '<div class="profile-search-empty">NO TAGS</div>';
    resultsHost.innerHTML = data.results.map(renderProfileSearchMember).join('') || '<div class="profile-search-empty">NO RESULTS</div>';
    if (topCount) topCount.textContent = String(data.results.length);
    if (resultsCount) resultsCount.textContent = String(data.results.length);
  }

  function renderProfileSearchMember(member) {
    const accent = /^#[0-9a-f]{6}$/i.test(member.colorHex || '') ? member.colorHex : '#9cecff';
    const initial = String(member.displayName || '?').slice(0, 1).toUpperCase();
    const image = member.imageUrl ? `<img src="${escapeHtml(member.imageUrl)}" data-fallback-src="${escapeHtml(member.imageFallbackUrl || '')}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="handleProfileImageError(this)">` : escapeHtml(initial);
    return `<button class="profile-search-member" style="--member-accent:${escapeHtml(accent)}" type="button" onclick="openProfileMemberDetail('${escapeHtml(member.memberId)}')"><span class="profile-search-avatar">${image}</span><span class="profile-search-member-copy"><b>${escapeHtml(member.displayName)}</b><small>${escapeHtml(member.primaryGroupName || 'SOLO')}</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>`;
  }
</script>

<style>
  .profile-search-head{margin-bottom:22px;display:flex;align-items:end;justify-content:space-between;gap:18px}.profile-search-title{margin:7px 0 0;color:var(--white);font-family:Orbitron,"Exo 2",sans-serif;font-size:clamp(30px,8vw,44px);font-weight:600;line-height:1}.profile-search-result-count{color:var(--cyan);font:700 14px "Exo 2",sans-serif;letter-spacing:.12em}.profile-search-box{min-height:56px;padding:0 17px;border:1px solid rgba(156,236,255,.22);border-radius:17px;display:flex;align-items:center;gap:12px;background:#09111a}.profile-search-box svg{width:23px;height:23px;flex:0 0 auto;fill:none;stroke:rgba(156,236,255,.72);stroke-width:1.8;stroke-linecap:round}.profile-search-box input{width:100%;min-width:0;border:0;outline:0;color:#f5fbfd;background:transparent;font:600 16px "Exo 2","Zen Kaku Gothic New",sans-serif;letter-spacing:.035em}.profile-search-box input::placeholder{color:rgba(232,242,247,.38)}.profile-search-selected{margin-top:18px;padding:17px;border:1px solid rgba(156,236,255,.20);border-radius:18px;background:rgba(91,193,217,.06)}.profile-search-selected-head,.profile-search-results-head{margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:rgba(232,242,247,.58);font:700 12px "Exo 2",sans-serif;letter-spacing:.13em}.profile-search-selected-head button{min-height:44px;padding:0 12px;border:0;color:var(--cyan);background:transparent;font:700 12px "Exo 2",sans-serif;letter-spacing:.10em}.profile-search-fields{margin-top:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profile-search-field{min-width:0;padding:0;border:1px solid rgba(194,232,244,.12);border-radius:18px;background:rgba(255,255,255,.022)}.profile-search-field.open{grid-column:1/-1}.profile-search-field-toggle{width:100%;min-height:56px;padding:0 16px;border:0;display:flex;align-items:center;justify-content:space-between;gap:10px;color:rgba(247,251,255,.88);background:transparent;font:600 16px "Zen Kaku Gothic New",sans-serif;text-align:left;cursor:pointer}.profile-search-field-meta{display:flex;align-items:center;gap:8px}.profile-search-field-meta b{min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;color:#071018;background:var(--cyan);font:700 12px "Exo 2",sans-serif}.profile-search-field-meta svg{width:20px;height:20px;fill:none;stroke:rgba(156,236,255,.62);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--fast) var(--ease)}.profile-search-field.open .profile-search-field-meta svg{transform:rotate(180deg)}.profile-search-field-options{padding:0 16px 17px}.profile-search-field-options[hidden]{display:none!important}.profile-search-tags{display:flex;flex-wrap:wrap;gap:9px}.profile-search-tag{min-height:46px;padding:0 16px;border:1px solid rgba(194,232,244,.13);border-radius:999px;color:rgba(241,248,251,.76);background:rgba(255,255,255,.035);font:600 14px "Zen Kaku Gothic New","Exo 2",sans-serif;cursor:pointer}.profile-search-tag.active{border-color:rgba(156,236,255,.55);color:#f3fcff;background:rgba(91,193,217,.18)}.profile-search-tag span{margin-left:8px;color:var(--cyan)}.profile-search-results{margin-top:26px;padding-top:22px;border-top:1px solid rgba(194,232,244,.10)}.profile-search-result-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile-search-member{min-width:0;min-height:72px;padding:10px 11px;border:1px solid rgba(194,232,244,.11);border-radius:19px;display:grid;grid-template-columns:50px minmax(0,1fr) 18px;align-items:center;gap:11px;color:#fff;background:rgba(255,255,255,.025);text-align:left;cursor:pointer}.profile-search-avatar{width:50px;height:50px;overflow:hidden;border-radius:50%;display:grid;place-items:center;color:var(--member-accent);background:color-mix(in srgb,var(--member-accent) 12%,#07101a);font:600 15px Orbitron,sans-serif}.profile-search-avatar img{width:50px;height:50px;object-fit:cover;object-position:center top;display:block}.profile-search-member-copy{min-width:0;display:grid;gap:5px}.profile-search-member-copy b{overflow:hidden;color:rgba(247,251,255,.92);font:600 15px "Exo 2","Zen Kaku Gothic New",sans-serif;text-overflow:ellipsis;white-space:nowrap}.profile-search-member-copy small{overflow:hidden;color:rgba(232,242,247,.44);font:700 10px "Exo 2",sans-serif;letter-spacing:.08em;text-overflow:ellipsis;white-space:nowrap}.profile-search-member>svg{width:18px;height:18px;fill:none;stroke:rgba(156,236,255,.52);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.profile-search-empty{min-height:120px;display:grid;place-items:center;color:rgba(232,242,247,.42);font:700 13px "Exo 2",sans-serif;letter-spacing:.12em}.profile-search-loading{min-height:240px;display:flex;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.60);font:600 12px "Exo 2",sans-serif;letter-spacing:.12em}
  @media(max-width:560px){.profile-search-result-list{grid-template-columns:1fr}}
  @media(min-width:720px){.profile-search-result-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

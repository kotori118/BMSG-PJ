<style>
  .quiz-page{padding-top:74px;padding-bottom:12px}
  .quiz-join-panel{display:grid;gap:18px}
  .quiz-join-code{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
  .quiz-recent-rooms{display:grid;gap:10px}
  .quiz-recent-room{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 15px;border:1px solid var(--quiz-line);border-radius:18px;background:rgba(255,255,255,.025)}
  .quiz-recent-room-main{min-width:0;display:grid;gap:5px}
  .quiz-recent-room-id{color:var(--white);font:700 20px/1 "Orbitron",sans-serif;letter-spacing:.12em}
  .quiz-recent-room-meta{color:rgba(247,251,255,.65);font:600 11px/1.5 "Zen Kaku Gothic New",Roboto,sans-serif;overflow-wrap:anywhere}
  .quiz-recent-room-sub{color:rgba(156,236,255,.62);font:600 10px/1.4 "Exo 2",Roboto,sans-serif;letter-spacing:.04em}
  .quiz-recent-room .quiz-action{min-width:96px;margin:0}
  .quiz-actions.is-stack{grid-template-columns:1fr}
  @media(max-width:679px){.quiz-page{padding-top:70px}.quiz-header{margin-bottom:22px}}
  @media(max-width:420px){.quiz-join-code{grid-template-columns:1fr 96px}.quiz-recent-room{grid-template-columns:1fr}.quiz-recent-room .quiz-action{width:100%}}
</style>
<script>
  function renderQuizSetup_(){
    quizState.screen='setup';quizState.completed=false;
    const s=quizState.settings,offlineLyrics=s.mode==='OFFLINE'&&s.genre==='LYRICS';
    const host=quizHost_();if(!host)return;
    const onlineActions=s.mode==='ONLINE'
      ? '<div class="quiz-actions"><button class="quiz-action is-primary" onclick="createQuizFromSetup_()">ROOMを作る</button><button class="quiz-action" onclick="openQuizRoomJoin_()">ルームに参加する</button></div><div class="quiz-actions is-stack"><button class="quiz-action" onclick="navigateTo(\'lab\')">BACK</button></div>'
      : '<div class="quiz-actions"><button class="quiz-action is-primary" onclick="createQuizFromSetup_()">START</button><button class="quiz-action" onclick="navigateTo(\'lab\')">BACK</button></div>';
    host.innerHTML='<section class="quiz-panel"><p class="quiz-kicker">GAME SETUP</p><h2 class="quiz-panel-title">PLAY QUIZ</h2><div class="quiz-settings">'+
      quizSetting_('01 / MODE',[['OFFLINE','OFFLINE'],['ONLINE','ONLINE']],s.mode,'mode')+
      quizSetting_('02 / GENRE',[['LYRICS','歌詞'],['PROFILE','プロフィール']],s.genre,'genre')+
      quizSetting_('03 / COURSE',(quizState.courses.length?quizState.courses:[{value:'BE:FIRST',label:'BE:FIRST'},{value:'MAZZEL',label:'MAZZEL'},{value:'STARGLOW',label:'STARGLOW'},{value:'HANA',label:'HANA'},{value:'UNIT',label:'ユニット'},{value:'ALL',label:'全部'}]).map(function(x){return[x.value,x.label];}),s.course,'course','is-course')+
      quizSetting_('04 / DIFFICULTY',[['NORMAL','普通'],['ADVANCED','上級']],s.difficulty,'difficulty')+
      (offlineLyrics?renderQuizPlayerSelect_():'')+
      '</div>'+onlineActions+'</section>';
  }

  function openQuizRoomJoin_(){
    quizState.screen='join';
    const host=quizHost_();if(!host)return;
    host.innerHTML='<section class="quiz-panel quiz-join-panel"><div><p class="quiz-kicker">ONLINE ROOM</p><h2 class="quiz-panel-title">ROOMに参加</h2></div><div class="quiz-join-code"><input id="quizRoomInput" class="quiz-room-input" inputmode="numeric" maxlength="4" aria-label="4桁のROOM ID" placeholder="0000"><button class="quiz-join-button" onclick="joinQuizFromSetup_()">参加</button></div><section class="quiz-setting"><p class="quiz-setting-title">RECENT ROOMS / 最新5件</p><div id="quizRecentRooms" class="quiz-recent-rooms">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading('','#9cecff'):'LOADING...')+'</div></section><div class="quiz-actions is-stack"><button class="quiz-action" onclick="renderQuizSetup_()">BACK</button></div></section>';
    google.script.run.withSuccessHandler(renderRecentQuizRooms_).withFailureHandler(function(error){const box=document.getElementById('quizRecentRooms');if(box)box.innerHTML='<div class="quiz-empty-score">ROOMを読み込めませんでした。</div>';quizNotify_(String(error&&error.message||error||'ROOMの読み込みに失敗しました。'));}).getRecentQuizRooms(quizState.userId);
  }

  function renderRecentQuizRooms_(rooms){
    const box=document.getElementById('quizRecentRooms');if(!box)return;
    const items=Array.isArray(rooms)?rooms:[];
    if(!items.length){box.innerHTML='<div class="quiz-empty-score">参加できるROOMはありません。</div>';return;}
    box.innerHTML=items.map(function(room){
      const creator=quizUserName_(room.creatorUserId)||room.creatorUserId||'';
      const meta=quizGenreLabel_(room.genre)+' / '+quizCourseLabelV2_(room.course)+' / '+quizDifficultyLabel_(room.difficulty);
      const sub=(creator?'作成 '+creator+' ・ ':'')+'回答 '+Number(room.participantCount||0)+'人';
      return '<div class="quiz-recent-room"><div class="quiz-recent-room-main"><strong class="quiz-recent-room-id">'+quizEscape_(room.roomId)+'</strong><span class="quiz-recent-room-meta">'+quizEscape_(meta)+'</span><span class="quiz-recent-room-sub">'+quizEscape_(sub)+'</span></div><button class="quiz-action '+(room.hasAnswered?'':'is-primary')+'" onclick="joinQuizRoomById_(\''+quizArg_(room.roomId)+'\')">'+(room.hasAnswered?'結果を見る':'参加')+'</button></div>';
    }).join('');
  }

  function quizCourseLabelV2_(value){return value==='UNIT'?'ユニット':value==='ALL'?'全部':String(value||'');}
  function joinQuizRoomById_(encoded){
    const id=decodeURIComponent(encoded);
    if(quizState.busy)return;
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){quizState.busy=false;setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);}).withFailureHandler(quizFailure_).joinQuizRoom(quizState.userId,id);
  }

  function renderQuizQuestion_(){
    const game=quizState.game,question=game&&game.questions&&game.questions[quizState.index];if(!question)return finishQuiz_();
    const host=quizHost_();if(!host)return;
    const progress=Math.round((quizState.index/game.questions.length)*100);
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<div class="quiz-progress" aria-label="進行度"><span style="width:'+progress+'%"></span></div><section class="quiz-panel"><div class="quiz-question-head"><p class="quiz-step-label">'+quizEscape_(quizGenreLabel_(game.genre))+' / '+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</p><span class="quiz-question-count">'+String(quizState.index+1).padStart(2,'0')+' / 10</span></div><div id="quizQuestionBody">'+renderQuizQuestionBody_(question)+'</div><div class="quiz-actions"><button id="quizNextButton" class="quiz-action is-primary" onclick="advanceQuiz_()" disabled>次へ</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">諦める</button></div></section>';
  }

  function renderQuizResult_(scoreboard){
    const game=quizState.game,host=quizHost_();if(!host)return;const max=game.genre==='LYRICS'?20:10;
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><p class="quiz-kicker">RESULT</p><h2 class="quiz-panel-title">SCORE</h2><div class="quiz-score-list">'+(scoreboard.length?scoreboard.map(function(row){return '<div class="quiz-score-row"><span class="quiz-score-rank">#'+row.rank+'</span><strong class="quiz-score-name">'+quizEscape_(row.displayName)+'</strong><span class="quiz-score-points">'+row.score+'<small> / '+max+'</small></span></div>';}).join(''):'<div class="quiz-empty-score">まだ回答者がいません。</div>')+'</div><div class="quiz-actions '+(game.roomId?'':'is-stack')+'">'+(game.roomId?'<button class="quiz-action" onclick="refreshQuizResult_()">ランキングを更新</button>':'')+'<button class="quiz-action is-primary" onclick="returnQuizTop_()">QUIZ TOP</button></div></section>';
  }
</script>

<style>
  .quiz-page{padding-top:78px}
  .quiz-v3-ready{text-align:center;padding:20px 0 8px}
  .quiz-v3-ready .quiz-panel-title{font-size:28px;margin:8px 0 12px}
  .quiz-v3-ready-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 22px}
  .quiz-v3-chip{border:1px solid rgba(156,236,255,.28);border-radius:999px;padding:7px 11px;background:rgba(156,236,255,.07);font-size:12px}
  .quiz-v3-timer{margin:13px 0 18px}
  .quiz-v3-timer-head{display:flex;align-items:center;justify-content:space-between;font-family:'Exo 2',sans-serif;font-size:12px;letter-spacing:.08em}
  .quiz-v3-timer-track{height:5px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:7px}
  .quiz-v3-timer-bar{display:block;height:100%;width:100%;transform-origin:left center;background:#9cecff;transition:width .1s linear}
  .quiz-v3-timer.is-danger .quiz-v3-timer-bar{background:#ff6f7d}
  .quiz-v3-search{position:relative;margin-top:14px}
  .quiz-v3-search-row{display:flex;gap:8px}
  .quiz-v3-search-input,.quiz-v3-singer-select{width:100%;min-height:48px;border:1px solid rgba(156,236,255,.28);border-radius:14px;background:rgba(255,255,255,.07);color:inherit;padding:0 14px;font:inherit;outline:none}
  .quiz-v3-search-input:focus,.quiz-v3-singer-select:focus{border-color:#9cecff;box-shadow:0 0 0 3px rgba(156,236,255,.12)}
  .quiz-v3-search-results{display:grid;gap:7px;margin-top:9px;max-height:245px;overflow:auto}
  .quiz-v3-song-option{width:100%;min-height:46px;text-align:left;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(255,255,255,.045);color:inherit;padding:10px 12px}
  .quiz-v3-song-option small{display:block;opacity:.55;margin-top:2px}
  .quiz-v3-inline-status{min-height:24px;margin:9px 0 0;font-weight:700}
  .quiz-v3-inline-status.is-wrong{color:#ff8b96;animation:quizV3Shake .28s ease}
  .quiz-v3-singer-box{display:grid;gap:10px;margin-top:16px}
  .quiz-v3-feedback{position:relative;overflow:hidden;border-radius:18px;margin-top:16px;padding:24px 18px;text-align:center;border:1px solid rgba(156,236,255,.34);background:linear-gradient(145deg,rgba(156,236,255,.16),rgba(255,255,255,.045));animation:quizV3Pop .32s ease}
  .quiz-v3-feedback.is-wrong,.quiz-v3-feedback.is-timeout{border-color:rgba(255,111,125,.48);background:linear-gradient(145deg,rgba(255,111,125,.16),rgba(255,255,255,.035))}
  .quiz-v3-feedback-mark{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;letter-spacing:.08em;color:#9cecff}
  .quiz-v3-feedback.is-wrong .quiz-v3-feedback-mark,.quiz-v3-feedback.is-timeout .quiz-v3-feedback-mark{color:#ff7f8c}
  .quiz-v3-feedback-answer{margin-top:12px;line-height:1.65}
  .quiz-v3-stage-flash{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(4,10,20,.72);backdrop-filter:blur(3px);animation:quizV3Fade .55s ease forwards}
  .quiz-v3-stage-flash span{font-family:'Orbitron',sans-serif;font-size:clamp(34px,10vw,64px);letter-spacing:.09em;font-weight:700;color:#9cecff;text-shadow:0 0 30px rgba(156,236,255,.55);animation:quizV3Pop .28s ease}
  .quiz-v3-stage-flash.is-wrong span{color:#ff7f8c;text-shadow:0 0 30px rgba(255,111,125,.38)}
  .quiz-v3-room-join{display:grid;gap:16px}
  .quiz-v3-room-input-row{display:grid;grid-template-columns:1fr auto;gap:8px}
  .quiz-v3-recent{display:grid;gap:9px}
  .quiz-v3-room-card{border:1px solid rgba(156,236,255,.18);border-radius:15px;background:rgba(255,255,255,.045);padding:13px;display:grid;gap:9px}
  .quiz-v3-room-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .quiz-v3-room-id{font-family:'Orbitron',sans-serif;font-size:18px;letter-spacing:.12em}
  .quiz-v3-room-meta{font-size:12px;opacity:.68}
  .quiz-v3-score-time{font-size:11px;opacity:.62;margin-left:5px}
  @keyframes quizV3Pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes quizV3Shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
  @keyframes quizV3Fade{0%{opacity:0}20%,72%{opacity:1}100%{opacity:0}}
  @media(max-width:600px){.quiz-page{padding-top:72px}.quiz-v3-search-row{grid-template-columns:1fr}.quiz-v3-search-row .quiz-action{width:100%}}
  @media(prefers-reduced-motion:reduce){.quiz-v3-feedback,.quiz-v3-inline-status.is-wrong,.quiz-v3-stage-flash,.quiz-v3-stage-flash span{animation:none!important}.quiz-v3-timer-bar{transition:none}}
</style>
<script>
(function(){
  const legacyAbandon=typeof abandonQuiz_==='function'?abandonQuiz_:null;
  const legacyReturnTop=typeof returnQuizTop_==='function'?returnQuizTop_:null;

  function clearTimer(){if(quizState.v3Timer){clearInterval(quizState.v3Timer);quizState.v3Timer=0;}}
  function resetRuntime(){clearTimer();quizState.totalAnswerTimeMs=0;quizState.questionStartedAt=0;quizState.timeRecorded=false;quizState.songAttempts=0;quizState.v3Feedback='';}

  initQuizPage=function(params){
    clearTimer();quizResetState_();resetRuntime();
    const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(!uid){renderQuizNeedsUser_();if(typeof openUserChooser==='function')openUserChooser(true);return;}
    quizState.userId=uid;quizState.selectedPlayers=[uid];renderQuizLoading_();
    google.script.run.withSuccessHandler(function(data){
      quizState.ready=true;quizState.users=data.users||[];quizState.courses=data.courses||[];
      if(data.room)startQuizClientGame_(data.room);else renderQuizSetup_();
    }).withFailureHandler(quizFailure_).getQuizBootstrapV2(uid,params&&params.room?params.room:'');
  };

  renderQuizSetup_=function(){
    clearTimer();quizState.screen='setup';quizState.completed=false;
    const s=quizState.settings,offlineLyrics=s.mode==='OFFLINE'&&s.genre==='LYRICS',host=quizHost_();if(!host)return;
    host.innerHTML='<section class="quiz-panel"><p class="quiz-kicker">GAME SETUP</p><h2 class="quiz-panel-title">PLAY QUIZ</h2><div class="quiz-settings">'+
      quizSetting_('01 / MODE',[['OFFLINE','OFFLINE'],['ONLINE','ONLINE']],s.mode,'mode')+
      quizSetting_('02 / GENRE',[['LYRICS','歌詞'],['PROFILE','プロフィール']],s.genre,'genre')+
      quizSetting_('03 / COURSE',(quizState.courses.length?quizState.courses:[{value:'BE:FIRST',label:'BE:FIRST'},{value:'MAZZEL',label:'MAZZEL'},{value:'STARGLOW',label:'STARGLOW'},{value:'HANA',label:'HANA'},{value:'UNIT',label:'ユニット'},{value:'ALL',label:'全部'}]).map(function(x){return[x.value,x.label];}),s.course,'course','is-course')+
      quizSetting_('04 / DIFFICULTY',[['NORMAL','普通'],['ADVANCED','上級']],s.difficulty,'difficulty')+
      (offlineLyrics?renderQuizPlayerSelect_():'')+'</div><div class="quiz-actions">'+
      (s.mode==='ONLINE'?'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">ROOMを作る</button><button class="quiz-action" onclick="openQuizRoomJoinV3_()">ルームに参加する</button>':'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">START</button>')+
      '<button class="quiz-action" onclick="navigateTo(\'lab\')">BACK</button></div></section>';
  };

  createQuizFromSetup_=function(){
    if(quizState.busy)return;const s=quizState.settings;
    if(s.mode==='OFFLINE'&&s.genre==='LYRICS'&&(quizState.selectedPlayers.length<2||quizState.selectedPlayers.length>3)){quizNotify_('2〜3人を選択してください。');return;}
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){quizState.busy=false;if(game.roomId)setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);}).withFailureHandler(quizFailure_).createQuizGameV2({userId:quizState.userId,mode:s.mode,genre:s.genre,course:s.course,difficulty:s.difficulty,playerUserIds:quizState.selectedPlayers});
  };

  window.openQuizRoomJoinV3_=function(){
    clearTimer();quizState.screen='join';const host=quizHost_();if(!host)return;
    host.innerHTML='<section class="quiz-panel quiz-v3-room-join"><p class="quiz-kicker">JOIN ROOM</p><h2 class="quiz-panel-title">ルームに参加する</h2><div class="quiz-v3-room-input-row"><input id="quizRoomInputV3" class="quiz-room-input" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="4桁のROOM ID"><button class="quiz-action is-primary" onclick="joinQuizRoomV3_()">参加</button></div><div><p class="quiz-setting-title">最新のルーム</p><div id="quizRecentRoomsV3" class="quiz-v3-recent">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading(false,'#9cecff'):'LOADING...')+'</div></div><div class="quiz-actions"><button class="quiz-action" onclick="renderQuizSetup_()">BACK</button></div></section>';
    google.script.run.withSuccessHandler(renderQuizRecentRoomsV3_).withFailureHandler(function(){const el=document.getElementById('quizRecentRoomsV3');if(el)el.innerHTML='<p class="quiz-muted">ルームを読み込めませんでした。</p>';}).getRecentQuizRooms(quizState.userId,5);
  };

  window.joinQuizRoomV3_=function(roomId){
    const input=document.getElementById('quizRoomInputV3');const id=String(roomId||input&&input.value||'').replace(/\D/g,'');
    if(!/^\d{4}$/.test(id)){quizNotify_('4桁のROOM IDを入力してください。');return;}if(quizState.busy)return;
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){quizState.busy=false;setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);}).withFailureHandler(quizFailure_).joinQuizRoomV2(quizState.userId,id);
  };

  window.renderQuizRecentRoomsV3_=function(rooms){
    const host=document.getElementById('quizRecentRoomsV3');if(!host)return;rooms=Array.isArray(rooms)?rooms:[];
    if(!rooms.length){host.innerHTML='<p class="quiz-muted">参加できるルームはまだありません。</p>';return;}
    host.innerHTML=rooms.map(function(room){return '<article class="quiz-v3-room-card"><div class="quiz-v3-room-card-head"><div><div class="quiz-v3-room-id">'+quizEscape_(room.roomId)+'</div><div class="quiz-v3-room-meta">'+quizEscape_(quizGenreLabel_(room.genre))+' / '+quizEscape_(room.course)+' / '+quizEscape_(quizDifficultyLabel_(room.difficulty))+'</div></div><button class="quiz-action is-primary" onclick="joinQuizRoomV3_(\''+quizArg_(room.roomId)+'\')">参加</button></div>'+(room.answeredCount?'<div class="quiz-v3-room-meta">回答済み '+room.answeredCount+'人</div>':'')+'</article>';}).join('');
  };

  startQuizClientGame_=function(game){
    clearTimer();quizState.game=game;quizState.index=0;quizState.stage='ready';quizState.answers=[];quizState.awards=[];quizState.selected=null;quizState.completed=!!game.hasAnswered;resetRuntime();
    if(game.hasAnswered){quizState.screen='result';renderQuizResult_(game.scoreboard||[]);return;}
    quizState.screen='ready';renderQuizReadyV3_();
  };

  window.renderQuizReadyV3_=function(){
    const game=quizState.game,host=quizHost_();if(!host||!game)return;
    const limit=game.genre==='LYRICS'?'曲名 30秒':'1問 20秒';
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel quiz-v3-ready"><p class="quiz-kicker">READY</p><h2 class="quiz-panel-title">問題の準備ができました</h2><p class="quiz-muted">STARTを押した瞬間からクイズ開始。問題生成や読み込み時間は回答時間に入りません。</p><div class="quiz-v3-ready-meta"><span class="quiz-v3-chip">'+quizEscape_(quizGenreLabel_(game.genre))+'</span><span class="quiz-v3-chip">'+quizEscape_(game.course)+'</span><span class="quiz-v3-chip">'+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</span><span class="quiz-v3-chip">'+limit+'</span></div><div class="quiz-actions"><button class="quiz-action is-primary" onclick="beginQuizV3_()">START</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">諦める</button></div></section>';
  };

  window.beginQuizV3_=function(){quizState.screen='game';quizState.index=0;quizState.stage='question';quizState.totalAnswerTimeMs=0;renderQuizQuestion_();};

  renderQuizQuestion_=function(){
    clearTimer();const game=quizState.game,question=game&&game.questions&&game.questions[quizState.index];if(!question)return finishQuiz_();
    quizState.timeRecorded=false;quizState.songAttempts=0;quizState.v3Feedback='';quizState.questionStartedAt=Date.now();
    const host=quizHost_();if(!host)return;const progress=Math.round((quizState.index/game.questions.length)*100);
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<div class="quiz-progress" aria-label="進行度"><span style="width:'+progress+'%"></span></div><section class="quiz-panel"><div class="quiz-question-head"><p class="quiz-step-label">'+quizEscape_(quizGenreLabel_(game.genre))+' / '+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</p><span class="quiz-question-count">'+String(quizState.index+1).padStart(2,'0')+' / 10</span></div><div id="quizTimerV3"></div><div id="quizQuestionBody">'+renderQuizQuestionBodyV3_(question)+'</div><div class="quiz-actions"><button id="quizNextButton" class="quiz-action is-primary" onclick="advanceQuiz_()" disabled>次へ</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">諦める</button></div></section>';
    if(game.genre==='PROFILE')startTimerV3_(20000,'profile');else if(game.genre==='LYRICS')startTimerV3_(30000,game.mode==='OFFLINE'?'offlineSong':'onlineSong');
  };

  function renderQuizQuestionBodyV3_(question){
    const game=quizState.game;
    if(game.genre==='PROFILE')return renderProfileBodyV3_(question);
    if(game.mode==='OFFLINE')return renderOfflineLyricsBodyV3_(question);
    return renderOnlineLyricsBodyV3_(question);
  }

  function renderProfileBodyV3_(question){
    if(quizState.stage==='answered')return renderFinalFeedbackV3_(question,quizState.answers[quizState.index]);
    return '<p class="quiz-question-text">'+quizEscape_(question.text)+'</p><div class="quiz-answer-list">'+(question.choices||[]).map(function(choice){return '<button class="quiz-answer" onclick="answerProfileV3_(\''+quizArg_(choice.value)+'\')">'+quizEscape_(choice.label)+'</button>';}).join('')+'</div>';
  }

  window.answerProfileV3_=function(encoded){
    if(quizState.stage==='answered')return;const value=decodeURIComponent(encoded),q=quizState.game.questions[quizState.index];
    const elapsed=recordQuestionTimeV3_(20000);const correct=String(value)===String(q.correct.value);
    quizState.answers[quizState.index]={value:value,timedOut:false,answerTimeMs:elapsed,correct:correct};quizState.stage='answered';clearTimer();flashV3_(correct?'CORRECT':'MISS',!correct);replaceBodyV3_();enableQuizNext_();
  };

  function renderOnlineLyricsBodyV3_(question){
    if(quizState.stage==='question'||quizState.stage==='song'){
      quizState.stage='song';return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><p class="quiz-setting-title">曲名を検索</p><div class="quiz-v3-search"><div class="quiz-v3-search-row"><input id="quizSongSearchV3" class="quiz-v3-search-input" autocomplete="off" placeholder="曲名の頭文字から検索" oninput="filterQuizSongsV3_()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitQuizSongSearchV3_();}"><button class="quiz-action" onclick="submitQuizSongSearchV3_()">回答</button></div><div id="quizSongStatusV3" class="quiz-v3-inline-status"></div><div id="quizSongResultsV3" class="quiz-v3-search-results"></div></div>';
    }
    if(quizState.stage==='singer'){
      const options=(quizState.game.memberCatalog||[]).map(function(x){return '<option value="'+quizEscape_(x.value)+'">'+quizEscape_(x.label)+'</option>';}).join('');
      return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">SONG CORRECT</div><div class="quiz-v3-feedback-answer">'+quizEscape_(question.source.title)+'</div></div><div class="quiz-v3-singer-box"><label class="quiz-setting-title" for="quizSingerV3">歌唱Member</label><select id="quizSingerV3" class="quiz-v3-singer-select"><option value="">選択してください</option>'+options+'</select><button class="quiz-action is-primary" onclick="answerSingerV3_()">決定</button></div>';
    }
    return renderFinalFeedbackV3_(question,quizState.answers[quizState.index])+renderQuizLyricsLink_(question);
  }

  window.filterQuizSongsV3_=function(){
    const input=document.getElementById('quizSongSearchV3'),host=document.getElementById('quizSongResultsV3');if(!input||!host)return;
    const q=normalizeSearchV3_(input.value);if(!q){host.innerHTML='';return;}
    const hits=(quizState.game.songCatalog||[]).filter(function(song){return normalizeSearchV3_(song.label).indexOf(q)===0;}).slice(0,8);
    host.innerHTML=hits.length?hits.map(function(song){return '<button class="quiz-v3-song-option" onclick="answerSongV3_(\''+quizArg_(song.value)+'\')"><strong>'+quizEscape_(song.label)+'</strong>'+(song.artist?'<small>'+quizEscape_(song.artist)+'</small>':'')+'</button>';}).join(''):'<p class="quiz-muted">候補なし</p>';
  };

  window.submitQuizSongSearchV3_=function(){
    const input=document.getElementById('quizSongSearchV3');if(!input)return;const q=normalizeSearchV3_(input.value);if(!q)return;
    const exact=(quizState.game.songCatalog||[]).filter(function(song){return normalizeSearchV3_(song.label)===q;});
    if(exact.length===1)answerSongV3_(exact[0].value);else filterQuizSongsV3_();
  };

  window.answerSongV3_=function(encoded){
    if(quizState.stage!=='song')return;const value=decodeURIComponent(encoded),q=quizState.game.questions[quizState.index];
    if(String(value)!==String(q.correct.songId)){
      quizState.songAttempts+=1;const status=document.getElementById('quizSongStatusV3');if(status){status.className='quiz-v3-inline-status is-wrong';status.textContent='MISS — まだ回答できます';setTimeout(function(){if(status)status.className='quiz-v3-inline-status';},350);}return;
    }
    const elapsed=recordQuestionTimeV3_(30000);quizState.answers[quizState.index]={songId:value,singerId:'',songCorrect:true,timedOut:false,answerTimeMs:elapsed};clearTimer();quizState.stage='singer';flashV3_('CORRECT',false);setTimeout(replaceBodyV3_,220);
  };

  window.answerSingerV3_=function(){
    if(quizState.stage!=='singer')return;const select=document.getElementById('quizSingerV3'),id=String(select&&select.value||'');if(!id){quizNotify_('歌唱Memberを選択してください。');return;}
    const q=quizState.game.questions[quizState.index],answer=quizState.answers[quizState.index]||{};const correct=(q.source.singerIds||[]).map(String).indexOf(id)>=0;
    answer.singerId=id;answer.singerCorrect=correct;quizState.answers[quizState.index]=answer;quizState.stage='answered';flashV3_(correct?'CORRECT':'MISS',!correct);replaceBodyV3_();enableQuizNext_();
  };

  function renderOfflineLyricsBodyV3_(question){
    if(quizState.stage==='question')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><button class="quiz-action is-primary" style="width:100%" onclick="revealOfflineLyricsV3_()">答えを見る</button>';
    if(quizState.stage==='songAward')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">ANSWER</div><div class="quiz-v3-feedback-answer">'+quizEscape_(question.source.title)+'</div></div><div class="quiz-award-step"><p class="quiz-setting-title">曲名の正解者</p>'+renderQuizAwardButtons_('song')+'</div>';
    if(quizState.stage==='singerAward')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">SINGER</div><div class="quiz-v3-feedback-answer">'+quizEscape_((question.source.singerNames||[]).join(' / '))+'</div></div><div class="quiz-award-step"><p class="quiz-setting-title">歌唱Memberの正解者</p>'+renderQuizAwardButtons_('singer')+'</div>';
    const award=quizState.awards[quizState.index]||{};return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">RESULT</div><div class="quiz-v3-feedback-answer">曲名：'+quizEscape_(question.source.title)+'<br>歌唱：'+quizEscape_((question.source.singerNames||[]).join(' / '))+'<br><small>'+quizEscape_(quizUserName_(award.songWinner)||'正解者なし')+' / '+quizEscape_(quizUserName_(award.singerWinner)||'正解者なし')+'</small></div></div>'+renderQuizLyricsLink_(question);
  }

  window.revealOfflineLyricsV3_=function(){if(quizState.stage!=='question')return;clearTimer();quizState.stage='songAward';replaceBodyV3_();};
  revealOfflineLyrics_=window.revealOfflineLyricsV3_;

  const legacyAward=awardOfflineLyrics_;
  awardOfflineLyrics_=function(kind,encoded){legacyAward(kind,encoded);};

  function startTimerV3_(limit,kind){
    clearTimer();const host=document.getElementById('quizTimerV3');if(!host)return;
    host.innerHTML='<div class="quiz-v3-timer"><div class="quiz-v3-timer-head"><span>TIME</span><strong id="quizTimerTextV3">'+Math.ceil(limit/1000)+'</strong></div><div class="quiz-v3-timer-track"><span id="quizTimerBarV3" class="quiz-v3-timer-bar"></span></div></div>';
    const started=quizState.questionStartedAt;
    quizState.v3Timer=setInterval(function(){
      const elapsed=Date.now()-started,remain=Math.max(0,limit-elapsed),ratio=remain/limit;const text=document.getElementById('quizTimerTextV3'),bar=document.getElementById('quizTimerBarV3'),box=bar&&bar.closest('.quiz-v3-timer');
      if(text)text.textContent=(remain/1000).toFixed(remain<10000?1:0);if(bar)bar.style.width=(ratio*100)+'%';if(box&&ratio<.25)box.classList.add('is-danger');
      if(remain<=0){clearTimer();onTimeoutV3_(kind);}
    },100);
  }

  function onTimeoutV3_(kind){
    const q=quizState.game.questions[quizState.index];if(kind==='profile'&&quizState.stage!=='answered'){
      recordFixedTimeV3_(20000);quizState.answers[quizState.index]={value:'',timedOut:true,answerTimeMs:20000,correct:false};quizState.stage='answered';flashV3_('TIME UP',true);replaceBodyV3_();enableQuizNext_();return;
    }
    if(kind==='onlineSong'&&quizState.stage==='song'){
      recordFixedTimeV3_(30000);quizState.answers[quizState.index]={songId:'',singerId:'',songCorrect:false,singerCorrect:false,timedOut:true,answerTimeMs:30000};quizState.stage='answered';flashV3_('TIME UP',true);replaceBodyV3_();enableQuizNext_();return;
    }
    if(kind==='offlineSong'&&quizState.stage==='question'){
      quizState.stage='songAward';flashV3_('TIME UP',true);replaceBodyV3_();
    }
  }

  function recordQuestionTimeV3_(limit){if(quizState.timeRecorded)return 0;const elapsed=Math.min(limit,Math.max(0,Date.now()-quizState.questionStartedAt));quizState.timeRecorded=true;quizState.totalAnswerTimeMs+=elapsed;return elapsed;}
  function recordFixedTimeV3_(value){if(quizState.timeRecorded)return;quizState.timeRecorded=true;quizState.totalAnswerTimeMs+=value;}
  function normalizeSearchV3_(value){return String(value||'').normalize('NFKC').trim().toLowerCase();}
  function replaceBodyV3_(){const body=document.getElementById('quizQuestionBody'),q=quizState.game.questions[quizState.index];if(body)body.innerHTML=renderQuizQuestionBodyV3_(q);}

  function renderFinalFeedbackV3_(question,answer){
    answer=answer||{};let ok=false,mark='MISS',detail='';
    if(quizState.game.genre==='PROFILE'){
      ok=!!answer.correct;mark=answer.timedOut?'TIME UP':(ok?'CORRECT':'MISS');detail='正解：'+quizEscape_(question.correct.label||question.correct.value||'');
    }else{
      ok=!!answer.songCorrect&&!!answer.singerCorrect;mark=answer.timedOut?'TIME UP':(ok?'CORRECT':(answer.songCorrect?'SONG +1':'MISS'));
      detail='曲名：'+quizEscape_(question.source.title)+'<br>歌唱：'+quizEscape_((question.source.singerNames||[]).join(' / '));
    }
    return '<div class="quiz-v3-feedback '+((!ok||answer.timedOut)?'is-wrong ':'')+(answer.timedOut?'is-timeout':'')+'"><div class="quiz-v3-feedback-mark">'+mark+'</div><div class="quiz-v3-feedback-answer">'+detail+'</div></div>';
  }

  function flashV3_(text,isWrong){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=document.createElement('div');el.className='quiz-v3-stage-flash'+(isWrong?' is-wrong':'');el.innerHTML='<span>'+quizEscape_(text)+'</span>';document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},560);}

  const legacyAdvance=advanceQuiz_;
  advanceQuiz_=function(){clearTimer();legacyAdvance();};

  finishQuiz_=function(){
    clearTimer();if(quizState.busy||quizState.completed)return;quizState.busy=true;renderQuizLoading_();
    const payload={userId:quizState.userId,quizGameId:quizState.game.gameId,totalAnswerTimeMs:quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS'?0:Math.round(quizState.totalAnswerTimeMs||0)};
    if(quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS')payload.awards=quizState.awards;else payload.answers=quizState.answers;
    google.script.run.withSuccessHandler(function(result){quizState.busy=false;quizState.completed=true;quizState.screen='result';renderQuizResult_(result.scoreboard||[]);}).withFailureHandler(quizFailure_).submitQuizResultV2(payload);
  };

  renderQuizResult_=function(scoreboard){
    clearTimer();const host=quizHost_(),game=quizState.game;if(!host)return;scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    const showTime=!(game&&game.mode==='OFFLINE'&&game.genre==='LYRICS');
    const rows=scoreboard.length?scoreboard.map(function(row,index){const rank=row.rank||index+1,name=row.displayName||quizUserName_(row.userId)||row.userId||'',time=Number(row.totalAnswerTimeMs||0);return '<div class="quiz-ranking-row"><strong>'+rank+'</strong><span>'+quizEscape_(name)+'</span><b>'+Number(row.score||0)+' pt</b>'+(showTime?'<small class="quiz-v3-score-time">'+formatQuizTimeV3_(time)+'</small>':'')+'</div>';}).join(''):'<p class="quiz-muted">まだ結果がありません。</p>';
    host.innerHTML=(game&&game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><p class="quiz-kicker">RESULT</p><h2 class="quiz-panel-title">SCOREBOARD</h2><div class="quiz-ranking">'+rows+'</div><div class="quiz-actions">'+(game&&game.mode==='ONLINE'?'<button class="quiz-action" onclick="refreshQuizRankingV3_()">ランキングを更新</button>':'')+'<button class="quiz-action is-primary" onclick="returnQuizTopV3_()">QUIZ TOP</button><button class="quiz-action" onclick="navigateTo(\'lab\')">LAB</button></div></section>';
  };

  window.refreshQuizRankingV3_=function(){if(!quizState.game||quizState.busy)return;quizState.busy=true;google.script.run.withSuccessHandler(function(rows){quizState.busy=false;renderQuizResult_(rows||[]);}).withFailureHandler(quizFailure_).getQuizScoreboard(quizState.userId,quizState.game.gameId);};
  window.returnQuizTopV3_=function(){clearTimer();if(legacyReturnTop){legacyReturnTop();}else{quizResetState_();renderQuizSetup_();}};
  function formatQuizTimeV3_(ms){if(!ms)return '—';return (ms/1000).toFixed(2)+'s';}

  abandonQuiz_=function(){clearTimer();if(legacyAbandon)return legacyAbandon();};
})();
</script>

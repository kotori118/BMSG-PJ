<style>
  .quiz-page{padding-top:78px}
  .quiz-v3-ready{text-align:center;padding:20px 0 8px}
  .quiz-v3-ready .quiz-panel-title{font-size:28px;margin:8px 0 12px}
  .quiz-v3-ready-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 22px}
  .quiz-v3-chip{border:1px solid rgba(156,236,255,.28);border-radius:999px;padding:7px 11px;background:rgba(156,236,255,.07);font-size:12px}
  .quiz-v3-timer{margin:13px 0 18px}
  .quiz-v3-timer-head{display:flex;align-items:center;justify-content:space-between;font-family:'Exo 2',sans-serif;font-size:12px;letter-spacing:.08em}
  .quiz-v3-timer-track{height:5px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:7px}
  .quiz-v3-timer-bar{display:block;height:100%;width:100%;transform-origin:left center;background:#9cecff;transition:width .1s linear}
  .quiz-v3-timer.is-danger .quiz-v3-timer-bar{background:#ff6f7d}
  .quiz-v3-search{position:relative;margin-top:14px}
  .quiz-v3-search-row{display:flex;gap:8px}
  .quiz-v3-search-input,.quiz-v3-singer-select{width:100%;min-height:48px;border:1px solid rgba(156,236,255,.28);border-radius:14px;background:rgba(255,255,255,.07);color:inherit;padding:0 14px;font:inherit;outline:none}
  .quiz-v3-search-input:focus,.quiz-v3-singer-select:focus{border-color:#9cecff;box-shadow:0 0 0 3px rgba(156,236,255,.12)}
  .quiz-v3-search-results{display:grid;gap:7px;margin-top:9px;max-height:245px;overflow:auto}
  .quiz-v3-song-option{width:100%;min-height:46px;text-align:left;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(255,255,255,.045);color:inherit;padding:10px 12px}
  .quiz-v3-song-option small{display:block;opacity:.55;margin-top:2px}
  .quiz-v3-inline-status{min-height:24px;margin:9px 0 0;font-weight:700}
  .quiz-v3-inline-status.is-wrong{color:#ff8b96;animation:quizV3Shake .28s ease}
  .quiz-v3-singer-box{display:grid;gap:10px;margin-top:16px}
  .quiz-v3-feedback{position:relative;overflow:hidden;border-radius:18px;margin-top:16px;padding:24px 18px;text-align:center;border:1px solid rgba(156,236,255,.34);background:linear-gradient(145deg,rgba(156,236,255,.16),rgba(255,255,255,.045));animation:quizV3Pop .32s ease}
  .quiz-v3-feedback.is-wrong,.quiz-v3-feedback.is-timeout{border-color:rgba(255,111,125,.48);background:linear-gradient(145deg,rgba(255,111,125,.16),rgba(255,255,255,.035))}
  .quiz-v3-feedback-mark{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;letter-spacing:.08em;color:#9cecff}
  .quiz-v3-feedback.is-wrong .quiz-v3-feedback-mark,.quiz-v3-feedback.is-timeout .quiz-v3-feedback-mark{color:#ff7f8c}
  .quiz-v3-feedback-answer{margin-top:12px;line-height:1.65}
  .quiz-v3-stage-flash{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(4,10,20,.72);backdrop-filter:blur(3px);animation:quizV3Fade .55s ease forwards}
  .quiz-v3-stage-flash span{font-family:'Orbitron',sans-serif;font-size:clamp(34px,10vw,64px);letter-spacing:.09em;font-weight:700;color:#9cecff;text-shadow:0 0 30px rgba(156,236,255,.55);animation:quizV3Pop .28s ease}
  .quiz-v3-stage-flash.is-wrong span{color:#ff7f8c;text-shadow:0 0 30px rgba(255,111,125,.38)}
  .quiz-v3-room-join{display:grid;gap:16px}
  .quiz-v3-room-input-row{display:grid;grid-template-columns:1fr auto;gap:8px}
  .quiz-v3-recent{display:grid;gap:9px}
  .quiz-v3-room-card{border:1px solid rgba(156,236,255,.18);border-radius:15px;background:rgba(255,255,255,.045);padding:13px;display:grid;gap:9px}
  .quiz-v3-room-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .quiz-v3-room-id{font-family:'Orbitron',sans-serif;font-size:18px;letter-spacing:.12em}
  .quiz-v3-room-meta{font-size:12px;opacity:.68}
  .quiz-v3-score-time{font-size:11px;opacity:.62;margin-left:5px}
  @keyframes quizV3Pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes quizV3Shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
  @keyframes quizV3Fade{0%{opacity:0}20%,72%{opacity:1}100%{opacity:0}}
  @media(max-width:600px){.quiz-page{padding-top:72px}.quiz-v3-search-row{grid-template-columns:1fr}.quiz-v3-search-row .quiz-action{width:100%}}
  @media(prefers-reduced-motion:reduce){.quiz-v3-feedback,.quiz-v3-inline-status.is-wrong,.quiz-v3-stage-flash,.quiz-v3-stage-flash span{animation:none!important}.quiz-v3-timer-bar{transition:none}}
</style>

<style>
  .quiz-page .quiz-kicker{display:none}
</style>
<script>
(function(){
  function hideTimerV3Fix_(){const host=document.getElementById('quizTimerV3');if(host)host.innerHTML='';}

  function localizeQuizTextFix_(root){
    root=root||document;
    const map={
      'GAME SETUP':'','PLAY QUIZ':'クイズ設定','01 / MODE':'01 / モード','02 / GENRE':'02 / ジャンル','03 / COURSE':'03 / コース','04 / DIFFICULTY':'04 / 難易度',
      'OFFLINE':'オフライン','ONLINE':'オンライン','ROOMを作る':'ルームを作る','BACK':'戻る','START':'開始',
      'CORRECT':'正解','MISS':'不正解','MISS — まだ回答できます':'不正解 — まだ回答できます','SONG CORRECT':'曲名正解','SONG +1':'曲名正解 +1',
      'ANSWER':'答え','SINGER':'歌唱','RESULT':'結果'
    };
    const elements=[];
    if(root.nodeType===1)elements.push(root);
    if(root.querySelectorAll)root.querySelectorAll('*').forEach(function(el){elements.push(el);});
    elements.forEach(function(el){
      if(el.children&&el.children.length)return;
      const text=(el.textContent||'').trim();
      if(Object.prototype.hasOwnProperty.call(map,text)&&map[text]!==text)el.textContent=map[text];
      if(el.getAttribute&&el.getAttribute('aria-label')==='4桁のROOM ID')el.setAttribute('aria-label','4桁のルームID');
    });
    const muted=root.querySelectorAll?root.querySelectorAll('.quiz-muted'):[];
    muted.forEach(function(el){
      if(el.textContent.indexOf('STARTを押した瞬間からクイズ開始。')===0){
        el.textContent='開始を押した瞬間からクイズ開始。問題生成や読み込み時間は回答時間に入りません。';
      }
    });
  }

  function installQuizLocalizationObserver_(){
    if(window.__quizLocalizationObserverInstalled)return;
    window.__quizLocalizationObserverInstalled=true;
    const observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){if(node.nodeType===1)localizeQuizTextFix_(node);});
        if(m.type==='characterData'&&m.target.parentElement)localizeQuizTextFix_(m.target.parentElement);
      });
    });
    observer.observe(document.body,{childList:true,subtree:true,characterData:true});
    localizeQuizTextFix_(document);
  }

  const baseSongAnswer=window.answerSongV3_;
  window.answerSongV3_=function(encoded){baseSongAnswer(encoded);if(quizState.stage==='singer')hideTimerV3Fix_();setTimeout(function(){localizeQuizTextFix_(document);},0);};

  const baseProfileAnswer=window.answerProfileV3_;
  window.answerProfileV3_=function(encoded){baseProfileAnswer(encoded);if(quizState.stage==='answered')hideTimerV3Fix_();setTimeout(function(){localizeQuizTextFix_(document);},0);};

  const baseRevealOffline=window.revealOfflineLyricsV3_;
  window.revealOfflineLyricsV3_=function(){baseRevealOffline();if(quizState.stage==='songAward')hideTimerV3Fix_();setTimeout(function(){localizeQuizTextFix_(document);},0);};
  revealOfflineLyrics_=window.revealOfflineLyricsV3_;

  awardOfflineLyrics_=function(kind,encoded){
    const id=encoded?decodeURIComponent(encoded):'';
    if(!quizState.awards[quizState.index])quizState.awards[quizState.index]={songWinner:'',singerWinner:''};
    if(kind==='song'){
      quizState.awards[quizState.index].songWinner=id;
      quizState.stage='singerAward';
    }else{
      quizState.awards[quizState.index].singerWinner=id;
      quizState.stage='answered';
    }
    const body=document.getElementById('quizQuestionBody');
    const q=quizState.game&&quizState.game.questions&&quizState.game.questions[quizState.index];
    if(body&&q){
      if(quizState.stage==='singerAward'){
        body.innerHTML='<p class="quiz-question-text is-lyrics">'+quizEscape_(q.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">歌唱</div><div class="quiz-v3-feedback-answer">'+quizEscape_((q.source.singerNames||[]).join(' / '))+'</div></div><div class="quiz-award-step"><p class="quiz-setting-title">歌唱メンバーの正解者</p>'+renderQuizAwardButtons_('singer')+'</div>';
      }else{
        const award=quizState.awards[quizState.index]||{};
        body.innerHTML='<p class="quiz-question-text is-lyrics">'+quizEscape_(q.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">結果</div><div class="quiz-v3-feedback-answer">曲名：'+quizEscape_(q.source.title)+'<br>歌唱：'+quizEscape_((q.source.singerNames||[]).join(' / '))+'<br><small>'+quizEscape_(quizUserName_(award.songWinner)||'正解者なし')+' / '+quizEscape_(quizUserName_(award.singerWinner)||'正解者なし')+'</small></div></div>'+renderQuizLyricsLink_(q);
      }
    }
    if(quizState.stage==='answered')enableQuizNext_();
  };

  function formatTimeV3Fix_(ms){return ms>0?(ms/1000).toFixed(2)+'s':'—';}
  function rankingSignatureV3Fix_(rows){return JSON.stringify((rows||[]).map(function(row){return [row.userId||'',Number(row.score||0),Number(row.answerTimeMs||row.totalAnswerTimeMs||0),row.displayName||''];}));}
  function rankingRowsV3Fix_(scoreboard,scoreOnly){
    scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    let previous=null,previousRank=0;
    const rows=scoreboard.map(function(row,index){
      const time=Number(row.answerTimeMs||row.totalAnswerTimeMs||0);
      const tieKey=scoreOnly?String(Number(row.score||0)):String(Number(row.score||0))+'|'+String(time);
      const rank=previous===tieKey?previousRank:index+1;
      previous=tieKey;previousRank=rank;
      const name=row.displayName||quizUserName_(row.userId)||row.userId||'';
      return '<div class="quiz-ranking-row"><strong>'+rank+'</strong><span>'+quizEscape_(name)+'</span><b>'+Number(row.score||0)+' pt</b>'+(!scoreOnly?'<small class="quiz-v3-score-time">'+formatTimeV3Fix_(time)+'</small>':'')+'</div>';
    }).join('');
    return rows||'<p class="quiz-muted">まだ結果がありません。</p>';
  }

  function stopRankingAutoRefreshV3Fix_(){
    if(quizState.v3RankingTimer){clearInterval(quizState.v3RankingTimer);quizState.v3RankingTimer=0;}
  }

  function startRankingAutoRefreshV3Fix_(){
    stopRankingAutoRefreshV3Fix_();
    const game=quizState.game;
    if(!game||game.mode!=='ONLINE'||quizState.screen!=='result')return;
    quizState.v3RankingTimer=setInterval(function(){
      if(!quizState.game||quizState.screen!=='result'||quizState.game.gameId!==game.gameId){stopRankingAutoRefreshV3Fix_();return;}
      const host=document.getElementById('quizRankingV3');
      if(!host){stopRankingAutoRefreshV3Fix_();return;}
      google.script.run.withSuccessHandler(function(rows){
        if(!quizState.game||quizState.screen!=='result'||quizState.game.gameId!==game.gameId)return;
        rows=Array.isArray(rows)?rows:[];
        const signature=rankingSignatureV3Fix_(rows);
        if(signature===quizState.v3RankingSignature)return;
        quizState.v3RankingSignature=signature;
        host.innerHTML=rankingRowsV3Fix_(rows,false);
        localizeQuizTextFix_(host);
      }).withFailureHandler(function(){}).getQuizScoreboard(quizState.userId,game.gameId);
    },4000);
  }

  renderQuizResult_=function(scoreboard){
    stopRankingAutoRefreshV3Fix_();
    const host=quizHost_(),game=quizState.game;if(!host)return;scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    const scoreOnly=!!(game&&game.mode==='OFFLINE'&&game.genre==='LYRICS');
    quizState.v3RankingSignature=rankingSignatureV3Fix_(scoreboard);
    host.innerHTML=(game&&game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><h2 class="quiz-panel-title">ランキング</h2><div id="quizRankingV3" class="quiz-ranking">'+rankingRowsV3Fix_(scoreboard,scoreOnly)+'</div><div class="quiz-actions"><button class="quiz-action is-primary" onclick="returnQuizTopV3_()">クイズトップ</button><button class="quiz-action" onclick="navigateTo(\'lab\')">LAB</button></div></section>';
    localizeQuizTextFix_(host);
    startRankingAutoRefreshV3Fix_();
  };

  window.refreshQuizRankingV3_=function(){
    if(!quizState.game||quizState.game.mode!=='ONLINE'||quizState.screen!=='result')return;
    google.script.run.withSuccessHandler(function(rows){
      const host=document.getElementById('quizRankingV3');if(!host)return;
      rows=Array.isArray(rows)?rows:[];const signature=rankingSignatureV3Fix_(rows);if(signature===quizState.v3RankingSignature)return;
      quizState.v3RankingSignature=signature;host.innerHTML=rankingRowsV3Fix_(rows,false);localizeQuizTextFix_(host);
    }).withFailureHandler(function(){}).getQuizScoreboard(quizState.userId,quizState.game.gameId);
  };

  const baseReturnTopFix_=window.returnQuizTopV3_;
  window.returnQuizTopV3_=function(){stopRankingAutoRefreshV3Fix_();return baseReturnTopFix_.apply(this,arguments);};

  installQuizLocalizationObserver_();
})();
</script>

<script>
(function(){
  function auditQuizUi_(root){
    root=root||document;
    var replacements={
      '01 / モード':'モード','02 / ジャンル':'ジャンル','03 / コース':'コース','04 / 難易度':'難易度',
      '01 / MODE':'モード','02 / GENRE':'ジャンル','03 / COURSE':'コース','04 / DIFFICULTY':'難易度',
      '諦める':'終了する','4桁のROOM IDを入力してください。':'4桁のルームIDを入力してください。'
    };
    var nodes=[];
    if(root.nodeType===1)nodes.push(root);
    if(root.querySelectorAll)root.querySelectorAll('*').forEach(function(el){nodes.push(el);});
    nodes.forEach(function(el){
      if(el.children&&el.children.length)return;
      var text=(el.textContent||'').trim();
      if(Object.prototype.hasOwnProperty.call(replacements,text))el.textContent=replacements[text];
      if(el.getAttribute&&el.getAttribute('aria-label')==='4桁のROOM ID')el.setAttribute('aria-label','4桁のルームID');
    });
  }

  function safeClearQuizTimer_(){
    if(window.quizState&&quizState.v3Timer){
      clearInterval(quizState.v3Timer);
      quizState.v3Timer=0;
    }
  }

  function quizOfflineUsers_(){
    var users=Array.isArray(window.quizState&&quizState.users)?quizState.users:[];
    if(users.length)return users;
    return [
      {userId:'U001',displayName:'ももたん'},
      {userId:'U002',displayName:'みおたん'},
      {userId:'U003',displayName:'りおたん'}
    ];
  }

  function syncOfflinePlayerButtons_(){
    var selected=Array.isArray(window.quizState&&quizState.selectedPlayers)?quizState.selectedPlayers:[];
    document.querySelectorAll('[data-quiz-offline-player]').forEach(function(button){
      var id=button.getAttribute('data-quiz-offline-player');
      var active=selected.indexOf(id)>=0;
      button.classList.toggle('is-selected',active);
      button.setAttribute('aria-pressed',active?'true':'false');
    });
    var count=document.getElementById('quizOfflinePlayerCount');
    if(count)count.textContent=selected.length+'人選択中';
  }

  function renderQuizBootstrapTimeout_(){
    var host=quizHost_();
    if(!host)return;
    host.innerHTML='<section class="quiz-panel"><p class="quiz-v3-note">読み込みに時間がかかっています。もう一度お試しください。</p><div class="quiz-actions"><button class="quiz-action is-primary" onclick="initQuizPage({})">再読み込み</button><button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
  }

  function renderQuizBootstrapError_(error){
    var host=quizHost_();
    if(!host)return;
    var message=error&&error.message?String(error.message):'クイズを読み込めませんでした。';
    host.innerHTML='<section class="quiz-panel"><p class="quiz-v3-note">'+quizEscape_(message)+'</p><div class="quiz-actions"><button class="quiz-action is-primary" onclick="initQuizPage({})">再読み込み</button><button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
  }

  function loadQuizBootstrapInBackground_(uid){
    try{
      google.script.run
        .withSuccessHandler(function(data){
          quizState.ready=true;
          quizState.users=data&&data.users?data.users:quizState.users;
          quizState.courses=data&&data.courses?data.courses:quizState.courses;
        })
        .withFailureHandler(function(){
          /* Setup already has safe local fallbacks. Keep the page usable. */
        })
        .getQuizBootstrapFinal(uid,'');
    }catch(error){
      /* Setup already rendered. Bootstrap refresh is optional on normal entry. */
    }
  }

  window.initQuizPage=function(params){
    params=params||{};
    var requestedRoom=String(params.room||'').replace(/\D/g,'');
    try{
      safeClearQuizTimer_();
      if(typeof quizResetState_==='function')quizResetState_();
      var uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
      if(!uid){
        var emptyHost=quizHost_();
        if(emptyHost)emptyHost.innerHTML='<section class="quiz-panel"><p class="quiz-v3-note">利用者を選択してください。</p></section>';
        if(typeof openUserChooser==='function')openUserChooser(true);
        return;
      }
      quizState.userId=uid;
      quizState.selectedPlayers=[uid];
      quizState.busy=false;

      /* Normal QUIZ entry must never wait for Spreadsheet/API bootstrap. */
      if(!requestedRoom){
        quizState.ready=true;
        renderQuizSetup_();
        loadQuizBootstrapInBackground_(uid);
        return;
      }

      /* Direct ROOM entry still needs the server, so protect the full path. */
      renderQuizLoading_();
      var settled=false;
      var timer=setTimeout(function(){
        if(settled)return;
        settled=true;
        quizState.busy=false;
        renderQuizBootstrapTimeout_();
      },10000);
      google.script.run
        .withSuccessHandler(function(data){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          quizState.ready=true;
          quizState.users=data&&data.users?data.users:[];
          quizState.courses=data&&data.courses?data.courses:[];
          if(data&&data.room)startQuizClientGame_(data.room);
          else renderQuizSetup_();
        })
        .withFailureHandler(function(error){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          quizState.busy=false;
          renderQuizBootstrapError_(error);
        })
        .getQuizBootstrapFinal(uid,requestedRoom);
    }catch(error){
      quizState.busy=false;
      renderQuizBootstrapError_(error);
    }
  };

  window.renderQuizPlayerSelect_=function(){
    var users=quizOfflineUsers_();
    var selected=Array.isArray(quizState.selectedPlayers)?quizState.selectedPlayers:[];
    return '<div class="quiz-setting quiz-offline-player-select">'+
      '<div class="quiz-setting-title">プレイヤー（2〜3人） <span id="quizOfflinePlayerCount" class="quiz-offline-player-count">'+selected.length+'人選択中</span></div>'+
      '<div class="quiz-player-grid">'+users.map(function(user){
        var id=String(user.userId||'');
        var active=selected.indexOf(id)>=0;
        return '<button type="button" class="quiz-player'+(active?' is-selected':'')+'" data-quiz-offline-player="'+quizEscape_(id)+'" aria-pressed="'+(active?'true':'false')+'" onclick="toggleQuizPlayer_(\''+quizEscape_(id)+'\');return false;">'+quizEscape_(user.displayName||id)+'</button>';
      }).join('')+'</div></div>';
  };

  window.toggleQuizPlayer_=function(userId){
    var id=String(userId||'');
    if(!id)return false;
    if(!Array.isArray(quizState.selectedPlayers))quizState.selectedPlayers=[];
    var selected=quizState.selectedPlayers.slice();
    var index=selected.indexOf(id);
    if(index>=0)selected.splice(index,1);
    else{
      if(selected.length>=3){
        if(typeof quizNotify_==='function')quizNotify_('選べるのは3人までです。');
        return false;
      }
      selected.push(id);
    }
    quizState.selectedPlayers=selected;
    syncOfflinePlayerButtons_();
    return false;
  };

  renderQuizSetup_=function(){
    safeClearQuizTimer_();quizState.screen='setup';quizState.completed=false;
    var s=quizState.settings;
    if(s.genre==='PROFILE')s.course='ALL';
    var offlineLyrics=s.mode==='OFFLINE'&&s.genre==='LYRICS',host=quizHost_();if(!host)return;
    var courseHtml=s.genre==='PROFILE'?'':quizSetting_('コース',(quizState.courses.length?quizState.courses:[
      {value:'BE:FIRST',label:'BE:FIRST'},{value:'MAZZEL',label:'MAZZEL'},{value:'STARGLOW',label:'STARGLOW'},
      {value:'HANA',label:'HANA'},{value:'UNIT',label:'ユニット'},{value:'ALL',label:'全部'}
    ]).map(function(x){return[x.value,x.label];}),s.course,'course','is-course');
    host.innerHTML='<section class="quiz-panel"><div class="quiz-settings">'+
      quizSetting_('モード',[['OFFLINE','オフライン'],['ONLINE','オンライン']],s.mode,'mode')+
      quizSetting_('ジャンル',[['LYRICS','歌詞'],['PROFILE','プロフィール']],s.genre,'genre')+
      courseHtml+
      quizSetting_('難易度',[['NORMAL','普通'],['ADVANCED','上級']],s.difficulty,'difficulty')+
      (offlineLyrics?renderQuizPlayerSelect_():'')+'</div><div class="quiz-actions">'+
      (s.mode==='ONLINE'?'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">ルームを作る</button><button class="quiz-action" onclick="openQuizRoomJoinV3_()">ルームに参加する</button>':'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">開始</button>')+
      '<button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
    auditQuizUi_(host);
  };

  createQuizFromSetup_=function(){
    if(quizState.busy)return;
    var s=quizState.settings;
    if(s.genre==='PROFILE')s.course='ALL';
    if(s.mode==='OFFLINE'&&s.genre==='LYRICS'&&(!Array.isArray(quizState.selectedPlayers)||quizState.selectedPlayers.length<2||quizState.selectedPlayers.length>3)){
      quizNotify_('2〜3人を選択してください。');return;
    }
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){
      quizState.busy=false;if(game.roomId)setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);
    }).withFailureHandler(quizFailure_).createQuizGameFinal({
      userId:quizState.userId,mode:s.mode,genre:s.genre,course:s.course,difficulty:s.difficulty,playerUserIds:quizState.selectedPlayers
    });
  };

  window.renderQuizReadyV3_=function(){
    var game=quizState.game,host=quizHost_();if(!host||!game)return;
    var items=game.genre==='LYRICS'
      ? ['「開始」を押すと1問目が始まります','曲名の回答時間は30秒です','問題生成や読み込み時間は回答時間に含まれません']
      : ['「開始」を押すと1問目が始まります','1問の回答時間は20秒です','問題生成や読み込み時間は回答時間に含まれません'];
    var chips='<span class="quiz-v3-chip">'+quizEscape_(quizGenreLabel_(game.genre))+'</span>'+
      (game.genre==='PROFILE'?'':'<span class="quiz-v3-chip">'+quizEscape_(game.course)+'</span>')+
      '<span class="quiz-v3-chip">'+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</span>';
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+
      '<section class="quiz-panel quiz-v3-ready"><ul class="quiz-ready-notes">'+items.map(function(x){return '<li>'+quizEscape_(x)+'</li>';}).join('')+'</ul>'+
      '<div class="quiz-v3-ready-meta">'+chips+'</div><div class="quiz-actions">'+
      '<button class="quiz-action is-primary" onclick="beginQuizV3_()">開始</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">終了する</button></div></section>';
  };

  function patchResultNavigation_(){
    if(typeof window.renderQuizResult_!=='function'||window.__quizFinalResultPatched)return;
    window.__quizFinalResultPatched=true;
    var base=window.renderQuizResult_;
    window.renderQuizResult_=function(scoreboard){
      base(scoreboard);
      var host=quizHost_();if(!host)return;
      var buttons=host.querySelectorAll('.quiz-actions button');
      buttons.forEach(function(btn){
        var text=(btn.textContent||'').trim();
        if(text==='クイズトップ'||text==='QUIZ TOP'){
          btn.textContent='トップに戻る';
          btn.setAttribute('onclick','returnQuizTopV3_()');
        }else if(text==='LAB'){
          btn.textContent='HOMEへ';
          btn.setAttribute('onclick',"navigateTo('home')");
        }
      });
    };
  }

  function installQuizUiAudit_(){
    auditQuizUi_(document);
    patchResultNavigation_();
    if(window.__quizUiAuditObserver)return;
    window.__quizUiAuditObserver=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){if(node.nodeType===1)auditQuizUi_(node);});
        if(m.type==='characterData'&&m.target.parentElement)auditQuizUi_(m.target.parentElement);
      });
    });
    window.__quizUiAuditObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installQuizUiAudit_);
  else installQuizUiAudit_();
})();
</script>

<script>
(function(){
  function isOfflineProfileParty_(){
    return !!(window.quizState && quizState.game && quizState.game.mode==='OFFLINE' && quizState.game.genre==='PROFILE');
  }

  function partyUsers_(){
    var users=Array.isArray(window.quizState&&quizState.users)?quizState.users:[];
    if(users.length)return users;
    return [
      {userId:'U001',displayName:'ももたん'},
      {userId:'U002',displayName:'みおたん'},
      {userId:'U003',displayName:'りおたん'}
    ];
  }

  function partyUserName_(id){
    var value=String(id||'');
    var hit=partyUsers_().filter(function(user){return String(user.userId||'')===value;})[0];
    return hit?String(hit.displayName||value):value;
  }

  function stopPartyTimer_(){
    if(window.quizState&&quizState.v3Timer){
      clearInterval(quizState.v3Timer);
      quizState.v3Timer=0;
    }
  }

  function selectedPartyPlayers_(){
    if(!Array.isArray(window.quizState&&quizState.selectedPlayers))quizState.selectedPlayers=[];
    return quizState.selectedPlayers.map(String).filter(function(id,index,all){return id&&all.indexOf(id)===index;});
  }

  function syncPartyPlayerUi_(){
    var selected=selectedPartyPlayers_();
    quizState.selectedPlayers=selected;
    document.querySelectorAll('#quizApp [data-quiz-party-player]').forEach(function(button){
      var id=String(button.getAttribute('data-quiz-party-player')||'');
      var active=selected.indexOf(id)>=0;
      button.classList.toggle('is-selected',active);
      button.setAttribute('aria-pressed',active?'true':'false');
    });
    var count=document.getElementById('quizOfflinePlayerCount');
    if(count)count.textContent=selected.length+'人選択中';
    var start=document.getElementById('quizOfflineStartButton');
    if(start)start.disabled=selected.length<2||selected.length>3;
  }

  window.renderQuizPlayerSelect_=function(){
    var selected=selectedPartyPlayers_();
    var users=partyUsers_();
    return '<div class="quiz-setting quiz-offline-player-select">'+
      '<div class="quiz-setting-title">プレイヤー（2〜3人） <span id="quizOfflinePlayerCount" class="quiz-offline-player-count">'+selected.length+'人選択中</span></div>'+
      '<div class="quiz-player-grid">'+users.map(function(user){
        var id=String(user.userId||'');
        var active=selected.indexOf(id)>=0;
        return '<button type="button" class="quiz-player'+(active?' is-selected':'')+'" data-quiz-party-player="'+quizEscape_(id)+'" aria-pressed="'+(active?'true':'false')+'" onclick="return toggleQuizPartyPlayer_(\''+quizEscape_(id)+'\')">'+quizEscape_(user.displayName||id)+'</button>';
      }).join('')+'</div></div>';
  };

  window.toggleQuizPartyPlayer_=function(userId){
    var id=String(userId||'');
    if(!id)return false;
    var selected=selectedPartyPlayers_();
    var index=selected.indexOf(id);
    if(index>=0){
      selected.splice(index,1);
    }else{
      if(selected.length>=3){
        if(typeof quizNotify_==='function')quizNotify_('選べるのは3人までです。');
        return false;
      }
      selected.push(id);
    }
    quizState.selectedPlayers=selected;
    syncPartyPlayerUi_();
    return false;
  };

  var previousSetup_=window.renderQuizSetup_;
  window.renderQuizSetup_=function(){
    stopPartyTimer_();
    quizState.screen='setup';quizState.completed=false;
    var s=quizState.settings;
    if(s.genre==='PROFILE')s.course='ALL';
    var host=quizHost_();if(!host)return;
    var offline=s.mode==='OFFLINE';
    var courseHtml=s.genre==='PROFILE'?'':quizSetting_('コース',(quizState.courses.length?quizState.courses:[
      {value:'BE:FIRST',label:'BE:FIRST'},{value:'MAZZEL',label:'MAZZEL'},{value:'STARGLOW',label:'STARGLOW'},
      {value:'HANA',label:'HANA'},{value:'UNIT',label:'ユニット'},{value:'ALL',label:'全部'}
    ]).map(function(x){return[x.value,x.label];}),s.course,'course','is-course');
    var selectedCount=selectedPartyPlayers_().length;
    host.innerHTML='<section class="quiz-panel"><div class="quiz-settings">'+
      quizSetting_('モード',[['OFFLINE','オフライン'],['ONLINE','オンライン']],s.mode,'mode')+
      quizSetting_('ジャンル',[['LYRICS','歌詞'],['PROFILE','プロフィール']],s.genre,'genre')+
      courseHtml+
      quizSetting_('難易度',[['NORMAL','普通'],['ADVANCED','上級']],s.difficulty,'difficulty')+
      (offline?renderQuizPlayerSelect_():'')+'</div><div class="quiz-actions">'+
      (s.mode==='ONLINE'?'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">ルームを作る</button><button class="quiz-action" onclick="openQuizRoomJoinV3_()">ルームに参加する</button>':'<button id="quizOfflineStartButton" class="quiz-action is-primary" onclick="createQuizFromSetup_()" '+(selectedCount>=2&&selectedCount<=3?'':'disabled')+'>開始</button>')+
      '<button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
    if(offline)syncPartyPlayerUi_();
  };

  window.createQuizFromSetup_=function(){
    if(quizState.busy)return;
    var s=quizState.settings;
    if(s.genre==='PROFILE')s.course='ALL';
    if(s.mode==='OFFLINE'&&(!Array.isArray(quizState.selectedPlayers)||quizState.selectedPlayers.length<2||quizState.selectedPlayers.length>3)){
      quizNotify_('2〜3人を選択してください。');return;
    }
    quizState.busy=true;renderQuizLoading_();
    var runner=google.script.run.withSuccessHandler(function(game){
      quizState.busy=false;if(game.roomId)setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);
    }).withFailureHandler(quizFailure_);
    var payload={userId:quizState.userId,mode:s.mode,genre:s.genre,course:s.course,difficulty:s.difficulty,playerUserIds:quizState.selectedPlayers};
    if(s.mode==='OFFLINE')runner.createQuizOfflinePartyFinal(payload);
    else runner.createQuizGameFinal(payload);
  };

  window.renderQuizReadyV3_=function(){
    var game=quizState.game,host=quizHost_();if(!host||!game)return;
    var items;
    if(game.mode==='OFFLINE'&&game.genre==='PROFILE'){
      items=['「開始」を押すと1問目が表示されます','分かった人がその場で回答し、「回答を見る」を押します','正解者を選ぶと1pt。時間制限はありません'];
    }else if(game.genre==='LYRICS'){
      items=['「開始」を押すと1問目が始まります','曲名の回答時間は30秒です','問題生成や読み込み時間は回答時間に含まれません'];
    }else{
      items=['「開始」を押すと1問目が始まります','1問の回答時間は20秒です','問題生成や読み込み時間は回答時間に含まれません'];
    }
    var chips='<span class="quiz-v3-chip">'+quizEscape_(quizGenreLabel_(game.genre))+'</span>'+
      (game.genre==='PROFILE'?'':'<span class="quiz-v3-chip">'+quizEscape_(game.course)+'</span>')+
      '<span class="quiz-v3-chip">'+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</span>';
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+
      '<section class="quiz-panel quiz-v3-ready"><ul class="quiz-ready-notes">'+items.map(function(x){return '<li>'+quizEscape_(x)+'</li>';}).join('')+'</ul>'+
      '<div class="quiz-v3-ready-meta">'+chips+'</div><div class="quiz-actions">'+
      '<button class="quiz-action is-primary" onclick="beginQuizV3_()">開始</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">終了する</button></div></section>';
  };

  function profilePartyAwardButtons_(){
    var players=Array.isArray(quizState.game&&quizState.game.players)?quizState.game.players:[];
    var buttons=players.map(function(id){
      return '<button class="quiz-award" onclick="awardOfflineProfileParty_(\''+quizArg_(id)+'\')">'+quizEscape_(partyUserName_(id))+' (+1pt)</button>';
    });
    buttons.push('<button class="quiz-award is-none" onclick="awardOfflineProfileParty_(\'\')">正解者なし (0pt)</button>');
    return '<div class="quiz-award-grid">'+buttons.join('')+'</div>';
  }

  function profilePartyBody_(question){
    var answerLabel=String(question&&question.correct&&(question.correct.label!=null?question.correct.label:question.correct.value)||'');
    if(quizState.stage==='question'){
      return '<p class="quiz-question-text">'+quizEscape_(question.text)+'</p><button class="quiz-action is-primary" style="width:100%" onclick="revealOfflineProfileParty_()">回答を見る</button>';
    }
    if(quizState.stage==='profileAward'){
      return '<p class="quiz-question-text">'+quizEscape_(question.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">正解</div><div class="quiz-v3-feedback-answer">'+quizEscape_(answerLabel)+'</div></div><div class="quiz-award-step"><p class="quiz-setting-title">正解した人</p>'+profilePartyAwardButtons_()+'</div>';
    }
    var award=quizState.awards[quizState.index]||{};
    return '<p class="quiz-question-text">'+quizEscape_(question.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">正解</div><div class="quiz-v3-feedback-answer">'+quizEscape_(answerLabel)+'<br><small>'+quizEscape_(partyUserName_(award.profileWinner)||'正解者なし')+'</small></div></div>';
  }

  function renderOfflineProfilePartyQuestion_(){
    stopPartyTimer_();
    var game=quizState.game,question=game&&game.questions&&game.questions[quizState.index];
    if(!question){finishQuiz_();return;}
    var host=quizHost_();if(!host)return;
    var progress=Math.round((quizState.index/game.questions.length)*100);
    host.innerHTML='<div class="quiz-progress" aria-label="進行度"><span style="width:'+progress+'%"></span></div><section class="quiz-panel"><div class="quiz-question-head"><p class="quiz-step-label">プロフィール / '+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</p><span class="quiz-question-count">'+String(quizState.index+1).padStart(2,'0')+' / 10</span></div><div id="quizQuestionBody">'+profilePartyBody_(question)+'</div><div class="quiz-actions"><button id="quizNextButton" class="quiz-action is-primary" onclick="advanceQuiz_()" '+(quizState.stage==='answered'?'':'disabled')+'>'+(quizState.index>=game.questions.length-1?'結果を見る':'次へ')+'</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">終了する</button></div></section>';
  }

  window.revealOfflineProfileParty_=function(){
    if(!isOfflineProfileParty_()||quizState.stage!=='question')return;
    stopPartyTimer_();quizState.stage='profileAward';renderOfflineProfilePartyQuestion_();
  };

  window.awardOfflineProfileParty_=function(encoded){
    if(!isOfflineProfileParty_()||quizState.stage!=='profileAward')return;
    var id=encoded?decodeURIComponent(encoded):'';
    var players=Array.isArray(quizState.game.players)?quizState.game.players.map(String):[];
    if(id&&players.indexOf(String(id))<0)return;
    if(!Array.isArray(quizState.awards))quizState.awards=[];
    quizState.awards[quizState.index]={profileWinner:String(id||'')};
    quizState.stage='answered';renderOfflineProfilePartyQuestion_();
  };

  var previousRenderQuestion_=window.renderQuizQuestion_;
  window.renderQuizQuestion_=function(){
    if(isOfflineProfileParty_()){
      if(quizState.stage!=='profileAward'&&quizState.stage!=='answered')quizState.stage='question';
      renderOfflineProfilePartyQuestion_();return;
    }
    return previousRenderQuestion_.apply(this,arguments);
  };

  var previousAdvance_=window.advanceQuiz_;
  window.advanceQuiz_=function(){
    if(!isOfflineProfileParty_())return previousAdvance_.apply(this,arguments);
    if(quizState.stage!=='answered')return;
    if(quizState.index>=quizState.game.questions.length-1){finishQuiz_();return;}
    quizState.index+=1;quizState.stage='question';quizState.selected=null;renderOfflineProfilePartyQuestion_();
    if(typeof scrollAppToTop==='function')scrollAppToTop('smooth');
  };

  var previousFinish_=window.finishQuiz_;
  window.finishQuiz_=function(){
    if(!isOfflineProfileParty_())return previousFinish_.apply(this,arguments);
    stopPartyTimer_();
    if(quizState.busy||quizState.completed)return;
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(result){
      quizState.busy=false;quizState.completed=true;quizState.screen='result';renderQuizResult_(result.scoreboard||[]);
    }).withFailureHandler(quizFailure_).submitQuizOfflinePartyFinal({
      userId:quizState.userId,quizGameId:quizState.game.gameId,totalAnswerTimeMs:0,awards:quizState.awards
    });
  };

  var previousResult_=window.renderQuizResult_;
  window.renderQuizResult_=function(scoreboard){
    previousResult_.call(this,scoreboard);
    if(quizState.game&&quizState.game.mode==='OFFLINE'){
      document.querySelectorAll('#quizApp .quiz-v3-score-time').forEach(function(el){el.remove();});
    }
  };
})();
</script>

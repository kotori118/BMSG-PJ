<script>
(function(){
  function hideTimerV3Fix_(){const host=document.getElementById('quizTimerV3');if(host)host.innerHTML='';}

  const baseSongAnswer=window.answerSongV3_;
  window.answerSongV3_=function(encoded){baseSongAnswer(encoded);if(quizState.stage==='singer')hideTimerV3Fix_();};

  const baseProfileAnswer=window.answerProfileV3_;
  window.answerProfileV3_=function(encoded){baseProfileAnswer(encoded);if(quizState.stage==='answered')hideTimerV3Fix_();};

  const baseRevealOffline=window.revealOfflineLyricsV3_;
  window.revealOfflineLyricsV3_=function(){baseRevealOffline();if(quizState.stage==='songAward')hideTimerV3Fix_();};
  revealOfflineLyrics_=window.revealOfflineLyricsV3_;

  awardOfflineLyrics_=function(kind,encoded){
    const id=encoded?decodeURIComponent(encoded):'';
    if(!quizState.awards[quizState.index])quizState.awards[quizState.index]={songWinner:'',singerWinner:''};
    if(kind==='song'){
      quizState.awards[quizState.index].songWinner=id;
      quizState.stage='singerAward';
    }else{
      quizState.awards[quizState.index].singerWinner=id;
      quizState.stage='answered';
    }
    const body=document.getElementById('quizQuestionBody');
    const q=quizState.game&&quizState.game.questions&&quizState.game.questions[quizState.index];
    if(body&&q){
      if(quizState.stage==='singerAward'){
        body.innerHTML='<p class="quiz-question-text is-lyrics">'+quizEscape_(q.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">SINGER</div><div class="quiz-v3-feedback-answer">'+quizEscape_((q.source.singerNames||[]).join(' / '))+'</div></div><div class="quiz-award-step"><p class="quiz-setting-title">歌唱Memberの正解者</p>'+renderQuizAwardButtons_('singer')+'</div>';
      }else{
        const award=quizState.awards[quizState.index]||{};
        body.innerHTML='<p class="quiz-question-text is-lyrics">'+quizEscape_(q.text)+'</p><div class="quiz-v3-feedback"><div class="quiz-v3-feedback-mark">RESULT</div><div class="quiz-v3-feedback-answer">曲名：'+quizEscape_(q.source.title)+'<br>歌唱：'+quizEscape_((q.source.singerNames||[]).join(' / '))+'<br><small>'+quizEscape_(quizUserName_(award.songWinner)||'正解者なし')+' / '+quizEscape_(quizUserName_(award.singerWinner)||'正解者なし')+'</small></div></div>'+renderQuizLyricsLink_(q);
      }
    }
    if(quizState.stage==='answered')enableQuizNext_();
  };

  renderQuizResult_=function(scoreboard){
    const host=quizHost_(),game=quizState.game;if(!host)return;scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    const scoreOnly=!!(game&&game.mode==='OFFLINE'&&game.genre==='LYRICS');
    let previous=null,previousRank=0;
    const rows=scoreboard.map(function(row,index){
      const time=Number(row.answerTimeMs||0);
      const tieKey=scoreOnly?String(Number(row.score||0)):String(Number(row.score||0))+'|'+String(time);
      const rank=previous===tieKey?previousRank:index+1;
      previous=tieKey;previousRank=rank;
      const name=row.displayName||quizUserName_(row.userId)||row.userId||'';
      return '<div class="quiz-ranking-row"><strong>'+rank+'</strong><span>'+quizEscape_(name)+'</span><b>'+Number(row.score||0)+' pt</b>'+(!scoreOnly?'<small class="quiz-v3-score-time">'+formatTimeV3Fix_(time)+'</small>':'')+'</div>';
    }).join('');
    host.innerHTML=(game&&game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><p class="quiz-kicker">RESULT</p><h2 class="quiz-panel-title">SCOREBOARD</h2><div class="quiz-ranking">'+(rows||'<p class="quiz-muted">まだ結果がありません。</p>')+'</div><div class="quiz-actions">'+(game&&game.mode==='ONLINE'?'<button class="quiz-action" onclick="refreshQuizRankingV3_()">ランキングを更新</button>':'')+'<button class="quiz-action is-primary" onclick="returnQuizTopV3_()">QUIZ TOP</button><button class="quiz-action" onclick="navigateTo(\'lab\')">LAB</button></div></section>';
  };

  function formatTimeV3Fix_(ms){return ms>0?(ms/1000).toFixed(2)+'s':'—';}
})();
</script>

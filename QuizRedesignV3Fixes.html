<style>
  .quiz-page .quiz-kicker{display:none}
</style>
<script>
(function(){
  function localizeQuizTextFix_(root){
    root=root||document;
    const map={
      'GAME SETUP':'','PLAY QUIZ':'クイズ設定','01 / MODE':'01 / モード','02 / GENRE':'02 / ジャンル','03 / COURSE':'03 / コース','04 / DIFFICULTY':'04 / 難易度',
      'OFFLINE':'オフライン','ONLINE':'オンライン','ROOMを作る':'ルームを作る','BACK':'戻る','START':'開始',
      'CORRECT':'正解','MISS':'不正解','MISS — まだ回答できます':'不正解 — まだ回答できます','SONG CORRECT':'曲名正解','SONG +1':'曲名正解 +1',
      'ANSWER':'答え','SINGER':'歌唱','RESULT':'結果'
    };
    const elements=[];
    if(root.nodeType===1)elements.push(root);
    if(root.querySelectorAll)root.querySelectorAll('*').forEach(function(el){elements.push(el);});
    elements.forEach(function(el){
      if(el.children&&el.children.length)return;
      const text=(el.textContent||'').trim();
      if(Object.prototype.hasOwnProperty.call(map,text)&&map[text]!==text)el.textContent=map[text];
      if(el.getAttribute&&el.getAttribute('aria-label')==='4桁のROOM ID')el.setAttribute('aria-label','4桁のルームID');
    });
    const muted=root.querySelectorAll?root.querySelectorAll('.quiz-muted'):[];
    muted.forEach(function(el){
      if(el.textContent.indexOf('STARTを押した瞬間からクイズ開始。')===0){
        el.textContent='開始を押した瞬間からクイズ開始。問題生成や読み込み時間は回答時間に入りません。';
      }
    });
  }

  function installQuizLocalizationObserver_(){
    if(window.__quizLocalizationObserverInstalled)return;
    window.__quizLocalizationObserverInstalled=true;
    const observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){if(node.nodeType===1)localizeQuizTextFix_(node);});
        if(m.type==='characterData'&&m.target.parentElement)localizeQuizTextFix_(m.target.parentElement);
      });
    });
    observer.observe(document.body,{childList:true,subtree:true,characterData:true});
    localizeQuizTextFix_(document);
  }

  installQuizLocalizationObserver_();
})();
</script>

<script>
(function(){
  function auditQuizUi_(root){
    root=root||document;
    var replacements={
      '01 / モード':'モード','02 / ジャンル':'ジャンル','03 / コース':'コース','04 / 難易度':'難易度',
      '01 / MODE':'モード','02 / GENRE':'ジャンル','03 / COURSE':'コース','04 / DIFFICULTY':'難易度',
      '諦める':'終了する','4桁のROOM IDを入力してください。':'4桁のルームIDを入力してください。'
    };
    var nodes=[];
    if(root.nodeType===1)nodes.push(root);
    if(root.querySelectorAll)root.querySelectorAll('*').forEach(function(el){nodes.push(el);});
    nodes.forEach(function(el){
      if(el.children&&el.children.length)return;
      var text=(el.textContent||'').trim();
      if(Object.prototype.hasOwnProperty.call(replacements,text))el.textContent=replacements[text];
      if(el.getAttribute&&el.getAttribute('aria-label')==='4桁のROOM ID')el.setAttribute('aria-label','4桁のルームID');
    });
  }

  function installQuizUiAudit_(){
    auditQuizUi_(document);
    if(window.__quizUiAuditObserver)return;
    window.__quizUiAuditObserver=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){if(node.nodeType===1)auditQuizUi_(node);});
        if(m.type==='characterData'&&m.target.parentElement)auditQuizUi_(m.target.parentElement);
      });
    });
    window.__quizUiAuditObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installQuizUiAudit_);
  else installQuizUiAudit_();
})();
</script>

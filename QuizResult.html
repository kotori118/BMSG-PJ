<script>
(function(){
  const legacyAbandon=typeof abandonQuiz_==='function'?abandonQuiz_:null;
  const legacyReturnTop=typeof returnQuizTop_==='function'?returnQuizTop_:null;
  function clearTimer(){if(quizState.v3Timer){clearInterval(quizState.v3Timer);quizState.v3Timer=0;}}

  finishQuiz_=function(){
    clearTimer();if(quizState.busy||quizState.completed)return;quizState.busy=true;renderQuizLoading_();
    const payload={userId:quizState.userId,quizGameId:quizState.game.gameId,totalAnswerTimeMs:quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS'?0:Math.round(quizState.totalAnswerTimeMs||0)};
    if(quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS')payload.awards=quizState.awards;else payload.answers=quizState.answers;
    google.script.run.withSuccessHandler(function(result){quizState.busy=false;quizState.completed=true;quizState.screen='result';renderQuizResult_(result.scoreboard||[]);}).withFailureHandler(quizFailure_).submitQuizResult(payload);
  };

  renderQuizResult_=function(scoreboard){
    clearTimer();const host=quizHost_(),game=quizState.game;if(!host)return;scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    const showTime=!(game&&game.mode==='OFFLINE'&&game.genre==='LYRICS');
    const rows=scoreboard.length?scoreboard.map(function(row,index){const rank=row.rank||index+1,name=row.displayName||quizUserName_(row.userId)||row.userId||'',time=Number(row.totalAnswerTimeMs||0);return '<div class="quiz-ranking-row"><strong>'+rank+'</strong><span>'+quizEscape_(name)+'</span><b>'+Number(row.score||0)+' pt</b>'+(showTime?'<small class="quiz-v3-score-time">'+formatQuizTimeV3_(time)+'</small>':'')+'</div>';}).join(''):'<p class="quiz-muted">まだ結果がありません。</p>';
    host.innerHTML=(game&&game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><p class="quiz-kicker">RESULT</p><h2 class="quiz-panel-title">SCOREBOARD</h2><div class="quiz-ranking">'+rows+'</div><div class="quiz-actions">'+(game&&game.mode==='ONLINE'?'<button class="quiz-action" onclick="refreshQuizRankingV3_()">ランキングを更新</button>':'')+'<button class="quiz-action is-primary" onclick="returnQuizTopV3_()">QUIZ TOP</button><button class="quiz-action" onclick="navigateTo(\'lab\')">LAB</button></div></section>';
  };

  window.refreshQuizRankingV3_=function(){if(!quizState.game||quizState.busy)return;quizState.busy=true;google.script.run.withSuccessHandler(function(rows){quizState.busy=false;renderQuizResult_(rows||[]);}).withFailureHandler(quizFailure_).getQuizScoreboard(quizState.userId,quizState.game.gameId);};
  window.returnQuizTopV3_=function(){clearTimer();if(legacyReturnTop){legacyReturnTop();}else{quizResetState_();renderQuizSetup_();}};
  function formatQuizTimeV3_(ms){if(!ms)return '—';return (ms/1000).toFixed(2)+'s';}

  abandonQuiz_=function(){clearTimer();if(legacyAbandon)return legacyAbandon();};
})();
</script>
<script>
(function(){
  function formatTimeV3Final_(ms){return ms>0?(ms/1000).toFixed(2)+'s':'—';}
  function rankingSignatureV3Final_(rows){return JSON.stringify((rows||[]).map(function(row){return [row.userId||'',Number(row.score||0),Number(row.answerTimeMs||row.totalAnswerTimeMs||0),row.displayName||''];}));}
  function rankingRowsV3Final_(scoreboard,scoreOnly){
    scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    let previous=null,previousRank=0;
    const rows=scoreboard.map(function(row,index){
      const time=Number(row.answerTimeMs||row.totalAnswerTimeMs||0);
      const tieKey=scoreOnly?String(Number(row.score||0)):String(Number(row.score||0))+'|'+String(time);
      const rank=previous===tieKey?previousRank:index+1;
      previous=tieKey;previousRank=rank;
      const name=row.displayName||quizUserName_(row.userId)||row.userId||'';
      return '<div class="quiz-ranking-row"><strong>'+rank+'</strong><span>'+quizEscape_(name)+'</span><b>'+Number(row.score||0)+' pt</b>'+(!scoreOnly?'<small class="quiz-v3-score-time">'+formatTimeV3Final_(time)+'</small>':'')+'</div>';
    }).join('');
    return rows||'<p class="quiz-muted">まだ結果がありません。</p>';
  }
  function stopRankingAutoRefreshV3Final_(){
    if(quizState.v3RankingTimer){clearInterval(quizState.v3RankingTimer);quizState.v3RankingTimer=0;}
  }
  function startRankingAutoRefreshV3Final_(){
    stopRankingAutoRefreshV3Final_();
    const game=quizState.game;
    if(!game||game.mode!=='ONLINE'||quizState.screen!=='result')return;
    quizState.v3RankingTimer=setInterval(function(){
      if(!quizState.game||quizState.screen!=='result'||quizState.game.gameId!==game.gameId){stopRankingAutoRefreshV3Final_();return;}
      const host=document.getElementById('quizRankingV3');
      if(!host){stopRankingAutoRefreshV3Final_();return;}
      google.script.run.withSuccessHandler(function(rows){
        if(!quizState.game||quizState.screen!=='result'||quizState.game.gameId!==game.gameId)return;
        rows=Array.isArray(rows)?rows:[];
        const signature=rankingSignatureV3Final_(rows);
        if(signature===quizState.v3RankingSignature)return;
        quizState.v3RankingSignature=signature;
        host.innerHTML=rankingRowsV3Final_(rows,false);
      }).withFailureHandler(function(){}).getQuizScoreboard(quizState.userId,game.gameId);
    },4000);
  }
  renderQuizResult_=function(scoreboard){
    stopRankingAutoRefreshV3Final_();
    const host=quizHost_(),game=quizState.game;if(!host)return;scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    const scoreOnly=!!(game&&game.mode==='OFFLINE'&&game.genre==='LYRICS');
    quizState.v3RankingSignature=rankingSignatureV3Final_(scoreboard);
    host.innerHTML=(game&&game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><h2 class="quiz-panel-title">ランキング</h2><div id="quizRankingV3" class="quiz-ranking">'+rankingRowsV3Final_(scoreboard,scoreOnly)+'</div><div class="quiz-actions"><button class="quiz-action is-primary" onclick="returnQuizTopV3_()">トップに戻る</button><button class="quiz-action" onclick="navigateTo(\'home\')">HOMEへ</button></div></section>';
    startRankingAutoRefreshV3Final_();
  };
  window.refreshQuizRankingV3_=function(){
    if(!quizState.game||quizState.game.mode!=='ONLINE'||quizState.screen!=='result')return;
    google.script.run.withSuccessHandler(function(rows){
      const host=document.getElementById('quizRankingV3');if(!host)return;
      rows=Array.isArray(rows)?rows:[];
      const signature=rankingSignatureV3Final_(rows);
      if(signature===quizState.v3RankingSignature)return;
      quizState.v3RankingSignature=signature;
      host.innerHTML=rankingRowsV3Final_(rows,false);
    }).withFailureHandler(function(){}).getQuizScoreboard(quizState.userId,quizState.game.gameId);
  };
  const baseReturnTopFinal_=window.returnQuizTopV3_;
  window.returnQuizTopV3_=function(){stopRankingAutoRefreshV3Final_();return baseReturnTopFinal_.apply(this,arguments);};
})();
</script>

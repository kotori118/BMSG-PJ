<script>
(function(){
  const legacyAbandon=typeof abandonQuiz_==='function'?abandonQuiz_:null;
  const legacyReturnTop=typeof returnQuizTop_==='function'?returnQuizTop_:null;
  function clearTimer(){if(quizState.v3Timer){clearInterval(quizState.v3Timer);quizState.v3Timer=0;}}

  finishQuiz_=function(){
    clearTimer();if(quizState.busy||quizState.completed)return;quizState.busy=true;renderQuizLoading_();
    const payload={userId:quizState.userId,quizGameId:quizState.game.gameId,totalAnswerTimeMs:quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS'?0:Math.round(quizState.totalAnswerTimeMs||0)};
    if(quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS')payload.awards=quizState.awards;else payload.answers=quizState.answers;
    google.script.run.withSuccessHandler(function(result){quizState.busy=false;quizState.completed=true;quizState.screen='result';renderQuizResult_(result.scoreboard||[]);}).withFailureHandler(quizFailure_).submitQuizResult(payload);
  };

  window.returnQuizTopV3_=function(){clearTimer();if(legacyReturnTop){legacyReturnTop();}else{quizResetState_();renderQuizSetup_();}};

  abandonQuiz_=function(){clearTimer();if(legacyAbandon)return legacyAbandon();};
})();
</script>
<script>
(function(){
  function formatQuizResultTime_(ms){return ms>0?(ms/1000).toFixed(2)+'s':'—';}
  function quizRankingSignature_(rows){return JSON.stringify((rows||[]).map(function(row){return [row.userId||'',Number(row.score||0),Number(row.answerTimeMs||row.totalAnswerTimeMs||0),row.displayName||''];}));}
  function renderQuizRankingRows_(scoreboard,scoreOnly){
    scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    let previous=null,previousRank=0;
    const rows=scoreboard.map(function(row,index){
      const time=Number(row.answerTimeMs||row.totalAnswerTimeMs||0);
      const tieKey=scoreOnly?String(Number(row.score||0)):String(Number(row.score||0))+'|'+String(time);
      const rank=previous===tieKey?previousRank:index+1;
      previous=tieKey;previousRank=rank;
      const name=row.displayName||quizUserName_(row.userId)||row.userId||'';
      return '<div class="quiz-ranking-row"><strong class="quiz-ranking-rank">'+rank+'位</strong><span class="quiz-ranking-name">'+quizEscape_(name)+'</span><b class="quiz-ranking-points">'+Number(row.score||0)+'pt</b>'+(!scoreOnly?'<small class="quiz-v3-score-time quiz-ranking-time">'+formatQuizResultTime_(time)+'</small>':'')+'</div>';
    }).join('');
    return rows||'<p class="quiz-muted">まだ結果がありません。</p>';
  }
  function stopQuizRankingAutoRefresh_(){
    if(quizState.v3RankingTimer){clearInterval(quizState.v3RankingTimer);quizState.v3RankingTimer=0;}
  }
  function startQuizRankingAutoRefresh_(){
    stopQuizRankingAutoRefresh_();
    const game=quizState.game;
    if(!game||game.mode!=='ONLINE'||quizState.screen!=='result')return;
    quizState.v3RankingTimer=setInterval(function(){
      if(!quizState.game||quizState.screen!=='result'||quizState.game.gameId!==game.gameId){stopQuizRankingAutoRefresh_();return;}
      const host=document.getElementById('quizRankingV3');
      if(!host){stopQuizRankingAutoRefresh_();return;}
      google.script.run.withSuccessHandler(function(rows){
        if(!quizState.game||quizState.screen!=='result'||quizState.game.gameId!==game.gameId)return;
        rows=Array.isArray(rows)?rows:[];
        const signature=quizRankingSignature_(rows);
        if(signature===quizState.v3RankingSignature)return;
        quizState.v3RankingSignature=signature;
        host.innerHTML=renderQuizRankingRows_(rows,false);
      }).withFailureHandler(function(){}).getQuizScoreboard(quizState.userId,game.gameId);
    },4000);
  }
  renderQuizResult_=function(scoreboard){
    stopQuizRankingAutoRefresh_();
    const host=quizHost_(),game=quizState.game;if(!host)return;scoreboard=Array.isArray(scoreboard)?scoreboard:[];
    const scoreOnly=!!(game&&game.mode==='OFFLINE'&&game.genre==='LYRICS');
    quizState.v3RankingSignature=quizRankingSignature_(scoreboard);
    host.innerHTML=(game&&game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><h2 class="quiz-panel-title">ランキング</h2><div id="quizRankingV3" class="quiz-ranking">'+renderQuizRankingRows_(scoreboard,scoreOnly)+'</div><div class="quiz-actions"><button class="quiz-action is-primary" onclick="returnQuizTopV3_()">トップに戻る</button><button class="quiz-action" onclick="navigateTo(\'home\')">HOMEへ</button></div></section>';
    startQuizRankingAutoRefresh_();
  };
  window.refreshQuizRankingV3_=function(){
    if(!quizState.game||quizState.game.mode!=='ONLINE'||quizState.screen!=='result')return;
    google.script.run.withSuccessHandler(function(rows){
      const host=document.getElementById('quizRankingV3');if(!host)return;
      rows=Array.isArray(rows)?rows:[];
      const signature=quizRankingSignature_(rows);
      if(signature===quizState.v3RankingSignature)return;
      quizState.v3RankingSignature=signature;
      host.innerHTML=renderQuizRankingRows_(rows,false);
    }).withFailureHandler(function(){}).getQuizScoreboard(quizState.userId,quizState.game.gameId);
  };
  const baseReturnQuizTop_=window.returnQuizTopV3_;
  window.returnQuizTopV3_=function(){stopQuizRankingAutoRefresh_();return baseReturnQuizTop_.apply(this,arguments);};
})();
</script>

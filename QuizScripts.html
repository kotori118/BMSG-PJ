<script>
  const quizState={ready:false,busy:false,userId:'',users:[],courses:[],screen:'setup',settings:{mode:'OFFLINE',genre:'LYRICS',course:'BE:FIRST',difficulty:'NORMAL'},selectedPlayers:[],game:null,index:0,stage:'question',answers:[],awards:[],selected:null,startedAt:0,completed:false};

  function renderQuiz(){const template=document.getElementById('quizPageTemplate');return template?template.innerHTML:'';}

  function quizResetState_(){quizState.ready=false;quizState.busy=false;quizState.screen='setup';quizState.game=null;quizState.index=0;quizState.stage='question';quizState.answers=[];quizState.awards=[];quizState.selected=null;quizState.startedAt=0;quizState.completed=false;}
  function quizHost_(){return document.getElementById('quizApp');}
  function renderQuizLoading_(){const host=quizHost_();if(host)host.innerHTML='<div class="quiz-panel">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading('LOADING QUIZ...','#9cecff'):'LOADING...')+'</div>';}
  function renderQuizNeedsUser_(){const host=quizHost_();if(host)host.innerHTML='<section class="quiz-panel"><p class="quiz-kicker">PLAYER</p><h2 class="quiz-panel-title">USERを選択</h2><p class="quiz-muted">QUIZを始めるUserを選んでください。</p><div class="quiz-actions"><button class="quiz-action is-primary" onclick="openUserChooser(true)">USER SELECT</button></div></section>';}

  function quizSetting_(title,options,current,key,extra){return '<section class="quiz-setting"><p class="quiz-setting-title">'+quizEscape_(title)+'</p><div class="quiz-options '+(extra||'')+'">'+options.map(function(option){return '<button type="button" class="quiz-choice '+(current===option[0]?'is-selected':'')+'" onclick="setQuizSetting_(\''+key+'\',\''+quizArg_(option[0])+'\')">'+quizEscape_(option[1])+'</button>';}).join('')+'</div></section>';}
  function setQuizSetting_(key,value){quizState.settings[key]=decodeURIComponent(value);if(key==='mode'||key==='genre'){if(!(quizState.settings.mode==='OFFLINE'&&quizState.settings.genre==='LYRICS'))quizState.selectedPlayers=[quizState.userId];}renderQuizSetup_();}

  function setQuizRoomUrl_(roomId){const params={page:'quiz',room:String(roomId)};google.script.history.replace(params,params,'');}

  function renderQuizQuestion_(){
    const game=quizState.game,question=game&&game.questions&&game.questions[quizState.index];if(!question)return finishQuiz_();
    const host=quizHost_();if(!host)return;
    const progress=Math.round((quizState.index/game.questions.length)*100);
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<div class="quiz-progress" aria-label="進行度"><span style="width:'+progress+'%"></span></div><section class="quiz-panel"><div class="quiz-question-head"><p class="quiz-step-label">'+quizEscape_(quizGenreLabel_(game.genre))+' / '+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</p><span class="quiz-question-count">'+String(quizState.index+1).padStart(2,'0')+' / 10</span></div><div id="quizQuestionBody">'+renderQuizQuestionBody_(question)+'</div><div class="quiz-actions"><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">諦める</button><button id="quizNextButton" class="quiz-action is-primary" onclick="advanceQuiz_()" disabled>次へ</button></div></section>';
  }

  function renderQuizQuestionBody_(question){
    const game=quizState.game;
    if(game.genre==='PROFILE')return renderProfileQuizBody_(question);
    if(game.mode==='OFFLINE')return renderOfflineLyricsBody_(question);
    return renderOnlineLyricsBody_(question);
  }

  function renderProfileQuizBody_(question){return '<p class="quiz-question-text">'+quizEscape_(question.text)+'</p><div class="quiz-answer-list">'+question.choices.map(function(choice){return '<button class="quiz-answer" onclick="answerProfileQuiz_(this,\''+quizArg_(choice.value)+'\')">'+quizEscape_(choice.label)+'</button>';}).join('')+'</div><div id="quizFeedback"></div>';}
  function answerProfileQuiz_(button,encoded){if(quizState.stage==='answered')return;const value=decodeURIComponent(encoded),question=quizState.game.questions[quizState.index],correct=String(value)===String(question.correct.value);quizState.answers[quizState.index]={value:value};quizState.stage='answered';document.querySelectorAll('.quiz-answer').forEach(function(item){item.disabled=true;const itemValue=decodeURIComponent((item.getAttribute('onclick').match(/'([^']+)'\)$/)||[])[1]||'');if(String(itemValue)===String(question.correct.value))item.classList.add('is-correct');});button.classList.add(correct?'is-correct':'is-wrong');document.getElementById('quizFeedback').innerHTML='<div class="quiz-feedback">'+(correct?'CORRECT':'ANSWER：'+quizEscape_(question.correct.value))+'</div>';enableQuizNext_();}

  function renderOnlineLyricsBody_(question){
    if(quizState.stage==='question'||quizState.stage==='song')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><p class="quiz-setting-title">曲名を選択</p><div class="quiz-answer-list">'+question.choices.songs.map(function(choice){return '<button class="quiz-answer" onclick="answerOnlineLyricsSong_(\''+quizArg_(choice.value)+'\')">'+quizEscape_(choice.label)+'</button>';}).join('')+'</div>';
    if(quizState.stage==='singer')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><p class="quiz-setting-title">歌唱Memberを選択</p><div class="quiz-answer-list">'+question.choices.singers.map(function(choice){return '<button class="quiz-answer" onclick="answerOnlineLyricsSinger_(\''+quizArg_(choice.value)+'\')">'+quizEscape_(choice.label)+'</button>';}).join('')+'</div>';
    const answer=quizState.answers[quizState.index];return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-feedback">曲名：'+quizEscape_(question.source.title)+'<br>歌唱：'+quizEscape_((question.source.singerNames||[]).join(' / '))+'<br><small>'+(answer.songCorrect?'曲名 +1':'曲名 0')+' / '+(answer.singerCorrect?'歌唱 +1':'歌唱 0')+'</small></div>'+renderQuizLyricsLink_(question);
  }
  function answerOnlineLyricsSong_(encoded){const value=decodeURIComponent(encoded);quizState.answers[quizState.index]={songId:value};quizState.stage='singer';replaceQuizBody_();}
  function answerOnlineLyricsSinger_(encoded){const value=decodeURIComponent(encoded),question=quizState.game.questions[quizState.index],answer=quizState.answers[quizState.index];answer.singerValue=value;answer.songCorrect=String(answer.songId)===String(question.correct.songId);answer.singerCorrect=String(value)===String(question.correct.singerValue);quizState.stage='answered';replaceQuizBody_();enableQuizNext_();}

  function renderOfflineLyricsBody_(question){
    if(quizState.stage==='question')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><button class="quiz-action is-primary" style="width:100%" onclick="revealOfflineLyrics_()">答えを見る</button>';
    if(quizState.stage==='songAward')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-feedback">曲名：'+quizEscape_(question.source.title)+'</div><div class="quiz-award-step"><p class="quiz-setting-title">曲名の正解者</p>'+renderQuizAwardButtons_('song')+'</div>';
    if(quizState.stage==='singerAward')return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-feedback">歌唱：'+quizEscape_((question.source.singerNames||[]).join(' / '))+'</div><div class="quiz-award-step"><p class="quiz-setting-title">歌唱Memberの正解者</p>'+renderQuizAwardButtons_('singer')+'</div>';
    const award=quizState.awards[quizState.index]||{};return '<p class="quiz-question-text is-lyrics">'+quizEscape_(question.text)+'</p><div class="quiz-feedback">曲名：'+quizEscape_(question.source.title)+'<br>歌唱：'+quizEscape_((question.source.singerNames||[]).join(' / '))+'<br><small>'+quizEscape_(quizUserName_(award.songWinner)||'正解者なし')+' / '+quizEscape_(quizUserName_(award.singerWinner)||'正解者なし')+'</small></div>'+renderQuizLyricsLink_(question);
  }
  function revealOfflineLyrics_(){quizState.stage='songAward';replaceQuizBody_();}
  function renderQuizAwardButtons_(kind){const buttons=quizState.game.players.map(function(id){return '<button class="quiz-award" onclick="awardOfflineLyrics_(\''+kind+'\',\''+quizArg_(id)+'\')">'+quizEscape_(quizUserName_(id))+'</button>';});buttons.push('<button class="quiz-award is-none" onclick="awardOfflineLyrics_(\''+kind+'\',\'\')">なし</button>');return '<div class="quiz-award-grid">'+buttons.join('')+'</div>';}
  function awardOfflineLyrics_(kind,encoded){const id=encoded?decodeURIComponent(encoded):'';if(!quizState.awards[quizState.index])quizState.awards[quizState.index]={songWinner:'',singerWinner:''};if(kind==='song'){quizState.awards[quizState.index].songWinner=id;quizState.stage='singerAward';}else{quizState.awards[quizState.index].singerWinner=id;quizState.stage='answered';}replaceQuizBody_();if(quizState.stage==='answered')enableQuizNext_();}

  function replaceQuizBody_(){const body=document.getElementById('quizQuestionBody'),question=quizState.game.questions[quizState.index];if(body)body.innerHTML=renderQuizQuestionBody_(question);}
  function enableQuizNext_(){const button=document.getElementById('quizNextButton');if(button){button.disabled=false;button.textContent=quizState.index>=9?'結果を見る':'次へ';}}
  function advanceQuiz_(){if(quizState.stage!=='answered')return;if(quizState.index>=quizState.game.questions.length-1){finishQuiz_();return;}quizState.index+=1;quizState.stage='question';quizState.selected=null;renderQuizQuestion_();scrollAppToTop('smooth');}

  function finishQuiz_(){if(quizState.busy||quizState.completed)return;quizState.busy=true;renderQuizLoading_();const payload={userId:quizState.userId,quizGameId:quizState.game.gameId,totalAnswerTimeMs:Date.now()-quizState.startedAt};if(quizState.game.mode==='OFFLINE'&&quizState.game.genre==='LYRICS')payload.awards=quizState.awards;else payload.answers=quizState.answers;google.script.run.withSuccessHandler(function(result){quizState.busy=false;quizState.completed=true;quizState.screen='result';renderQuizResult_(result.scoreboard||[]);}).withFailureHandler(quizFailure_).submitQuizResult(payload);}

  function renderQuizResult_(scoreboard){const game=quizState.game,host=quizHost_();if(!host)return;const max=game.genre==='LYRICS'?20:10;host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel"><p class="quiz-kicker">RESULT</p><h2 class="quiz-panel-title">SCORE</h2><div class="quiz-score-list">'+(scoreboard.length?scoreboard.map(function(row){return '<div class="quiz-score-row"><span class="quiz-score-rank">#'+row.rank+'</span><strong class="quiz-score-name">'+quizEscape_(row.displayName)+'</strong><span class="quiz-score-points">'+row.score+'<small> / '+max+'</small></span></div>';}).join(''):'<div class="quiz-empty-score">まだ回答者がいません。</div>')+'</div><div class="quiz-actions">'+(game.roomId?'<button class="quiz-action" onclick="refreshQuizResult_()">更新</button>':'')+'<button class="quiz-action is-primary" onclick="returnQuizTop_()">QUIZ TOP</button></div></section>';}
  function refreshQuizResult_(){if(quizState.busy)return;quizState.busy=true;google.script.run.withSuccessHandler(function(scoreboard){quizState.busy=false;renderQuizResult_(scoreboard||[]);}).withFailureHandler(quizFailure_).getQuizScoreboard(quizState.userId,quizState.game.gameId);}

  function renderQuizRoomBanner_(roomId){return '<div class="quiz-room-banner"><span><small class="quiz-room-label">ROOM ID</small><br><span class="quiz-muted">同じ問題でプレイ</span></span><strong>'+quizEscape_(roomId)+'</strong></div>';}
  function renderQuizLyricsLink_(question){return '<button type="button" class="quiz-lyrics-link" onclick="openQuizLyrics_(\''+quizArg_(question.source.songId)+'\',\''+quizArg_(question.source.artist)+'\')">全文歌詞を見る ›</button>';}
  function openQuizLyrics_(songId,artist){const url=new URL(window.location.href);url.search='';url.searchParams.set('page','lyrics');url.searchParams.set('song',decodeURIComponent(songId));url.searchParams.set('group',decodeURIComponent(artist));window.open(url.toString(),'_blank','noopener');}

  function abandonQuiz_(){if(!quizState.game||quizState.completed)return returnQuizTop_();if(!window.confirm('このクイズを諦めますか？\n途中の成績は保存されません。'))return;const id=quizState.game.gameId;quizState.completed=true;google.script.run.withFailureHandler(function(){}).abandonQuizGame(quizState.userId,id);returnQuizTop_();}
  function returnQuizTop_(){quizState.game=null;quizState.completed=true;google.script.history.replace({page:'quiz'},{page:'quiz'},'');renderQuizSetup_();scrollAppToTop('smooth');}
  function quizBackToLab(){if(!quizCanLeave_())return;navigateTo('lab');}
  function quizCanLeave_(){if(currentRoute!=='quiz'||!quizState.game||quizState.completed||quizState.screen==='result')return true;if(!window.confirm('このクイズを諦めますか？\n途中の成績は保存されません。'))return false;const id=quizState.game.gameId;quizState.completed=true;google.script.run.withFailureHandler(function(){}).abandonQuizGame(quizState.userId,id);return true;}

  function quizFailure_(error){quizState.busy=false;const message=String(error&&error.message||error||'クイズの処理に失敗しました。');const host=quizHost_();if(host)host.innerHTML='<section class="quiz-panel"><p class="quiz-kicker">ERROR</p><h2 class="quiz-panel-title">読み込みに失敗しました</h2><p class="quiz-muted">'+quizEscape_(message)+'</p><div class="quiz-actions"><button class="quiz-action is-primary" onclick="initQuizPage({})">RETRY</button><button class="quiz-action" onclick="navigateTo(\'lab\')">BACK</button></div></section>';quizNotify_(message);}
  function quizNotify_(message){if(typeof showToast==='function')showToast(message);}
  function quizUserName_(id){const user=quizState.users.find(function(item){return item.userId===id;});return user?user.displayName:'';}
  function quizGenreLabel_(value){return value==='LYRICS'?'歌詞':'プロフィール';}
  function quizDifficultyLabel_(value){return value==='NORMAL'?'普通':'上級';}
  function quizArg_(value){return encodeURIComponent(String(value==null?'':value));}
  function quizEscape_(value){return typeof escapeHtml==='function'?escapeHtml(value):String(value);}
</script>

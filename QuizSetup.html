<script>
(function(){
  function clearTimer(){if(quizState.v3Timer){clearInterval(quizState.v3Timer);quizState.v3Timer=0;}}
  function resetRuntime(){clearTimer();quizState.totalAnswerTimeMs=0;quizState.questionStartedAt=0;quizState.timeRecorded=false;quizState.songAttempts=0;quizState.v3Feedback='';}

  window.openQuizRoomJoinV3_=function(){
    clearTimer();quizState.screen='join';const host=quizHost_();if(!host)return;
    host.innerHTML='<section class="quiz-panel quiz-v3-room-join"><p class="quiz-kicker">JOIN ROOM</p><h2 class="quiz-panel-title">ルームに参加する</h2><div class="quiz-v3-room-input-row"><input id="quizRoomInputV3" class="quiz-room-input" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="4桁のルームID"><button class="quiz-action is-primary" onclick="joinQuizRoomV3_()">参加</button></div><div><p class="quiz-setting-title">最新のルーム</p><div id="quizRecentRoomsV3" class="quiz-v3-recent">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading(false,'#9cecff'):'LOADING...')+'</div></div><div class="quiz-actions"><button class="quiz-action" onclick="renderQuizSetup_()">戻る</button></div></section>';
    google.script.run.withSuccessHandler(renderQuizRecentRoomsV3_).withFailureHandler(function(){const el=document.getElementById('quizRecentRoomsV3');if(el)el.innerHTML='<p class="quiz-muted">ルームを読み込めませんでした。</p>';}).getRecentQuizRooms(quizState.userId,5);
  };

  window.joinQuizRoomV3_=function(roomId){
    const input=document.getElementById('quizRoomInputV3');const id=String(roomId||input&&input.value||'').replace(/\D/g,'');
    if(!/^\d{4}$/.test(id)){quizNotify_('4桁のルームIDを入力してください。');return;}if(quizState.busy)return;
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){quizState.busy=false;setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);}).withFailureHandler(quizFailure_).joinQuizRoom(quizState.userId,id);
  };

  window.renderQuizRecentRoomsV3_=function(rooms){
    const host=document.getElementById('quizRecentRoomsV3');if(!host)return;rooms=Array.isArray(rooms)?rooms:[];
    if(!rooms.length){host.innerHTML='<p class="quiz-muted">参加できるルームはまだありません。</p>';return;}
    host.innerHTML=rooms.map(function(room){return '<article class="quiz-v3-room-card"><div class="quiz-v3-room-card-head"><div><div class="quiz-v3-room-id">'+quizEscape_(room.roomId)+'</div><div class="quiz-v3-room-meta">'+quizEscape_(quizGenreLabel_(room.genre))+' / '+quizEscape_(room.course)+' / '+quizEscape_(quizDifficultyLabel_(room.difficulty))+'</div></div><button class="quiz-action is-primary" onclick="joinQuizRoomV3_(\''+quizArg_(room.roomId)+'\')">参加</button></div>'+(room.answeredCount?'<div class="quiz-v3-room-meta">回答済み '+room.answeredCount+'人</div>':'')+'</article>';}).join('');
  };

  startQuizClientGame_=function(game){
    clearTimer();quizState.game=game;quizState.index=0;quizState.stage='ready';quizState.answers=[];quizState.awards=[];quizState.selected=null;quizState.completed=!!game.hasAnswered;resetRuntime();
    if(game.hasAnswered){quizState.screen='result';renderQuizResult_(game.scoreboard||[]);return;}
    quizState.screen='ready';renderQuizReadyV3_();
  };

  window.beginQuizV3_=function(){quizState.screen='game';quizState.index=0;quizState.stage='question';quizState.totalAnswerTimeMs=0;renderQuizQuestion_();};
})();
</script>
<script>
(function(){
  function safeClearQuizTimer_(){
    if(window.quizState&&quizState.v3Timer){
      clearInterval(quizState.v3Timer);
      quizState.v3Timer=0;
    }
  }

  function quizOfflineUsers_(){
    var users=Array.isArray(window.quizState&&quizState.users)?quizState.users:[];
    if(users.length)return users;
    return [
      {userId:'U001',displayName:'ももたん'},
      {userId:'U002',displayName:'みおたん'},
      {userId:'U003',displayName:'りおたん'}
    ];
  }

  function syncOfflinePlayerButtons_(){
    var selected=Array.isArray(window.quizState&&quizState.selectedPlayers)?quizState.selectedPlayers:[];
    document.querySelectorAll('[data-quiz-offline-player]').forEach(function(button){
      var id=button.getAttribute('data-quiz-offline-player');
      var active=selected.indexOf(id)>=0;
      button.classList.toggle('is-selected',active);
      button.setAttribute('aria-pressed',active?'true':'false');
    });
    var count=document.getElementById('quizOfflinePlayerCount');
    if(count)count.textContent=selected.length+'人選択中';
  }

  function renderQuizBootstrapTimeout_(){
    var host=quizHost_();
    if(!host)return;
    host.innerHTML='<section class="quiz-panel"><p class="quiz-v3-note">読み込みに時間がかかっています。もう一度お試しください。</p><div class="quiz-actions"><button class="quiz-action is-primary" onclick="initQuizPage({})">再読み込み</button><button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
  }

  function renderQuizBootstrapError_(error){
    var host=quizHost_();
    if(!host)return;
    var message=error&&error.message?String(error.message):'クイズを読み込めませんでした。';
    host.innerHTML='<section class="quiz-panel"><p class="quiz-v3-note">'+quizEscape_(message)+'</p><div class="quiz-actions"><button class="quiz-action is-primary" onclick="initQuizPage({})">再読み込み</button><button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
  }

  function loadQuizBootstrapInBackground_(uid){
    try{
      google.script.run
        .withSuccessHandler(function(data){
          quizState.ready=true;
          quizState.users=data&&data.users?data.users:quizState.users;
          quizState.courses=data&&data.courses?data.courses:quizState.courses;
        })
        .withFailureHandler(function(){
          /* Setup already has safe local fallbacks. Keep the page usable. */
        })
        .getQuizBootstrap(uid,'');
    }catch(error){
      /* Setup already rendered. Bootstrap refresh is optional on normal entry. */
    }
  }

  window.initQuizPage=function(params){
    params=params||{};
    var requestedRoom=String(params.room||'').replace(/\D/g,'');
    try{
      safeClearQuizTimer_();
      if(typeof quizResetState_==='function')quizResetState_();
      var uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
      if(!uid){
        var emptyHost=quizHost_();
        if(emptyHost)emptyHost.innerHTML='<section class="quiz-panel"><p class="quiz-v3-note">利用者を選択してください。</p></section>';
        if(typeof openUserChooser==='function')openUserChooser(true);
        return;
      }
      quizState.userId=uid;
      quizState.selectedPlayers=[uid];
      quizState.busy=false;

      /* Normal QUIZ entry must never wait for Spreadsheet/API bootstrap. */
      if(!requestedRoom){
        quizState.ready=true;
        renderQuizSetup_();
        loadQuizBootstrapInBackground_(uid);
        return;
      }

      /* Direct ROOM entry still needs the server, so protect the full path. */
      renderQuizLoading_();
      var settled=false;
      var timer=setTimeout(function(){
        if(settled)return;
        settled=true;
        quizState.busy=false;
        renderQuizBootstrapTimeout_();
      },10000);
      google.script.run
        .withSuccessHandler(function(data){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          quizState.ready=true;
          quizState.users=data&&data.users?data.users:[];
          quizState.courses=data&&data.courses?data.courses:[];
          if(data&&data.room)startQuizClientGame_(data.room);
          else renderQuizSetup_();
        })
        .withFailureHandler(function(error){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          quizState.busy=false;
          renderQuizBootstrapError_(error);
        })
        .getQuizBootstrap(uid,requestedRoom);
    }catch(error){
      quizState.busy=false;
      renderQuizBootstrapError_(error);
    }
  };

  window.renderQuizPlayerSelect_=function(){
    var users=quizOfflineUsers_();
    var selected=Array.isArray(quizState.selectedPlayers)?quizState.selectedPlayers:[];
    return '<div class="quiz-setting quiz-offline-player-select">'+
      '<div class="quiz-setting-title">プレイヤー（2〜3人） <span id="quizOfflinePlayerCount" class="quiz-offline-player-count">'+selected.length+'人選択中</span></div>'+
      '<div class="quiz-player-grid">'+users.map(function(user){
        var id=String(user.userId||'');
        var active=selected.indexOf(id)>=0;
        return '<button type="button" class="quiz-player'+(active?' is-selected':'')+'" data-quiz-offline-player="'+quizEscape_(id)+'" aria-pressed="'+(active?'true':'false')+'" onclick="toggleQuizPlayer_(\''+quizEscape_(id)+'\');return false;">'+quizEscape_(user.displayName||id)+'</button>';
      }).join('')+'</div></div>';
  };

  window.toggleQuizPlayer_=function(userId){
    var id=String(userId||'');
    if(!id)return false;
    if(!Array.isArray(quizState.selectedPlayers))quizState.selectedPlayers=[];
    var selected=quizState.selectedPlayers.slice();
    var index=selected.indexOf(id);
    if(index>=0)selected.splice(index,1);
    else{
      if(selected.length>=3){
        if(typeof quizNotify_==='function')quizNotify_('選べるのは3人までです。');
        return false;
      }
      selected.push(id);
    }
    quizState.selectedPlayers=selected;
    syncOfflinePlayerButtons_();
    return false;
  };

  renderQuizSetup_=function(){
    safeClearQuizTimer_();quizState.screen='setup';quizState.completed=false;
    var s=quizState.settings;
    if(s.genre==='PROFILE')s.course='ALL';
    var offlineLyrics=s.mode==='OFFLINE'&&s.genre==='LYRICS',host=quizHost_();if(!host)return;
    var courseHtml=s.genre==='PROFILE'?'':quizSetting_('コース',(quizState.courses.length?quizState.courses:[
      {value:'BE:FIRST',label:'BE:FIRST'},{value:'MAZZEL',label:'MAZZEL'},{value:'STARGLOW',label:'STARGLOW'},
      {value:'HANA',label:'HANA'},{value:'UNIT',label:'ユニット'},{value:'ALL',label:'全部'}
    ]).map(function(x){return[x.value,x.label];}),s.course,'course','is-course');
    host.innerHTML='<section class="quiz-panel"><div class="quiz-settings">'+
      quizSetting_('モード',[['OFFLINE','オフライン'],['ONLINE','オンライン']],s.mode,'mode')+
      quizSetting_('ジャンル',[['LYRICS','歌詞'],['PROFILE','プロフィール']],s.genre,'genre')+
      courseHtml+
      quizSetting_('難易度',[['NORMAL','普通'],['ADVANCED','上級']],s.difficulty,'difficulty')+
      (offlineLyrics?renderQuizPlayerSelect_():'')+'</div><div class="quiz-actions">'+
      (s.mode==='ONLINE'?'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">ルームを作る</button><button class="quiz-action" onclick="openQuizRoomJoinV3_()">ルームに参加する</button>':'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">開始</button>')+
      '<button class="quiz-action" onclick="navigateTo(\'lab\')">戻る</button></div></section>';
  };

  createQuizFromSetup_=function(){
    if(quizState.busy)return;
    var s=quizState.settings;
    if(s.genre==='PROFILE')s.course='ALL';
    if(s.mode==='OFFLINE'&&s.genre==='LYRICS'&&(!Array.isArray(quizState.selectedPlayers)||quizState.selectedPlayers.length<2||quizState.selectedPlayers.length>3)){
      quizNotify_('2〜3人を選択してください。');return;
    }
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){
      quizState.busy=false;if(game.roomId)setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);
    }).withFailureHandler(quizFailure_).createQuizGame({
      userId:quizState.userId,mode:s.mode,genre:s.genre,course:s.course,difficulty:s.difficulty,playerUserIds:quizState.selectedPlayers
    });
  };

  window.renderQuizReadyV3_=function(){
    var game=quizState.game,host=quizHost_();if(!host||!game)return;
    var items=game.genre==='LYRICS'
      ? ['「開始」を押すと1問目が始まります','曲名の回答時間は30秒です','問題生成や読み込み時間は回答時間に含まれません']
      : ['「開始」を押すと1問目が始まります','1問の回答時間は20秒です','問題生成や読み込み時間は回答時間に含まれません'];
    var chips='<span class="quiz-v3-chip">'+quizEscape_(quizGenreLabel_(game.genre))+'</span>'+
      (game.genre==='PROFILE'?'':'<span class="quiz-v3-chip">'+quizEscape_(game.course)+'</span>')+
      '<span class="quiz-v3-chip">'+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</span>';
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+
      '<section class="quiz-panel quiz-v3-ready"><ul class="quiz-ready-notes">'+items.map(function(x){return '<li>'+quizEscape_(x)+'</li>';}).join('')+'</ul>'+
      '<div class="quiz-v3-ready-meta">'+chips+'</div><div class="quiz-actions">'+
      '<button class="quiz-action is-primary" onclick="beginQuizV3_()">開始</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">終了する</button></div></section>';
  };

})();
</script>

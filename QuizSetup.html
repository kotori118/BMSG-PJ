<script>
(function(){
  function clearTimer(){if(quizState.v3Timer){clearInterval(quizState.v3Timer);quizState.v3Timer=0;}}
  function resetRuntime(){clearTimer();quizState.totalAnswerTimeMs=0;quizState.questionStartedAt=0;quizState.timeRecorded=false;quizState.songAttempts=0;quizState.v3Feedback='';}

  initQuizPage=function(params){
    clearTimer();quizResetState_();resetRuntime();
    const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';
    if(!uid){renderQuizNeedsUser_();if(typeof openUserChooser==='function')openUserChooser(true);return;}
    quizState.userId=uid;quizState.selectedPlayers=[uid];renderQuizLoading_();
    google.script.run.withSuccessHandler(function(data){
      quizState.ready=true;quizState.users=data.users||[];quizState.courses=data.courses||[];
      if(data.room)startQuizClientGame_(data.room);else renderQuizSetup_();
    }).withFailureHandler(quizFailure_).getQuizBootstrapV2(uid,params&&params.room?params.room:'');
  };

  renderQuizSetup_=function(){
    clearTimer();quizState.screen='setup';quizState.completed=false;
    const s=quizState.settings,offlineLyrics=s.mode==='OFFLINE'&&s.genre==='LYRICS',host=quizHost_();if(!host)return;
    host.innerHTML='<section class="quiz-panel"><p class="quiz-kicker">GAME SETUP</p><h2 class="quiz-panel-title">PLAY QUIZ</h2><div class="quiz-settings">'+
      quizSetting_('01 / MODE',[['OFFLINE','OFFLINE'],['ONLINE','ONLINE']],s.mode,'mode')+
      quizSetting_('02 / GENRE',[['LYRICS','歌詞'],['PROFILE','プロフィール']],s.genre,'genre')+
      quizSetting_('03 / COURSE',(quizState.courses.length?quizState.courses:[{value:'BE:FIRST',label:'BE:FIRST'},{value:'MAZZEL',label:'MAZZEL'},{value:'STARGLOW',label:'STARGLOW'},{value:'HANA',label:'HANA'},{value:'UNIT',label:'ユニット'},{value:'ALL',label:'全部'}]).map(function(x){return[x.value,x.label];}),s.course,'course','is-course')+
      quizSetting_('04 / DIFFICULTY',[['NORMAL','普通'],['ADVANCED','上級']],s.difficulty,'difficulty')+
      (offlineLyrics?renderQuizPlayerSelect_():'')+'</div><div class="quiz-actions">'+
      (s.mode==='ONLINE'?'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">ROOMを作る</button><button class="quiz-action" onclick="openQuizRoomJoinV3_()">ルームに参加する</button>':'<button class="quiz-action is-primary" onclick="createQuizFromSetup_()">START</button>')+
      '<button class="quiz-action" onclick="navigateTo(\'lab\')">BACK</button></div></section>';
  };

  createQuizFromSetup_=function(){
    if(quizState.busy)return;const s=quizState.settings;
    if(s.mode==='OFFLINE'&&s.genre==='LYRICS'&&(quizState.selectedPlayers.length<2||quizState.selectedPlayers.length>3)){quizNotify_('2〜3人を選択してください。');return;}
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){quizState.busy=false;if(game.roomId)setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);}).withFailureHandler(quizFailure_).createQuizGameV2({userId:quizState.userId,mode:s.mode,genre:s.genre,course:s.course,difficulty:s.difficulty,playerUserIds:quizState.selectedPlayers});
  };

  window.openQuizRoomJoinV3_=function(){
    clearTimer();quizState.screen='join';const host=quizHost_();if(!host)return;
    host.innerHTML='<section class="quiz-panel quiz-v3-room-join"><p class="quiz-kicker">JOIN ROOM</p><h2 class="quiz-panel-title">ルームに参加する</h2><div class="quiz-v3-room-input-row"><input id="quizRoomInputV3" class="quiz-room-input" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="4桁のROOM ID"><button class="quiz-action is-primary" onclick="joinQuizRoomV3_()">参加</button></div><div><p class="quiz-setting-title">最新のルーム</p><div id="quizRecentRoomsV3" class="quiz-v3-recent">'+(typeof renderUniverseLoading==='function'?renderUniverseLoading(false,'#9cecff'):'LOADING...')+'</div></div><div class="quiz-actions"><button class="quiz-action" onclick="renderQuizSetup_()">BACK</button></div></section>';
    google.script.run.withSuccessHandler(renderQuizRecentRoomsV3_).withFailureHandler(function(){const el=document.getElementById('quizRecentRoomsV3');if(el)el.innerHTML='<p class="quiz-muted">ルームを読み込めませんでした。</p>';}).getRecentQuizRooms(quizState.userId,5);
  };

  window.joinQuizRoomV3_=function(roomId){
    const input=document.getElementById('quizRoomInputV3');const id=String(roomId||input&&input.value||'').replace(/\D/g,'');
    if(!/^\d{4}$/.test(id)){quizNotify_('4桁のROOM IDを入力してください。');return;}if(quizState.busy)return;
    quizState.busy=true;renderQuizLoading_();
    google.script.run.withSuccessHandler(function(game){quizState.busy=false;setQuizRoomUrl_(game.roomId);startQuizClientGame_(game);}).withFailureHandler(quizFailure_).joinQuizRoomV2(quizState.userId,id);
  };

  window.renderQuizRecentRoomsV3_=function(rooms){
    const host=document.getElementById('quizRecentRoomsV3');if(!host)return;rooms=Array.isArray(rooms)?rooms:[];
    if(!rooms.length){host.innerHTML='<p class="quiz-muted">参加できるルームはまだありません。</p>';return;}
    host.innerHTML=rooms.map(function(room){return '<article class="quiz-v3-room-card"><div class="quiz-v3-room-card-head"><div><div class="quiz-v3-room-id">'+quizEscape_(room.roomId)+'</div><div class="quiz-v3-room-meta">'+quizEscape_(quizGenreLabel_(room.genre))+' / '+quizEscape_(room.course)+' / '+quizEscape_(quizDifficultyLabel_(room.difficulty))+'</div></div><button class="quiz-action is-primary" onclick="joinQuizRoomV3_(\''+quizArg_(room.roomId)+'\')">参加</button></div>'+(room.answeredCount?'<div class="quiz-v3-room-meta">回答済み '+room.answeredCount+'人</div>':'')+'</article>';}).join('');
  };

  startQuizClientGame_=function(game){
    clearTimer();quizState.game=game;quizState.index=0;quizState.stage='ready';quizState.answers=[];quizState.awards=[];quizState.selected=null;quizState.completed=!!game.hasAnswered;resetRuntime();
    if(game.hasAnswered){quizState.screen='result';renderQuizResult_(game.scoreboard||[]);return;}
    quizState.screen='ready';renderQuizReadyV3_();
  };

  window.renderQuizReadyV3_=function(){
    const game=quizState.game,host=quizHost_();if(!host||!game)return;
    const limit=game.genre==='LYRICS'?'曲名 30秒':'1問 20秒';
    host.innerHTML=(game.roomId?renderQuizRoomBanner_(game.roomId):'')+'<section class="quiz-panel quiz-v3-ready"><p class="quiz-kicker">READY</p><h2 class="quiz-panel-title">問題の準備ができました</h2><p class="quiz-muted">STARTを押した瞬間からクイズ開始。問題生成や読み込み時間は回答時間に入りません。</p><div class="quiz-v3-ready-meta"><span class="quiz-v3-chip">'+quizEscape_(quizGenreLabel_(game.genre))+'</span><span class="quiz-v3-chip">'+quizEscape_(game.course)+'</span><span class="quiz-v3-chip">'+quizEscape_(quizDifficultyLabel_(game.difficulty))+'</span><span class="quiz-v3-chip">'+limit+'</span></div><div class="quiz-actions"><button class="quiz-action is-primary" onclick="beginQuizV3_()">START</button><button class="quiz-action quiz-danger" onclick="abandonQuiz_()">諦める</button></div></section>';
  };

  window.beginQuizV3_=function(){quizState.screen='game';quizState.index=0;quizState.stage='question';quizState.totalAnswerTimeMs=0;renderQuizQuestion_();};
})();
</script>

<style>
  /* SONG GACHA settings back matches the other LYRICS white navigation buttons. */
  body.theme-light .song-gacha-back,
  .song-gacha-back{
    background:#fff!important;
    border-color:rgba(21,24,32,.14)!important;
    color:var(--ink)!important;
    box-shadow:0 5px 16px rgba(21,24,32,.035),inset 0 1px 0 rgba(255,255,255,.98)!important;
  }
</style>
<script>
  /* Speed-first KARAOKE randomization: fairness/history balancing is intentionally disabled. */
  if(typeof randomizeKaraokeLocal==='function'){
    randomizeKaraoke=function(){
      if(karaokeState.busy)return;
      randomizeKaraokeLocal();
    };
  }

  /* Keep the last verified room snapshot visible during SPA returns, then refresh silently. */
  if(typeof loadLyricsKaraokeRoom==='function'){
    loadLyricsKaraokeRoom=function(){
      const userId=requireLyricsUniverseUser();
      if(!userId){
        lyricsState.karaokeRoomReady=true;
        lyricsState.karaokeRoomUserId='';
        lyricsState.karaokeRoom=null;
        lyricsState.karaokeHistory=[];
        updateLyricsKaraokeRoom();
        return;
      }

      const canReuse=lyricsState.karaokeRoomReady===true&&lyricsState.karaokeRoomUserId===userId;
      if(!canReuse){
        lyricsState.karaokeRoomReady=false;
        lyricsState.karaokeRoom=null;
        lyricsState.karaokeHistory=[];
        updateLyricsKaraokeRoom();
      }

      google.script.run.withSuccessHandler(function(data){
        lyricsState.karaokeRoomReady=true;
        lyricsState.karaokeRoomUserId=userId;
        lyricsState.karaokeRoom=data.room||null;
        lyricsState.karaokeHistory=data.history||[];
        updateLyricsKaraokeRoom();
      }).withFailureHandler(function(error){
        if(!canReuse){
          lyricsState.karaokeRoomReady=true;
          lyricsState.karaokeRoomUserId=userId;
          lyricsState.karaokeRoom=null;
          lyricsState.karaokeHistory=[];
          updateLyricsKaraokeRoom();
          showLyricsError(error);
        }
      }).getKaraokeBootstrap(userId);
    };
  }
</script>

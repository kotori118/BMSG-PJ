<script>
  const UNIVERSE_USERS = Object.freeze([
    { id: 'U001', name: 'ももたん' },
    { id: 'U002', name: 'みおたん' },
    { id: 'U003', name: 'りおたん' }
  ]);

  function getCurrentUniverseUser() {
    const savedId = localStorage.getItem('bmsgUniverseUserId') || 'U001';
    return UNIVERSE_USERS.find(function(user) { return user.id === savedId; }) || UNIVERSE_USERS[0];
  }
  function isLyricsEditMode() { return localStorage.getItem('bmsgLyricsEditMode') === 'true'; }
  function syncLyricsEditMode() {
    const status = document.getElementById('lyricsEditModeStatus');
    if (status) { status.textContent = isLyricsEditMode() ? 'ON' : 'OFF'; status.classList.toggle('active', isLyricsEditMode()); }
  }
  function toggleLyricsEditMode() {
    localStorage.setItem('bmsgLyricsEditMode', isLyricsEditMode() ? 'false' : 'true');
    syncLyricsEditMode();
    if (typeof lyricsState !== 'undefined' && lyricsState.song && typeof renderLyricsSong === 'function') renderLyricsSong();
  }

  function syncSettingsUserName() {
    const label = document.getElementById('settingsUserName');
    if (label) label.textContent = getCurrentUniverseUser().name;
  }
  function openSettings() {
    syncSettingsUserName(); syncLyricsEditMode(); const lyricsSection=document.getElementById('lyricsSettingsSection'); if(lyricsSection) lyricsSection.hidden=currentRoute!=='lyrics'; settingsOverlay.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  function openPerformanceTool() { closeSettings(); navigateTo('metrics'); }
  function closeSettings() { settingsOverlay.classList.remove('open'); document.body.style.overflow = ''; }
  function cycleDemoUser() {
    const current = getCurrentUniverseUser();
    const index = UNIVERSE_USERS.findIndex(function(user) { return user.id === current.id; });
    const next = UNIVERSE_USERS[(index + 1) % UNIVERSE_USERS.length];
    localStorage.setItem('bmsgUniverseUserId', next.id); syncSettingsUserName();
    if (typeof showToast === 'function') showToast(next.name + 'に変更しました');
  }
  syncSettingsUserName(); syncLyricsEditMode();
</script>

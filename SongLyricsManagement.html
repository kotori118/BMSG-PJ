<div id="songLyricsManagementOverlay" class="modal-overlay slm-overlay" onclick="closeSongLyricsManagementOnBackdrop(event)">
  <section class="settings-panel management-panel slm-panel" role="dialog" aria-modal="true" aria-labelledby="slmTitle">
    <header class="modal-head slm-head"><div><h2 id="slmTitle" class="modal-title">楽曲・歌詞管理</h2><p id="slmLead" class="management-lead slm-lead">楽曲情報・クレジット・歌詞を管理</p></div><button class="overlay-close" type="button" onclick="closeSongLyricsManagement()" aria-label="閉じる">×</button></header>
    <div id="slmLoading" class="management-loading slm-loading" hidden>LOADING...</div>
    <div id="slmBody"></div>
  </section>
</div>
<div id="slmGuestConfirm" class="modal-overlay slm-confirm" onclick="closeSlmGuestConfirmOnBackdrop(event)">
  <section class="settings-panel management-panel slm-confirm-panel" role="dialog" aria-modal="true"><h3>未登録のSingerが見つかりました</h3><strong id="slmGuestName"></strong><p>Guestとして登録しますか？</p><div class="slm-confirm-actions"><button class="u-btn" type="button" onclick="cancelSlmGuestConfirm()">キャンセル</button><button class="u-btn" type="button" onclick="confirmSlmGuestRegistration()">Guestとして登録</button></div></section>
</div>
<style>
  .slm-overlay{z-index:1260}.slm-panel{width:min(760px,calc(100vw - 24px));max-width:760px;max-height:min(94vh,980px);overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.slm-lead{margin:4px 0 0;color:rgba(255,255,255,.48);font:500 11px "Zen Kaku Gothic New",sans-serif}.slm-home{display:grid;gap:12px;margin-top:16px}.slm-choice{display:flex;align-items:center;justify-content:space-between;padding:0 18px;text-align:left}.slm-choice strong{display:block;font:700 17px "Zen Kaku Gothic New",sans-serif}.slm-choice small{display:block;margin-top:4px;color:rgba(255,255,255,.46);font:500 11px "Zen Kaku Gothic New",sans-serif}.slm-choice b{color:var(--cyan);font-size:27px}.slm-back{width:46px;height:46px;margin:4px 0 16px}.slm-stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 18px}.slm-step{padding:9px 6px;border:1px solid rgba(156,236,255,.12);border-radius:999px;color:rgba(255,255,255,.38);font:700 10px "Exo 2","Zen Kaku Gothic New",sans-serif;text-align:center}.slm-step.is-active{border-color:rgba(156,236,255,.55);color:var(--cyan);background:rgba(156,236,255,.08)}.slm-card{display:grid;gap:14px;padding:16px;border:1px solid rgba(156,236,255,.12);border-radius:18px;background:rgba(255,255,255,.018)}.slm-section-title{margin:0;color:var(--cyan);font:700 12px "Exo 2","Zen Kaku Gothic New",sans-serif;letter-spacing:.06em}.slm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slm-field{display:grid;gap:6px;min-width:0}.slm-field.is-wide{grid-column:1/-1}.slm-field>span{color:rgba(255,255,255,.56);font:700 11px "Zen Kaku Gothic New",sans-serif}.slm-field input,.slm-field select,.slm-field textarea{width:100%;max-width:100%;min-width:0;box-sizing:border-box;min-height:48px;padding:10px 12px;border:1px solid rgba(156,236,255,.18);border-radius:13px;background:#0b0f16;color:#fff;font:600 14px "Zen Kaku Gothic New",sans-serif;outline:none}.slm-field textarea{min-height:220px;resize:vertical;line-height:1.7}.slm-field input:disabled,.slm-field select:disabled{opacity:.55}.slm-toggle{display:flex;align-items:center;gap:10px;min-height:48px}.slm-toggle input[type="checkbox"]{width:24px;max-width:24px;min-width:24px;min-height:24px;height:24px;padding:0;margin:0;flex:0 0 24px}.slm-loading[hidden]{display:none!important}.slm-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.slm-error{margin:12px 0 0;padding:11px 13px;border:1px solid rgba(255,100,100,.25);border-radius:12px;color:#ffb6b6;background:rgba(255,80,80,.06);font:600 12px "Zen Kaku Gothic New",sans-serif;white-space:pre-wrap}.slm-note{margin:0;color:rgba(255,255,255,.48);font:500 11px/1.7 "Zen Kaku Gothic New",sans-serif}.slm-preview-list,.slm-parts{display:grid;gap:10px}.slm-preview-part,.slm-part-card{padding:13px;border:1px solid rgba(156,236,255,.12);border-radius:14px;background:rgba(255,255,255,.02)}.slm-preview-part>div,.slm-part-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.slm-preview-part strong,.slm-part-head strong{color:var(--cyan);font:700 12px "Exo 2",sans-serif}.slm-preview-part span{font:700 12px "Zen Kaku Gothic New",sans-serif}.slm-preview-part p,.slm-part-card textarea{white-space:pre-wrap}.slm-preview-part p{margin:9px 0 0;font:500 14px/1.75 "Zen Kaku Gothic New",sans-serif}.slm-part-card{display:grid;gap:10px}.slm-part-head-actions{display:flex;gap:6px}.slm-icon-btn{width:38px;height:38px;font-weight:700}.slm-part-card textarea{width:100%;box-sizing:border-box;min-height:116px;padding:10px 12px;border:1px solid rgba(156,236,255,.18);border-radius:12px;background:#0b0f16;color:#fff;font:500 14px/1.7 "Zen Kaku Gothic New",sans-serif}.slm-edit-section{display:grid;gap:12px;margin-top:16px}.slm-save-section{justify-self:end}.slm-confirm{z-index:1400}.slm-confirm-panel{max-width:440px}.slm-confirm-panel h3{margin:0 0 16px;font:700 17px "Zen Kaku Gothic New",sans-serif}.slm-confirm-panel>strong{display:block;color:var(--cyan);font:700 23px "Zen Kaku Gothic New",sans-serif}.slm-confirm-panel>p{color:rgba(255,255,255,.58);font:500 13px "Zen Kaku Gothic New",sans-serif}.slm-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.slm-success{padding:18px;text-align:center;color:var(--cyan);font:700 14px "Zen Kaku Gothic New",sans-serif}
  body.theme-light .slm-lead,body.theme-light .slm-field>span,body.theme-light .slm-note{color:rgba(21,24,32,.55)}body.theme-light .slm-choice small{color:rgba(21,24,32,.5)}body.theme-light .slm-field input,body.theme-light .slm-field select,body.theme-light .slm-field textarea,body.theme-light .slm-part-card textarea{background:#fff;color:var(--ink);border-color:rgba(75,165,184,.25)}body.theme-light .slm-card,body.theme-light .slm-preview-part,body.theme-light .slm-part-card{background:#fff;border-color:rgba(75,165,184,.18)}
  @media(max-width:560px){.slm-panel{padding:17px}.slm-grid{grid-template-columns:1fr}.slm-field.is-wide{grid-column:auto}.slm-actions{display:grid;grid-template-columns:1fr 1fr}.slm-actions .u-btn{width:100%}.slm-step{font-size:9px}.slm-confirm-actions{grid-template-columns:1fr}}
</style>
<script>
  const songLyricsManagementState={bootstrap:null,view:'home',newStep:1,newSong:{artist:'',title:'',releaseDate:'',form:'',cdTitle:'',isTitleTrack:false},newCredits:{lyricists:'',composers:'',choreographers:''},rawLyrics:'',preview:null,unknownQueue:[],existingArtist:'',existingSongId:'',existing:null,dirty:{info:false,credits:false,lyrics:false},busy:false};

  function openSongLyricsManagement(){
    closeSettings();const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';if(!uid){if(typeof openUserChooser==='function')openUserChooser(true);return;}
    const overlay=document.getElementById('songLyricsManagementOverlay');if(!overlay)return;overlay.classList.add('open');document.body.style.overflow='hidden';
    if(songLyricsManagementState.bootstrap){renderSlm();return;}setSlmLoading(true);
    google.script.run.withSuccessHandler(function(data){songLyricsManagementState.bootstrap=data;setSlmLoading(false);renderSlm();}).withFailureHandler(function(e){setSlmLoading(false);renderSlmError(readSlmError(e));}).getSongLyricsManagementBootstrap(uid);
  }
  function closeSongLyricsManagement(){if(hasSlmDirty_()&&!window.confirm('保存していない変更があります。\n閉じますか？'))return;document.getElementById('songLyricsManagementOverlay').classList.remove('open');document.body.style.overflow='';}
  function closeSongLyricsManagementOnBackdrop(event){if(event.target&&event.target.id==='songLyricsManagementOverlay')closeSongLyricsManagement();}
  function setSlmLoading(flag){document.getElementById('slmLoading').hidden=!flag;document.getElementById('slmBody').hidden=flag;}
  function renderSlm(){const body=document.getElementById('slmBody');if(!body)return;if(songLyricsManagementState.view==='new')renderSlmNew(body);else if(songLyricsManagementState.view==='existingSelect')renderSlmExistingSelect(body);else if(songLyricsManagementState.view==='existingEdit')renderSlmExistingEdit(body);else renderSlmHome(body);}
  function renderSlmHome(body){songLyricsManagementState.view='home';body.innerHTML='<div class="slm-home"><button class="slm-choice" type="button" onclick="startSlmNew()"><span><strong>新規追加</strong><small>楽曲情報・クレジット・歌詞をまとめて登録</small></span><b>›</b></button><button class="slm-choice" type="button" onclick="startSlmExisting()"><span><strong>既存曲を編集</strong><small>楽曲情報・クレジット・歌詞を個別保存</small></span><b>›</b></button></div>';}
  function slmBackHome(){if(hasSlmDirty_()&&!window.confirm('保存していない変更があります。\n戻りますか？'))return;songLyricsManagementState.view='home';songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};renderSlm();}
  function startSlmNew(){songLyricsManagementState.view='new';songLyricsManagementState.newStep=1;songLyricsManagementState.preview=null;renderSlm();}
  function startSlmExisting(){songLyricsManagementState.view='existingSelect';songLyricsManagementState.existing=null;songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};renderSlm();}
  function slmStepper_(){return '<div class="slm-stepper">'+['楽曲情報','クレジット','歌詞'].map(function(label,index){return '<div class="slm-step '+(songLyricsManagementState.newStep===index+1?'is-active':'')+'">'+label+'</div>';}).join('')+'</div>';}
  function renderSlmNew(body){
    let html='<button class="u-btn slm-back" type="button" onclick="slmBackHome()">‹</button>'+slmStepper_();
    if(songLyricsManagementState.newStep===1)html+=slmNewSongHtml_();else if(songLyricsManagementState.newStep===2)html+=slmCreditsHtml_(songLyricsManagementState.newCredits,false);else if(songLyricsManagementState.preview)html+=slmPreviewHtml_();else html+=slmLyricsInputHtml_();
    body.innerHTML=html;bindSlmNewFields_();
  }
  function slmNewSongHtml_(){const s=songLyricsManagementState.newSong;return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">楽曲情報</h3><div class="slm-grid">'+slmSelectField_('slmNewArtist','アーティスト',songLyricsManagementState.bootstrap.artists,s.artist,'選択してください')+slmTextField_('slmNewTitle','曲名',s.title,true)+slmDateField_('slmNewRelease','リリース日',s.releaseDate)+slmSelectField_('slmNewForm','形態',songLyricsManagementState.bootstrap.forms,s.form,'未設定')+slmTextField_('slmNewCd','CDタイトル',s.cdTitle,false)+'<label class="management-field slm-field"><span>表題曲</span><span class="slm-toggle"><input id="slmNewTitleTrack" type="checkbox" '+(s.isTitleTrack?'checked':'')+'> 表題曲</span></label></div></section><div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="slmBackHome()">戻る</button><button class="u-btn" type="button" onclick="nextSlmNewSong()">次へ</button></div>';}
  function slmCreditsHtml_(credits,isEdit){const songs=songLyricsManagementState.bootstrap.songs||[];return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">クレジット</h3><div class="slm-grid">'+slmTextField_((isEdit?'slmEdit':'slmNew')+'Lyricists','作詞',credits.lyricists,false)+slmTextField_((isEdit?'slmEdit':'slmNew')+'Composers','作曲',credits.composers,false)+slmTextField_((isEdit?'slmEdit':'slmNew')+'Choreographers','振付',credits.choreographers,false)+'</div></section>'+(isEdit?'':'<div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="slmPrevNewStep()">戻る</button><button class="u-btn" type="button" onclick="nextSlmNewCredits()">次へ</button></div>');}
  function slmLyricsInputHtml_(){return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">歌詞入力</h3><p class="slm-note">Singer名の行と歌詞本文を、そのまま貼り付けてください。解析したSingerはメインとして保存されます。</p><label class="management-field slm-field"><span>歌詞</span><textarea id="slmRawLyrics" placeholder="SOTA\n歌詞...">'+escapeSlm(songLyricsManagementState.rawLyrics)+'</textarea></label></section><div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="slmPrevNewStep()">戻る</button><button class="u-btn" type="button" onclick="parseSlmNewLyrics()">解析する</button></div>';}
  function slmPreviewHtml_(){const p=songLyricsManagementState.preview;return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">解析結果確認</h3><p class="slm-note">'+escapeSlm(songLyricsManagementState.newSong.artist)+' / '+escapeSlm(songLyricsManagementState.newSong.title)+' / '+p.parts.length+' PARTS</p><div class="slm-preview-list">'+p.parts.map(function(part,index){return '<article class="slm-preview-part"><div><strong>PART '+(index+1)+'</strong><span>'+escapeSlm(part.singers.map(function(s){return s.name;}).join(' / '))+'</span></div><p>'+escapeSlm(part.lyrics)+'</p></article>';}).join('')+'</div></section><div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="editSlmRawAgain()">入力へ戻る</button><button class="u-btn" type="button" onclick="saveSlmNewSong()">登録する</button></div>';}
  function bindSlmNewFields_(){['slmNewArtist','slmNewTitle','slmNewRelease','slmNewForm','slmNewCd','slmNewTitleTrack','slmNewLyricists','slmNewComposers','slmNewChoreographers','slmNewOriginal','slmRawLyrics'].forEach(function(id){const el=document.getElementById(id);if(!el)return;el.addEventListener('input',captureSlmNewFields_);el.addEventListener('change',captureSlmNewFields_);});}
  function captureSlmNewFields_(){const s=songLyricsManagementState.newSong,c=songLyricsManagementState.newCredits;const value=function(id){const e=document.getElementById(id);return e?e.value:'';};if(document.getElementById('slmNewArtist')){s.artist=value('slmNewArtist');s.title=value('slmNewTitle');s.releaseDate=value('slmNewRelease');s.form=value('slmNewForm');s.cdTitle=value('slmNewCd');s.isTitleTrack=!!document.getElementById('slmNewTitleTrack').checked;}if(document.getElementById('slmNewLyricists')){c.lyricists=value('slmNewLyricists');c.composers=value('slmNewComposers');c.choreographers=value('slmNewChoreographers');}if(document.getElementById('slmRawLyrics'))songLyricsManagementState.rawLyrics=value('slmRawLyrics');}
  function nextSlmNewSong(){captureSlmNewFields_();if(!songLyricsManagementState.newSong.artist||!songLyricsManagementState.newSong.title){renderSlmInlineError_('ARTISTとTITLEは必須です。');return;}songLyricsManagementState.newStep=2;renderSlm();}
  function nextSlmNewCredits(){captureSlmNewFields_();songLyricsManagementState.newStep=3;songLyricsManagementState.preview=null;renderSlm();}
  function slmPrevNewStep(){captureSlmNewFields_();songLyricsManagementState.preview=null;songLyricsManagementState.newStep=Math.max(1,songLyricsManagementState.newStep-1);renderSlm();}
  function editSlmRawAgain(){songLyricsManagementState.preview=null;renderSlm();}
  function parseSlmNewLyrics(){captureSlmNewFields_();const uid=getUniverseUserId();if(!songLyricsManagementState.rawLyrics.trim()){renderSlmInlineError_('歌詞を入力してください。');return;}setSlmBusy_(true);google.script.run.withSuccessHandler(function(data){setSlmBusy_(false);if(data.unknownGuests&&data.unknownGuests.length){songLyricsManagementState.unknownQueue=data.unknownGuests.slice();openNextSlmGuestConfirm_();return;}if(data.errors&&data.errors.length){renderSlmInlineError_(data.errors.join('\n'));return;}songLyricsManagementState.preview=data;renderSlm();}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).parseSongLyricsManagement({userId:uid,rawLyrics:songLyricsManagementState.rawLyrics});}
  function openNextSlmGuestConfirm_(){const name=songLyricsManagementState.unknownQueue[0];if(!name){parseSlmNewLyrics();return;}document.getElementById('slmGuestName').textContent=name;document.getElementById('slmGuestConfirm').classList.add('open');}
  function cancelSlmGuestConfirm(){document.getElementById('slmGuestConfirm').classList.remove('open');songLyricsManagementState.unknownQueue=[];renderSlmInlineError_('未登録Singerは登録されていません。入力内容を確認してください。');}
  function closeSlmGuestConfirmOnBackdrop(event){if(event.target&&event.target.id==='slmGuestConfirm')cancelSlmGuestConfirm();}
  function confirmSlmGuestRegistration(){const name=songLyricsManagementState.unknownQueue[0];if(!name)return;setSlmBusy_(true);google.script.run.withSuccessHandler(function(){setSlmBusy_(false);document.getElementById('slmGuestConfirm').classList.remove('open');songLyricsManagementState.unknownQueue.shift();if(songLyricsManagementState.unknownQueue.length)openNextSlmGuestConfirm_();else refreshSlmBootstrap_(function(){parseSlmNewLyrics();});}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).registerSongLyricsGuest({userId:getUniverseUserId(),name:name});}
  function saveSlmNewSong(){if(!songLyricsManagementState.preview)return;setSlmBusy_(true);google.script.run.withSuccessHandler(function(result){setSlmBusy_(false);if(result&&result.duplicate){if(window.confirm('同じTITLE＋ARTISTの曲が登録済みです。\n既存曲の編集画面を開きますか？'))openSlmExistingSong_(result.songId);return;}if(!result||!result.ok){renderSlmInlineError_('登録できませんでした。');return;}refreshSlmBootstrap_(function(){openSlmExistingSong_(result.songId);if(typeof showToast==='function')showToast('楽曲を登録しました。');});}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveNewSongLyricsManagement({userId:getUniverseUserId(),song:songLyricsManagementState.newSong,credits:songLyricsManagementState.newCredits,rawLyrics:songLyricsManagementState.rawLyrics});}

  function renderSlmExistingSelect(body){const artists=songLyricsManagementState.bootstrap.existingArtists||[];const songs=(songLyricsManagementState.bootstrap.songs||[]).filter(function(song){return !songLyricsManagementState.existingArtist||song.artist===songLyricsManagementState.existingArtist;});body.innerHTML='<button class="u-btn slm-back" type="button" onclick="slmBackHome()">‹</button><section class="management-card slm-card"><h3 class="management-section-title slm-section-title">既存曲を編集</h3><div class="slm-grid">'+slmSelectField_('slmExistingArtist','アーティスト',artists,songLyricsManagementState.existingArtist,'選択してください')+slmSongSelectField_('slmExistingSong','SONG',songs,songLyricsManagementState.existingSongId,'')+'</div></section><div class="management-actions slm-actions"><span></span><button class="u-btn" type="button" onclick="loadSlmExistingSong()">編集する</button></div>';const artist=document.getElementById('slmExistingArtist'),song=document.getElementById('slmExistingSong');artist.addEventListener('change',function(){songLyricsManagementState.existingArtist=artist.value;songLyricsManagementState.existingSongId='';renderSlm();});song.addEventListener('change',function(){songLyricsManagementState.existingSongId=song.value;});}
  function loadSlmExistingSong(){const id=document.getElementById('slmExistingSong').value;if(!id){renderSlmInlineError_('曲を選択してください。');return;}openSlmExistingSong_(id);}
  function openSlmExistingSong_(songId){songLyricsManagementState.existingSongId=String(songId);songLyricsManagementState.view='existingEdit';songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};setSlmBusy_(true);google.script.run.withSuccessHandler(function(data){setSlmBusy_(false);songLyricsManagementState.existing=data;renderSlm();}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).getSongLyricsManagementSong(getUniverseUserId(),String(songId));}
  function renderSlmExistingEdit(body){if(!songLyricsManagementState.existing){body.innerHTML='<div class="management-loading slm-loading">LOADING...</div>';return;}const d=songLyricsManagementState.existing,s=d.song,c=d.credits;body.innerHTML='<button class="u-btn slm-back" type="button" onclick="backSlmExistingSelect()">‹</button><p class="slm-note">SongID '+escapeSlm(s.songId)+' / '+escapeSlm(s.artist)+'</p><section class="slm-edit-section slm-card"><h3 class="management-section-title slm-section-title">楽曲情報</h3><div class="slm-grid">'+slmDisabledField_('アーティスト',s.artist)+slmTextField_('slmEditTitle','曲名',s.title,true)+slmDateField_('slmEditRelease','リリース日',s.releaseDate)+slmSelectField_('slmEditForm','形態',songLyricsManagementState.bootstrap.forms,s.form,'未設定')+slmTextField_('slmEditCd','CDタイトル',s.cdTitle,false)+'<label class="management-field slm-field"><span>表題曲</span><span class="slm-toggle"><input id="slmEditTitleTrack" type="checkbox" '+(s.isTitleTrack?'checked':'')+'> 表題曲</span></label></div><button class="u-btn slm-save-section" type="button" onclick="saveSlmExistingInfo()">SONG INFOを保存</button></section><section class="slm-edit-section">'+slmCreditsHtml_(c,true)+'<button class="u-btn slm-save-section" type="button" onclick="saveSlmExistingCredits()">CREDITSを保存</button></section><section class="slm-edit-section slm-card"><h3 class="management-section-title slm-section-title">LYRICS</h3><div id="slmEditParts" class="slm-parts"></div><button class="u-btn" type="button" onclick="addSlmPart()">＋ PART</button><button class="u-btn slm-save-section" type="button" onclick="saveSlmExistingLyrics()">LYRICSを保存</button></section>';renderSlmParts_();bindSlmEdit_();}
  function backSlmExistingSelect(){if(hasSlmDirty_()&&!window.confirm('保存していない変更があります。\n曲選択へ戻りますか？'))return;songLyricsManagementState.view='existingSelect';songLyricsManagementState.existing=null;songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};renderSlm();}
  function bindSlmEdit_(){['slmEditTitle','slmEditRelease','slmEditForm','slmEditCd','slmEditTitleTrack'].forEach(function(id){const e=document.getElementById(id);if(e){e.addEventListener('input',function(){songLyricsManagementState.dirty.info=true;});e.addEventListener('change',function(){songLyricsManagementState.dirty.info=true;});}});['slmEditLyricists','slmEditComposers','slmEditChoreographers','slmEditOriginal'].forEach(function(id){const e=document.getElementById(id);if(e){e.addEventListener('input',function(){songLyricsManagementState.dirty.credits=true;});e.addEventListener('change',function(){songLyricsManagementState.dirty.credits=true;});}});}
  function renderSlmParts_(){const target=document.getElementById('slmEditParts');if(!target||!songLyricsManagementState.existing)return;target.innerHTML=songLyricsManagementState.existing.parts.map(function(part,index){return '<article class="slm-part-card" data-part-index="'+index+'"><div class="slm-part-head"><strong>PART '+(index+1)+'</strong><div class="slm-part-head-actions"><button class="slm-icon-btn" type="button" onclick="moveSlmPart('+index+',-1)">↑</button><button class="slm-icon-btn" type="button" onclick="moveSlmPart('+index+',1)">↓</button><button class="slm-icon-btn" type="button" onclick="deleteSlmPart('+index+')">×</button></div></div><div class="slm-singer-editor"></div><textarea class="slm-part-lyrics">'+escapeSlm(part.lyrics)+'</textarea></article>';}).join('');target.querySelectorAll('.slm-part-card').forEach(function(card){const index=Number(card.dataset.partIndex),part=songLyricsManagementState.existing.parts[index],editor=card.querySelector('.slm-singer-editor'),textarea=card.querySelector('.slm-part-lyrics');mountUniverseSingerEditor(editor,part.singers,songLyricsManagementState.bootstrap.singerOptions,function(value){part.singers=value;songLyricsManagementState.dirty.lyrics=true;});textarea.addEventListener('input',function(){part.lyrics=textarea.value;songLyricsManagementState.dirty.lyrics=true;});});}
  function addSlmPart(){songLyricsManagementState.existing.parts.push({partOrder:songLyricsManagementState.existing.parts.length+1,singers:[{id:'',name:'',role:'MAIN'}],lyrics:''});songLyricsManagementState.dirty.lyrics=true;renderSlmParts_();}
  function moveSlmPart(index,delta){const list=songLyricsManagementState.existing.parts,next=index+delta;if(next<0||next>=list.length)return;const item=list.splice(index,1)[0];list.splice(next,0,item);songLyricsManagementState.dirty.lyrics=true;renderSlmParts_();}
  function deleteSlmPart(index){if(!window.confirm('このパートを削除しますか？'))return;songLyricsManagementState.existing.parts.splice(index,1);songLyricsManagementState.dirty.lyrics=true;renderSlmParts_();}
  function saveSlmExistingInfo(){const s=songLyricsManagementState.existing.song;const payload={artist:s.artist,title:document.getElementById('slmEditTitle').value,releaseDate:document.getElementById('slmEditRelease').value,form:document.getElementById('slmEditForm').value,cdTitle:document.getElementById('slmEditCd').value,isTitleTrack:document.getElementById('slmEditTitleTrack').checked};setSlmBusy_(true);google.script.run.withSuccessHandler(function(){setSlmBusy_(false);songLyricsManagementState.dirty.info=false;refreshSlmBootstrap_(function(){openSlmExistingSong_(s.songId);});}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveSongLyricsManagementInfo({userId:getUniverseUserId(),songId:s.songId,song:payload});}
  function saveSlmExistingCredits(){const s=songLyricsManagementState.existing.song;const credits={lyricists:document.getElementById('slmEditLyricists').value,composers:document.getElementById('slmEditComposers').value,choreographers:document.getElementById('slmEditChoreographers').value};setSlmBusy_(true);google.script.run.withSuccessHandler(function(){setSlmBusy_(false);songLyricsManagementState.dirty.credits=false;openSlmExistingSong_(s.songId);}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveSongLyricsManagementCredits({userId:getUniverseUserId(),songId:s.songId,credits:credits});}
  function saveSlmExistingLyrics(){const s=songLyricsManagementState.existing.song,parts=songLyricsManagementState.existing.parts.map(function(part){return{singers:part.singers,lyrics:part.lyrics};});setSlmBusy_(true);google.script.run.withSuccessHandler(function(){setSlmBusy_(false);songLyricsManagementState.dirty.lyrics=false;try{sessionStorage.removeItem('bmsgLyricsDataV4');}catch(e){}openSlmExistingSong_(s.songId);}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveSongLyricsManagementLyrics({userId:getUniverseUserId(),songId:s.songId,parts:parts});}

  function refreshSlmBootstrap_(callback){google.script.run.withSuccessHandler(function(data){songLyricsManagementState.bootstrap=data;if(typeof callback==='function')callback();}).withFailureHandler(function(e){renderSlmInlineError_(readSlmError(e));}).getSongLyricsManagementBootstrap(getUniverseUserId());}
  function hasSlmDirty_(){return !!(songLyricsManagementState.dirty.info||songLyricsManagementState.dirty.credits||songLyricsManagementState.dirty.lyrics);}
  function setSlmBusy_(flag){songLyricsManagementState.busy=flag;document.querySelectorAll('#songLyricsManagementOverlay button,#songLyricsManagementOverlay input,#songLyricsManagementOverlay select,#songLyricsManagementOverlay textarea').forEach(function(el){el.disabled=!!flag;});if(flag){const body=document.getElementById('slmBody');if(body&&!document.getElementById('slmBusyText'))body.insertAdjacentHTML('afterbegin','<div id="slmBusyText" class="management-loading slm-loading">LOADING...</div>');}else{const node=document.getElementById('slmBusyText');if(node)node.remove();}}
  function renderSlmInlineError_(message){const body=document.getElementById('slmBody');if(!body)return;let node=document.getElementById('slmInlineError');if(!node){node=document.createElement('p');node.id='slmInlineError';node.className='slm-error';body.prepend(node);}node.textContent=message;}
  function renderSlmError(message){document.getElementById('slmBody').innerHTML='<p class="management-error slm-error">'+escapeSlm(message)+'</p>';}
  function readSlmError(error){return String(error&&error.message?error.message:error||'エラーが発生しました。').replace(/^Exception:\s*/,'');}
  function slmTextField_(id,label,value,required){return '<label class="management-field slm-field '+(label==='曲名'?'is-wide':'')+'"><span>'+escapeSlm(label)+(required?' *':'')+'</span><input id="'+id+'" type="text" value="'+escapeSlm(value||'')+'"></label>';}
  function slmDateField_(id,label,value){return '<label class="management-field slm-field"><span>'+label+'</span><input id="'+id+'" type="date" value="'+escapeSlm(value||'')+'"></label>';}
  function slmSelectField_(id,label,options,value,placeholder){return '<label class="management-field slm-field"><span>'+escapeSlm(label)+'</span><select id="'+id+'"><option value="">'+escapeSlm(placeholder||'選択してください')+'</option>'+(options||[]).map(function(item){const v=typeof item==='string'?item:item.value;return '<option value="'+escapeSlm(v)+'"'+(String(v)===String(value)?' selected':'')+'>'+escapeSlm(typeof item==='string'?item:(item.label||v))+'</option>';}).join('')+'</select></label>';}
  function slmSongSelectField_(id,label,songs,value,exclude){return '<label class="management-field slm-field"><span>'+escapeSlm(label)+'</span><select id="'+id+'"><option value="">選択なし</option>'+(songs||[]).filter(function(song){return !exclude||song.songId!==exclude;}).map(function(song){return '<option value="'+escapeSlm(song.songId)+'"'+(String(song.songId)===String(value)?' selected':'')+'>'+escapeSlm(song.title)+' / '+escapeSlm(song.artist)+'</option>';}).join('')+'</select></label>';}
  function slmDisabledField_(label,value){return '<label class="management-field slm-field"><span>'+escapeSlm(label)+'</span><input type="text" value="'+escapeSlm(value)+'" disabled></label>';}
  function escapeSlm(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
</script>

<div id="songLyricsManagementOverlay" class="management-editor" hidden>
  <section class="management-editor-panel slm-panel">

    <div id="slmLoading" class="management-loading slm-loading" hidden>LOADING...</div>
    <div id="slmBody"></div>
  </section>
</div>
<div id="slmGuestConfirm" class="modal-overlay slm-confirm" onclick="closeSlmGuestConfirmOnBackdrop(event)">
  <section class="settings-panel management-panel slm-confirm-panel" role="dialog" aria-modal="true"><h3>未登録のSingerが見つかりました</h3><strong id="slmGuestName"></strong><p>Guestとして登録しますか？</p><div class="slm-confirm-actions"><button class="u-btn" type="button" onclick="markSlmGuestNotGuest()">ゲストではない</button><button class="u-btn" type="button" onclick="confirmSlmGuestRegistration()">Guestとして登録</button></div></section>
</div>
<style>
  .slm-lead{margin-top:8px}.slm-stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 18px}.slm-step{padding:9px 6px;border:1px solid rgba(156,236,255,.12);border-radius:999px;color:rgba(255,255,255,.38);font:700 10px "Exo 2","Zen Kaku Gothic New",sans-serif;text-align:center}.slm-step.is-active{border-color:rgba(156,236,255,.55);color:var(--cyan);background:rgba(156,236,255,.08)}.slm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slm-field.is-wide{grid-column:1/-1}.slm-field textarea{min-height:220px;resize:vertical;line-height:1.7}.slm-toggle{display:flex;align-items:center;gap:10px;min-height:48px}.slm-toggle input[type="checkbox"]{width:24px;max-width:24px;min-width:24px;min-height:24px;height:24px;padding:0;margin:0;flex:0 0 24px}.slm-note{margin:0;color:rgba(255,255,255,.48);font:500 11px/1.7 "Zen Kaku Gothic New",sans-serif}.slm-preview-list,.slm-parts{display:grid;gap:10px}.slm-preview-part,.slm-part-card{padding:13px;border:1px solid rgba(156,236,255,.12);border-radius:14px;background:rgba(255,255,255,.02)}.slm-preview-part>div,.slm-part-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.slm-preview-part strong,.slm-part-head strong{color:var(--cyan);font:700 12px "Exo 2",sans-serif}.slm-preview-part span{font:700 12px "Zen Kaku Gothic New",sans-serif}.slm-preview-part p,.slm-part-card textarea{white-space:pre-wrap}.slm-preview-part p{margin:9px 0 0;font:500 14px/1.75 "Zen Kaku Gothic New",sans-serif}.slm-part-card{display:grid;gap:10px}.slm-part-head-actions{display:flex;gap:6px}.slm-icon-btn{width:38px;height:38px;font-weight:700}.slm-part-insert{width:100%;min-height:42px;margin:2px 0;border-radius:14px!important;font:700 11px "Zen Kaku Gothic New",sans-serif}.slm-part-card textarea{width:100%;box-sizing:border-box;min-height:116px;padding:10px 12px;border:1px solid rgba(156,236,255,.18);border-radius:12px;background:#0b0f16;color:#fff;font:500 14px/1.7 "Zen Kaku Gothic New",sans-serif}.slm-edit-section{display:grid;gap:12px;margin-top:16px}.slm-save-section{justify-self:end}.slm-confirm{z-index:1400}.slm-confirm-panel{max-width:440px}.slm-confirm-panel h3{margin:0 0 16px;font:700 17px "Zen Kaku Gothic New",sans-serif}.slm-confirm-panel>strong{display:block;color:var(--cyan);font:700 23px "Zen Kaku Gothic New",sans-serif}.slm-confirm-panel>p{color:rgba(255,255,255,.58);font:500 13px "Zen Kaku Gothic New",sans-serif}.slm-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.slm-success{padding:18px;text-align:center;color:var(--cyan);font:700 14px "Zen Kaku Gothic New",sans-serif}
    body.theme-light .slm-part-card textarea{background:#fff;color:#151820;border-color:rgba(54,196,220,.35)}
  @media(max-width:560px){.slm-panel{padding:17px}.slm-grid{grid-template-columns:1fr}.slm-field.is-wide{grid-column:auto}.slm-actions .u-btn{width:100%}.slm-step{font-size:9px}.slm-confirm-actions{grid-template-columns:1fr}}
</style>
<script>
  const songLyricsManagementState={bootstrap:null,view:'home',newStep:1,newSong:{artist:'',title:'',releaseDate:'',form:'',cdTitle:'',isTitleTrack:false},newCredits:{lyricists:'',composers:'',choreographers:''},rawLyrics:'',preview:null,unknownQueue:[],ignoredGuestCandidates:[],ignoredGuestSource:'',existingArtist:'',existingSongId:'',existing:null,dirty:{info:false,credits:false,lyrics:false},busy:false};

  function openSongLyricsManagement(){
    closeSettings();const uid=typeof getUniverseUserId==='function'?getUniverseUserId():'';if(!uid){if(typeof openUserChooser==='function')openUserChooser(true);return;}
    const overlay=document.getElementById('songLyricsManagementOverlay');if(!overlay)return;overlay.hidden=false;
    if(songLyricsManagementState.bootstrap){renderSlm();return;}songLyricsManagementState.busy=true;setSlmLoading(true);
    managementRunner_().withSuccessHandler(function(data){songLyricsManagementState.bootstrap=data;songLyricsManagementState.busy=false;setSlmLoading(false);renderSlm();}).withFailureHandler(function(e){songLyricsManagementState.busy=false;setSlmLoading(false);renderSlmError(readSlmError(e));}).getSongLyricsManagementBootstrap(uid);
  }
  function setSlmLoading(flag){document.getElementById('slmLoading').hidden=!flag;document.getElementById('slmBody').hidden=flag;}
  function renderSlm(){const body=document.getElementById('slmBody');if(!body)return;if(songLyricsManagementState.view==='new')renderSlmNew(body);else if(songLyricsManagementState.view==='existingSelect')renderSlmExistingSelect(body);else if(songLyricsManagementState.view==='existingEdit')renderSlmExistingEdit(body);else startSlmExisting();}
  function slmBackHome(){managementGo_('songs');}
  function resetSlmNewState_(){songLyricsManagementState.newStep=1;songLyricsManagementState.newSong={artist:'',title:'',releaseDate:'',form:'',cdTitle:'',isTitleTrack:false};songLyricsManagementState.newCredits={lyricists:'',composers:'',choreographers:''};songLyricsManagementState.rawLyrics='';songLyricsManagementState.includeLyrics=true;songLyricsManagementState.preview=null;songLyricsManagementState.unknownQueue=[];songLyricsManagementState.ignoredGuestCandidates=[];songLyricsManagementState.ignoredGuestSource='';}
  function startSlmExisting(){songLyricsManagementState.view='existingSelect';songLyricsManagementState.existing=null;songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};renderSlm();}
  function slmIsPersonal_(id){return /^M\d+$/.test(String(id||''));}
  function slmIsBeFirst_(id){return id==='G1'||id==='BE:FIRST';}
  function slmArtistLabel_(id){const artist=(songLyricsManagementState.bootstrap.artists||[]).find(function(entry){return entry.value===id;});return artist?artist.label:id;}
  function slmStepper_(){const isBeFirst=slmIsBeFirst_(songLyricsManagementState.newSong.artist),steps=isBeFirst?[{step:1,label:'楽曲情報'},{step:2,label:'クレジット'},{step:3,label:'歌詞'}]:[{step:1,label:'楽曲情報'},{step:3,label:'歌詞'}];return '<div class="slm-stepper">'+steps.map(function(item){return '<div class="slm-step '+(songLyricsManagementState.newStep===item.step?'is-active':'')+'">'+item.label+'</div>';}).join('')+'</div>';}
  function renderSlmNew(body){
    let html=''+slmStepper_();
    if(songLyricsManagementState.newStep===1)html+=slmNewSongHtml_();else if(songLyricsManagementState.newStep===2)html+=slmCreditsHtml_(songLyricsManagementState.newCredits,false);else if(songLyricsManagementState.preview)html+=slmPreviewHtml_();else html+=slmLyricsInputHtml_();
    body.innerHTML=html;bindSlmNewFields_();
  }
  function slmNewSongHtml_(){const s=songLyricsManagementState.newSong;return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">楽曲情報</h3><div class="slm-grid">'+slmSelectField_('slmNewArtist','アーティスト',songLyricsManagementState.bootstrap.artists,s.artist,'選択してください')+slmTextField_('slmNewTitle','曲名',s.title,true)+slmDateField_('slmNewRelease','リリース日',s.releaseDate)+slmSelectField_('slmNewForm','形態',songLyricsManagementState.bootstrap.forms,s.form,'未設定')+slmTextField_('slmNewCd','CDタイトル',s.cdTitle,false)+slmSongOptionsHtml_()+'<label class="management-field slm-field"><span>表題曲</span><span class="slm-toggle"><input id="slmNewTitleTrack" type="checkbox" '+(s.isTitleTrack?'checked':'')+'> 表題曲</span></label></div></section><div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="slmBackHome()">戻る</button><button class="u-btn" type="button" onclick="nextSlmNewSong()">次へ</button></div>';}
  function slmCreditsHtml_(credits,isEdit){return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">クレジット</h3><div class="slm-grid">'+slmTextField_((isEdit?'slmEdit':'slmNew')+'Lyricists','作詞',credits.lyricists,false)+slmTextField_((isEdit?'slmEdit':'slmNew')+'Composers','作曲',credits.composers,false)+slmTextField_((isEdit?'slmEdit':'slmNew')+'Choreographers','振付',credits.choreographers,false)+'</div></section>'+(isEdit?'':'<div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="slmPrevNewStep()">戻る</button><button class="u-btn" type="button" onclick="nextSlmNewCredits()">次へ</button></div>');}
  function slmLyricsInputHtml_(){if(songLyricsManagementState.includeLyrics===false)return '<div class="management-actions"><button class="u-btn" onclick="slmPrevNewStep()">入力を訂正する</button></div><section class="management-card"><p class="slm-note">歌詞は後から追加できます。</p><button class="u-btn" type="button" onclick="saveSlmNewSong()">楽曲を登録</button></section>';return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">歌詞入力</h3><p class="slm-note">Singer名の行と歌詞本文を、そのまま貼り付けてください。解析したSingerはメインとして保存されます。</p><label class="management-field slm-field"><span>歌詞</span><textarea id="slmRawLyrics" placeholder="SOTA\n歌詞...">'+escapeSlm(songLyricsManagementState.rawLyrics)+'</textarea></label></section><div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="slmPrevNewStep()">戻る</button><button class="u-btn" type="button" onclick="parseSlmNewLyrics()">解析する</button></div>';}
  function slmPreviewHtml_(){const p=songLyricsManagementState.preview;return '<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">解析結果確認</h3><p class="slm-note">'+escapeSlm(slmArtistLabel_(songLyricsManagementState.newSong.artist))+' / '+escapeSlm(songLyricsManagementState.newSong.title)+' / '+p.parts.length+' PARTS</p><div class="slm-preview-list">'+p.parts.map(function(part,index){return '<article class="slm-preview-part"><div><strong>PART '+(index+1)+'</strong><span>'+escapeSlm(part.singers.map(function(s){return s.name;}).join(' / '))+'</span></div><p>'+escapeSlm(part.lyrics)+'</p></article>';}).join('')+'</div></section><div class="management-actions slm-actions"><button class="u-btn" type="button" onclick="editSlmRawAgain()">入力へ戻る</button><button class="u-btn" type="button" onclick="saveSlmNewSong()">登録する</button></div>';}
  function bindSlmNewFields_(){['slmNewArtist','slmNewTitle','slmNewRelease','slmNewForm','slmNewCd','slmNewTitleTrack','slmNewLyricists','slmNewComposers','slmNewChoreographers','slmRawLyrics','slmIncludeLyrics'].forEach(function(id){const el=document.getElementById(id);if(!el)return;el.addEventListener('input',captureSlmNewFields_);el.addEventListener('change',captureSlmNewFields_);});}
  function captureSlmNewFields_(){const s=songLyricsManagementState.newSong,c=songLyricsManagementState.newCredits;const value=function(id){const e=document.getElementById(id);return e?e.value:'';};if(document.getElementById('slmNewArtist')){s.artist=value('slmNewArtist');s.title=value('slmNewTitle');s.releaseDate=value('slmNewRelease');s.form=value('slmNewForm');s.cdTitle=value('slmNewCd');s.isTitleTrack=!!document.getElementById('slmNewTitleTrack').checked;}if(document.getElementById('slmNewLyricists')){c.lyricists=value('slmNewLyricists');c.composers=value('slmNewComposers');c.choreographers=value('slmNewChoreographers');}if(document.getElementById('slmIncludeLyrics'))songLyricsManagementState.includeLyrics=document.getElementById('slmIncludeLyrics').checked;if(document.getElementById('slmRawLyrics'))songLyricsManagementState.rawLyrics=value('slmRawLyrics');}
  function nextSlmNewSong(){captureSlmNewFields_();if(!songLyricsManagementState.newSong.artist||!songLyricsManagementState.newSong.title){renderSlmInlineError_('ARTISTとTITLEは必須です。');return;}if(slmIsPersonal_(songLyricsManagementState.newSong.artist))songLyricsManagementState.includeLyrics=false;if(!slmIsBeFirst_(songLyricsManagementState.newSong.artist))songLyricsManagementState.newCredits={lyricists:'',composers:'',choreographers:''};songLyricsManagementState.newStep=slmIsBeFirst_(songLyricsManagementState.newSong.artist)?2:3;renderSlm();}
  function nextSlmNewCredits(){captureSlmNewFields_();songLyricsManagementState.newStep=3;songLyricsManagementState.preview=null;renderSlm();}
  function slmPrevNewStep(){captureSlmNewFields_();songLyricsManagementState.preview=null;songLyricsManagementState.newStep=(songLyricsManagementState.newStep===3&&!slmIsBeFirst_(songLyricsManagementState.newSong.artist))?1:Math.max(1,songLyricsManagementState.newStep-1);renderSlm();}
  function editSlmRawAgain(){songLyricsManagementState.preview=null;renderSlm();}
  function parseSlmNewLyrics(){captureSlmNewFields_();const uid=getUniverseUserId();if(!songLyricsManagementState.rawLyrics.trim()){renderSlmInlineError_('歌詞を入力してください。');return;}if(songLyricsManagementState.ignoredGuestSource!==songLyricsManagementState.rawLyrics){songLyricsManagementState.ignoredGuestCandidates=[];songLyricsManagementState.ignoredGuestSource=songLyricsManagementState.rawLyrics;}setSlmBusy_(true);managementRunner_().withSuccessHandler(function(data){setSlmBusy_(false);if(data.unknownGuests&&data.unknownGuests.length){songLyricsManagementState.unknownQueue=data.unknownGuests.slice();openNextSlmGuestConfirm_();return;}if(data.errors&&data.errors.length){renderSlmInlineError_(data.errors.join('\n'));return;}songLyricsManagementState.preview=data;renderSlm();}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).parseSongLyricsManagement({userId:uid,rawLyrics:songLyricsManagementState.rawLyrics,ignoredGuestCandidates:songLyricsManagementState.ignoredGuestCandidates.slice()});}
  function openNextSlmGuestConfirm_(){const name=songLyricsManagementState.unknownQueue[0];if(!name){parseSlmNewLyrics();return;}document.getElementById('slmGuestName').textContent=name;document.getElementById('slmGuestConfirm').classList.add('open');}
  function slmGuestCandidateKeyClient_(value){const text=String(value==null?'':value).trim();return typeof text.normalize==='function'?text.normalize('NFKC'):text;}
  function markSlmGuestNotGuest(){const name=songLyricsManagementState.unknownQueue[0];if(!name)return;const key=slmGuestCandidateKeyClient_(name);if(!songLyricsManagementState.ignoredGuestCandidates.some(function(item){return slmGuestCandidateKeyClient_(item)===key;}))songLyricsManagementState.ignoredGuestCandidates.push(name);document.getElementById('slmGuestConfirm').classList.remove('open');songLyricsManagementState.unknownQueue=songLyricsManagementState.unknownQueue.filter(function(item){return slmGuestCandidateKeyClient_(item)!==key;});if(songLyricsManagementState.unknownQueue.length)openNextSlmGuestConfirm_();else parseSlmNewLyrics();}
  function closeSlmGuestConfirmOnBackdrop(event){return;}
  function confirmSlmGuestRegistration(){if(songLyricsManagementState.busy)return;const name=songLyricsManagementState.unknownQueue[0];if(!name)return;setSlmBusy_(true);managementRunner_().withSuccessHandler(function(){setSlmBusy_(false);document.getElementById('slmGuestConfirm').classList.remove('open');songLyricsManagementState.unknownQueue.shift();if(songLyricsManagementState.unknownQueue.length)openNextSlmGuestConfirm_();else refreshSlmBootstrap_(function(){parseSlmNewLyrics();});}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).registerSongLyricsGuest({userId:getUniverseUserId(),name:name});}
  function saveSlmNewSong(){if(songLyricsManagementState.busy)return;if(songLyricsManagementState.includeLyrics!==false&&!songLyricsManagementState.preview)return;setSlmBusy_(true);managementRunner_().withSuccessHandler(function(result){setSlmBusy_(false);if(result&&result.duplicate){if(window.confirm('同じTITLE＋ARTISTの曲が登録済みです。\n既存曲の編集画面を開きますか？'))openSlmExistingSong_(result.songId);return;}if(!result||!result.ok){renderSlmInlineError_('登録できませんでした。');return;}const savedSongId=result.songId;managementMutationDone_();managementState.dirty=false;resetSlmNewState_();refreshSlmBootstrap_(function(){openSlmExistingSong_(savedSongId);if(typeof showToast==='function')showToast('楽曲を登録しました。');});}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));})[songLyricsManagementState.includeLyrics===false?'catalogManagementCreateSongDraft':'saveNewSongLyricsManagement']({includeLyrics:songLyricsManagementState.includeLyrics!==false,userId:getUniverseUserId(),song:songLyricsManagementState.newSong,credits:songLyricsManagementState.newCredits,rawLyrics:songLyricsManagementState.rawLyrics,ignoredGuestCandidates:songLyricsManagementState.ignoredGuestCandidates.slice()});}

  function renderSlmExistingSelect(body){const artists=songLyricsManagementState.bootstrap.existingArtists||[];const songs=(songLyricsManagementState.bootstrap.songs||[]).filter(function(song){return !songLyricsManagementState.existingArtist||song.artist===songLyricsManagementState.existingArtist;});body.innerHTML='<section class="management-card slm-card"><h3 class="management-section-title slm-section-title">既存曲を編集</h3><div class="slm-grid">'+slmSelectField_('slmExistingArtist','アーティスト',artists,songLyricsManagementState.existingArtist,'選択してください')+slmTextField_('slmSongSearch','曲名を検索','',false)+slmSongSelectField_('slmExistingSong','曲',songs,songLyricsManagementState.existingSongId)+'</div></section><div class="management-actions slm-actions"><span></span><button class="u-btn" type="button" onclick="loadSlmExistingSong()">編集する</button></div>';const artist=document.getElementById('slmExistingArtist'),song=document.getElementById('slmExistingSong');artist.addEventListener('change',function(){songLyricsManagementState.existingArtist=artist.value;songLyricsManagementState.existingSongId='';renderSlm();});song.addEventListener('change',function(){songLyricsManagementState.existingSongId=song.value;});document.getElementById('slmSongSearch').addEventListener('input',function(event){const q=event.target.value.toLowerCase();song.innerHTML='<option value="">選択なし</option>'+songs.filter(function(x){return x.title.toLowerCase().includes(q);}).map(function(x){return '<option value="'+escapeSlm(x.songId)+'">'+escapeSlm(x.title+' / '+x.artist)+'</option>';}).join('');});}
  function loadSlmExistingSong(){const id=document.getElementById('slmExistingSong').value;if(!id){renderSlmInlineError_('曲を選択してください。');return;}openSlmExistingSong_(id);}
  function openSlmExistingSong_(songId){songLyricsManagementState.existingSongId=String(songId);songLyricsManagementState.view='existingEdit';songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};setSlmBusy_(true);managementRunner_().withSuccessHandler(function(data){setSlmBusy_(false);songLyricsManagementState.existing=data;renderSlm();}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).getSongLyricsManagementSong(getUniverseUserId(),String(songId));}
  function renderSlmExistingEdit(body){if(!songLyricsManagementState.existing){body.innerHTML='<div class="management-loading slm-loading">LOADING...</div>';return;}const d=songLyricsManagementState.existing,s=d.song,c=d.credits,creditsSection=!s.personal&&slmIsBeFirst_(s.artistId||s.artist)?'<section class="slm-edit-section">'+slmCreditsHtml_(c,true)+'<button class="u-btn slm-save-section" type="button" onclick="saveSlmExistingCredits()">クレジットを保存</button></section>':'';body.innerHTML='<button class="u-btn" onclick="backSlmExistingSelect()">曲の選択に戻る</button><p class="slm-note">SongID '+escapeSlm(s.songId)+' / '+escapeSlm(s.artist)+'</p><section class="management-card slm-edit-section slm-card"><h3 class="management-section-title slm-section-title">楽曲情報</h3><div class="slm-grid">'+slmDisabledField_('アーティスト',s.artist)+slmTextField_('slmEditTitle','曲名',s.title,true)+slmDateField_('slmEditRelease','リリース日',s.releaseDate)+slmSelectField_('slmEditForm','形態',songLyricsManagementState.bootstrap.forms,s.form,'未設定')+slmTextField_('slmEditCd','CDタイトル',s.cdTitle,false)+'<label class="management-field slm-field"><span>表題曲</span><span class="slm-toggle"><input id="slmEditTitleTrack" type="checkbox" '+(s.isTitleTrack?'checked':'')+'> 表題曲</span></label></div><button class="u-btn slm-save-section" type="button" onclick="saveSlmExistingInfo()">楽曲情報を保存</button></section>'+creditsSection+(s.personal?'':'<section class="management-card slm-edit-section slm-card"><h3 class="management-section-title slm-section-title">歌詞</h3><div id="slmEditParts" class="slm-parts"></div><button class="u-btn slm-save-section" type="button" onclick="saveSlmExistingLyrics()">歌詞を保存</button></section>');body.insertAdjacentHTML('beforeend',slmCatalogSongControls_());renderSlmParts_();bindSlmEdit_();}
  function backSlmExistingSelect(){if(hasSlmDirty_()&&!window.confirm('保存していない変更があります。\n曲選択へ戻りますか？'))return;songLyricsManagementState.view='existingSelect';songLyricsManagementState.existing=null;songLyricsManagementState.dirty={info:false,credits:false,lyrics:false};renderSlm();}
  function bindSlmEdit_(){['slmEditTitle','slmEditRelease','slmEditForm','slmEditCd','slmEditTitleTrack'].forEach(function(id){const e=document.getElementById(id);if(e){e.addEventListener('input',function(){songLyricsManagementState.dirty.info=true;});e.addEventListener('change',function(){songLyricsManagementState.dirty.info=true;});}});['slmEditLyricists','slmEditComposers','slmEditChoreographers'].forEach(function(id){const e=document.getElementById(id);if(e){e.addEventListener('input',function(){songLyricsManagementState.dirty.credits=true;});e.addEventListener('change',function(){songLyricsManagementState.dirty.credits=true;});}});}
  function slmPartInsertButton_(index){return '<button class="u-btn slm-part-insert" type="button" onclick="addSlmPart('+index+')">＋ PART</button>';}
  function renderSlmParts_(){const target=document.getElementById('slmEditParts');if(!target||!songLyricsManagementState.existing)return;const parts=songLyricsManagementState.existing.parts;let html=slmPartInsertButton_(0);parts.forEach(function(part,index){html+='<article class="slm-part-card" data-part-index="'+index+'"><div class="slm-part-head"><strong>PART '+(index+1)+'</strong><div class="slm-part-head-actions"><button class="slm-icon-btn" type="button" onclick="moveSlmPart('+index+',-1)">↑</button><button class="slm-icon-btn" type="button" onclick="moveSlmPart('+index+',1)">↓</button><button class="slm-icon-btn" type="button" onclick="deleteSlmPart('+index+')">×</button></div></div><div class="slm-singer-editor"></div><textarea class="slm-part-lyrics">'+escapeSlm(part.lyrics)+'</textarea></article>'+slmPartInsertButton_(index+1);});target.innerHTML=html;target.querySelectorAll('.slm-part-card').forEach(function(card){const index=Number(card.dataset.partIndex),part=parts[index],editor=card.querySelector('.slm-singer-editor'),textarea=card.querySelector('.slm-part-lyrics');mountUniverseSingerEditor(editor,part.singers,songLyricsManagementState.bootstrap.singerOptions,function(value){part.singers=value;songLyricsManagementState.dirty.lyrics=true;});textarea.addEventListener('input',function(){part.lyrics=textarea.value;songLyricsManagementState.dirty.lyrics=true;});});}
  function addSlmPart(index){const list=songLyricsManagementState.existing.parts,at=Math.max(0,Math.min(Number(index),list.length));list.splice(at,0,{partOrder:0,singers:[{id:'',name:'',role:'MAIN'}],lyrics:''});songLyricsManagementState.dirty.lyrics=true;renderSlmParts_();}
  function moveSlmPart(index,delta){const list=songLyricsManagementState.existing.parts,next=index+delta;if(next<0||next>=list.length)return;const item=list.splice(index,1)[0];list.splice(next,0,item);songLyricsManagementState.dirty.lyrics=true;renderSlmParts_();}
  function deleteSlmPart(index){const list=songLyricsManagementState.existing.parts;if(list.length<=1){renderSlmInlineError_('歌詞パートは1件以上必要です。');return;}if(!window.confirm('このパートを削除しますか？'))return;list.splice(index,1);songLyricsManagementState.dirty.lyrics=true;renderSlmParts_();}
  function saveSlmExistingInfo(){if(songLyricsManagementState.busy)return;const s=songLyricsManagementState.existing.song;const payload={artist:s.storedArtist??s.artist,title:document.getElementById('slmEditTitle').value,releaseDate:document.getElementById('slmEditRelease').value,form:document.getElementById('slmEditForm').value,cdTitle:document.getElementById('slmEditCd').value,isTitleTrack:document.getElementById('slmEditTitleTrack').checked};setSlmBusy_(true);managementRunner_().withSuccessHandler(function(){setSlmBusy_(false);songLyricsManagementState.dirty.info=false;managementState.dirty=false;slmReloadAfterSave_('info');}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveSongLyricsManagementInfo({userId:getUniverseUserId(),songId:s.songId,song:payload});}
  function saveSlmExistingCredits(){if(songLyricsManagementState.busy)return;const s=songLyricsManagementState.existing.song;const credits={lyricists:document.getElementById('slmEditLyricists').value,composers:document.getElementById('slmEditComposers').value,choreographers:document.getElementById('slmEditChoreographers').value};setSlmBusy_(true);managementRunner_().withSuccessHandler(function(){setSlmBusy_(false);slmReloadAfterSave_('credits');}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveSongLyricsManagementCredits({userId:getUniverseUserId(),songId:s.songId,credits:credits});}
  function saveSlmExistingLyrics(){if(songLyricsManagementState.busy)return;const s=songLyricsManagementState.existing.song,parts=songLyricsManagementState.existing.parts.map(function(part){return{singers:part.singers,lyrics:part.lyrics};});setSlmBusy_(true);managementRunner_().withSuccessHandler(function(){setSlmBusy_(false);songLyricsManagementState.dirty.lyrics=false;try{sessionStorage.removeItem('bmsgLyricsDataV5');}catch(e){}slmReloadAfterSave_('lyrics');}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).saveSongLyricsManagementLyrics({userId:getUniverseUserId(),songId:s.songId,parts:parts});}

  function refreshSlmBootstrap_(callback){setSlmBusy_(true);managementRunner_().withSuccessHandler(function(data){songLyricsManagementState.bootstrap=data;setSlmBusy_(false);if(typeof callback==='function')callback();}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).getSongLyricsManagementBootstrap(getUniverseUserId());}
  function hasSlmDirty_(){return Object.values(songLyricsManagementState.dirty).some(Boolean);}
  function setSlmBusy_(flag){songLyricsManagementState.busy=flag;document.querySelectorAll('#songLyricsManagementOverlay button,#songLyricsManagementOverlay input,#songLyricsManagementOverlay select,#songLyricsManagementOverlay textarea,#slmGuestConfirm button').forEach(function(el){el.disabled=!!flag;});if(flag){const body=document.getElementById('slmBody');if(body&&!document.getElementById('slmBusyText'))body.insertAdjacentHTML('afterbegin','<div id="slmBusyText" class="management-loading slm-loading">LOADING...</div>');}else{const node=document.getElementById('slmBusyText');if(node)node.remove();}}
  function renderSlmInlineError_(message){const body=document.getElementById('slmBody');if(!body)return;let node=document.getElementById('slmInlineError');if(!node){node=document.createElement('p');node.id='slmInlineError';node.className='slm-error';body.prepend(node);}node.textContent=message;}
  function renderSlmError(message){document.getElementById('slmBody').innerHTML='<p class="management-error slm-error">'+escapeSlm(message)+'</p>';}
  function readSlmError(error){return String(error&&error.message?error.message:error||'エラーが発生しました。').replace(/^Exception:\s*/,'');}
  function slmTextField_(id,label,value,required){return '<label class="management-field slm-field '+(label==='曲名'?'is-wide':'')+'"><span>'+escapeSlm(label)+(required?' *':'')+'</span><input id="'+id+'" type="text" value="'+escapeSlm(value||'')+'"></label>';}
  function slmDateField_(id,label,value){return '<label class="management-field slm-field"><span>'+label+'</span><input id="'+id+'" type="date" value="'+escapeSlm(value||'')+'"></label>';}
  function slmSelectField_(id,label,options,value,placeholder){return '<label class="management-field slm-field"><span>'+escapeSlm(label)+'</span><select id="'+id+'"><option value="">'+escapeSlm(placeholder||'選択してください')+'</option>'+(options||[]).map(function(item){const v=typeof item==='string'?item:item.value;return '<option value="'+escapeSlm(v)+'"'+(String(v)===String(value)?' selected':'')+'>'+escapeSlm(typeof item==='string'?item:(item.label||v))+'</option>';}).join('')+'</select></label>';}
  function slmSongSelectField_(id,label,songs,value){return '<label class="management-field slm-field"><span>'+escapeSlm(label)+'</span><select id="'+id+'"><option value="">選択なし</option>'+(songs||[]).map(function(song){return '<option value="'+escapeSlm(song.songId)+'"'+(String(song.songId)===String(value)?' selected':'')+'>'+escapeSlm(song.title)+' / '+escapeSlm(song.artist)+'</option>';}).join('')+'</select></label>';}
  function slmDisabledField_(label,value){return '<label class="management-field slm-field"><span>'+escapeSlm(label)+'</span><input type="text" value="'+escapeSlm(value)+'" disabled></label>';}
  function escapeSlm(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function slmSongOptionsHtml_(){
    if(!managementState.access||!managementState.access.catalog)return '';
    const state=songLyricsManagementState;
    return '<label class="management-field"><span>歌詞の登録</span><span class="slm-toggle"><input id="slmIncludeLyrics" type="checkbox" '+(state.includeLyrics!==false?'checked':'')+'> 歌詞を登録する</span></label>';
  }
  function slmCatalogSongControls_(){
    if(!managementState.access||!managementState.access.catalog)return '';
    const s=songLyricsManagementState.existing.song;
    return '<section class="management-card slm-edit-section"><h3 class="management-section-title">アーティストを訂正</h3>'+slmSelectField_('slmCorrectArtist','アーティスト',songLyricsManagementState.bootstrap.artists,s.artistId||s.artist)+'<button class="u-btn" onclick="correctSlmArtist_()">影響を確認して訂正</button></section><section class="management-card slm-edit-section"><h3 class="management-section-title">楽曲を削除</h3><p class="slm-note">関連データと参照を確認してから削除します。削除後の復元はできません。</p><button class="u-btn cm-danger" onclick="slmDeleteSelectedSong_()">影響を確認して削除</button></section>';
  }
  function slmReloadAfterSave_(saved){
    const state=songLyricsManagementState,old=state.existing,dirty=Object.assign({},state.dirty);
    dirty[saved]=false;
    const draft={};document.querySelectorAll('#slmBody input,#slmBody select').forEach(function(el){draft[el.id]={value:el.value,checked:el.checked};});
    setSlmBusy_(true);
    managementRunner_().withSuccessHandler(function(data){
      if(dirty.lyrics)data.parts=old.parts;
      state.existing=data;state.dirty=dirty;managementState.dirty=Object.values(dirty).some(Boolean);setSlmBusy_(false);renderSlm();
      const fields={info:['slmEditTitle','slmEditRelease','slmEditForm','slmEditCd','slmEditTitleTrack'],credits:['slmEditLyricists','slmEditComposers','slmEditChoreographers']};
      Object.keys(fields).forEach(function(key){if(dirty[key])fields[key].forEach(function(id){const el=document.getElementById(id);if(el&&draft[id]){el.value=draft[id].value;el.checked=draft[id].checked;}});});
      managementMutationDone_();showToast('保存しました。');
    }).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_('保存後の再読込に失敗しました。再送せず内容を確認してください。 '+readSlmError(e));}).getSongLyricsManagementSong(getUniverseUserId(),state.existingSongId);
  }
  function slmDeleteSelectedSong_(){
    if(songLyricsManagementState.busy)return;
    if(managementDirty_()&&!window.confirm('未保存の変更を破棄して削除確認に進みますか？'))return;
    const s=songLyricsManagementState.existing.song;cmState.bootstrap={songs:[{SongID:s.songId,Title:s.title}]};cmDeleteSong_();
  }
  function correctSlmArtist_(){
    if(songLyricsManagementState.busy)return;
    if(hasSlmDirty_()){renderSlmInlineError_('先に編集中の内容を保存してください。');return;}
    const s=songLyricsManagementState.existing.song,artist=cmValue_('slmCorrectArtist');
    if(!artist||artist===(s.artistId||s.artist))return;
    if(!window.confirm('「'+s.title+'」のアーティストを「'+slmArtistLabel_(artist)+'」に訂正しますか？'))return;
    setSlmBusy_(true);managementRunner_().withSuccessHandler(function(){managementMutationDone_();managementState.dirty=false;openSlmExistingSong_(s.songId);}).withFailureHandler(function(e){setSlmBusy_(false);renderSlmInlineError_(readSlmError(e));}).runManagementOperation({operation:'artist',userId:getUniverseUserId(),songId:s.songId,artist:artist,expectedArtist:s.storedArtist??s.artist,confirm:s.songId});
  }
</script>

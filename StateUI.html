<script>
    function openStateCheck() {
      stateCheckOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeStateCheck() {
      stateCheckOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    function closeOnBackdrop(event, id) {
      if (event.target && event.target.id === id) {
        if (id === 'settingsOverlay') closeSettings();
        if (id === 'stateCheckOverlay') closeStateCheck();
      }
    }

    function showLoadingState() {
      closeStateCheck();
      stateContent.innerHTML = typeof renderUniverseLoading === 'function'
        ? `<div class="loading-space loading-space-shared">${renderUniverseLoading('LOADING UNIVERSE', '#9cecff')}</div>`
        : '<div class="loading-space"></div>';
      stateOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function showInfoState(title, copy) {
      closeStateCheck();
      stateContent.innerHTML = `
        <section class="state-card">
          <p class="state-eyebrow">BMSG UNIVERSE</p>
          <h2 class="state-title">${escapeHtml(title)}</h2>
          <p class="state-copy">${escapeHtml(copy)}</p>
          <button class="state-close" onclick="closeStateOverlay()">CLOSE</button>
        </section>
      `;
      stateOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeStateOverlay() {
      stateOverlay.classList.remove('open');
      document.body.style.overflow = '';
      stateContent.innerHTML = '';
    }

    function renderSkeletonPage(route) {
      const isHome = route === 'home';

      let cardCount = 3;
      if (route === 'home') cardCount = 2;
      if (route === 'lab') cardCount = 4;

      const cards = Array.from({ length: cardCount }, () => `
        <div class="skeleton-block skeleton-card"></div>
      `).join('');

      return `
        <section class="view ${isHome ? 'skeleton-home' : 'skeleton-page'}">
          <div class="skeleton-heading-wrap">
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block skeleton-copy"></div>
          </div>

          <div class="skeleton-cards">
            ${cards}
          </div>
        </section>
      `;
    }

    function showSkeletonState() {
      closeStateCheck();

      if (skeletonTimer) {
        clearTimeout(skeletonTimer);
        skeletonTimer = null;
      }

      const routeToRestore = currentRoute;

      window.scrollTo(0, 0);
      pageContent.innerHTML = renderSkeletonPage(routeToRestore);

      skeletonTimer = setTimeout(() => {
        skeletonTimer = null;
        renderRoute(routeToRestore);
      }, 2200);
    }

    function showToast(message = '保存しました') {
      if (!toastRegion) return;

      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }

      toastRegion.innerHTML = `
        <div class="universe-toast" role="status">
          ${escapeHtml(message)}
        </div>
      `;

      toastTimer = setTimeout(() => {
        const toast = toastRegion.querySelector('.universe-toast');
        if (!toast) return;

        toast.classList.add('toast-out');

        setTimeout(() => {
          toastRegion.innerHTML = '';
          toastTimer = null;
        }, 180);
      }, 1800);
    }

</script>

<style>
    :root {
      --starry-black: #05070d;
      --starry-black-2: #080d17;
      --starry-black-3: #0c1320;
      --star-off-white: #f6f5f0;

      --white: #f7fbff;
      --ink: #151820;

      --cyan: #9cecff;
      --cyan-strong: #c6f6ff;
      --cyan-soft: rgba(156, 236, 255, .11);
      --violet: rgba(171, 155, 255, .12);

      --dark-line: rgba(255, 255, 255, .105);
      --dark-line-strong: rgba(156, 236, 255, .24);
      --dark-card: rgba(255, 255, 255, .045);
      --dark-card-hover: rgba(255, 255, 255, .065);

      --muted-dark: rgba(247, 251, 255, .58);
      --muted-light: rgba(21, 24, 32, .58);

      --page-max: 980px;
      --nav-height: 72px;
      --radius-lg: 26px;
      --radius-md: 18px;

      --ease: cubic-bezier(.22, .8, .28, 1);
      --fast: 170ms;
      --normal: 260ms;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--starry-black);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--white);
      background: var(--starry-black);
      font-family: Roboto, "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition:
        background-color var(--normal) var(--ease),
        color var(--normal) var(--ease);
    }

    body.theme-light {
      color: var(--ink);
      background: var(--star-off-white);
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .app-shell {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* =========================================================
       Cosmic Background
       HOMEは強め、通常Darkページは控えめ。
       ========================================================= */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      pointer-events: none;
      opacity: .68;
      transition: opacity var(--normal) var(--ease);
      background:
        radial-gradient(circle at 50% -12%, rgba(156, 236, 255, .075), transparent 34%),
        radial-gradient(circle at 92% 24%, rgba(171, 155, 255, .055), transparent 26%),
        linear-gradient(180deg, var(--starry-black), var(--starry-black-2) 58%, var(--starry-black));
    }

    body.is-home .cosmic-bg {
      opacity: 1;
      background:
        radial-gradient(circle at 50% -8%, rgba(156, 236, 255, .14), transparent 37%),
        radial-gradient(circle at 88% 24%, rgba(171, 155, 255, .07), transparent 29%),
        radial-gradient(circle at 9% 73%, rgba(156, 236, 255, .045), transparent 28%),
        linear-gradient(180deg, #04060b, #08101b 58%, #04070d);
    }

    body.theme-light .cosmic-bg {
      opacity: 0;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-repeat: repeat;
    }

    .stars {
      opacity: .32;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.74) 0 1px, transparent 1.15px);
      background-size: 63px 63px;
      background-position: 8px 14px;
    }

    .stars::before {
      opacity: .48;
      background-image:
        radial-gradient(circle, rgba(156,236,255,.78) 0 .9px, transparent 1.1px);
      background-size: 109px 109px;
      background-position: 48px 32px;
    }

    .stars::after {
      opacity: .22;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 .7px, transparent 1px);
      background-size: 41px 41px;
      background-position: 15px 5px;
    }

    .home-glow {
      position: fixed;
      top: -17vw;
      left: 50%;
      z-index: -2;
      width: min(92vw, 1000px);
      aspect-ratio: 1 / .55;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      filter: blur(40px);
      background: radial-gradient(
        ellipse at center,
        rgba(156,236,255,.11),
        rgba(156,236,255,.025) 42%,
        transparent 71%
      );
      transition: opacity var(--normal) var(--ease);
    }

    body.is-home .home-glow {
      opacity: 1;
    }

    body.theme-light .home-glow {
      opacity: 0;
    }

    /* =========================================================
       Shell
       ========================================================= */
    .page-wrap {
      width: min(100%, var(--page-max));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        clamp(16px, 4vw, 34px)
        calc(var(--nav-height) + 34px + env(safe-area-inset-bottom));
    }

    .page-content {
      min-height: calc(100dvh - var(--nav-height) - 58px);
    }

    .view {
      animation: view-in var(--normal) var(--ease);
    }

    @keyframes view-in {
      from {
        opacity: .55;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       HOME
       B/B確定:
       - BMSG実ロゴ画像は使わない
       - DATA/LABは縦2枚
       ========================================================= */
    .home {
      min-height: calc(100dvh - var(--nav-height) - 66px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(30px, 6vh, 70px) 0 clamp(16px, 3vh, 30px);
    }

    .home-title-wrap {
      position: relative;
      text-align: center;
      margin: 0 auto;
      width: min(100%, 820px);
    }

    .home-kicker {
      margin: 0 0 clamp(8px, 1.5vw, 14px);
      color: rgba(198, 246, 255, .76);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: clamp(10px, 2.5vw, 13px);
      font-weight: 600;
      letter-spacing: .44em;
      text-indent: .44em;
    }

    .home-title {
      margin: 0;
      font-family: Orbitron, "Arial Black", sans-serif;
      font-size: clamp(43px, 11.7vw, 92px);
      font-weight: 600;
      line-height: .91;
      letter-spacing: .025em;
      text-transform: uppercase;
      text-shadow:
        0 0 22px rgba(156, 236, 255, .055),
        0 0 70px rgba(156, 236, 255, .035);
    }

    .home-title .line {
      display: block;
    }

    .home-divider {
      width: min(34vw, 180px);
      height: 1px;
      margin: clamp(24px, 5vw, 40px) auto 0;
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(156, 236, 255, .5),
          transparent
        );
      box-shadow: 0 0 14px rgba(156, 236, 255, .14);
    }

    .home-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(12px, 2.8vw, 18px);
      width: min(100%, 820px);
      margin: clamp(34px, 7vw, 60px) auto 0;
    }

    .home-card {
      position: relative;
      min-width: 0;
      min-height: clamp(118px, 25vw, 154px);
      padding: clamp(18px, 4vw, 30px);
      overflow: hidden;
      border: 1px solid var(--dark-line);
      border-radius: var(--radius-lg);
      color: var(--white);
      text-align: left;
      background:
        linear-gradient(145deg, rgba(255,255,255,.052), rgba(255,255,255,.022));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 20px 60px rgba(0,0,0,.12);
      cursor: pointer;
      transform: translateZ(0);
      transition:
        border-color var(--fast) var(--ease),
        background var(--fast) var(--ease),
        transform var(--fast) var(--ease),
        box-shadow var(--fast) var(--ease);
    }

    .home-card::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: 0;
      background:
        radial-gradient(circle at 18% 0%, rgba(156,236,255,.09), transparent 43%);
      transition: opacity var(--fast) var(--ease);
    }

    .home-card::after {
      position: absolute;
      left: clamp(18px, 4vw, 30px);
      right: clamp(18px, 4vw, 30px);
      bottom: clamp(18px, 4vw, 28px);
      height: 1px;
      content: "";
      opacity: .5;
      background: linear-gradient(90deg, rgba(156,236,255,.62), transparent);
    }

    .home-card:active {
      transform: scale(.985);
    }

    @media (hover: hover) {
      .home-card:hover {
        border-color: var(--dark-line-strong);
        background:
          linear-gradient(145deg, rgba(255,255,255,.066), rgba(255,255,255,.027));
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.05),
          0 22px 70px rgba(0,0,0,.18);
      }

      .home-card:hover::before {
        opacity: 1;
      }
    }

    .home-card-content {
      position: relative;
      z-index: 1;
      height: 100%;
      min-height: calc(clamp(118px, 25vw, 154px) - 2 * clamp(18px, 4vw, 30px));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .home-card-index {
      color: rgba(247,251,255,.35);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: clamp(9px, 2.1vw, 11px);
      font-weight: 600;
      letter-spacing: .18em;
    }

    .home-card-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 8px;
    }

    .home-card-name {
      min-width: 0;
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: clamp(20px, 5.7vw, 38px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: .045em;
      white-space: nowrap;
    }

    .home-card-arrow {
      flex: 0 0 auto;
      color: var(--cyan);
      font-size: clamp(20px, 4.8vw, 30px);
      font-weight: 400;
      line-height: .9;
      transform: translateY(1px);
    }

    /* =========================================================
       DATA / LAB / Placeholder
       v0.2の機能を維持。HOME確定前の勝手な再設計はしない。
       ========================================================= */
    .section-head {
      padding-top: clamp(28px, 5vh, 56px);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--cyan);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-family: Orbitron, "Arial Black", sans-serif;
      font-size: clamp(40px, 10vw, 74px);
      font-weight: 600;
      line-height: .96;
      letter-spacing: .03em;
    }

    .subtitle {
      margin: 14px 0 0;
      color: var(--muted-dark);
      font-family: Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    body.theme-light .subtitle {
      color: var(--muted-light);
    }

    .grid {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }

    .grid.one {
      grid-template-columns: 1fr;
    }

    .route-card {
      min-height: 142px;
      padding: 22px;
      border: 1px solid var(--dark-line);
      border-radius: var(--radius-lg);
      color: inherit;
      text-align: left;
      background: var(--dark-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      transition:
        background var(--fast) var(--ease),
        border-color var(--fast) var(--ease),
        transform var(--fast) var(--ease);
    }

    .route-card:active {
      transform: scale(.987);
    }

    .route-card .name {
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: .035em;
    }

    .route-card .arrow {
      color: var(--cyan);
      font-size: 22px;
      line-height: 1;
    }

    body.theme-light .route-card {
      border-color: rgba(20,25,34,.1);
      background: rgba(255,255,255,.78);
      box-shadow: 0 10px 30px rgba(20,25,34,.05);
    }

    .placeholder {
      margin-top: 28px;
      padding: 24px;
      border: 1px solid var(--dark-line);
      border-radius: var(--radius-lg);
      background: var(--dark-card);
    }

    body.theme-light .placeholder {
      border-color: rgba(20,25,34,.1);
      background: rgba(255,255,255,.78);
    }

    .placeholder p {
      margin: 0;
      color: var(--muted-dark);
      line-height: 1.75;
    }

    body.theme-light .placeholder p {
      color: var(--muted-light);
    }

    .home-link {
      min-height: 48px;
      margin-top: 22px;
      padding: 0 18px;
      border: 1px solid rgba(156,236,255,.34);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(156,236,255,.075);
      cursor: pointer;
    }


    /* =========================================================
       DATA / LAB Category Pages
       IAは確定仕様のまま、見た目だけ本番寄りに整理。
       ========================================================= */
    .category-page {
      min-height: calc(100dvh - var(--nav-height) - 64px);
      padding: clamp(28px, 5vh, 56px) 0 20px;
    }

    .category-header {
      display: grid;
      gap: 12px;
      margin-bottom: clamp(26px, 5vw, 40px);
    }

    .category-number {
      color: rgba(247,251,255,.34);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .18em;
    }

    .category-title {
      margin: 0;
      font-family: Orbitron, sans-serif;
      font-size: clamp(48px, 13vw, 86px);
      font-weight: 600;
      line-height: .92;
      letter-spacing: .025em;
    }

    .category-copy {
      margin: 0;
      color: var(--muted-dark);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: clamp(14px, 3.7vw, 17px);
      font-weight: 500;
      letter-spacing: .025em;
    }

    .category-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .category-card {
      position: relative;
      min-height: 116px;
      overflow: hidden;
      padding: 20px;
      border: 1px solid var(--dark-line);
      border-radius: 22px;
      color: var(--white);
      text-align: left;
      background:
        linear-gradient(145deg, rgba(255,255,255,.048), rgba(255,255,255,.022));
      cursor: pointer;
      transition:
        border-color var(--fast) var(--ease),
        background var(--fast) var(--ease),
        transform var(--fast) var(--ease);
    }

    .category-card::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 7% 10%, rgba(156,236,255,.08), transparent 38%);
      transition: opacity var(--fast) var(--ease);
    }

    .category-card:active {
      transform: scale(.988);
    }

    @media (hover: hover) {
      .category-card:hover {
        border-color: var(--dark-line-strong);
        background:
          linear-gradient(145deg, rgba(255,255,255,.064), rgba(255,255,255,.026));
      }

      .category-card:hover::before {
        opacity: 1;
      }
    }

    .category-card-inner {
      position: relative;
      z-index: 1;
      min-height: 74px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 14px;
    }

    .category-card-meta {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .category-card-index {
      color: rgba(247,251,255,.3);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .16em;
    }

    .category-card-name {
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: clamp(23px, 6.2vw, 34px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: .035em;
      white-space: nowrap;
    }

    @media (min-width: 720px) {
      .category-cards.data-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .category-cards.lab-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-card {
        min-height: 172px;
      }

      .category-card-inner {
        min-height: 128px;
      }

      .category-card-name {
        white-space: normal;
      }
    }

    /* =========================================================
       Bottom Navigation
       構造は確定済みHOME/DATA/LABのまま。
       ========================================================= */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 20;
      width: min(100%, var(--page-max));
      height: calc(var(--nav-height) + env(safe-area-inset-bottom));
      padding:
        8px
        clamp(14px, 4vw, 28px)
        calc(8px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,.07);
      background: rgba(4, 7, 13, .86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    body.theme-light .bottom-nav {
      border-top-color: rgba(20,25,34,.09);
      background: rgba(246,245,240,.91);
    }

    .nav-btn {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      color: rgba(247,251,255,.4);
      background: transparent;
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      cursor: pointer;
      transition:
        color var(--fast) var(--ease),
        background var(--fast) var(--ease);
    }

    body.theme-light .nav-btn {
      color: rgba(21,24,32,.42);
    }

    .nav-btn.active {
      color: var(--cyan);
      background: rgba(156,236,255,.07);
    }


    /* =========================================================
       Responsive
       HOME cardsは縦2枚で統一。
       ========================================================= */
    @media (max-width: 420px) {
      .home-actions {
        gap: 11px;
      }

      .home-card {
        min-height: 116px;
        padding: 18px;
        border-radius: 21px;
      }

      .home-card-content {
        min-height: 80px;
      }

      .home-card::after {
        left: 18px;
        right: 18px;
        bottom: 18px;
      }

      .home-card-name {
        font-size: clamp(24px, 7vw, 30px);
      }
    }

    @media (min-width: 760px) {
      .home {
        padding-top: 46px;
      }

      .home-actions {
        gap: 20px;
      }
    }


    /* =========================================================
       v0.6 VISUAL REFINEMENT
       ========================================================= */

    /* stronger but restrained space field */
    .cosmic-bg {
      background:
        radial-gradient(ellipse at 18% 8%, rgba(91, 191, 218, .11), transparent 31%),
        radial-gradient(ellipse at 88% 22%, rgba(117, 102, 196, .055), transparent 28%),
        radial-gradient(ellipse at 42% 58%, rgba(35, 90, 112, .035), transparent 34%),
        linear-gradient(180deg, #03070d 0%, #07111c 44%, #040910 100%);
    }

    body.is-home .cosmic-bg {
      background:
        radial-gradient(ellipse at 28% 2%, rgba(112, 221, 242, .14), transparent 31%),
        radial-gradient(ellipse at 92% 21%, rgba(128, 110, 204, .06), transparent 26%),
        radial-gradient(ellipse at 14% 66%, rgba(45, 135, 165, .045), transparent 34%),
        linear-gradient(180deg, #03070c 0%, #08131f 46%, #030810 100%);
    }

    .stars {
      opacity: .30;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.70) 0 .8px, transparent 1px);
      background-size: 71px 71px;
      background-position: 10px 17px;
    }

    .stars::before {
      opacity: .44;
      background-image:
        radial-gradient(circle, rgba(154,236,255,.80) 0 .75px, transparent 1px);
      background-size: 119px 119px;
      background-position: 51px 36px;
    }

    .stars::after {
      opacity: .17;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.86) 0 .6px, transparent .9px);
      background-size: 47px 47px;
      background-position: 19px 7px;
    }

    /* top utility actions */
    .utility-actions {
      position: fixed;
      inset: 0 0 auto;
      z-index: 40;
      min-height: max(82px, calc(env(safe-area-inset-top) + 70px));
      box-sizing: border-box;
      padding:
        max(14px, env(safe-area-inset-top))
        max(18px, calc((100vw - min(100vw, var(--page-max))) / 2 + 18px))
        12px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #03070d;
      box-shadow: 0 10px 24px rgba(3, 7, 13, .48);
    }

    .utility-home {
      margin-right: auto;
    }

    .utility-btn {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 50%;
      color: rgba(235,247,252,.83);
      background: rgba(4,9,16,.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .utility-btn svg {
      width: 23px;
      height: 23px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* HOME left alignment */
    .home {
      justify-content: center;
      padding-top: clamp(78px, 12vh, 118px);
    }

    .home-title-wrap {
      width: min(100%, 820px);
      margin: 0 auto;
      text-align: left;
    }

    .home-kicker {
      margin-left: 2px;
      text-align: left;
      text-indent: 0;
    }

    .home-title {
      text-align: left;
      font-size: clamp(42px, 11vw, 86px);
      line-height: .92;
    }

    .home-divider {
      margin-left: 0;

      stroke-linecap: round;

    .category-card-symbol {
      width: 30px;
      height: 30px;
      color: rgba(135,226,245,.70);
    }

    .category-card-symbol svg {

      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;

      animation: overlay-in 180ms var(--ease);

    .overlay-close {

      height: 48px;

    .search-result-name {

    .settings-panel,

      color: var(--cyan);
      background: rgba(156,236,255,.055);

    .settings-note {
      margin: 18px 4px 0;
      color: rgba(247,251,255,.30);

      font-size: 13px;

    }

    /* state check */
    .state-check-trigger {
      align-self: flex-start;
      min-height: 44px;
      margin: 24px 0 0;
      padding: 0 17px;
      border: 1px solid rgba(156,236,255,.19);
      border-radius: 999px;
      color: rgba(198,246,255,.62);
      background: rgba(156,236,255,.028);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;
      cursor: pointer;
    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .state-test-btn {
      min-height: 50px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      color: rgba(247,251,255,.78);
      background: rgba(255,255,255,.03);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      cursor: pointer;
    }

    /* common state overlay */
    .state-overlay {
      position: fixed;
      inset: 0;
      z-index: 110;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(2,6,12,.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .state-overlay.open {
      display: grid;
    }

    .loading-space {
      width: min(78vw, 310px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .loading-orbit {
      position: absolute;
      inset: 14%;
      border: 1px solid rgba(137,226,245,.22);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .loading-orbit::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 18px rgba(156,236,255,.55);
      animation: orbit-dot 1.8s linear infinite;
      transform-origin: 0 calc(50% + 4px);
    }

    .loading-orbit.second {
      inset: 25%;
      opacity: .65;
      transform: rotate(48deg);
    }

    .loading-orbit.second::before {
      width: 5px;
      height: 5px;
      top: -3px;
      animation-duration: 2.6s;
      animation-direction: reverse;
    }

    @keyframes orbit-dot {
      from { transform: rotate(0deg) translateX(calc(43%)); }
      to { transform: rotate(360deg) translateX(calc(43%)); }
    }

    .loading-core {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(210,249,255,.95) 0 12%, rgba(106,219,239,.28) 34%, transparent 68%);
      box-shadow: 0 0 40px rgba(111,224,243,.18);
    }

    .loading-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6%;
      text-align: center;
      color: rgba(234,247,251,.62);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
    }

    .state-card {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 26px;
      background: rgba(7,12,21,.97);
    }

    .state-eyebrow {
      margin: 0 0 12px;
      color: var(--cyan);
      font-family: "Exo 2", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .17em;
    }

    .state-title {
      margin: 0;
      font-family: Orbitron, sans-serif;
      font-size: clamp(31px, 8vw, 46px);
      font-weight: 600;
      letter-spacing: .025em;
    }

    .state-copy {
      margin: 14px 0 0;
      color: rgba(247,251,255,.44);
      font-family: Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.65;
    }

    .state-close {
      min-height: 44px;
      margin-top: 24px;
      padding: 0 17px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 999px;
      color: rgba(247,251,255,.70);
      background: rgba(255,255,255,.03);
      font-family: "Exo 2", Roboto, sans-serif;
      font-weight: 600;
      cursor: pointer;
    }

    /* bottom nav icon system */
    .nav-btn {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: block;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-label {
      display: block;
    }

    @media (max-width: 420px) {
      .utility-btn {
        width: 48px;
        height: 48px;
      }

      .home {
        padding-top: 82px;
      }

      .home-title-wrap::after {
        top: calc(100% + 18px);
        height: 92px;
      }

      .home-actions {
        margin-top: 54px;
      }
    }


    /* =========================================================
       v0.7 — MINIMAL SPACE / NAV RULE / SEARCH / SETTINGS TOOLS
       ========================================================= */

    /* --- Minimal Space Background --- */
    html,
    body {
      background: #03070d;
    }

    .cosmic-bg,
    body.is-home .cosmic-bg {
      opacity: 1;
      background:
        linear-gradient(
          180deg,
          #02060b 0%,
          #050b13 48%,
          #02060b 100%
        );

    .stars,
    .stars::before,
    .stars::after {
      background-image: none !important;
      background: none !important;
      opacity: 1;

    .star-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .space-star {
      position: absolute;
      width: var(--star-size);
      height: var(--star-size);

      box-shadow: 0 0 var(--star-glow) rgba(149, 229, 246, .20);

      display: none;

    body.nav-hidden .page-wrap {
      padding-bottom: max(30px, env(safe-area-inset-bottom));

    /* --- Search: page list only --- */

    .state-copy {
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-size: 15px;
      line-height: 1.75;
    }

    /* --- Loading: planet follows a fixed circular orbit --- */
    .loading-space {
      width: min(76vw, 300px);
      aspect-ratio: 1;
    }

    .loading-orbit {
      position: absolute;
      inset: 18%;
      border: 1px solid rgba(142, 225, 243, .24);
      border-radius: 50%;
      transform: none;
    }

    .loading-orbit.second {
      display: none;
    }

    .loading-runner {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      animation: planet-orbit 2.25s linear infinite;
    }

    .loading-planet {
      position: absolute;
      left: 50%;
      top: -7px;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(

          rgba(234,253,255,.98) 0 14%,
          rgba(137,228,246,.96) 15% 42%,

        );

        0 0 10px rgba(156,236,255,.52),
        0 0 25px rgba(100,214,237,.22);

      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 6px;
      border: 1px solid rgba(198,246,255,.58);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);

      height: 6px;

    .category-card {
      width: 100%;
      display: block;
      text-align: left !important;

    .category-card-inner {
      width: 100%;
      justify-items: stretch;
      text-align: left !important;

      width: 100%;
      justify-items: start;
      text-align: left !important;

      width: 100%;
      text-align: left !important;
    }

    /* More air between category heading and first card */
    .category-header {
      margin-bottom: clamp(52px, 9vw, 72px);
    }

    /* Loading: SVG-based single circular orbit */
    .loading-space {
      width: min(76vw, 300px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .loading-orbit,
    .loading-orbit::before,
    .loading-orbit.second,
    .loading-runner,
    .loading-core {
      display: none !important;

    .loading-svg {
      width: 82%;
      height: 82%;
      overflow: visible;
    }

    .loading-circle {

      stroke: rgba(142, 225, 243, .28);
      stroke-width: 1.7;
      vector-effect: non-scaling-stroke;

      to   { transform: rotate(360deg); }

      bottom: 7%;
